ità","Frischer, eleganter Geschmack mit perfektem Gleichgewicht zwischen Süße und Säure"],"Në fillim ende pak e mbyllur në hundë, pastaj hapet me nota manaferrash dhe qershish të errëta; në sfond tone të lehta çokollate":["At first still a little closed on the nose, then it opens with notes of blackberries and dark cherries; light chocolate tones in the background","All'inizio ancora un po' chiuso al naso, poi si apre con note di more e ciliegie scure; leggeri toni di cioccolato sullo sfondo","Anfangs noch etwas verschlossen in der Nase, dann öffnet er sich mit Noten von Brombeeren und dunklen Kirschen; leichte Schokoladentöne im Hintergrund"],"Shumë e lëngshme dhe e ngopur në fillim dhe në vazhdim, ndërtohet me shumë shtresa; qershi e pjekur dhe butësi e hollë e ëmbël, jehonë e gjatë":["Very juicy and saturated at the start and further on, it builds in many layers; ripe cherry and a fine sweet softness, a long echo","Molto succoso e saturo all'inizio e nello sviluppo, si costruisce in molti strati; ciliegia matura e fine morbidezza dolce, eco lunga","Sehr saftig und satt am Anfang und im Verlauf, baut sich in vielen Schichten auf; reife Kirsche und feine süße Weichheit, langer Nachhall"],"Hundë intensive me fruta të zeza të pjekura dhe nota erëzore":["Intense nose with ripe black fruit and spicy notes","Naso intenso con frutti neri maturi e note speziate","Intensive Nase mit reifen schwarzen Früchten und würzigen Noten"],"Peshë mesatare në qiellzë, me tanine të pjekura, aciditet të hollë dhe gjatësi të mirë":["Medium weight on the palate, with ripe tannins, fine acidity and good length","Peso medio al palato, con tannini maturi, acidità fine e buona lunghezza","Mittleres Gewicht am Gaumen, mit reifen Tanninen, feiner Säure und guter Länge"],"E kuqe purpurt mesatarisht e thellë":["Medium-deep purple red","Rosso porpora di media profondità","Mitteltiefes Purpurrot"],"Buqetë lulore me manushaqe dhe duhan të freskët, me ndjesi frutore të gjalla qershie dhe manaferre":["Floral bouquet with violet and fresh tobacco, with lively fruity sensations of cherry and blackberry","Bouquet floreale con viola e tabacco fresco, con vivaci sensazioni fruttate di ciliegia e mora","Blumiges Bouquet mit Veilchen und frischem Tabak, mit lebendigen fruchtigen Eindrücken von Kirsche und Brombeere"],"Hyrje e vendosur dhe mbështjellëse në qiellzë, tanine të pjekura dhe të përcaktuara mirë, damar acid i freskët, përfundim energjik":["A decisive, enveloping entry on the palate, ripe and well-defined tannins, a fresh acidic vein, an energetic finish","Ingresso deciso e avvolgente al palato, tannini maturi e ben definiti, fresca vena acida, finale energico","Entschiedener, umhüllender Auftakt am Gaumen, reife und klar definierte Tannine, frische Säureader, energischer Abgang"],"Ngjyrë rubin e mrekullueshme":["Wonderful ruby colour","Colore rubino meraviglioso","Wunderbare Rubinfarbe"],"Buqetë e shkëlqyer":["Excellent bouquet","Bouquet eccellente","Ausgezeichnetes Bouquet"],"Shije shumë e butë, me mbyllje të gjatë dhe të këndshme":["Very soft taste, with a long, pleasant close","Gusto molto morbido, con chiusura lunga e piacevole","Sehr weicher Geschmack mit langem, angenehmem Ausklang"],"E kuqe rubin e thellë dhe e errët":["Deep, dark ruby red","Rosso rubino profondo e scuro","Tiefes, dunkles Rubinrot"],"Hundë magjepsëse me nuanca fillestare pjekurie, shumë freski eterike që të kujton nenexhikun, nota luleshtrydhesh të ziera dhe dheu të lagur":["A captivating nose with initial hints of maturity, plenty of ethereal freshness reminiscent of mint, notes of stewed strawberries and wet earth","Naso affascinante con prime sfumature di evoluzione, molta freschezza eterea che ricorda la menta, note di fragole cotte e terra bagnata","Eine bezaubernde Nase mit ersten Reifeanklängen, viel ätherischer Frische, die an Minze erinnert, Noten gekochter Erdbeeren und nasser Erde"],"Më e lehtë në qiellzë se ç'pritej, me tanine të forta me kokërr të trashë, aciditet të gjallë dhe përfundim erëzor e të gjatë":["Lighter on the palate than expected, with firm, coarse-grained tannins, lively acidity and a spicy, long finish","Più leggero al palato del previsto, con tannini decisi a grana grossa, acidità vivace e finale speziato e lungo","Leichter am Gaumen als erwartet, mit festen, grobkörnigen Tanninen, lebendiger Säure und würzigem, langem Abgang"],"E verdhë kashte me intensitet mesatar.":["Straw yellow of medium intensity.","Giallo paglierino di media intensità.","Strohgelb mittlerer Intensität."],"Aromë mbështjellëse frutash të freskëta, me shprehje të territorit.":["An enveloping aroma of fresh fruit, expressing the territory.","Profumo avvolgente di frutta fresca, espressione del territorio.","Umhüllender Duft frischer Früchte, Ausdruck des Gebiets."],"E butë dhe aromatike në gojë; verë e bardhë e thatë dhe e lehtë, e lehtë për t'u pirë, me buqetë të këndshme dhe delikate.":["Soft and aromatic on the palate; a dry, light white wine, easy to drink, with a pleasant, delicate bouquet.","Morbido e aromatico in bocca; vino bianco secco e leggero, di facile beva, con un bouquet piacevole e delicato.","Weich und aromatisch am Gaumen; ein trockener, leichter Weißwein, leicht zu trinken, mit angenehmem, zartem Bouquet."],"Shkëlqyeshëm si aperitiv dhe me antipasta deti, omëleta me barishte pranverore, pjata të para të thjeshta, ushqim i papjekur (crudo).":["Excellent as an aperitif and with seafood starters, omelettes with spring herbs, simple first courses, raw food (crudo).","Ottimo come aperitivo e con antipasti di mare, frittate alle erbe primaverili, primi piatti semplici, crudi.","Ausgezeichnet als Aperitif und zu Meeresfrüchtevorspeisen, Omeletts mit Frühlingskräutern, einfachen ersten Gängen, Rohem (Crudo)."],"E verdhë kashte e ndritshme.":["Bright straw yellow.","Giallo paglierino brillante.","Leuchtendes Strohgelb."],"Parfume intensive lulesh dhe nota frutash të pjekura.":["Intense floral perfumes and notes of ripe fruit.","Intensi profumi floreali e note di frutta matura.","Intensive Blütendüfte und Noten reifer Früchte."],"Aciditet i këndshëm, e lëngshme dhe me shije aromatike.":["Pleasant acidity, juicy and with an aromatic taste.","Acidità piacevole, succoso e dal gusto aromatico.","Angenehme Säure, saftig und mit aromatischem Geschmack."],"Një vakt i plotë me peshk ose mish të bardhë.":["A complete meal with fish or white meat.","Un pasto completo a base di pesce o carni bianche.","Ein komplettes Menü mit Fisch oder hellem Fleisch."],"Rubin i shndritshëm me nuanca vjollcë.":["Bright ruby with violet hues.","Rubino brillante con sfumature violacee.","Leuchtendes Rubin mit violetten Nuancen."],"Frutore, kujton reçel qershie dhe një erëz të lehtë.":["Fruity, it recalls cherry jam and a light spice.","Fruttato, ricorda la confettura di ciliegie e una leggera spezia.","Fruchtig, erinnert an Kirschkonfitüre und eine leichte Würze."],"Me kripësi, e ekuilibruar në tanine dhe alkool, me qëndrueshmëri të madhe frutash të pjekura.":["Savoury, balanced in tannins and alcohol, with great persistence of ripe fruit.","Sapido, equilibrato in tannini e alcol, con grande persistenza di frutta matura.","Salzig, ausgewogen in Tannin und Alkohol, mit großer Länge reifer Frucht."],"Të brendshme (rrëmbesa), shpendë në skarë, lepur i pjekur, djathëra mesatarisht të stagjionuar.":["Offal, grilled poultry, roast rabbit, medium-aged cheeses.","Interiora, pollame alla griglia, coniglio arrosto, formaggi di media stagionatura.","Innereien, gegrilltes Geflügel, gebratenes Kaninchen, mittelalte Käse."],"Aroma frutash ekzotike të freskëta dhe lulesh.":["Aromas of fresh exotic fruit and flowers.","Profumi di frutta esotica fresca e fiori.","Aromen frischer exotischer Früchte und Blumen."],"Shije tipike e Verdicchio-s me pas-shije lehtësisht të hidhur bajameje të thekur.":["The typical Verdicchio taste with a lightly bitter aftertaste of toasted almond.","Gusto tipico del Verdicchio con retrogusto leggermente amarognolo di mandorla tostata.","Typischer Verdicchio-Geschmack mit leicht bitterem Nachgeschmack von gerösteter Mandel."],"Antipasta me fruta deti, omëleta me barishte pranverore, pjata të para të thjeshta, edhe perime të freskëta dhe fruta deti.":["Seafood starters, omelettes with spring herbs, simple first courses, also fresh vegetables and seafood.","Antipasti di mare, frittate alle erbe primaverili, primi piatti semplici, anche verdure fresche e frutti di mare.","Meeresfrüchtevorspeisen, Omeletts mit Frühlingskräutern, einfache erste Gänge, auch frisches Gemüse und Meeresfrüchte."],"Kashte, e ndritshme dhe e shndritshme.":["Straw, bright and shining.","Paglierino, luminoso e brillante.","Stroh, leuchtend und glänzend."],"Kujton fruta të pjekura, bajame të ëmbël, lule akacie, anason yll dhe nuanca agrumesh.":["It recalls ripe fruit, sweet almond, acacia flowers, star anise and hints of citrus.","Ricorda frutta matura, mandorla dolce, fiori d'acacia, anice stellato e sfumature agrumate.","Erinnert an reife Früchte, süße Mandel, Akazienblüten, Sternanis und Zitrusanklänge."],"Shije e gjatë dhe e qëndrueshme, me nota kripësie dhe minerale.":["A long, persistent taste, with saline and mineral notes.","Gusto lungo e persistente, con note sapide e minerali.","Langer, anhaltender Geschmack mit salzigen und mineralischen Noten."],"Pjata të mëdha me fruta deti, djathëra mesatarisht të stagjionuar dhe mish i bardhë.":["Important seafood dishes, medium-aged cheeses and white meat.","Grandi piatti di mare, formaggi di media stagionatura e carni bianche.","Große Meeresfrüchtegerichte, mittelalte Käse und helles Fleisch."],"Me personalitet dhe elegancë të madhe; e verdhë kashte, e shndritshme dhe e ndritur":["With great personality and elegance; straw yellow, shining and luminous","Di grande personalità ed eleganza; giallo paglierino, brillante e luminoso","Mit großer Persönlichkeit und Eleganz; strohgelb, glänzend und leuchtend"],"Të kujton fruta të pjekura, bajame të ëmbël, lule akacie, anason yll dhe nuanca agrumesh":["It recalls ripe fruit, sweet almond, acacia flowers, star anise and hints of citrus","Ricorda frutta matura, mandorla dolce, fiori d'acacia, anice stellato e sfumature agrumate","Erinnert an reife Früchte, süße Mandel, Akazienblüten, Sternanis und Zitrusanklänge"],"Qëndrueshmëri e gjatë shijuese me nota kripore dhe minerale":["Long taste persistence with saline and mineral notes","Lunga persistenza gustativa con note sapide e minerali","Lange geschmackliche Länge mit salzigen und mineralischen Noten"],"Shkon në mënyrë të përsosur me pjata të mëdha të kuzhinës detare, djathëra me stazhionim mesatar dhe mish të bardhë":["Goes perfectly with important dishes of seafood cuisine, medium-aged cheeses and white meat","Si abbina perfettamente a grandi piatti della cucina di mare, formaggi di media stagionatura e carni bianche","Passt perfekt zu großen Gerichten der Meeresküche, mittelalten Käsen und hellem Fleisch"],"Kujton fruta të freskëta, mollë jeshile dhe fruta ekzotike, si dhe lule gjinestre, sanë dhe bajame të ëmbël.":["It recalls fresh fruit, green apple and exotic fruit, as well as broom flowers, hay and sweet almond.","Ricorda frutta fresca, mela verde e frutta esotica, oltre a fiori di ginestra, fieno e mandorla dolce.","Erinnert an frische Früchte, grünen Apfel und exotische Früchte sowie Ginsterblüten, Heu und süße Mandel."],"Shije tipike e Verdicchio-s me pas-shije lehtësisht të hidhur, lëngshmëri të mirë dhe rrumbullakësi në gojë.":["The typical Verdicchio taste with a lightly bitter aftertaste, good juiciness and roundness on the palate.","Gusto tipico del Verdicchio con retrogusto leggermente amarognolo, buona succosità e rotondità in bocca.","Typischer Verdicchio-Geschmack mit leicht bitterem Nachgeschmack, guter Saftigkeit und Rundheit am Gaumen."],"Antipasta, pjata me peshk dhe krustace.":["Starters, fish and shellfish dishes.","Antipasti, piatti di pesce e crostacei.","Vorspeisen, Fisch- und Krustentiergerichte."],"Rubin-vjollcë intensiv dhe i shndritshëm":["Intense, bright ruby-violet","Rubino-violaceo intenso e brillante","Intensives, leuchtendes Rubinviolett"],"Hundë shumë e hapur dhe e afrueshme, me nota të theksuara kokrrash shtogu dhe ribesi të zi, tërheqëse":["Very open, approachable nose, with marked notes of elderberries and blackcurrant, attractive","Naso molto aperto e accessibile, con spiccate note di bacche di sambuco e ribes nero, attraente","Sehr offene, zugängliche Nase mit ausgeprägten Noten von Holunderbeeren und schwarzer Johannisbeere, ansprechend"],"Me lëndë dhe e lëngshme në qiellzë, hapet me tanin të fortë e të dendur; ndërton presion të plotë, njëkohësisht fruta të bukura, jehonë e gjatë":["Substantial and juicy on the palate, it opens with firm, dense tannin; it builds full pressure, at the same time lovely fruit, a long echo","Materico e succoso al palato, si apre con tannino deciso e fitto; costruisce piena spinta, allo stesso tempo bel frutto, eco lunga","Substanzreich und saftig am Gaumen, öffnet sich mit festem, dichtem Tannin; baut vollen Druck auf, zugleich schöne Frucht, langer Nachhall"],"Rubin-vjollcë i dendur, i padepërtueshëm":["Dense, impenetrable ruby-violet","Rubino-violaceo fitto, impenetrabile","Dichtes, undurchdringliches Rubinviolett"],"Hundë theksueshëm erëzore me nota të lehta piperi, barishte të thata, në sfond manaferra të pjekura":["Markedly spicy nose with light notes of pepper, dried herbs, ripe blackberries in the background","Naso spiccatamente speziato con leggere note di pepe, erbe secche, more mature sullo sfondo","Ausgeprägt würzige Nase mit leichten Noten von Pfeffer, getrockneten Kräutern, reifen Brombeeren im Hintergrund"],"Në fillim shumë fruta të plota, manaferra, butësi e ëmbël; shpaloset me shumë elegancë, tanin i kapshëm shumë i integruar, jehonë e gjatë":["At first lots of full fruit, blackberries, sweet softness; it unfolds with great elegance, very well-integrated grippy tannin, a long echo","All'inizio molto frutto pieno, more, morbidezza dolce; si distende con grande eleganza, tannino grippante molto integrato, eco lunga","Anfangs viel volle Frucht, Brombeeren, süße Weichheit; entfaltet sich mit großer Eleganz, sehr gut eingebundenes griffiges Tannin, langer Nachhall"],"E kuqe rubin e errët e ndritshme":["Bright dark ruby red","Rosso rubino scuro e brillante","Leuchtendes dunkles Rubinrot"],"Shumë shprehëse në hundë: ribes i zi, boronica të bluara, dru fisnik, një nuancë dylli vulosës, në fund nota të holla malti":["Very expressive on the nose: blackcurrant, crushed blueberries, noble wood, a hint of sealing wax, finally fine malty notes","Molto espressivo al naso: ribes nero, mirtilli schiacciati, legno nobile, un tocco di ceralacca, infine fini note di malto","Sehr ausdrucksstark in der Nase: schwarze Johannisbeere, zerdrückte Heidelbeeren, edles Holz, ein Hauch Siegellack, zuletzt feine Malznoten"],"Në qiellzë me shumë lëng dhe tanin të fortë, përhapet me vendosmëri mbi gjuhë, me nota të bukura erëzore, me lëndë; në fund ende pak e ashpër dhe shumë e re":["On the palate with lots of juice and firm tannin, it spreads decisively over the tongue, with lovely spicy notes, substantial; at the end still a little rough and very young","Al palato con molto succo e tannino deciso, si diffonde con decisione sulla lingua, con belle note speziate, materico; nel finale ancora un po' ruvido e molto giovane","Am Gaumen mit viel Saft und festem Tannin, breitet sich entschieden über die Zunge aus, mit schönen würzigen Noten, substanzreich; am Ende noch etwas rau und sehr jung"],"E kuqe rubin intensive me reflekse granate.":["Intense ruby red with garnet reflections.","Rosso rubino intenso con riflessi granati.","Intensives Rubinrot mit granatroten Reflexen."],"Magjepsëse dhe komplekse: fillon me aroma frutash të egra, pastaj nota balsamike, nënpyll, duhan dhe barishte aromatike.":["Captivating and complex: it starts with aromas of wild fruit, then balsamic notes, undergrowth, tobacco and aromatic herbs.","Affascinante e complesso: inizia con profumi di frutti selvatici, poi note balsamiche, sottobosco, tabacco ed erbe aromatiche.","Bezaubernd und komplex: beginnt mit Aromen wilder Früchte, dann balsamische Noten, Waldboden, Tabak und Kräuter."],"E gjallë dhe elegante, me përputhje të përsosur midis shijes dhe aromës, tanine të rafinuara, ekuilibër dhe thellësi të shkëlqyer; përfundim shumë i qëndrueshëm.":["Lively and elegant, with perfect correspondence between taste and aroma, refined tannins, excellent balance and depth; a very persistent finish.","Vivace ed elegante, con perfetta corrispondenza tra gusto e profumo, tannini raffinati, ottimo equilibrio e profondità; finale molto persistente.","Lebendig und elegant, mit perfekter Übereinstimmung von Geschmack und Duft, feinen Tanninen, ausgezeichneter Balance und Tiefe; sehr anhaltender Abgang."],"Aroma të gjera që kujtojnë qershinë e pjekur dhe frutat e pyllit, të shkrira mirë me nota erëzash që i japin klas dhe kompleksitet.":["Broad aromas recalling ripe cherry and wild berries, well blended with spicy notes that give class and complexity.","Profumi ampi che ricordano la ciliegia matura e i frutti di bosco, ben fusi con note speziate che danno classe e complessità.","Weite Aromen, die an reife Kirsche und Waldbeeren erinnern, gut verbunden mit würzigen Noten, die Klasse und Komplexität verleihen."],"E rrumbullakët, shumë harmonike dhe e gjallë; tregon thellësi dhe teksturë të përsosur taninesh.":["Round, very harmonious and lively; it shows depth and a perfect tannic texture.","Rotondo, molto armonico e vivace; mostra profondità e una perfetta trama tannica.","Rund, sehr harmonisch und lebendig; zeigt Tiefe und perfekte Tannintextur."],"Rubin-vjollcë i errët dhe i shkëlqyer":["Dark, brilliant ruby-violet","Rubino-violaceo scuro e brillante","Dunkles, glänzendes Rubinviolett"],"Në fillim nota të theksuara minerale, pak katran dhe blozë, pastaj lëkurë dhe shumë manaferra":["At first marked mineral notes, a little tar and soot, then leather and lots of blackberries","All'inizio spiccate note minerali, un po' di catrame e fuliggine, poi cuoio e molte more","Zunächst ausgeprägte mineralische Noten, etwas Teer und Ruß, dann Leder und viele Brombeeren"],"E pasur në fillim, zhvillohet shumë e rrumbullakët dhe e lakueshme, ndërtohet bukur, me tanin të dendur me kokërr të imët":["Rich at the start, it develops very round and supple, builds nicely, with dense, fine-grained tannin","Ricco all'inizio, si sviluppa molto rotondo e flessuoso, si costruisce bene, con tannino fitto a grana fine","Reich am Anfang, entwickelt sich sehr rund und geschmeidig, baut sich schön auf, mit dichtem, feinkörnigem Tannin"],"E kuqe rubin e pasur, me një çelje të lehtë në buzë":["Rich ruby red, with a slight lightening at the rim","Rosso rubino ricco, con leggero schiarimento sull'unghia","Reiches Rubinrot mit leichter Aufhellung am Rand"],"Hundë erëzore me piper të zi dhe karakter frutor qershie të thartë të pasur; pastaj pak lëkurë, me një prekje çokollate dhe kafeje":["Spicy nose with black pepper and a rich sour-cherry fruit character; then a little leather, with a touch of chocolate and coffee","Naso speziato con pepe nero e ricco carattere fruttato di amarena; poi un po' di cuoio, con un tocco di cioccolato e caffè","Würzige Nase mit schwarzem Pfeffer und reichem Sauerkirschcharakter; dann etwas Leder, mit einem Hauch Schokolade und Kaffee"],"Shumë qershi e pjekur në qiellzë, e balancuar mirë, me tanine me kokërr të imët dhe përfundim të gjatë":["Lots of ripe cherry on the palate, well balanced, with fine-grained tannins and a long finish","Molta ciliegia matura al palato, ben equilibrato, con tannini a grana fine e finale lungo","Viel reife Kirsche am Gaumen, gut ausgewogen, mit feinkörnigen Tanninen und langem Abgang"],"E kuqe purpurt me nuanca manushaqeje":["Purple red with violet hues","Rosso porpora con sfumature di viola","Purpurrot mit Veilchennuancen"],"Buqetë e pasur me fruta të pyllit intensive dhe erëza, me nuanca duhani":["Rich bouquet with intense wild berries and spices, with hints of tobacco","Bouquet ricco con intensi frutti di bosco e spezie, con sfumature di tabacco","Reiches Bouquet mit intensiven Waldbeeren und Gewürzen, mit Tabakanklängen"],"E butë dhe kadifeje në gojë, me erëza, duhan dhe fruta plotësisht të pjekura e të ëmbla":["Soft and velvety on the palate, with spices, tobacco and fully ripe, sweet fruit","Morbido e vellutato in bocca, con spezie, tabacco e frutta pienamente matura e dolce","Weich und samtig am Gaumen, mit Gewürzen, Tabak und vollreifer, süßer Frucht"],"Rubin i errët me nuanca të theksuara vjollcë.":["Dark ruby with marked violet hues.","Rubino scuro con spiccate sfumature violacee.","Dunkles Rubin mit ausgeprägten violetten Nuancen."],"Ndjesi të jashtëzakonshme plotësie dhe kompleksiteti, me nota frutash të vogla të kuqe të pjekura, çokollate dhe shkëndija balsamike.":["Extraordinary sensations of fullness and complexity, with notes of ripe small red fruits, chocolate and balsamic sparks.","Straordinarie sensazioni di pienezza e complessità, con note di piccoli frutti rossi maturi, cioccolato e guizzi balsamici.","Außergewöhnliche Eindrücke von Fülle und Komplexität, mit Noten reifer kleiner roter Früchte, Schokolade und balsamischen Funken."],"Mbështjellëse, shumë e pasur në strukturë, por shumë dinamike.":["Enveloping, very rich in structure, yet very dynamic.","Avvolgente, molto ricco di struttura, ma molto dinamico.","Umhüllend, sehr strukturreich und doch sehr dynamisch."],"Nuanca lulesh, si vjollca, që shkrihen me nota terciare nënpylli.":["Floral hints, such as violet, merging with tertiary notes of undergrowth.","Sfumature floreali, come la viola, che si fondono con note terziarie di sottobosco.","Blumige Anklänge wie Veilchen, die mit tertiären Noten von Waldboden verschmelzen."],"Ekuilibër, thellësi e madhe dhe tanine të holla.":["Balance, great depth and fine tannins.","Equilibrio, grande profondità e tannini fini.","Ausgewogenheit, große Tiefe und feine Tannine."],"E kuqe rubin me tonalitet mesatar.":["Ruby red of medium tone.","Rosso rubino di media tonalità.","Rubinrot mittlerer Tönung."],"Aroma të freskëta lulesh dhe frutash.":["Fresh aromas of flowers and fruit.","Profumi freschi di fiori e frutta.","Frische Aromen von Blumen und Früchten."],"E lëngshme dhe e lehtë për t'u pirë, gjithmonë me freski, ekuilibër dhe këndshmëri.":["Juicy and easy to drink, always with freshness, balance and pleasantness.","Succoso e di facile beva, sempre con freschezza, equilibrio e piacevolezza.","Saftig und leicht zu trinken, immer mit Frische, Ausgewogenheit und Gefälligkeit."],"Krostina të përziera, pjata me salume, pasta me domate.":["Mixed crostini, plates of cured meats, pasta with tomato.","Crostini misti, taglieri di salumi, pasta al pomodoro.","Gemischte Crostini, Wurstplatten, Pasta mit Tomate."],"E hollë, me aroma kokrrash të egra, manushaqesh dhe një përfundim të bukur erëzor":["Fine, with aromas of wild berries, violets and a lovely spicy finish","Fine, con profumi di bacche selvatiche, viole e un bel finale speziato","Fein, mit Aromen von Wildbeeren, Veilchen und einem schönen würzigen Abgang"],"E thatë dhe e freskët, me trup të plotë dhe tanine të mëdha":["Dry and fresh, full-bodied with big tannins","Secco e fresco, di corpo pieno e con grandi tannini","Trocken und frisch, vollmundig mit großen Tanninen"],"E kuqe rubin e shndritshme me buzë pak më të çelur":["Bright ruby red with a slightly lighter rim","Rosso rubino brillante con unghia leggermente più chiara","Leuchtendes Rubinrot mit etwas hellerem Rand"],"Hundë me karakter të bukur, me nota qershie të pjekur, dylli dhe karafili":["A nose of lovely character, with notes of ripe cherry, wax and clove","Naso di bel carattere, con note di ciliegia matura, cera e chiodo di garofano","Eine Nase mit schönem Charakter, mit Noten reifer Kirsche, Wachs und Nelke"],"Tanine kadifeje në qiellzë, zhvillohet butë, shije qershie, me përfundim të lehtë lajthie; e rrumbullakët":["Velvety tannins on the palate, it develops softly, cherry flavour, with a light hazelnut finish; round","Tannini vellutati al palato, si sviluppa morbido, gusto di ciliegia, con leggero finale di nocciola; rotondo","Samtige Tannine am Gaumen, entwickelt sich weich, Kirschgeschmack, mit leichtem Haselnussabgang; rund"],"E kuqe rubin e pasur me shkëlqim të bukur":["Rich ruby red with a lovely sheen","Rosso rubino ricco con bella lucentezza","Reiches Rubinrot mit schönem Glanz"],"Hundë intensive me qershi të zezë, çokollatë dhe manushaqe":["Intense nose with black cherry, chocolate and violets","Naso intenso con ciliegia nera, cioccolato e viola","Intensive Nase mit Schwarzkirsche, Schokolade und Veilchen"],"Tanine të lëmuara në qiellzë, frutore dhe e lehtë për t'u pirë, me përfundim të gjatë":["Polished tannins on the palate, fruity and easy to drink, with a long finish","Tannini levigati al palato, fruttato e di facile beva, con finale lungo","Geschliffene Tannine am Gaumen, fruchtig und leicht zu trinken, mit langem Abgang"],"Aromë intensive dhe e qëndrueshme frutash të pjekura, mjalti dhe erëzash":["Intense, persistent aroma of ripe fruit, honey and spices","Profumo intenso e persistente di frutta matura, miele e spezie","Intensiver, anhaltender Duft von reifen Früchten, Honig und Gewürzen"],"Butësi dhe rrumbullakësi e madhe, e balancuar nga aciditet i mirë":["Great softness and roundness, balanced by good acidity","Grande morbidezza e rotondità, bilanciate da una buona acidità","Große Weichheit und Rundheit, ausgeglichen durch gute Säure"],"Ëmbëlsira, djathëra të stazhionuar dhe pjata me fruta":["Desserts, aged cheeses and fruit dishes","Dolci, formaggi stagionati e piatti con frutta","Desserts, gereifte Käse und Obstgerichte"],"Me hirin spontan të një balerine, nuk e humb kurrë shkëlqimin dhe ritmin":["With the spontaneous grace of a ballerina, it never loses its sparkle and rhythm","Con la grazia spontanea di una ballerina, non perde mai brillantezza e ritmo","Mit der spontanen Anmut einer Ballerina verliert er nie seinen Glanz und Rhythmus"],"Peshk, pulë, lepur; proshutë me pjepër, sallam me fiq; pjata të para me peshk, rizoto":["Fish, chicken, rabbit; ham with melon, salami with figs; first courses with fish, risotto","Pesce, pollo, coniglio; prosciutto e melone, salame e fichi; primi piatti di pesce, risotti","Fisch, Huhn, Kaninchen; Schinken mit Melone, Salami mit Feigen; erste Gänge mit Fisch, Risotto"],"E ndritshme, madje nervoze, por kurrë sipërfaqësore; me vjetërsinë befason me freskinë e ndërthurur me një kompleksitet të papritur":["Bright, even nervy, but never superficial; with age it surprises with freshness intertwined with unexpected complexity","Brillante, persino nervoso, ma mai superficiale; con l'età sorprende con una freschezza intrecciata a una complessità inattesa","Leuchtend, sogar nervig, aber nie oberflächlich; mit dem Alter überrascht er mit Frische, verwoben mit unerwarteter Komplexität"],"Peshk, shpendë, supa, pasta, proshutë me pjepër, sallam me fiq, bukë, ullinj dhe djathë; shumë e gjithanshme":["Fish, poultry, soups, pasta, ham with melon, salami with figs, bread, olives and cheese; very versatile","Pesce, pollame, zuppe, pasta, prosciutto e melone, salame e fichi, pane, olive e formaggi; molto versatile","Fisch, Geflügel, Suppen, Pasta, Schinken mit Melone, Salami mit Feigen, Brot, Oliven und Käse; sehr vielseitig"],"E freskët, aromatike, bukur e hollë dhe me kapje të imët; me vjetërsinë thurja e saj mblidhet në kompleksitet të pasur":["Fresh, aromatic, beautifully fine and with subtle grip; with age its weave gathers into rich complexity","Fresco, aromatico, splendidamente fine e di presa sottile; con l'età la sua trama si raccoglie in una ricca complessità","Frisch, aromatisch, wunderbar fein und mit feinem Griff; mit dem Alter verdichtet sich sein Gewebe zu reicher Komplexität"],"Me çfarëdo ushqimi që dëshironi, për sa kohë të jetë gatuar si duhet":["With whatever food you like, as long as it has been cooked properly","Con qualsiasi cibo desideriate, purché cucinato come si deve","Zu jedem Essen, das Sie mögen, solange es richtig zubereitet ist"],"Qartësisht vjeshtore, erëzore; aromatike dhe e rreptë njëkohësisht":["Clearly autumnal, spicy; aromatic and austere at the same time","Nettamente autunnale, speziato; aromatico e austero allo stesso tempo","Deutlich herbstlich, würzig; zugleich aromatisch und streng"],"Ndjesi e mrekullueshme plotësie në qiellzë, por e lehtë në mënyrë të papërshkrueshme":["A wonderful sensation of fullness on the palate, yet indescribably light","Una meravigliosa sensazione di pienezza al palato, ma indescrivibilmente leggero","Ein wunderbares Gefühl von Fülle am Gaumen und doch unbeschreiblich leicht"],"Shpendë fisnikë, ragù me mish të bardhë, fileto derri, derr në qumësht, lepur në verë të bardhë, qengj në furrë":["Noble fowl, white-meat ragù, pork fillet, pork cooked in milk, rabbit in white wine, baked lamb","Pollame nobile, ragù di carni bianche, filetto di maiale, maiale al latte, coniglio al vino bianco, agnello al forno","Edles Geflügel, Ragù aus hellem Fleisch, Schweinefilet, Schwein in Milch, Kaninchen in Weißwein, Lamm aus dem Ofen"],"Rubin i butë me nuanca mahagoni":["Soft ruby with mahogany hues","Rubino tenue con sfumature mogano","Sanftes Rubin mit Mahagoninuancen"],"Komplekse, me nota lulesh të egra, frutash të kuqe dhe erëzash fisnike":["Complex, with notes of wild flowers, red fruit and noble spices","Complesso, con note di fiori di campo, frutti rossi e spezie nobili","Komplex, mit Noten von Wildblumen, roten Früchten und edlen Gewürzen"],"E përqendruar, por njëkohësisht e ekuilibruar dhe elegante; kënaqësi e zgjatur":["Concentrated, yet at the same time balanced and elegant; prolonged pleasure","Concentrato, ma allo stesso tempo equilibrato ed elegante; piacere prolungato","Konzentriert und zugleich ausgewogen und elegant; anhaltender Genuss"],"Mish i kuq, gjah, djathë i stazhionuar":["Red meat, game, aged cheese","Carni rosse, selvaggina, formaggi stagionati","Rotes Fleisch, Wild, gereifter Käse"],"Shkëlqim i artë, gati qelibar":["Golden sheen, almost amber","Riflesso dorato, quasi ambrato","Goldener Glanz, fast bernsteinfarben"],"Ftua, fruta të thata dhe petale trëndafili":["Quince, dried fruit and rose petals","Mela cotogna, frutta secca e petali di rosa","Quitte, Trockenfrüchte und Rosenblätter"],"E përqendruar në qiellzë, me shije delikate mjalti, e ëmbël dhe e gjatë":["Concentrated on the palate, with a delicate honey flavour, sweet and long","Concentrato al palato, con delicato sapore di miele, dolce e lungo","Konzentriert am Gaumen, mit zartem Honiggeschmack, süß und lang"],"Ëmbëlsira, djathëra të pjekur mirë, kek dhe biskota, terrina/pate":["Desserts, well-matured cheeses, cakes and biscuits, terrines/pâté","Dolci, formaggi ben stagionati, torte e biscotti, terrine/paté","Desserts, gut gereifte Käse, Kuchen und Kekse, Terrinen/Pasteten"],"E kuqe granatë e fortë me reflekse vjollcë":["Strong garnet red with violet reflections","Rosso granato deciso con riflessi violacei","Kräftiges Granatrot mit violetten Reflexen"],"Aromë e butë, karakteristike, që të kujton manushaqe dhe qershi":["Soft, characteristic aroma reminiscent of violets and cherries","Profumo morbido e caratteristico che ricorda viole e ciliegie","Weicher, charakteristischer Duft, der an Veilchen und Kirschen erinnert"],"Shije e plotë, e rrumbullakët dhe frutore; tanine me kokërr të imët dhe aciditet i këndshëm mbështesin përfundimin e gjatë":["Full, round and fruity taste; fine-grained tannins and pleasant acidity support the long finish","Gusto pieno, rotondo e fruttato; tannini a grana fine e piacevole acidità sostengono il lungo finale","Voller, runder und fruchtiger Geschmack; feinkörnige Tannine und angenehme Säure tragen den langen Abgang"],"Mish kau i stufuar/në skarë, qengj, gjah, djathë":["Stewed/grilled beef, lamb, game, cheese","Manzo stufato/alla griglia, agnello, selvaggina, formaggi","Geschmortes/gegrilltes Rind, Lamm, Wild, Käse"],"E verdhë e zbehtë e ndritshme me reflekse të gjelbra shkëlqyese":["Bright pale yellow with shining green reflections","Giallo tenue brillante con splendenti riflessi verdi","Leuchtendes Blassgelb mit glänzenden grünen Reflexen"],"Aromë e këndshme lulesh livadhi, tipike për varietetin, që të kujton fruta ekzotike":["Pleasant aroma of meadow flowers, typical of the variety, reminiscent of exotic fruit","Piacevole profumo di fiori di prato, tipico del vitigno, che ricorda la frutta esotica","Angenehmer Duft von Wiesenblumen, sortentypisch, erinnert an exotische Früchte"],"Lehtësisht e athët, e strukturuar mirë dhe me trup të plotë, me përfundim të qëndrueshëm":["Lightly tart, well structured and full-bodied, with a persistent finish","Leggermente acidulo, ben strutturato e di corpo pieno, con finale persistente","Leicht säuerlich, gut strukturiert und vollmundig, mit anhaltendem Abgang"],"Peshk, fruta deti, mish i bardhë, rizoto, knedlik me djathë":["Fish, seafood, white meat, risotto, cheese dumplings","Pesce, frutti di mare, carni bianche, risotti, canederli al formaggio","Fisch, Meeresfrüchte, helles Fleisch, Risotto, Käseknödel"],"E kuqe rubin-granat e çelur":["Light ruby-garnet red","Rosso rubino-granato chiaro","Helles Rubin-Granatrot"],"Aroma joshëse qershie të kuqe, kokrrash të egra dhe manushaqesh":["Seductive aromas of red cherry, wild berries and violets","Profumi seducenti di ciliegia rossa, bacche selvatiche e viole","Verführerische Aromen von roter Kirsche, Wildbeeren und Veilchen"],"E balancuar mirë, me shije qershie të kuqe të thartë dhe kokrrash të kuqe, me nuanca vaniljeje dhe erëzash":["Well balanced, with flavours of sour red cherry and red berries, with hints of vanilla and spices","Ben equilibrato, con sapori di ciliegia rossa acidula e bacche rosse, con sfumature di vaniglia e spezie","Gut ausgewogen, mit Geschmack von säuerlicher roter Kirsche und roten Beeren, mit Anklängen von Vanille und Gewürzen"],"Pjata me mish të bardhë si derr i pjekur, gjellë me lepur dhe viçi me kërpudha":["White-meat dishes such as roast pork, rabbit stew and veal with mushrooms","Piatti di carne bianca come maiale arrosto, spezzatino di coniglio e vitello ai funghi","Gerichte mit hellem Fleisch wie Schweinebraten, Kaninchenragout und Kalb mit Pilzen"],"Nga e kuqe rubin e çelur deri mesatare; rubin intensiv deri granati i thellë":["From light to medium ruby red; intense ruby to deep garnet","Da rosso rubino chiaro a medio; da rubino intenso a granato profondo","Von hellem bis mittlerem Rubinrot; intensives Rubin bis tiefes Granat"],"Karakteristike, lehtësisht barishtore, e këndshme, tipike e varietetit, aromatike, delikate":["Characteristic, lightly herbaceous, pleasant, typical of the variety, aromatic, delicate","Caratteristico, leggermente erbaceo, piacevole, tipico del vitigno, aromatico, delicato","Charakteristisch, leicht krautig, angenehm, sortentypisch, aromatisch, zart"],"E thatë, e plotë, lehtësisht tanike; e butë, kadifeje, harmonike, e freskët":["Dry, full, lightly tannic; soft, velvety, harmonious, fresh","Secco, pieno, leggermente tannico; morbido, vellutato, armonico, fresco","Trocken, voll, leicht tanninbetont; weich, samtig, harmonisch, frisch"],"E verdhë e zbehtë e ndritshme":["Bright pale yellow","Giallo tenue brillante","Leuchtendes Blassgelb"],"Buqetë e ekuilibruar ananasi dhe bananeje":["Balanced bouquet of pineapple and banana","Bouquet equilibrato di ananas e banana","Ausgewogenes Bouquet von Ananas und Banane"],"Me trup të plotë, por njëkohësisht elegante":["Full-bodied, yet at the same time elegant","Di corpo pieno, ma allo stesso tempo elegante","Vollmundig und zugleich elegant"],"Antipasta të lehta, peshk, fruta deti, shpendë, mish i bardhë":["Light starters, fish, seafood, poultry, white meat","Antipasti leggeri, pesce, frutti di mare, pollame, carni bianche","Leichte Vorspeisen, Fisch, Meeresfrüchte, Geflügel, helles Fleisch"],"E verdhë e zbehtë deri në ngjyrë rëre":["Pale yellow to sand colour","Da giallo tenue a color sabbia","Blassgelb bis sandfarben"],"Buqetë lulore barishtesh dhe frutash të pjekura si dardhë, pjeshkë dhe pjepër":["Floral bouquet of herbs and ripe fruit such as pear, peach and melon","Bouquet floreale di erbe e frutta matura come pera, pesca e melone","Blumiges Bouquet von Kräutern und reifen Früchten wie Birne, Pfirsich und Melone"],"Trupi i verës është i plotë dhe i rrumbullakët, me përfundim elegant dhe kremoz":["The body of the wine is full and round, with an elegant, creamy finish","Il corpo del vino è pieno e rotondo, con finale elegante e cremoso","Der Körper des Weins ist voll und rund, mit elegantem, cremigem Abgang"],"Antipasta të lehta, peshk, specialitete tiroleze":["Light starters, fish, Tyrolean specialities","Antipasti leggeri, pesce, specialità tirolesi","Leichte Vorspeisen, Fisch, Tiroler Spezialitäten"],"E verdhë e ndritshme me reflekse të gjelbra":["Bright yellow with green reflections","Giallo brillante con riflessi verdi","Leuchtendes Gelb mit grünen Reflexen"],"Buqetë bukur e theksuar me strall, lule shtogu, kulumbri, piper jeshil, sherebelë dhe nenexhik":["A nicely pronounced bouquet with flint, elderflower, gooseberry, green pepper, sage and mint","Bouquet ben marcato con pietra focaia, fiori di sambuco, uva spina, peperone verde, salvia e menta","Ein schön ausgeprägtes Bouquet mit Feuerstein, Holunderblüte, Stachelbeere, grüner Paprika, Salbei und Minze"],"Këndshëm e kripur dhe minerale, e freskët në qiellzë, me aciditet të integruar hollë dhe përfundim të lëngshëm e të qëndrueshëm":["Pleasantly salty and mineral, fresh on the palate, with finely integrated acidity and a juicy, persistent finish","Piacevolmente sapido e minerale, fresco al palato, con acidità finemente integrata e finale succoso e persistente","Angenehm salzig und mineralisch, frisch am Gaumen, mit fein eingebundener Säure und saftigem, anhaltendem Abgang"],"Asparagus, perime në skarë, peshk, djathë dhie":["Asparagus, grilled vegetables, fish, goat cheese","Asparagi, verdure alla griglia, pesce, formaggio di capra","Spargel, gegrilltes Gemüse, Fisch, Ziegenkäse"],"Aromë delikate lulesh jasemini":["Delicate aroma of jasmine flowers","Delicato profumo di fiori di gelsomino","Zarter Duft von Jasminblüten"],"Intensive në qiellzë por e lehtë, e freskët dhe gjallëruese falë shkumës së imët; frutore-kremoze me dardha dhe bajame, e thatë, me aciditet të butë e të lehtë dhe trup jo shumë të rëndë":["Intense on the palate yet light, fresh and invigorating thanks to the fine mousse; fruity-creamy with pears and almonds, dry, with soft, light acidity and a not too heavy body","Intenso al palato ma leggero, fresco e vivificante grazie alla spuma fine; fruttato-cremoso con pere e mandorle, secco, con acidità morbida e leggera e corpo non troppo pesante","Intensiv am Gaumen und doch leicht, frisch und belebend dank des feinen Schaums; fruchtig-cremig mit Birnen und Mandeln, trocken, mit weicher, leichter Säure und nicht zu schwerem Körper"],"Antipasta, supa, gjellë, sallam, peshk":["Starters, soups, stews, salami, fish","Antipasti, zuppe, stufati, salame, pesce","Vorspeisen, Suppen, Eintöpfe, Salami, Fisch"],"E kuqe rubin intensive, që anon nga granati":["Intense ruby red, leaning towards garnet","Rosso rubino intenso, tendente al granato","Intensives Rubinrot, zu Granat neigend"],"Nuanca qershie, erëzash, lëkure, vaniljeje, fuçie lisi dhe theksime interesante minerale":["Hints of cherry, spices, leather, vanilla, oak barrel and interesting mineral accents","Sfumature di ciliegia, spezie, cuoio, vaniglia, botte di rovere e interessanti accenti minerali","Anklänge von Kirsche, Gewürzen, Leder, Vanille, Eichenfass und interessanten mineralischen Akzenten"],"Përzierje harmonike frutash të kuqe të pjekura, mjedrash, qershish, boronicash dhe kumbullash":["A harmonious blend of ripe red fruit, raspberries, cherries, blueberries and plums","Fusione armonica di frutti rossi maturi, lamponi, ciliegie, mirtilli e prugne","Harmonische Mischung aus reifen roten Früchten, Himbeeren, Kirschen, Heidelbeeren und Pflaumen"],"Gjellë me mish lope Chianina, gjah, kërpudha dhe tartuf, djathëra të stazhionuar dhe të strukturuar":["Chianina beef stews, game, mushrooms and truffle, aged and structured cheeses","Stufati di manzo chianino, selvaggina, funghi e tartufo, formaggi stagionati e strutturati","Schmorgerichte vom Chianina-Rind, Wild, Pilze und Trüffel, gereifte und strukturierte Käse"],"Nota harmonike frutash dhe erëzash":["Harmonious notes of fruit and spices","Note armoniche di frutta e spezie","Harmonische Noten von Früchten und Gewürzen"],"Elegante dhe me trup, me përfundim të gjatë":["Elegant and with body, with a long finish","Elegante e di corpo, con finale lungo","Elegant und mit Körper, mit langem Abgang"],"Rubin-vjollcë kadifeje dhe intensiv":["Velvety, intense ruby-violet","Rubino-violaceo vellutato e intenso","Samtiges, intensives Rubinviolett"],"Hundë pak e përmbajtur, ka nevojë për kohë; manaferra dhe ribes i errët, pak erëza barishtore":["A slightly restrained nose, it needs time; blackberries and dark currant, a little herbal spice","Naso un po' contenuto, ha bisogno di tempo; more e ribes scuro, un po' di spezie erbacee","Etwas verhaltene Nase, braucht Zeit; Brombeeren und dunkle Johannisbeere, etwas Kräuterwürze"],"Fillim kompakt, lëngshmëri, frut kokrrash të errëta, tanine të dendura e të kapshme, bollëk që zhvillohet; përfundim me vrull të guximshëm, shumë duhan":["Compact start, juiciness, dark berry fruit, dense grippy tannins, an abundance that develops; a finish with bold drive, lots of tobacco","Inizio compatto, succosità, frutto di bacche scure, tannini fitti e grippanti, abbondanza che si sviluppa; finale con slancio audace, molto tabacco","Kompakter Beginn, Saftigkeit, dunkle Beerenfrucht, dichte griffige Tannine, eine sich entwickelnde Fülle; Abgang mit kühnem Schwung, viel Tabak"],"Intensive dhe frutore: fruta të vogla të kuqe dhe erëza, përfshirë jamballin":["Intense and fruity: small red fruits and spices, including saffron","Intenso e fruttato: piccoli frutti rossi e spezie, compreso lo zafferano","Intensiv und fruchtig: kleine rote Früchte und Gewürze, darunter Safran"],"E freskët dhe kadifeje, harmonike, me tanine veçanërisht tërheqëse":["Fresh and velvety, harmonious, with particularly attractive tannins","Fresco e vellutato, armonico, con tannini particolarmente attraenti","Frisch und samtig, harmonisch, mit besonders ansprechenden Tanninen"],"Pjata të thjeshta me mish, perime në skarë, tartar mishi, djathë me stazhionim mesatar":["Simple meat dishes, grilled vegetables, meat tartare, medium-aged cheese","Piatti semplici di carne, verdure alla griglia, tartare di carne, formaggi di media stagionatura","Einfache Fleischgerichte, gegrilltes Gemüse, Fleischtatar, mittelalter Käse"],"Rubin i errët dhe i pasur":["Dark, rich ruby","Rubino scuro e ricco","Dunkles, reiches Rubin"],"Hundë emocionuese me nota manaferrash dhe kumbullash të pjekura, shegë në sfond":["Exciting nose with notes of blackberries and ripe plums, pomegranate in the background","Naso emozionante con note di more e prugne mature, melograno sullo sfondo","Aufregende Nase mit Noten von Brombeeren und reifen Pflaumen, Granatapfel im Hintergrund"],"E rrumbullakët dhe e butë në qiellzë, me shumë fruta të pjekura; hapet me tanine të endura imët, e kripur dhe e gjatë":["Round and soft on the palate, with lots of ripe fruit; it opens with finely woven tannins, salty and long","Rotondo e morbido al palato, con molta frutta matura; si apre con tannini finemente intessuti, sapido e lungo","Rund und weich am Gaumen, mit viel reifer Frucht; öffnet sich mit fein gewobenen Tanninen, salzig und lang"],"Rubin i errët që shkëlqen":["Shining dark ruby","Rubino scuro brillante","Glänzendes dunkles Rubin"],"Hundë intensive dhe ftuese me aromë të theksuar jargavani, pak kakao dhe lëkurë, shumë ribes i zi":["Intense, inviting nose with a marked aroma of lilac, a little cocoa and leather, lots of blackcurrant","Naso intenso e invitante con spiccato profumo di lillà, un po' di cacao e cuoio, molto ribes nero","Intensive, einladende Nase mit ausgeprägtem Fliederduft, etwas Kakao und Leder, viel schwarze Johannisbeere"],"Nota shumë të bukura frutash në qiellzë, sërish shumë ribes i zi, tanin i kapshëm, shumë e qartë; zhvillon gjatësi shumë të mirë në fund":["Very lovely fruit notes on the palate, again lots of blackcurrant, grippy tannin, very clear; it develops very good length at the end","Note di frutto molto belle al palato, di nuovo molto ribes nero, tannino grippante, molto nitido; sviluppa ottima lunghezza nel finale","Sehr schöne Fruchtnoten am Gaumen, wieder viel schwarze Johannisbeere, griffiges Tannin, sehr klar; entwickelt am Ende sehr gute Länge"],"Rubin me reflekse të kuqe granate":["Ruby with garnet-red reflections","Rubino con riflessi rosso granato","Rubin mit granatroten Reflexen"],"Intensive, me nuanca të qarta frutash të kuqe me tul; lulore me manushaqe shumë të freskëta, me nuanca erëzash":["Intense, with clear hints of fleshy red fruit; floral with very fresh violets, with spicy hints","Intenso, con nette sfumature di frutti rossi polposi; floreale con viole freschissime, con sfumature speziate","Intensiv, mit klaren Anklängen fleischiger roter Früchte; blumig mit ganz frischen Veilchen, mit würzigen Anklängen"],"E qëndrueshme, e ngrohtë, me trup të plotë dhe harmonike; në shije konfirmon notat e ndjera në hundë":["Persistent, warm, full-bodied and harmonious; on the palate it confirms the notes perceived on the nose","Persistente, caldo, di corpo pieno e armonico; al gusto conferma le note percepite al naso","Anhaltend, warm, vollmundig und harmonisch; am Gaumen bestätigt er die Noten der Nase"],"E kuqe rubin ose granati, më shumë ose më pak intensive":["Ruby or garnet red, more or less intense","Rosso rubino o granato, più o meno intenso","Rubin- oder Granatrot, mehr oder weniger intensiv"],"Delikate, aromatike, e gjerë, me nuanca lulore":["Delicate, aromatic, broad, with floral hints","Delicato, aromatico, ampio, con sfumature floreali","Zart, aromatisch, weit, mit Blütenanklängen"],"Nga e thatë deri në të ëmbël (versioni amabile është gjysmë i ëmbël), e freskët, e balancuar mirë, me një nuancë delikate majaje":["From dry to sweet (the amabile version is semi-sweet), fresh, well balanced, with a delicate hint of yeast","Da secco a dolce (la versione amabile è semidolce), fresco, ben equilibrato, con una delicata sfumatura di lievito","Von trocken bis süß (die Amabile-Version ist halbsüß), frisch, gut ausgewogen, mit zartem Hefeanklang"],"Pjata me makarona, mish i zier, djathëra":["Pasta dishes, boiled meat, cheeses","Piatti di pasta, bolliti, formaggi","Pastagerichte, gekochtes Fleisch, Käse"],"Ngjyrë e verdhë kashte":["Straw yellow colour","Colore giallo paglierino","Strohgelbe Farbe"],"Aromë lulesh dhe frutash me nuanca pjeshke":["Aroma of flowers and fruit with hints of peach","Profumo di fiori e frutta con sfumature di pesca","Duft von Blumen und Früchten mit Pfirsichanklängen"],"Shije e plotë dhe e pasur, e butë dhe harmonike, me tone aromash fisnike që vijnë nga pjekja e plotë e rrushit dhe që intensifikojnë karakterin":["Full, rich taste, soft and harmonious, with tones of noble aromas coming from the full ripeness of the grapes that intensify its character","Gusto pieno e ricco, morbido e armonico, con toni di profumi nobili derivanti dalla piena maturazione delle uve che ne intensificano il carattere","Voller, reicher Geschmack, weich und harmonisch, mit edlen Aromatönen aus der vollen Traubenreife, die den Charakter verstärken"],"Shkon në mënyrë të përsosur me mish të bardhë dhe pjata me peshk":["Goes perfectly with white meat and fish dishes","Si abbina perfettamente a carni bianche e piatti di pesce","Passt perfekt zu hellem Fleisch und Fischgerichten"],"Aroma intensive frutash të kuqe, të kombinuara me nota erëzore kafeje dhe çokollate":["Intense aromas of red fruit, combined with spicy notes of coffee and chocolate","Profumi intensi di frutti rossi, uniti a note speziate di caffè e cioccolato","Intensive Aromen roter Früchte, verbunden mit würzigen Noten von Kaffee und Schokolade"],"E gjallë dhe e balancuar mirë, me tanine të buta dhe përfundim të gjatë e të mëndafshtë":["Lively and well balanced, with soft tannins and a long, silky finish","Vivace e ben equilibrato, con tannini morbidi e finale lungo e setoso","Lebendig und gut ausgewogen, mit weichen Tanninen und langem, seidigem Abgang"],"Një larmi gati e pafundme aromash: fruta të errëta të pjekura si kumbulla, kokrra të ndryshme të errëta dhe shtog":["An almost endless variety of aromas: ripe dark fruit such as plums, various dark berries and elder","Una varietà quasi infinita di profumi: frutti scuri maturi come prugne, varie bacche scure e sambuco","Eine fast unendliche Vielfalt an Aromen: reife dunkle Früchte wie Pflaumen, verschiedene dunkle Beeren und Holunder"],"Në qiellzë një fishekzjarr aromash; komponentët frutorë dhe erëzorë dalin bukur dhe plotësojnë njëri-tjetrin, me tanine të buta e kadifeje":["On the palate a firework of aromas; the fruity and spicy components emerge beautifully and complement each other, with soft, velvety tannins","Al palato un fuoco d'artificio di aromi; le componenti fruttate e speziate emergono splendidamente e si completano a vicenda, con tannini morbidi e vellutati","Am Gaumen ein Feuerwerk an Aromen; die fruchtigen und würzigen Komponenten treten schön hervor und ergänzen sich, mit weichen, samtigen Tanninen"],"Qengj, gjah dhe patë, si dhe pjata të forta makaronash ose djathëra të stazhionuar":["Lamb, game and goose, as well as hearty pasta dishes or aged cheeses","Agnello, selvaggina e oca, oltre a robusti piatti di pasta o formaggi stagionati","Lamm, Wild und Gans sowie kräftige Pastagerichte oder gereifte Käse"],"E kuqe rubin, intensive me reflekse vjollcë.":["Ruby red, intense with violet reflections.","Rosso rubino, intenso con riflessi violacei.","Rubinrot, intensiv mit violetten Reflexen."],"Aromë intensive me fruta të kuqe dhe nuanca balsamike e lulesh.":["Intense aroma with red fruit and balsamic and floral hints.","Profumo intenso con frutti rossi e sfumature balsamiche e floreali.","Intensiver Duft mit roten Früchten und balsamischen und blumigen Anklängen."],"E ngrohtë, e qëndrueshme, me pas-shije druri.":["Warm, persistent, with a woody aftertaste.","Caldo, persistente, con retrogusto legnoso.","Warm, anhaltend, mit holzigem Nachgeschmack."],"Pjata të para, pasta me ragù, kaponata me patëllxhanë dhe djathë mesatarisht i stagjionuar.":["First courses, pasta with ragù, aubergine caponata and medium-aged cheese.","Primi piatti, pasta al ragù, caponata di melanzane e formaggi di media stagionatura.","Erste Gänge, Pasta mit Ragù, Auberginen-Caponata und mittelalter Käse."],"Hapet me qershi të zezë, manaferra dhe shtog; poshtë tyre jamball, çokollatë e zezë dhe një nuancë diskrete aromash të pjekura":["It opens with black cherry, blackberry and elder; beneath them saffron, dark chocolate and a discreet hint of roasted aromas","Si apre con ciliegia nera, mora e sambuco; sotto, zafferano, cioccolato fondente e un discreto accenno di aromi tostati","Öffnet sich mit Schwarzkirsche, Brombeere und Holunder; darunter Safran, dunkle Schokolade und ein dezenter Hauch Röstaromen"],"Me trup të plotë dhe e dendur; tanine të forta me pjekuri të këndshme, pa ashpërsi":["Full-bodied and dense; firm tannins with pleasant ripeness, without harshness","Di corpo pieno e denso; tannini decisi di piacevole maturità, senza ruvidezza","Vollmundig und dicht; feste Tannine mit angenehmer Reife, ohne Härte"],"Brinjë qengji në skarë, makarona me ragù, pecorino i stazhionuar ose caponata me patëllxhanë":["Grilled lamb chops, pasta with ragù, aged pecorino or aubergine caponata","Costolette d'agnello alla griglia, pasta al ragù, pecorino stagionato o caponata di melanzane","Gegrillte Lammkoteletts, Pasta mit Ragù, gereifter Pecorino oder Auberginen-Caponata"],"E kuqe rubin, intensive dhe e plotë.":["Ruby red, intense and full.","Rosso rubino, intenso e pieno.","Rubinrot, intensiv und voll."],"Aromë frutash të kuqe, intensive, me nuanca barishtore dhe balsamike.":["Aroma of red fruit, intense, with herbaceous and balsamic hints.","Profumo di frutti rossi, intenso, con sfumature erbacee e balsamiche.","Duft roter Früchte, intensiv, mit krautigen und balsamischen Anklängen."],"Me trup të plotë, taninike; pas-shije frutash të kuqe, përfundim i ngrohtë.":["Full-bodied, tannic; aftertaste of red fruit, warm finish.","Di corpo pieno, tannico; retrogusto di frutti rossi, finale caldo.","Vollmundig, tanninbetont; Nachgeschmack roter Früchte, warmer Abgang."],"Salume, tagliata viçi dhe pasta; shkëlqyeshëm me recetat tipike mesdhetare dhe siciliane.":["Cured meats, veal tagliata and pasta; excellent with typical Mediterranean and Sicilian recipes.","Salumi, tagliata di vitello e pasta; ottimo con le ricette tipiche mediterranee e siciliane.","Wurstwaren, Kalbs-Tagliata und Pasta; ausgezeichnet zu typisch mediterranen und sizilianischen Rezepten."],"E artë me reflekse qelibar, shumë e ndritshme":["Golden with amber reflections, very bright","Dorato con riflessi ambrati, molto brillante","Golden mit bernsteinfarbenen Reflexen, sehr leuchtend"],"Intensive dhe komplekse: fruta në shurup, mjaltë, fiq të thatë, rrush të thatë dhe nota agrumesh":["Intense and complex: fruit in syrup, honey, dried figs, raisins and citrus notes","Intenso e complesso: frutta sciroppata, miele, fichi secchi, uvetta e note di agrumi","Intensiv und komplex: Früchte in Sirup, Honig, getrocknete Feigen, Rosinen und Zitrusnoten"],"Këndshëm e ëmbël, e plotë dhe e pasur, me nota të thekura dhe mbyllje të gjatë e të këndshme":["Pleasantly sweet, full and rich, with toasty notes and a long, pleasant close","Piacevolmente dolce, pieno e ricco, con note tostate e chiusura lunga e piacevole","Angenehm süß, voll und reich, mit Röstnoten und langem, angenehmem Ausklang"],"Në hundë dalin nota frutash të thata, mjalti, vaniljeje, erëzash të ëmbla dhe drurësh fisnikë, me nuanca të lehta të thekura":["On the nose notes of dried fruit, honey, vanilla, sweet spices and noble woods emerge, with light toasty hints","Al naso emergono note di frutta secca, miele, vaniglia, spezie dolci e legni nobili, con leggere sfumature tostate","In der Nase zeigen sich Noten von Trockenfrüchten, Honig, Vanille, süßen Gewürzen und edlen Hölzern, mit leichten Röstanklängen"],"Në qiellzë është e butë, mbështjellëse dhe e qëndrueshme, me ndjesi të ngrohtë por të integruar në mënyrë të përsosur dhe mbyllje të gjatë e elegante; shije e butë dhe e veçantë, grappa me personalitet të madh":["On the palate it is soft, enveloping and persistent, with a warm but perfectly integrated sensation and a long, elegant close; a smooth and distinctive taste, a grappa of great personality","Al palato è morbida, avvolgente e persistente, con una sensazione calda ma perfettamente integrata e una chiusura lunga ed elegante; gusto morbido e particolare, grappa di grande personalità","Am Gaumen weich, umhüllend und anhaltend, mit warmem, aber perfekt eingebundenem Eindruck und langem, elegantem Ausklang; ein weicher, besonderer Geschmack, ein Grappa mit großer Persönlichkeit"],"Distilat meditimi; shkon shumë mirë me çokollatë të zezë 70–80%, cantucci ose ëmbëlsira të thata me bajame":["A meditation spirit; it goes very well with 70–80% dark chocolate, cantucci or dry almond pastries","Distillato da meditazione; si abbina molto bene a cioccolato fondente 70–80%, cantucci o dolci secchi alle mandorle","Ein Meditationsdestillat; passt sehr gut zu 70–80 % dunkler Schokolade, Cantucci oder trockenem Mandelgebäck"],"Në hundë dalin nota lulore trëndafili, nuanca reçeli dhe nuanca të lehta erëzore":["On the nose floral notes of rose, hints of jam and light spicy hints emerge","Al naso emergono note floreali di rosa, sfumature di confettura e leggere sfumature speziate","In der Nase zeigen sich blumige Rosennoten, Anklänge von Konfitüre und leichte würzige Anklänge"],"Në qiellzë është e butë dhe kadifeje, me qëndrueshmëri të mirë dhe mbyllje të ngrohtë por të balancuar":["On the palate it is soft and velvety, with good persistence and a warm but balanced close","Al palato è morbida e vellutata, con buona persistenza e chiusura calda ma equilibrata","Am Gaumen weich und samtig, mit guter Länge und warmem, aber ausgewogenem Ausklang"],"E përsosur në fund të vaktit; për një degustim të ngadaltë dhe meditues":["Perfect at the end of a meal; for slow, meditative tasting","Perfetta a fine pasto; per una degustazione lenta e meditativa","Perfekt zum Abschluss des Essens; für ein langsames, meditatives Verkosten"],"Pa ngjyrë dhe plotësisht e tejdukshme; nëse është plakur në dru, në nuanca të ndryshme qelibari":["Colourless and perfectly transparent; if aged in wood, in various shades of amber","Incolore e perfettamente trasparente; se invecchiata in legno, nelle varie sfumature dell'ambra","Farblos und vollkommen transparent; bei Holzlagerung in verschiedenen Bernsteintönen"],"Intensive, me nota tipike të lëndës së parë (vinaccia) dhe tone delikate lulore ose frutore; te grappat e plakura shtohen nuancat aromatike që jep druri":["Intense, with notes typical of the raw material (pomace) and delicate floral or fruity tones; in aged grappas the aromatic nuances given by the wood are added","Intenso, con note tipiche della materia prima (vinaccia) e delicati toni floreali o fruttati; nelle grappe invecchiate si aggiungono le sfumature aromatiche date dal legno","Intensiv, mit typischen Noten des Rohstoffs (Trester) und zarten blumigen oder fruchtigen Tönen; bei gereiften Grappe kommen die Aromanuancen des Holzes hinzu"],"E ngrohtë, e vendosur, harmonike dhe e qëndrueshme":["Warm, decisive, harmonious and persistent","Caldo, deciso, armonico e persistente","Warm, entschieden, harmonisch und anhaltend"],"Qelibar, me bukuri joshëse":["Amber, of seductive beauty","Ambrato, di seducente bellezza","Bernsteinfarben, von verführerischer Schönheit"],"Aroma shumë intensive fiqsh të thatë, reçeli kumbulle dhe vaniljeje":["Very intense aromas of dried figs, plum jam and vanilla","Profumi intensissimi di fichi secchi, confettura di prugne e vaniglia","Sehr intensive Aromen von getrockneten Feigen, Pflaumenkonfitüre und Vanille"],"E butë, e pasur dhe harmonike":["Soft, rich and harmonious","Morbida, ricca e armoniosa","Weich, reich und harmonisch"],"Qelibar intensiv":["Intense amber","Ambra intenso","Intensives Bernstein"],"Aromë intensive dhe e qëndrueshme me nota tipike lisi dhe veze; rrush i thatë me një nuancë kanelle":["Intense, persistent aroma with typical notes of oak and egg; raisins with a hint of cinnamon","Profumo intenso e persistente con tipiche note di rovere e uovo; uvetta con una sfumatura di cannella","Intensiver, anhaltender Duft mit typischen Noten von Eiche und Ei; Rosinen mit einem Hauch Zimt"],"Kremoze, e ëmbël, mbështjellëse dhe e balancuar":["Creamy, sweet, enveloping and balanced","Cremoso, dolce, avvolgente ed equilibrato","Cremig, süß, umhüllend und ausgewogen"],"Si verë ëmbëlsire me pasticeri të thatë, biskota dhe akullore; edhe me djathë blu":["As a dessert wine with dry pastries, biscuits and ice cream; also with blue cheese","Come vino da dessert con pasticceria secca, biscotti e gelato; anche con formaggi erborinati","Als Dessertwein zu trockenem Gebäck, Keksen und Eis; auch zu Blauschimmelkäse"],"Kristal i kthjellët, që tregon pastërtinë":["Crystal clear, showing its purity","Cristallino, che mostra la sua purezza","Kristallklar, zeigt seine Reinheit"],"Buqetë delikate me nota lehtësisht frutore dhe një nuancë të hollë bajameje":["Delicate bouquet with lightly fruity notes and a fine hint of almond","Bouquet delicato con note leggermente fruttate e una fine sfumatura di mandorla","Zartes Bouquet mit leicht fruchtigen Noten und einem feinen Mandelanklang"],"E lëmuar dhe e butë në qiellzë, me ekuilibër harmonik":["Smooth and soft on the palate, with harmonious balance","Morbida e vellutata al palato, con equilibrio armonico","Glatt und weich am Gaumen, mit harmonischer Ausgewogenheit"],"E përsosur si digjestiv pas vaktit dhe si bazë për kokteje":["Perfect as a digestif after a meal and as a base for cocktails","Perfetta come digestivo dopo il pasto e come base per cocktail","Perfekt als Digestif nach dem Essen und als Basis für Cocktails"],"E verdhë intensive":["Intense yellow","Giallo intenso","Intensives Gelb"],"Aroma aromatike, erëzore dhe intensive":["Aromatic, spicy and intense aromas","Profumi aromatici, speziati e intensi","Aromatische, würzige und intensive Aromen"],"Shija në gojë është harmonike, e butë, e balancuar dhe lehtësisht me vanilje":["The taste is harmonious, soft, balanced and lightly vanilla-scented","Il gusto in bocca è armonico, morbido, equilibrato e leggermente vanigliato","Der Geschmack ist harmonisch, weich, ausgewogen und leicht vanillig"],"Aromë e hollë dhe aromatike":["Fine, aromatic aroma","Profumo fine e aromatico","Feiner, aromatischer Duft"],"E thatë dhe e qartë në qiellzë; karakteri i bërsisë del në pah, druri mbetet i përmbajtur":["Dry and clear on the palate; the character of the pomace comes to the fore, the wood remains restrained","Secca e nitida al palato; il carattere della vinaccia emerge, il legno resta contenuto","Trocken und klar am Gaumen; der Tresterscharakter tritt hervor, das Holz bleibt zurückhaltend"],"Digjestiv pas vaktit, me çokollatë të zezë ose me një espreso në fund të një mbrëmjeje të gjatë":["A digestif after a meal, with dark chocolate or with an espresso at the end of a long evening","Digestivo dopo il pasto, con cioccolato fondente o con un espresso alla fine di una lunga serata","Digestif nach dem Essen, zu dunkler Schokolade oder zu einem Espresso am Ende eines langen Abends"],"Buqetë delikate, lehtësisht aromatike; pak ujë e hap më tej aromën":["Delicate bouquet, lightly aromatic; a little water opens the aroma further","Bouquet delicato, leggermente aromatico; un po' d'acqua apre ulteriormente il profumo","Zartes Bouquet, leicht aromatisch; etwas Wasser öffnet den Duft weiter"],"Shije e balancuar mirë, që nuk duket e ashpër pavarësisht 50%":["A well-balanced taste that does not seem harsh despite the 50%","Gusto ben equilibrato, che non risulta aggressivo nonostante il 50%","Gut ausgewogener Geschmack, der trotz 50 % nicht scharf wirkt"],"Klasikisht pas vaktit si digjestiv; shkon mirë edhe në një caffè corretto":["Classically after a meal as a digestif; also good in a caffè corretto","Classicamente dopo il pasto come digestivo; ottima anche nel caffè corretto","Klassisch nach dem Essen als Digestif; passt auch gut in einen Caffè corretto"],"Shumë transparente":["Very transparent","Molto trasparente","Sehr transparent"],"Aroma të kujton frutat e bardha dhe rrushin e freskët":["The aroma recalls white fruit and fresh grapes","Il profumo ricorda la frutta bianca e l'uva fresca","Der Duft erinnert an helle Früchte und frische Trauben"],"Rrush i freskët, nota lulore, fruta me tul të bardhë":["Fresh grape, floral notes, white-fleshed fruit","Uva fresca, note floreali, frutta a polpa bianca","Frische Traube, Blütennoten, weißfleischige Früchte"],"Në fund të vaktit":["At the end of a meal","A fine pasto","Zum Abschluss des Essens"],"Ngjyrë e bukur ari e çelur":["A lovely light gold colour","Bel colore oro chiaro","Schöne hellgoldene Farbe"],"Aroma eterike lulore dhe frutore, që i lënë vend nuancave erëzore dhe barishtore":["Ethereal floral and fruity aromas, giving way to spicy and herbal hints","Profumi eterei floreali e fruttati, che lasciano spazio a sfumature speziate ed erbacee","Ätherische blumige und fruchtige Aromen, die würzigen und krautigen Anklängen Platz machen"],"E butë, elegante dhe me mbyllje të qëndrueshme me vanilje":["Soft, elegant and with a persistent close with vanilla","Morbida, elegante e con chiusura persistente di vaniglia","Weich, elegant und mit anhaltendem Vanilleausklang"],"Shkëlqyeshëm për t'u shijuar e pastër, ashtu siç është":["Excellent enjoyed neat, just as it is","Ottima da gustare liscia, così com'è","Ausgezeichnet pur genossen, so wie sie ist"],"Balsamik, aromatik, kremoz":["Balsamic, aromatic, creamy","Balsamico, aromatico, cremoso","Balsamisch, aromatisch, cremig"],"Aromë delikate, e pastër, që të kujton frutin (mollën)":["Delicate, clean aroma reminiscent of the fruit (apple)","Profumo delicato, netto, che ricorda il frutto (la mela)","Zarter, klarer Duft, der an die Frucht (Apfel) erinnert"],"Shije harmonike, e këndshme dhe me qëndrueshmëri të mirë":["Harmonious, pleasant taste with good persistence","Gusto armonico, gradevole e di buona persistenza","Harmonischer, angenehmer Geschmack mit guter Länge"],"Aromë lulesh portokalli dhe kamomili":["Aroma of orange blossom and chamomile","Profumo di fiori d'arancio e camomilla","Duft von Orangenblüte und Kamille"],"Bërthamë portokalli e hidhur-e ëmbël me jamball intensiv, mente piperi dhe anason; mbyllet me mente dominuese dhe karakter barishtor të freskët e joshës":["A bittersweet orange core with intense saffron, peppermint and anise; it closes with dominant mint and a fresh, seductive herbal character","Cuore di arancia agrodolce con intenso zafferano, menta piperita e anice; chiude con menta dominante e un carattere erbaceo fresco e seducente","Ein bittersüßer Orangenkern mit intensivem Safran, Pfefferminze und Anis; schließt mit dominierender Minze und frischem, verführerischem Kräutercharakter"],"Ngjyrë e errët, mbështjellëse, që paralajmëron notat aromatike të thella dhe të qëndrueshme":["A dark, enveloping colour heralding deep, persistent aromatic notes","Colore scuro e avvolgente, che annuncia note aromatiche profonde e persistenti","Eine dunkle, umhüllende Farbe, die tiefe, anhaltende Aromen ankündigt"],"Buqetë e pasur me theksime karameli, kafeje, çokollate dhe një nuancë portokalli":["Rich bouquet with accents of caramel, coffee, chocolate and a hint of orange","Bouquet ricco con accenti di caramello, caffè, cioccolato e un tocco d'arancia","Reiches Bouquet mit Akzenten von Karamell, Kaffee, Schokolade und einem Hauch Orange"],"Shije e balancuar dhe çuditërisht e ëmbël në fillim, e ndjekur nga një notë e hidhur që zgjat dhe të fton për një gllënjkë tjetër":["Balanced and surprisingly sweet at first, followed by a bitter note that lingers and invites another sip","Gusto equilibrato e sorprendentemente dolce all'inizio, seguito da una nota amara che persiste e invita a un altro sorso","Ausgewogen und anfangs überraschend süß, gefolgt von einer bitteren Note, die nachklingt und zu einem weiteren Schluck einlädt"],"Portokalli e ndritshme.":["Bright orange.","Arancione brillante.","Leuchtendes Orange."],"Portokall i freskët me aroma komplekse barishtesh, të harmonizuara me një prekje vanilje.":["Fresh orange with complex aromas of herbs, harmonised with a touch of vanilla.","Arancia fresca con complessi profumi di erbe, armonizzati da un tocco di vaniglia.","Frische Orange mit komplexen Kräuteraromen, harmonisiert durch einen Hauch Vanille."],"Notë fillestare intensive portokalli, me nota barishtore dhe druri në trup, që rrumbullakosen në një shije të këndshme ëmbël-hidhur dhe me kripësi.":["An intense initial note of orange, with herbal and woody notes in the body, rounding into a pleasant bittersweet and savoury taste.","Intensa nota iniziale d'arancia, con note erbacee e legnose nel corpo, che si arrotondano in un gusto piacevolmente agrodolce e sapido.","Eine intensive Orangennote am Anfang, mit Kräuter- und Holznoten im Körper, die sich zu einem angenehm bittersüßen, salzigen Geschmack abrunden."],"Qelibar.":["Amber.","Ambrato.","Bernsteinfarben."],"E pasur në aroma të ndryshme: parfumi i detit përzihet me agrume dhe jamball.":["Rich in varied aromas: the scent of the sea mixes with citrus and saffron.","Ricco di profumi diversi: il profumo del mare si mescola ad agrumi e zafferano.","Reich an vielfältigen Aromen: Meeresduft mischt sich mit Zitrus und Safran."],"Shije ëmbël-hidhur.":["Bittersweet taste.","Gusto agrodolce.","Bittersüßer Geschmack."],"Kafe qelibar me nuanca të kuqërremta.":["Amber brown with reddish hues.","Marrone ambrato con sfumature rossastre.","Bernsteinbraun mit rötlichen Nuancen."],"Nota druri dhe rrënjësh, ku dallohet rrënja e gencianës, me dëllinjë, barishte aromatike dhe pelin në fund.":["Notes of wood and roots, where gentian root stands out, with juniper, aromatic herbs and wormwood at the end.","Note di legno e radici, dove spicca la radice di genziana, con ginepro, erbe aromatiche e assenzio nel finale.","Noten von Holz und Wurzeln, aus denen die Enzianwurzel hervortritt, mit Wacholder, Kräutern und Wermut am Ende."],"Shije e fortë dhe intensive barishtesh dhe vajrash esencialë, e ndjekur nga nota druri dhe rrënjësh dhe një hidhësi e këndshme.":["A strong, intense taste of herbs and essential oils, followed by notes of wood and roots and a pleasant bitterness.","Gusto deciso e intenso di erbe e oli essenziali, seguito da note di legno e radici e da un piacevole amaro.","Ein kräftiger, intensiver Geschmack von Kräutern und ätherischen Ölen, gefolgt von Holz- und Wurzelnoten und angenehmer Bitterkeit."],"Lëng i kthjellët, i kuq i thellë.":["Clear liquid, deep red.","Liquido limpido, rosso intenso.","Klare Flüssigkeit, tiefes Rot."],"Nota agrumesh dhe botanikësh.":["Notes of citrus and botanicals.","Note di agrumi e botaniche.","Noten von Zitrus und Botanicals."],"Përfundim i gjatë dhe i thatë agrumesh dhe botanikësh; hidhësia klasike e Campari-t.":["Long, dry finish of citrus and botanicals; the classic Campari bitterness.","Finale lungo e secco di agrumi e botaniche; la classica amarezza del Campari.","Langer, trockener Abgang von Zitrus und Botanicals; die klassische Campari-Bitterkeit."],"Krejt e kthjellët, me ngjyrë të gjallë \"të kuqe Campari\".":["Completely clear, with a vivid 'Campari red' colour.","Completamente limpido, di un vivace colore 'rosso Campari'.","Völlig klar, mit lebhafter 'Campari-roter' Farbe."],"Tërheqëse dhe komplekse, me nota barishtesh, portokalli dhe lulesh.":["Attractive and complex, with notes of herbs, orange and flowers.","Attraente e complesso, con note di erbe, arancia e fiori.","Ansprechend und komplex, mit Noten von Kräutern, Orange und Blüten."],"E hidhur në mënyrë të këndshme, me pas-shije kadifeje; nota intensive portokalli, barishtesh dhe druri.":["Pleasantly bitter, with a velvety aftertaste; intense notes of orange, herbs and wood.","Piacevolmente amaro, con retrogusto vellutato; intense note di arancia, erbe e legno.","Angenehm bitter, mit samtigem Nachgeschmack; intensive Noten von Orange, Kräutern und Holz."],"Qelibar":["Amber","Ambrato","Bernsteinfarben"],"Përzierje aromatike vaniljeje dhe qershie të zezë, me një nuancë karameli kremoz":["An aromatic blend of vanilla and black cherry, with a hint of creamy caramel","Miscela aromatica di vaniglia e ciliegia nera, con una sfumatura di caramello cremoso","Eine aromatische Mischung aus Vanille und Schwarzkirsche, mit einem Hauch cremigem Karamell"],"I butë, me një nuancë të lehtë ëmbëlsie fillestare, që hapet drejt erëzave dhe një hidhësie komplekse; përfundim botanik pelini (artemisia)":["Soft, with a light hint of initial sweetness, opening towards spices and a complex bitterness; a botanical finish of wormwood (artemisia)","Morbido, con una leggera dolcezza iniziale, che si apre verso spezie e un amaro complesso; finale botanico di assenzio (artemisia)","Weich, mit leichter anfänglicher Süße, die sich zu Gewürzen und komplexer Bitterkeit öffnet; botanischer Abgang von Wermut (Artemisia)"],"Përbërës i përsosur për kokteje; mund të shërbehet i pastër ose me pak sodë":["A perfect cocktail ingredient; can be served neat or with a little soda","Ingrediente perfetto per i cocktail; si può servire liscio o con un po' di soda","Eine perfekte Cocktailzutat; kann pur oder mit etwas Soda serviert werden"],"Aroma karakteristike pelini, selinoje mali (lovage) dhe lëkure agrumesh të lehta":["Characteristic aromas of wormwood, lovage and light citrus peel","Profumi caratteristici di assenzio, levistico e scorza di agrumi leggera","Charakteristische Aromen von Wermut, Liebstöckel und leichter Zitrusschale"],"Pas një fillimi të freskët, një duet ëmbëlsie përhapet në qiellzë; nuancat e tharta bëhen më të dendura drejt përfundimit":["After a fresh start, a duet of sweetness spreads over the palate; the bitter nuances become denser towards the finish","Dopo un inizio fresco, un duetto di dolcezza si diffonde al palato; le sfumature amare si fanno più fitte verso il finale","Nach einem frischen Beginn breitet sich ein Duett der Süße am Gaumen aus; die bitteren Nuancen verdichten sich zum Abgang hin"],"Shije njëkohësisht qartësisht e ëmbël dhe e hidhur.":["At the same time clearly sweet and bitter.","Gusto allo stesso tempo nettamente dolce e amaro.","Zugleich deutlich süß und bitter."],"Delikat dhe intensiv, me nuanca agrumesh dhe erëzash":["Delicate and intense, with hints of citrus and spices","Delicato e intenso, con sfumature di agrumi e spezie","Zart und intensiv, mit Anklängen von Zitrus und Gewürzen"],"Kompleks, me nota të forta portokalli të hidhur e të ëmbël, raveni, vaniljeje dhe gentianës; i ëmbël, i strukturuar mirë dhe me një pas-shije të këndshme të hidhur":["Complex, with strong notes of bitter and sweet orange, rhubarb, vanilla and gentian; sweet, well structured and with a pleasant bitter aftertaste","Complesso, con note decise di arancia amara e dolce, rabarbaro, vaniglia e genziana; dolce, ben strutturato e con un piacevole retrogusto amaro","Komplex, mit kräftigen Noten von Bitter- und Süßorange, Rhabarber, Vanille und Enzian; süß, gut strukturiert und mit angenehm bitterem Nachgeschmack"],"I pastër pas darkës ose në koktejin Manhattan":["Neat after dinner or in a Manhattan cocktail","Liscio dopo cena o nel cocktail Manhattan","Pur nach dem Essen oder im Manhattan-Cocktail"],"Plot harmoni dhe me një aromë të këndshme rrushi Moscato":["Full of harmony and with a pleasant aroma of Moscato grapes","Piena di armonia e con un piacevole profumo di uva Moscato","Voller Harmonie und mit angenehmem Duft von Moscato-Trauben"],"Notat më të holla arrëmyshku dhe rrushi të thatë rezonojnë me shijen tipike të Barbera-s":["The finest notes of nutmeg and raisins resonate with the typical Barbera taste","Le note più fini di noce moscata e uvetta risuonano con il gusto tipico della Barbera","Die feinsten Noten von Muskatnuss und Rosinen klingen mit dem typischen Barbera-Geschmack zusammen"],"Përfundimi është lehtësisht i ëmbël dhe i këndshëm":["The finish is lightly sweet and pleasant","Il finale è leggermente dolce e piacevole","Der Abgang ist leicht süß und angenehm"],"Pas vaktit ose thjesht për kënaqësi":["After a meal or simply for pleasure","Dopo il pasto o semplicemente per piacere","Nach dem Essen oder einfach zum Genuss"],"Elegante dhe harmonike":["Elegant and harmonious","Elegante e armonica","Elegant und harmonisch"],"E butë, delikate, me aroma vaniljeje dhe kakaoje":["Soft, delicate, with aromas of vanilla and cocoa","Morbida, delicata, con profumi di vaniglia e cacao","Weich, zart, mit Aromen von Vanille und Kakao"],"Komplekse, delikate, mbështjellëse; dallohen agrume të kandisura, anason, erëza dhe rrush i thatë":["Complex, delicate, enveloping; candied citrus, anise, spices and raisins stand out","Complessa, delicata, avvolgente; spiccano agrumi canditi, anice, spezie e uvetta","Komplex, zart, umhüllend; kandierte Zitrusfrüchte, Anis, Gewürze und Rosinen treten hervor"],"E butë dhe mbështjellëse, me teksturë të mëndafshtë që zgjat në gojë, duke konfirmuar ndjesitë joshëse të buqetës":["Soft and enveloping, with a silky texture that lingers on the palate, confirming the seductive sensations of the bouquet","Morbida e avvolgente, con una trama setosa che persiste in bocca, confermando le sensazioni seducenti del bouquet","Weich und umhüllend, mit seidiger Textur, die am Gaumen verweilt und die verführerischen Eindrücke des Bouquets bestätigt"],"Qelibar intensiv, i ndriçuar nga reflekse të arta":["Intense amber, lit up by golden reflections","Ambra intenso, illuminato da riflessi dorati","Intensives Bernstein, erhellt von goldenen Reflexen"],"Menjëherë dalin nota vaniljeje dhe karameli, me një sfond delikat frutash të thata dhe erëzash":["Notes of vanilla and caramel emerge immediately, with a delicate background of dried fruit and spices","Emergono subito note di vaniglia e caramello, con un delicato fondo di frutta secca e spezie","Sofort zeigen sich Noten von Vanille und Karamell, mit zartem Hintergrund von Trockenfrüchten und Gewürzen"],"Dallon për ëmbëlsinë e balancuar mirë, me tone të ngrohta erëzash dhe alkooli, që kulmojnë në një përfundim të gjatë dhe të kënaqshëm":["It stands out for its well-balanced sweetness, with warm tones of spice and alcohol culminating in a long, satisfying finish","Si distingue per una dolcezza ben equilibrata, con toni caldi di spezie e alcol che culminano in un finale lungo e appagante","Besticht durch gut ausgewogene Süße, mit warmen Tönen von Gewürzen und Alkohol, die in einem langen, befriedigenden Abgang gipfeln"],"E përsosur për t'u shijuar vetë në fund të vaktit, ose si shoqërim elegant për ëmbëlsira me lugë, sidomos me krem ose çokollatë":["Perfect enjoyed on its own at the end of a meal, or as an elegant partner for spoon desserts, especially with cream or chocolate","Perfetta da gustare da sola a fine pasto, o come elegante accompagnamento a dolci al cucchiaio, soprattutto alla crema o al cioccolato","Perfekt allein zum Abschluss des Essens oder als eleganter Begleiter zu Löffeldesserts, besonders mit Creme oder Schokolade"],"Qelibar me reflekse ari.":["Amber with golden reflections.","Ambrata con riflessi dorati.","Bernsteinfarben mit goldenen Reflexen."],"Me finesë të madhe, me aroma rrushi të thatë dhe vanilje.":["Of great finesse, with aromas of raisins and vanilla.","Di grande finezza, con profumi di uvetta e vaniglia.","Von großer Finesse, mit Aromen von Rosinen und Vanille."],"E ngrohtë dhe e plotë, me përfundim elegant bajamesh të hidhura dhe rrushi të thatë.":["Warm and full, with an elegant finish of bitter almonds and raisins.","Calda e piena, con un finale elegante di mandorle amare e uvetta.","Warm und voll, mit elegantem Abgang von Bittermandeln und Rosinen."],"Si aperitiv: djathëra mesatarisht të stagjionuar, bajame të thekura dhe vezë peshku; si verë ëmbëlsire: pastiçeri dhe fruta të thata.":["As an aperitif: medium-aged cheeses, toasted almonds and fish roe; as a dessert wine: pastries and dried fruit.","Come aperitivo: formaggi di media stagionatura, mandorle tostate e bottarga; come vino da dessert: pasticceria e frutta secca.","Als Aperitif: mittelalte Käse, geröstete Mandeln und Fischrogen; als Dessertwein: Gebäck und Trockenfrüchte."],"Ngjyra e kuqe tipike, që tradicionalisht vinte nga koshenila e grirë":["The typical red colour, which traditionally came from ground cochineal","Il tipico colore rosso, che tradizionalmente derivava dalla cocciniglia macinata","Die typische rote Farbe, die traditionell aus gemahlener Cochenille stammte"],"Liker me bazë ujë trëndafili dhe ujë lulesh portokalli, sheqer, barishte dhe erëza":["A liqueur based on rose water and orange-blossom water, sugar, herbs and spices","Liquore a base di acqua di rose e acqua di fiori d'arancio, zucchero, erbe e spezie","Ein Likör auf Basis von Rosenwasser und Orangenblütenwasser, Zucker, Kräutern und Gewürzen"],"Shije mente të freskët në harmoni të përsosur me nota intriguese të hidhura.":["A taste of fresh mint in perfect harmony with intriguing bitter notes.","Gusto di menta fresca in perfetta armonia con intriganti note amare.","Geschmack frisch
