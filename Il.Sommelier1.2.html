er Minze in perfekter Harmonie mit faszinierenden Bitternoten."],"Hunda kap mirrën dhe butësinë e saj të papritur.":["The nose picks up myrrh and its unexpected softness.","Il naso coglie la mirra e la sua inaspettata morbidezza.","Die Nase nimmt Myrrhe und ihre unerwartete Weichheit wahr."],"Shija natyrale e hidhur e Fernet-Branca-s dhe e barishteve të saj paraqitet me forcë në gojë; hidhësi e sofistikuar, taninike dhe këndshëm balsamike.":["The natural bitter taste of Fernet-Branca and its herbs comes forcefully to the palate; a sophisticated, tannic and pleasantly balsamic bitterness.","Il naturale gusto amaro del Fernet-Branca e delle sue erbe si presenta con forza in bocca; un amaro sofisticato, tannico e piacevolmente balsamico.","Der natürliche bittere Geschmack von Fernet-Branca und seinen Kräutern zeigt sich kräftig am Gaumen; eine raffinierte, tanninige und angenehm balsamische Bitterkeit."],"E kuqe e errët me vija të kuqe cinabri":["Dark red with cinnabar-red streaks","Rosso scuro con venature rosso cinabro","Dunkelrot mit zinnoberroten Schlieren"],"Aroma që të kujtojnë barishte aromatike, kininë dhe karafil":["Aromas reminiscent of aromatic herbs, quinine and clove","Profumi che ricordano erbe aromatiche, chinino e chiodi di garofano","Aromen, die an Kräuter, Chinin und Nelke erinnern"],"Ndjesia fillestare është e ëmbël, e theksuar nga një nuancë intriguese lëvoreje portokalli të hidhur; kalon te shija e hidhur e kininës dhe mbyllet me një notë përfundimtare ëmbëlsie":["The initial sensation is sweet, accented by an intriguing hint of bitter orange peel; it moves on to the bitter taste of quinine and closes with a final note of sweetness","La sensazione iniziale è dolce, accentuata da un'intrigante sfumatura di scorza d'arancia amara; passa al gusto amaro del chinino e chiude con una nota finale di dolcezza","Der erste Eindruck ist süß, betont durch einen faszinierenden Anklang von Bitterorangenschale; geht zum bitteren Chiningeschmack über und schließt mit einer süßen Schlussnote"],"Ngjyrë mahagoni":["Mahogany colour","Colore mogano","Mahagonifarbe"],"Aroma shumë e larmishme":["Very multifaceted aroma","Profumo molto sfaccettato","Sehr facettenreicher Duft"],"Elegante dhe e plotë, por njëkohësisht e butë dhe e rrumbullakët në qiellzë; mbyllje e gjatë dhe e këndshme":["Elegant and full, yet at the same time soft and round on the palate; a long, pleasant close","Elegante e piena, ma allo stesso tempo morbida e rotonda al palato; chiusura lunga e piacevole","Elegant und voll, zugleich weich und rund am Gaumen; langer, angenehmer Ausklang"],"Ngjyrë e verdhë e bukur":["A beautiful yellow colour","Bel colore giallo","Schöne gelbe Farbe"],"Mban erë limoni dhe është i ëmbël në mënyrë të këndshme":["It smells of lemon and is pleasantly sweet","Profuma di limone ed è piacevolmente dolce","Riecht nach Zitrone und ist angenehm süß"],"Shije e ëmbël, e këndshme":["Sweet, pleasant taste","Gusto dolce, piacevole","Süßer, angenehmer Geschmack"],"Pas vaktit, me ëmbëlsirë ose i pastër; i përzier me verë të gazuar, sodë ose tonik; si aperitiv ose digjestiv; për të pasuruar akullore, kek, ëmbëlsira":["After a meal, with dessert or neat; mixed with sparkling wine, soda or tonic; as an aperitif or digestif; to enrich ice cream, cakes, desserts","Dopo il pasto, con il dolce o liscio; miscelato con spumante, soda o tonica; come aperitivo o digestivo; per arricchire gelati, torte, dolci","Nach dem Essen, zum Dessert oder pur; gemischt mit Sekt, Soda oder Tonic; als Aperitif oder Digestif; zum Verfeinern von Eis, Kuchen, Desserts"],"Aromë e fortë limoni":["Strong lemon aroma","Profumo intenso di limone","Kräftiger Zitronenduft"],"E ëmbël":["Sweet","Dolce","Süß"],"Krem pas vaktit; i përshtatshëm edhe për kokteje dhe ëmbëlsira":["A cream liqueur for after a meal; also suitable for cocktails and desserts","Crema da fine pasto; adatta anche a cocktail e dolci","Ein Cremelikör für nach dem Essen; auch für Cocktails und Desserts geeignet"],"Limoncello: ngjyrë e gjallë":["Limoncello: vivid colour","Limoncello: colore vivace","Limoncello: lebhafte Farbe"],"Limoncello: profum intensiv · Crema: aromë e fortë limoni":["Limoncello: intense perfume · Crema: strong lemon aroma","Limoncello: profumo intenso · Crema: profumo intenso di limone","Limoncello: intensiver Duft · Crema: kräftiger Zitronenduft"],"Crema: e ëmbël":["Crema: sweet","Crema: dolce","Crema: süß"],"Crema: pas vaktit, në kokteje dhe ëmbëlsira":["Crema: after a meal, in cocktails and desserts","Crema: dopo il pasto, in cocktail e dolci","Crema: nach dem Essen, in Cocktails und Desserts"],"Ngjyrë e gjallë":["Vivid colour","Colore vivace","Lebhafte Farbe"],"Profum intensiv":["Intense perfume","Profumo intenso","Intensiver Duft"],"Aromë intensive dhe e qëndrueshme.":["Intense and persistent aroma.","Profumo intenso e persistente.","Intensiver und anhaltender Duft."],"Karakter i ëmbël dhe frutor, i plotësuar nga një ndjesi ngrohtësie.":["A sweet, fruity character, complemented by a sensation of warmth.","Carattere dolce e fruttato, completato da una sensazione di calore.","Süßer, fruchtiger Charakter, ergänzt durch ein Gefühl von Wärme."],"Aroma të kujton një pastiçeri plot me ëmbëlsira me krem, liker veze (eggnog) dhe tiramisu":["The aroma recalls a pastry shop full of cream cakes, eggnog and tiramisu","Il profumo ricorda una pasticceria piena di dolci alla crema, zabaione e tiramisù","Der Duft erinnert an eine Konditorei voller Sahnetörtchen, Eierlikör und Tiramisu"],"Aroma të kujton një krafen të butë të mbushur me krem, me bazë alkooli të këndshme":["The aroma recalls a soft doughnut filled with cream, on a pleasant alcoholic base","Il profumo ricorda un morbido krapfen ripieno di crema, su una piacevole base alcolica","Der Duft erinnert an einen weichen, mit Creme gefüllten Krapfen auf angenehmer alkoholischer Basis"],"Harmonike, kafe":["Harmonious, coffee","Armonico, caffè","Harmonisch, Kaffee"],"Kremoze dhe elegante":["Creamy and elegant","Cremoso ed elegante","Cremig und elegant"],"Kristalore, e kthjellët":["Crystalline, clear","Cristallina, limpida","Kristallin, klar"],"Nota lulesh portokalli dhe frutash të pjekura":["Notes of orange blossom and ripe fruit","Note di zagara e frutta matura","Noten von Orangenblüte und reifen Früchten"],"E butë, e gjerë dhe e shijshme; qiellza mbetet e thatë":["Soft, broad and tasty; the palate remains dry","Morbida, ampia e saporita; il palato resta secco","Weich, weit und schmackhaft; der Gaumen bleibt trocken"],"Aroma të kujton një shportë me rrush të kuq dhe fruta pylli, të zbukuruar me një trëndafil; aroma barishtore si bar i sapoprerë dhe nota vere e lulesh të kuqe (barbarozë, trëndafil, manushaqe)":["The aroma recalls a basket of red grapes and wild berries, adorned with a rose; herbaceous aromas like freshly cut grass and notes of wine and red flowers (poppy, rose, violet)","Il profumo ricorda un cesto di uva rossa e frutti di bosco, ornato da una rosa; profumi erbacei come erba appena tagliata e note di vino e fiori rossi (papavero, rosa, viola)","Der Duft erinnert an einen Korb mit roten Trauben und Waldbeeren, geschmückt mit einer Rose; krautige Aromen wie frisch geschnittenes Gras und Noten von Wein und roten Blumen (Mohn, Rose, Veilchen)"],"Aroma të kujton një shportë me fruta ekzotike, vanilje, bajame dhe lajthi të thekura":["The aroma recalls a basket of exotic fruit, vanilla, almonds and toasted hazelnuts","Il profumo ricorda un cesto di frutta esotica, vaniglia, mandorle e nocciole tostate","Der Duft erinnert an einen Korb mit exotischen Früchten, Vanille, Mandeln und gerösteten Haselnüssen"],"Aroma të kujton një shportë me rrush të bardhë, mollë, kajsi, dardha dhe lule portokalli":["The aroma recalls a basket of white grapes, apples, apricots, pears and orange blossom","Il profumo ricorda un cesto di uva bianca, mele, albicocche, pere e fiori d'arancio","Der Duft erinnert an einen Korb mit weißen Trauben, Äpfeln, Aprikosen, Birnen und Orangenblüten"],"Ngjyrë bakri e shndritshme":["Bright copper colour","Colore ramato brillante","Leuchtende Kupferfarbe"],"Aroma komplekse dhe delikate marzipani, frutash të thata, anasoni yll dhe arre kola":["Complex, delicate aromas of marzipan, dried fruit, star anise and cola nut","Profumi complessi e delicati di marzapane, frutta secca, anice stellato e noce di cola","Komplexe, zarte Aromen von Marzipan, Trockenfrüchten, Sternanis und Kolanuss"],"Hyrje e butë dhe kadifeje, që çon në një trup të plotë lehtësisht të ëmbël me bajame të pjekura, marzipan, agrume të thata dhe erëza kafe; përfundim i gjatë me beze, piper rozë dhe bajame":["A soft, velvety entry, leading to a full, lightly sweet body with roasted almonds, marzipan, dried citrus and brown spices; a long finish with meringue, pink pepper and almond","Ingresso morbido e vellutato, che porta a un corpo pieno e leggermente dolce con mandorle tostate, marzapane, agrumi secchi e spezie scure; finale lungo con meringa, pepe rosa e mandorla","Ein weicher, samtiger Auftakt, der zu einem vollen, leicht süßen Körper mit gerösteten Mandeln, Marzipan, getrockneten Zitrusfrüchten und braunen Gewürzen führt; langer Abgang mit Baiser, rosa Pfeffer und Mandel"],"Shijohet i pastër pasdite ose pas darkës; i mirë edhe në kek, kafe, mbi akullore dhe sallatë frutash; shkon në mënyrë të përsosur me kek dhe akullore; përbërës i shkëlqyer për amaretto sour":["Enjoyed neat in the afternoon or after dinner; also good in cake, coffee, over ice cream and fruit salad; goes perfectly with cake and ice cream; an excellent ingredient for an amaretto sour","Da gustare liscio nel pomeriggio o dopo cena; ottimo anche nelle torte, nel caffè, sul gelato e nella macedonia; si abbina perfettamente a torte e gelato; ottimo ingrediente per l'amaretto sour","Pur am Nachmittag oder nach dem Abendessen genossen; auch gut in Kuchen, Kaffee, über Eis und Obstsalat; passt perfekt zu Kuchen und Eis; eine ausgezeichnete Zutat für einen Amaretto Sour"],"E verdhë ari e turbullt me nuancë smeraldi":["Cloudy golden yellow with an emerald hue","Giallo dorato torbido con sfumatura smeraldo","Trübes Goldgelb mit smaragdfarbenem Schimmer"],"Aroma të ndritshme lëkure dhe vaji limoni":["Bright aromas of lemon peel and lemon oil","Profumi brillanti di scorza e olio di limone","Leuchtende Aromen von Zitronenschale und Zitronenöl"],"I balancuar në mënyrë të përsosur në qiellzë; trup mesatar deri të plotë, i mëndafshtë, i thartë dhe frutor i ëmbël, me përfundim të ngrohtë, të nuancuar e të gjatë me nota mjalti dhe akulloreje limoni":["Perfectly balanced on the palate; medium to full body, silky, tart and sweetly fruity, with a warm, nuanced and long finish with notes of honey and lemon ice cream","Perfettamente equilibrato al palato; corpo da medio a pieno, setoso, acidulo e dolcemente fruttato, con finale caldo, sfumato e lungo con note di miele e gelato al limone","Perfekt ausgewogen am Gaumen; mittlerer bis voller Körper, seidig, säuerlich und süß-fruchtig, mit warmem, nuanciertem und langem Abgang mit Noten von Honig und Zitroneneis"],"I pastër pas vaktit ose në long drinks, sallata frutash, akullore limoni dhe frutash; si aperitiv ose digjestiv; përbërës i shkëlqyer për kokteje":["Neat after a meal or in long drinks, fruit salads, lemon and fruit ice cream; as an aperitif or digestif; an excellent cocktail ingredient","Liscio dopo il pasto o in long drink, macedonie, gelati al limone e alla frutta; come aperitivo o digestivo; ottimo ingrediente per cocktail","Pur nach dem Essen oder in Longdrinks, Obstsalaten, Zitronen- und Fruchteis; als Aperitif oder Digestif; eine ausgezeichnete Cocktailzutat"],"Rekomandohet si pije pas vaktit, ose e shtuar në long drink, sallata frutash, akullore etj.":["Recommended as an after-meal drink, or added to a long drink, fruit salads, ice cream etc.","Consigliato come bevanda di fine pasto, o aggiunto a long drink, macedonie, gelati ecc.","Empfohlen als Getränk nach dem Essen oder als Zugabe zu Longdrinks, Obstsalaten, Eis usw."],"Absolutisht transparente dhe pa ngjyrë":["Absolutely transparent and colourless","Assolutamente trasparente e incolore","Absolut transparent und farblos"],"Në kontakt me qiellzën mbetet e butë, me 'shkëndija' të forta":["On contact with the palate it remains soft, with strong 'sparks'","Al contatto con il palato resta morbida, con forti 'scintille'","Bei Kontakt mit dem Gaumen bleibt sie weich, mit kräftigen 'Funken'"],"Pihet e pastër ose 'me mizën' (3 kokrra kafeje)":["Drunk neat or 'con la mosca' (3 coffee beans)","Si beve liscia o 'con la mosca' (3 chicchi di caffè)","Pur getrunken oder 'con la mosca' (mit 3 Kaffeebohnen)"],"Elegante dhe e pastër, me nota qershie të egër, manushaqeje dhe kumbulle të kuqe, të ngritura nga një prekje e hollë erëzash dhe bajameje":["Elegant and clean, with notes of wild cherry, violet and red plum, lifted by a fine touch of spice and almond","Elegante e pulito, con note di ciliegia selvatica, viola e prugna rossa, sollevate da un fine tocco di spezie e mandorla","Elegant und sauber, mit Noten von Wildkirsche, Veilchen und roter Pflaume, gehoben von einem feinen Hauch Gewürz und Mandel"],"E butë dhe e saktë, zbulon fruta të kuqe, nuanca lulore dhe një ngrohtësi delikate që flet për origjinën e vreshtit":["Soft and precise, it reveals red fruit, floral hints and a delicate warmth that speaks of the vineyard's origin","Morbido e preciso, rivela frutti rossi, sfumature floreali e un calore delicato che racconta l'origine del vigneto","Weich und präzise, zeigt rote Früchte, blumige Anklänge und eine zarte Wärme, die von der Herkunft des Weinbergs erzählt"],"Profil aromatik i pasur dhe mbështjellës: i freskët, frutor, lehtësisht barishtor":["A rich, enveloping aromatic profile: fresh, fruity, lightly herbaceous","Profilo aromatico ricco e avvolgente: fresco, fruttato, leggermente erbaceo","Ein reiches, umhüllendes Aromaprofil: frisch, fruchtig, leicht krautig"],"Notat e ngrohta të drurit përzihen në mënyrë harmonike me freskinë dhe strukturën karakteristike të rrushit të origjinës":["The warm notes of wood blend harmoniously with the freshness and structure characteristic of the original grape","Le calde note del legno si fondono armoniosamente con la freschezza e la struttura caratteristiche dell'uva d'origine","Die warmen Holznoten verbinden sich harmonisch mit der Frische und Struktur, die für die Ursprungstraube charakteristisch sind"],"Digjestiv":["Digestif","Digestivo","Digestif"],"E butë; e plakur në fuçi lisi të paktën 18 muaj":["Soft; aged in oak barrels for at least 18 months","Morbida; invecchiata in botti di rovere per almeno 18 mesi","Weich; mindestens 18 Monate im Eichenfass gereift"],"Shije ekskluzive dhe intensive (plakur në fuçi lisi mbi 20 vjet)":["Exclusive, intense taste (aged in oak barrels for over 20 years)","Gusto esclusivo e intenso (invecchiato in botti di rovere per oltre 20 anni)","Exklusiver, intensiver Geschmack (über 20 Jahre im Eichenfass gereift)"],"Buqetë e thellë frutash":["Deep fruity bouquet","Bouquet fruttato profondo","Tiefes fruchtiges Bouquet"],"E butë":["Soft","Morbida","Weich"],"Buqetë e thellë":["Deep bouquet","Bouquet profondo","Tiefes Bouquet"],"E butë; e rafinuar në fuçi lisi të paktën 18 muaj":["Soft; refined in oak barrels for at least 18 months","Morbida; affinata in botti di rovere per almeno 18 mesi","Weich; mindestens 18 Monate im Eichenfass verfeinert"],"Reflekse mjalti.":["Honey reflections.","Riflessi di miele.","Honigfarbene Reflexe."],"Aroma intensive lisi dhe vanilje, me nota lulesh portokalli dhe çaji.":["Intense aromas of oak and vanilla, with notes of orange blossom and tea.","Profumi intensi di rovere e vaniglia, con note di fiori d'arancio e tè.","Intensive Aromen von Eiche und Vanille, mit Noten von Orangenblüte und Tee."],"E ngrohtë, e butë dhe kadifeje, me gjatësi të shkëlqyer në përfundim dhe shije pas.":["Warm, soft and velvety, with excellent length on the finish and aftertaste.","Calda, morbida e vellutata, con ottima lunghezza nel finale e nel retrogusto.","Warm, weich und samtig, mit ausgezeichneter Länge im Abgang und Nachgeschmack."],"Aromë delikate, e hidhur-e ëmbël, me një nuancë sane":["Delicate, bittersweet aroma with a hint of hay","Profumo delicato, agrodolce, con una sfumatura di fieno","Zarter, bittersüßer Duft mit einem Hauch Heu"],"Shumë delikate dhe elegante, që rritet në një shije të gjatë e të qëndrueshme":["Very delicate and elegant, growing into a long, persistent taste","Molto delicata ed elegante, che cresce in un gusto lungo e persistente","Sehr zart und elegant, wächst zu einem langen, anhaltenden Geschmack"],"Tignanello me pjatën kryesore dhe kjo grappa e hollë si digjestiv":["Tignanello with the main course and this fine grappa as a digestif","Tignanello con il piatto principale e questa grappa fine come digestivo","Tignanello zum Hauptgang und dieser feine Grappa als Digestif"],"Nuancë e artë e zbehtë.":["Pale golden hue.","Sfumatura dorata tenue.","Blasser Goldton."],"Shije e lehtë dhe freskuese, me nota delikate vanilje dhe barishtesh aromatike.":["Light, refreshing taste, with delicate notes of vanilla and aromatic herbs.","Gusto leggero e rinfrescante, con delicate note di vaniglia ed erbe aromatiche.","Leichter, erfrischender Geschmack mit zarten Noten von Vanille und Kräutern."],"Ar i zbehtë.":["Pale gold.","Oro tenue.","Blassgold."],"Parfum delikat me nuanca distilatesh mjedre dhe limoni, mbi një sfond irisi dhe druri delikat.":["Delicate perfume with hints of raspberry and lemon distillates, on a background of iris and delicate wood.","Profumo delicato con sfumature di distillati di lampone e limone, su un fondo di iris e legno delicato.","Zarter Duft mit Anklängen von Himbeer- und Zitronendestillaten auf einem Hintergrund von Iris und zartem Holz."],"Përfundim i ndritshëm dhe i pastër, me nota krokante agrumesh; përvojë e lehtë, e thatë dhe komplekse.":["A bright, clean finish with crisp citrus notes; a light, dry and complex experience.","Finale brillante e pulito, con note croccanti di agrumi; esperienza leggera, secca e complessa.","Ein leuchtender, sauberer Abgang mit knackigen Zitrusnoten; ein leichtes, trockenes und komplexes Erlebnis."],"Përballon mirë shijet e mprehta dhe acide: sardele ose açuge të marinuara.":["It stands up well to sharp and acidic flavours: marinated sardines or anchovies.","Regge bene i sapori decisi e acidi: sarde o alici marinate.","Hält kräftigen und säuerlichen Aromen gut stand: marinierte Sardinen oder Sardellen."],"E kuqe e thellë flakë.":["Deep flame red.","Rosso fiamma profondo.","Tiefes Flammenrot."],"Nota aromatike dhe barishtore.":["Aromatic and herbal notes.","Note aromatiche ed erbacee.","Aromatische und kräuterige Noten."],"Shije e guximshme dhe komplekse; profil i pasur dhe i ekuilibruar në mënyrë të përsosur, me shtresa notash barishtore.":["A bold, complex taste; a rich, perfectly balanced profile with layers of herbal notes.","Gusto audace e complesso; profilo ricco e perfettamente equilibrato, con strati di note erbacee.","Ein kühner, komplexer Geschmack; ein reiches, perfekt ausgewogenes Profil mit Schichten von Kräuternoten."],"Liker me ngjyrë të errët (kafe e errët)":["A dark-coloured liqueur (dark brown)","Liquore di colore scuro (marrone scuro)","Ein dunkler Likör (dunkelbraun)"],"Aroma delikate portokalli, nota barishtesh mjekësore dhe raven":["Delicate aromas of orange, notes of medicinal herbs and rhubarb","Delicati profumi d'arancia, note di erbe officinali e rabarbaro","Zarte Aromen von Orange, Noten von Heilkräutern und Rhabarber"],"Shija njëkohësisht e ëmbël dhe e hidhur":["The taste is at the same time sweet and bitter","Il gusto è allo stesso tempo dolce e amaro","Der Geschmack ist zugleich süß und bitter"],"Shkëlqyeshëm i pirë i pastër në fund të vaktit ose me akull":["Excellent drunk neat at the end of a meal or on ice","Ottimo bevuto liscio a fine pasto o con ghiaccio","Ausgezeichnet pur zum Abschluss des Essens oder auf Eis"],"Ngjyrë qelibar e ngrohtë":["Warm amber colour","Colore ambrato caldo","Warme Bernsteinfarbe"],"Intensive, e këndshme (amabile); me plakjen bëhet më eterike dhe harmonike":["Intense, pleasant (amabile); with ageing it becomes more ethereal and harmonious","Intenso, amabile; con l'invecchiamento diventa più etereo e armonico","Intensiv, lieblich (amabile); mit der Reife ätherischer und harmonischer"],"Strukturë e butë, e thatë; humbet ashpërsitë fillestare dhe jep një ndjesi elegante e të mëndafshtë":["Soft, dry structure; it loses its initial harshness and gives an elegant, silky sensation","Struttura morbida, secca; perde le asprezze iniziali e dà una sensazione elegante e setosa","Weiche, trockene Struktur; verliert die anfängliche Schärfe und gibt ein elegantes, seidiges Gefühl"],"Intensive dhe frutore":["Intense and fruity","Intenso e fruttato","Intensiv und fruchtig"],"Strukturë mbështjellëse dhe harmonike":["Enveloping, harmonious structure","Struttura avvolgente e armonica","Umhüllende, harmonische Struktur"],"Frutore, erëzore":["Fruity, spicy","Fruttato, speziato","Fruchtig, würzig"],"Strukturë e butë, e ekuilibruar":["Soft, balanced structure","Struttura morbida, equilibrata","Weiche, ausgewogene Struktur"],"E gjerë, lehtësisht e torfuar":["Broad, lightly peaty","Ampio, leggermente torbato","Weit, leicht torfig"],"Strukturë e rrumbullakët, e qëndrueshme":["Round, persistent structure","Struttura rotonda, persistente","Runde, anhaltende Struktur"],"Shije e butë dhe delikate; notat e lajthisë shkrihen me kremozitetin e ajkës; shije kadifeje":["Soft, delicate taste; the hazelnut notes melt into the creaminess of the cream; velvety taste","Gusto morbido e delicato; le note di nocciola si fondono con la cremosità della panna; gusto vellutato","Weicher, zarter Geschmack; die Haselnussnoten verschmelzen mit der Cremigkeit der Sahne; samtiger Geschmack"],"Për t'u shijuar në fund të vaktit, me ëmbëlsira, në përgatitjen e ëmbëlsirave dhe akulloreve, ose si përbërës për kokteje origjinale":["To be enjoyed at the end of a meal, with desserts, in making desserts and ice cream, or as an ingredient for original cocktails","Da gustare a fine pasto, con i dolci, nella preparazione di dolci e gelati, o come ingrediente per cocktail originali","Zum Genießen am Ende des Essens, zu Desserts, für die Zubereitung von Desserts und Eis oder als Zutat für originelle Cocktails"],"Shije e butë dhe delikate; notat e Fior di Latte shkrihen me kremozitetin e ajkës nga qumësht i freskët; shije kadifeje":["Soft, delicate taste; the Fior di Latte notes melt into the creaminess of fresh-milk cream; velvety taste","Gusto morbido e delicato; le note di fior di latte si fondono con la cremosità della panna di latte fresco; gusto vellutato","Weicher, zarter Geschmack; die Fior-di-Latte-Noten verschmelzen mit der Cremigkeit von Frischmilchsahne; samtiger Geschmack"],"Ngjyrë e çelur":["Pale colour","Colore chiaro","Helle Farbe"],"Elegante, harmonike, theksueshëm e butë; nuanca vaniljeje dhe frutash tropikale në përfundim":["Elegant, harmonious, markedly soft; hints of vanilla and tropical fruit on the finish","Elegante, armonica, spiccatamente morbida; sfumature di vaniglia e frutta tropicale nel finale","Elegant, harmonisch, ausgeprägt weich; Anklänge von Vanille und tropischen Früchten im Abgang"],"E vendosur, e pasur":["Decisive, rich","Deciso, ricco","Entschieden, reich"],"Strukturë e thatë, e rrumbullakët":["Dry, round structure","Struttura secca, rotonda","Trockene, runde Struktur"],"E gjerë, e vendosur; profum i hollë dhe i vendosur":["Broad, decisive; a fine, decisive perfume","Ampio, deciso; profumo fine e deciso","Weit, entschieden; feiner, entschiedener Duft"],"Strukturë kadifeje, e qëndrueshme; shije e këndshme mbështjellëse, harmonike dhe e qëndrueshme në gojë":["Velvety, persistent structure; a pleasant, enveloping taste, harmonious and persistent on the palate","Struttura vellutata, persistente; gusto piacevolmente avvolgente, armonico e persistente in bocca","Samtige, anhaltende Struktur; angenehm umhüllender Geschmack, harmonisch und anhaltend am Gaumen"],"Fisnike, elegante":["Noble, elegant","Nobile, elegante","Edel, elegant"],"Strukturë e butë, e thatë; intensive dhe e thatë në shije":["Soft, dry structure; intense and dry in taste","Struttura morbida, secca; intensa e secca al gusto","Weiche, trockene Struktur; intensiv und trocken im Geschmack"],"Gewürztraminer: intensive, aromatike · Chardonnay: fisnike, elegante · Amarone: e gjerë, e vendosur":["Gewürztraminer: intense, aromatic · Chardonnay: noble, elegant · Amarone: broad, decisive","Gewürztraminer: intenso, aromatico · Chardonnay: nobile, elegante · Amarone: ampio, deciso","Gewürztraminer: intensiv, aromatisch · Chardonnay: edel, elegant · Amarone: weit, entschieden"],"Gewürztraminer: delikate, harmonike · Chardonnay: e butë, e thatë · Amarone: kadifeje, e qëndrueshme":["Gewürztraminer: delicate, harmonious · Chardonnay: soft, dry · Amarone: velvety, persistent","Gewürztraminer: delicato, armonico · Chardonnay: morbido, secco · Amarone: vellutato, persistente","Gewürztraminer: zart, harmonisch · Chardonnay: weich, trocken · Amarone: samtig, anhaltend"],"Intensive, aromatike; me ndikim të fortë shqisor":["Intense, aromatic; with a strong sensory impact","Intenso, aromatico; di forte impatto sensoriale","Intensiv, aromatisch; mit starker sensorischer Wirkung"],"Strukturë delikate, harmonike; ndjesi shijuese shumë harmonike":["Delicate, harmonious structure; very harmonious taste sensations","Struttura delicata, armonica; sensazioni gustative molto armoniche","Zarte, harmonische Struktur; sehr harmonische Geschmackseindrücke"],"Aromatike, delikate":["Aromatic, delicate","Aromatico, delicato","Aromatisch, zart"],"Strukturë e butë, mbështjellëse; pas plakjes në fuçi të përdorura për Diciotto Lune bëhet e ëmbël në karakter dhe kadifeje":["Soft, enveloping structure; after ageing in the barrels used for Diciotto Lune it becomes sweet in character and velvety","Struttura morbida, avvolgente; dopo l'affinamento nelle botti usate per Diciotto Lune diventa dolce nel carattere e vellutata","Weiche, umhüllende Struktur; nach der Reifung in den für Diciotto Lune verwendeten Fässern wird sie süß im Charakter und samtig"],"Krem i lëngshëm me ngjyrë qelibari me reflekse të arta":["A liquid cream of amber colour with golden reflections","Crema liquida di colore ambrato con riflessi dorati","Eine flüssige Creme in Bernsteinfarbe mit goldenen Reflexen"],"E ëmbël, bajame, vanilje, krem":["Sweet, almond, vanilla, cream","Dolce, mandorla, vaniglia, crema","Süß, Mandel, Vanille, Creme"],"E butë, e pasur dhe me shije bajameje të qëndrueshme":["Soft, rich and with a persistent almond taste","Morbida, ricca e con un persistente gusto di mandorla","Weich, reich und mit anhaltendem Mandelgeschmack"],"Digjestiv ose me ëmbëlsira; shkon shumë mirë me ëmbëlsira me krem ose me fruta të thata":["A digestif or with desserts; goes very well with cream or dried-fruit desserts","Digestivo o con i dolci; si abbina molto bene a dolci alla crema o alla frutta secca","Ein Digestif oder zu Desserts; passt sehr gut zu Desserts mit Creme oder Trockenfrüchten"],"Bashkim i përsosur midis shijes së anasonit të Sambuca Molinari dhe një përzierjeje të zgjedhur kafeje":["A perfect union between the anise taste of Sambuca Molinari and a selected coffee blend","Unione perfetta tra il gusto d'anice della Sambuca Molinari e una selezionata miscela di caffè","Eine perfekte Verbindung aus dem Anisgeschmack der Sambuca Molinari und einer ausgewählten Kaffeemischung"],"Për t'u shijuar pas drekës ose darkës, si shoqërim natyral i ëmbëlsirës ose akullores":["To be enjoyed after lunch or dinner, as a natural partner for dessert or ice cream","Da gustare dopo pranzo o cena, come naturale accompagnamento del dolce o del gelato","Nach dem Mittag- oder Abendessen zu genießen, als natürlicher Begleiter zu Dessert oder Eis"],"Liker me shije të pagabueshme, me bazë anasoni yll.":["A liqueur with an unmistakable taste, based on star anise.","Liquore dal gusto inconfondibile, a base di anice stellato.","Ein Likör mit unverwechselbarem Geschmack auf Basis von Sternanis."],"Një aromë e guximshme vaniljeje hapet menjëherë, e ndjekur nga nota intensive sheqeri që të kujtojnë crème brûlée; poshtë ëmbëlsisë dalin ngrohtësi delikate kanelle dhe një skaj i mprehtë agrumesh":["A bold vanilla aroma opens immediately, followed by intense notes of sugar reminiscent of crème brûlée; beneath the sweetness a delicate warmth of cinnamon and a sharp edge of citrus emerge","Un audace profumo di vaniglia si apre subito, seguito da intense note di zucchero che ricordano la crème brûlée; sotto la dolcezza emergono un delicato calore di cannella e una punta pungente di agrumi","Ein kühnes Vanillearoma öffnet sich sofort, gefolgt von intensiven Zuckernoten, die an Crème brûlée erinnern; unter der Süße zeigen sich zarte Zimtwärme und eine scharfe Zitruskante"],"Hyrje shumë e trashë dhe mbështjellëse, me pasuri të theksuar kremi vezësh; në mes, Marsala e stazhionuar shton thellësi vere, ndërsa vanilja e Madagaskarit rrumbullakos trupin":["A very thick, enveloping entry, with marked richness of egg custard; in the middle, aged Marsala adds vinous depth, while Madagascar vanilla rounds out the body","Ingresso molto denso e avvolgente, con spiccata ricchezza di crema all'uovo; a metà il Marsala stagionato aggiunge profondità vinosa, mentre la vaniglia del Madagascar arrotonda il corpo","Ein sehr dichter, umhüllender Auftakt mit ausgeprägter Fülle von Eiercreme; in der Mitte bringt gereifter Marsala weinige Tiefe, während Madagaskar-Vanille den Körper abrundet"],"Tiramisu dhe ëmbëlsira me biskota savoiardi; edhe përbërës kokteji":["Tiramisu and desserts with savoiardi biscuits; also a cocktail ingredient","Tiramisù e dolci con savoiardi; anche ingrediente per cocktail","Tiramisu und Desserts mit Löffelbiskuits; auch eine Cocktailzutat"],"Shije e ekuilibruar këndshëm midis të ëmbëlës dhe të hidhurës.":["A taste pleasantly balanced between sweet and bitter.","Gusto piacevolmente equilibrato tra dolce e amaro.","Ein angenehm zwischen süß und bitter ausgewogener Geschmack."],"Hundë relativisht e fortë me nuanca kakaoje, arrëmyshku dhe mushti molle":["A relatively strong nose with hints of cocoa, nutmeg and apple must","Naso relativamente deciso con sfumature di cacao, noce moscata e mosto di mela","Eine relativ kräftige Nase mit Anklängen von Kakao, Muskatnuss und Apfelmost"],"Pak marzipan, nota të pjekura, dardhë, ftua dhe mollë të gatuara; përfundim erëzor dhe i thartë":["A little marzipan, roasted notes, pear, quince and cooked apples; a spicy, tart finish","Un po' di marzapane, note tostate, pera, mela cotogna e mele cotte; finale speziato e acidulo","Etwas Marzipan, Röstnoten, Birne, Quitte und gekochte Äpfel; würziger, säuerlicher Abgang"],"Transparente dhe kristalore":["Transparent and crystalline","Trasparente e cristallina","Transparent und kristallin"],"Aromë e çiltër, bujare dhe e menjëhershme":["A frank, generous and immediate aroma","Profumo franco, generoso e immediato","Ein offener, großzügiger und unmittelbarer Duft"],"E ekuilibruar, intensive dhe e rrumbullakët":["Balanced, intense and round","Equilibrata, intensa e rotonda","Ausgewogen, intensiv und rund"],"Perfekte pas vaktit; mund të përdoret edhe në kokteje":["Perfect after a meal; can also be used in cocktails","Perfetta dopo il pasto; si può usare anche nei cocktail","Perfekt nach dem Essen; kann auch in Cocktails verwendet werden"],"Transparente dhe kristalore.":["Transparent and crystalline.","Trasparente e cristallina.","Transparent und kristallin."],"Aromë e sinqertë, bujare dhe e menjëhershme.":["A frank, generous and immediate aroma.","Profumo franco, generoso e immediato.","Ein offener, großzügiger und unmittelbarer Duft."],"E ekuilibruar, intensive dhe e rrumbullakët.":["Balanced, intense and round.","Equilibrata, intensa e rotonda.","Ausgewogen, intensiv und rund."],"E përsosur pas vaktit; mund të përdoret edhe në koktejle.":["Perfect after a meal; can also be used in cocktails.","Perfetta dopo il pasto; si può usare anche nei cocktail.","Perfekt nach dem Essen; kann auch in Cocktails verwendet werden."],"Transparente me tone qelibari.":["Transparent with amber tones.","Trasparente con toni ambrati.","Transparent mit Bernsteintönen."],"Aromë aromatike, delikate dhe harmonike.":["Aromatic, delicate and harmonious aroma.","Profumo aromatico, delicato e armonico.","Aromatischer, zarter und harmonischer Duft."],"E butë, intensive, e pasuruar nga nuancat komplekse të plakjes në fuçi.":["Soft, intense, enriched by the complex nuances of barrel ageing.","Morbida, intensa, arricchita dalle complesse sfumature dell'invecchiamento in botte.","Weich, intensiv, bereichert durch die komplexen Nuancen der Fasslagerung."],"E përsosur pas një vakti të rëndësishëm.":["Perfect after an important meal.","Perfetta dopo un pasto importante.","Perfekt nach einem gehaltvollen Essen."],"Transparente me tone qelibari":["Transparent with amber tones","Trasparente con toni ambrati","Transparent mit Bernsteintönen"],"Profum aromatik, delikat dhe harmonik":["Aromatic, delicate and harmonious perfume","Profumo aromatico, delicato e armonico","Aromatischer, zarter und harmonischer Duft"],"E butë, intensive, e pasuruar nga nuancat komplekse të plakjes në fuçi":["Soft, intense, enriched by the complex nuances of barrel ageing","Morbida, intensa, arricchita dalle complesse sfumature dell'invecchiamento in botte","Weich, intensiv, bereichert durch die komplexen Nuancen der Fasslagerung"],"Perfekte pas një vakti të rëndësishëm":["Perfect after an important meal","Perfetta dopo un pasto importante","Perfekt nach einem gehaltvollen Essen"],"Elegante me reflekse të arta":["Elegant with golden reflections","Elegante con riflessi dorati","Elegant mit goldenen Reflexen"],"Aroma pastiçerie dhe çokollate":["Aromas of pastry and chocolate","Profumi di pasticceria e cioccolato","Aromen von Gebäck und Schokolade"],"E shkëlqyer me djathë, foie gras, çokollatë të zezë ose ëmbëlsira me bazë çokollate":["Excellent with cheese, foie gras, dark chocolate or chocolate-based desserts","Ottima con formaggi, foie gras, cioccolato fondente o dolci a base di cioccolato","Ausgezeichnet zu Käse, Foie gras, dunkler Schokolade oder Schokoladendesserts"],"Elegante, me reflekse ari.":["Elegant, with golden reflections.","Elegante, con riflessi dorati.","Elegant, mit goldenen Reflexen."],"Aroma pastiçerie dhe çokollate.":["Aromas of pastry and chocolate.","Profumi di pasticceria e cioccolato.","Aromen von Gebäck und Schokolade."],"Shkëlqyeshëm me djathë, foie gras, çokollatë të zezë ose ëmbëlsira me çokollatë.":["Excellent with cheese, foie gras, dark chocolate or chocolate desserts.","Ottima con formaggi, foie gras, cioccolato fondente o dolci al cioccolato.","Ausgezeichnet zu Käse, Foie gras, dunkler Schokolade oder Schokoladendesserts."],"Aromatike, kujton boronicat dhe frutat e buta.":["Aromatic, recalling blueberries and soft fruit.","Aromatica, ricorda i mirtilli e i frutti morbidi.","Aromatisch, erinnert an Heidelbeeren und weiche Früchte."],"E përsosur me ëmbëlsira me çokollatë, luleshtrydhe, mjedra dhe fruta të kuqe.":["Perfect with chocolate desserts, strawberries, raspberries and red fruit.","Perfetta con dolci al cioccolato, fragole, lamponi e frutti rossi.","Perfekt zu Schokoladendesserts, Erdbeeren, Himbeeren und roten Früchten."],"E freskët, kristalore, lehtësisht aromatike; kujton kajsinë dhe dardhën.":["Fresh, crystalline, lightly aromatic; it recalls apricot and pear.","Fresca, cristallina, leggermente aromatica; ricorda l'albicocca e la pera.","Frisch, kristallin, leicht aromatisch; erinnert an Aprikose und Birne."],"E përsosur me peshk ose sushi; edhe me kremra, sorbe dhe sallatë frutash.":["Perfect with fish or sushi; also with creams, sorbets and fruit salad.","Perfetta con pesce o sushi; anche con creme, sorbetti e macedonia.","Perfekt zu Fisch oder Sushi; auch zu Cremes, Sorbets und Obstsalat."],"Aromatike, e freskët dhe sensuale, me një hundë që të kujton petalet e trëndafilave të majit":["Aromatic, fresh and sensual, with a nose reminiscent of the petals of May roses","Aromatica, fresca e sensuale, con un naso che ricorda i petali delle rose di maggio","Aromatisch, frisch und sinnlich, mit einer Nase, die an die Blütenblätter von Mairosen erinnert"],"Aromatike, e butë dhe sensuale; pas një pushimi të shkurtër harmonia hundë–qiellzë plotësohet":["Aromatic, soft and sensual; after a short rest the nose–palate harmony is complete","Aromatica, morbida e sensuale; dopo un breve riposo l'armonia naso–palato si completa","Aromatisch, weich und sinnlich; nach kurzem Ruhen ist die Harmonie zwischen Nase und Gaumen vollkommen"],"Pasuron ëmbëlsirat me krem dhe akulloret; shkëlqyeshëm mbi një sallatë frutash të freskëta ose në sorbet":["It enhances cream desserts and ice cream; excellent over a fresh fruit salad or in sorbet","Arricchisce dolci alla crema e gelati; ottima su una macedonia di frutta fresca o nel sorbetto","Verfeinert Cremedesserts und Eis; ausgezeichnet über frischem Obstsalat oder im Sorbet"],"E freskët, aromatike, kristalore dhe lehtësisht aromatike, me një elegancë të veçantë që vjen nga vitigjet e origjinës.":["Fresh, aromatic, crystalline and lightly aromatic, with a particular elegance coming from the original grape varieties.","Fresca, aromatica, cristallina e leggermente aromatica, con un'eleganza particolare che deriva dai vitigni d'origine.","Frisch, aromatisch, kristallin und leicht aromatisch, mit besonderer Eleganz, die von den Ursprungsrebsorten kommt."],"Ëmbëlsira me krem, akullore, sallatë frutash, sushi dhe peshk; shkëlqyeshëm në sallatë frutash ose në sorbe.":["Cream desserts, ice cream, fruit salad, sushi and fish; excellent in fruit salad or sorbet.","Dolci alla crema, gelati, macedonia, sushi e pesce; ottima nella macedonia o nel sorbetto.","Cremedesserts, Eis, Obstsalat, Sushi und Fisch; ausgezeichnet in Obstsalat oder Sorbet."],"Buqetë aromatike me notë frutash pylli dhe erëza të holla":["Aromatic bouquet with a note of wild berries and fine spices","Bouquet aromatico con nota di frutti di bosco e spezie fini","Aromatisches Bouquet mit einer Note von Waldbeeren und feinen Gewürzen"],"Shija intensive është frutore dhe kadifeje e butë, me përfundim të gjatë":["The intense taste is fruity and softly velvety, with a long finish","Il gusto intenso è fruttato e morbidamente vellutato, con finale lungo","Der intensive Geschmack ist fruchtig und sanft samtig, mit langem Abgang"],"Pas vaktit; si përbërës për sorbet, sallatë frutash ose akullore; me çokollatë të hidhur ose ëmbëlsira me çokollatë":["After a meal; as an ingredient for sorbet, fruit salad or ice cream; with bitter chocolate or chocolate desserts","Dopo il pasto; come ingrediente per sorbetti, macedonie o gelati; con cioccolato amaro o dolci al cioccolato","Nach dem Essen; als Zutat für Sorbet, Obstsalat oder Eis; zu Bitterschokolade oder Schokoladendesserts"],"Elegante dhe e ekuilibruar, me aromë të jashtëzakonshme barishtesh.":["Elegant and balanced, with an extraordinary herbal aroma.","Elegante ed equilibrato, con uno straordinario profumo di erbe.","Elegant und ausgewogen, mit außergewöhnlichem Kräuterduft."],"Në fund të vaktit si digjestiv; me akull dhe një fetë portokalli ose në koktejle; me çokollatë të zezë.":["At the end of a meal as a digestif; with ice and a slice of orange or in cocktails; with dark chocolate.","A fine pasto come digestivo; con ghiaccio e una fetta d'arancia o nei cocktail; con cioccolato fondente.","Zum Abschluss des Essens als Digestif; mit Eis und einer Orangenscheibe oder in Cocktails; zu dunkler Schokolade."],"Qelibar i ndritshëm.":["Bright amber.","Ambra brillante.","Leuchtendes Bernstein."],"E ngrohtë, kadifeje, e qëndrueshme dhe me pasuri të madhe aromatike: nota erëzash, brioshi e pastiçerie, portokalli dhe frutash të kandisura.":["Warm, velvety, persistent and of great aromatic richness: notes of spices, brioche and pastry, orange and candied fruit.","Calda, vellutata, persistente e di grande ricchezza aromatica: note di spezie, brioche e pasticceria, arancia e frutta candita.","Warm, samtig, anhaltend und von großem aromatischem Reichtum: Noten von Gewürzen, Brioche und Gebäck, Orange und kandierten Früchten."],"Djathëra, foie gras, rizoto, çokollatë, ëmbëlsira furre, akullore.":["Cheeses, foie gras, risotto, chocolate, baked desserts, ice cream.","Formaggi, foie gras, risotti, cioccolato, dolci da forno, gelati.","Käse, Foie gras, Risotto, Schokolade, Backwaren, Eis."],"E rafinuar, e butë dhe elegante, me aromë mollësh të arta dhe buke të sapopjekur.":["Refined, soft and elegant, with an aroma of golden apples and freshly baked bread.","Raffinata, morbida ed elegante, con profumo di mele dorate e pane appena sfornato.","Fein, weich und elegant, mit Duft von goldenen Äpfeln und frisch gebackenem Brot."],"E rafinuar, e butë dhe elegante.":["Refined, soft and elegant.","Raffinata, morbida ed elegante.","Fein, weich und elegant."],"E përsosur me peshk dhe sushi.":["Perfect with fish and sushi.","Perfetta con pesce e sushi.","Perfekt zu Fisch und Sushi."],"Lehtësisht qelibar, nga pushimi në barrique.":["Lightly amber, from resting in barrique.","Leggermente ambrata, per il riposo in barrique.","Leicht bernsteinfarben, durch die Ruhezeit im Barrique."],"E rafinuar dhe elegante; kujton aromën e bukës, vaniljes dhe pastiçerisë.":["Refined and elegant; it recalls the aroma of bread, vanilla and pastry.","Raffinata ed elegante; ricorda il profumo di pane, vaniglia e pasticceria.","Fein und elegant; erinnert an den Duft von Brot, Vanille und Gebäck."],"Djathëra, foie gras, mish i kuruar, çokollatë, strudel, nugat (lista e përgjithshme e linjës).":["Cheeses, foie gras, cured meat, chocolate, strudel, nougat (general list for the line).","Formaggi, foie gras, salumi, cioccolato, strudel, torrone (elenco generale della linea).","Käse, Foie gras, Wurstwaren, Schokolade, Strudel, Nougat (allgemeine Liste der Linie)."],"Kujton një hojë plot mjaltë, aromë lulesh fushe, ftua të pjekur, moscato të freskët dhe fiq të sapovjelë.":["It recalls a honeycomb full of honey, the scent of wild flowers, baked quince, fresh moscato and freshly picked figs.","Ricorda un favo colmo di miele, profumo di fiori di campo, mela cotogna cotta, moscato fresco e fichi appena colti.","Erinnert an eine Wabe voller Honig, den Duft von Wildblumen, gebackene Quitte, frischen Moscato und frisch gepflückte Feigen."],"Në gojë konfirmon nuancat e hundës, me shtim të shijes së kajsisë, bajames dhe kores së bukës së sapopjekur.":["On the palate it confirms the nuances of the nose, adding the taste of apricot, almond and the crust of freshly baked bread.","In bocca conferma le sfumature del naso, aggiungendo il sapore di albicocca, mandorla e crosta di pane appena sfornato.","Am Gaumen bestätigt sie die Nuancen der Nase und fügt den Geschmack von Aprikose, Mandel und frisch gebackener Brotkruste hinzu."],"Me proshutë San Daniele dhe mostarda fiku.":["With San Daniele ham and fig mostarda.","Con prosciutto di San Daniele e mostarda di fichi.","Zu San-Daniele-Schinken und Feigensenf (Mostarda)."],"Transparente, kristalore.":["Transparent, crystalline.","Trasparente, cristallina.","Transparent, kristallin."],"Përputhet plotësisht me aromën dhe shijen e mjaltit të akacies.":["It fully matches the aroma and taste of acacia honey.","Corrisponde pienamente al profumo e al sapore del miele d'acacia.","Entspricht ganz dem Duft und Geschmack von Akazienhonig."],"Elegante dhe shumë delikate.":["Elegant and very delicate.","Elegante e delicatissima.","Elegant und sehr zart."],"Djathëra me personalitet të fortë, foie gras, ëmbëlsira të thata, ëmbëlsira me mjaltë ose akullore; edhe në salca për gjah, mish të bardhë dhe peshk.":["Cheeses with strong personality, foie gras, dry pastries, honey desserts or ice cream; also in sauces for game, white meat and fish.","Formaggi di forte personalità, foie gras, pasticceria secca, dolci al miele o gelati; anche in salse per selvaggina, carni bianche e pesce.","Käse mit starker Persönlichkeit, Foie gras, trockenes Gebäck, Honigdesserts oder Eis; auch in Saucen zu Wild, hellem Fleisch und Fisch."],"Freskia e buqetës kujton momentin e shtrydhjes së mushtit.":["The freshness of the bouquet recalls the moment the must is pressed.","La freschezza del bouquet ricorda il momento della pigiatura del mosto.","Die Frische des Bouquets erinnert an den Moment des Mostpressens."],"Kristalore, e butë dhe e rrumbullakët, me aromë petalesh trëndafili dhe bërthamash qershie.":["Crystalline, soft and round, with an aroma of rose petals and cherry stones.","Cristallina, morbida e rotonda, con profumo di petali di rosa e noccioli di ciliegia.","Kristallin, weich und rund, mit Duft von Rosenblättern und Kirschkernen."],"Elegante, aromatike, e butë dhe sensuale, me aromë trëndafilash, sherebele dhe vanilje.":["Elegant, aromatic, soft and sensual, with an aroma of roses, sage and vanilla.","Elegante, aromatica, morbida e sensuale, con profumo di rose, salvia e vaniglia.","Elegant, aromatisch, weich und sinnlich, mit Duft von Rosen, Salbei und Vanille."],"Ëmbëlsira me krem, krem anglez dhe pana, akullore; e përsosur mbi sallatë frutash të freskëta.":["Cream desserts, crème anglaise and cream, ice cream; perfect over a fresh fruit salad.","Dolci alla crema, crema inglese e panna, gelati; perfetta su una macedonia di frutta fresca.","Cremedesserts, Vanillesauce und Sahne, Eis; perfekt über frischem Obstsalat."],"Aromë intensive, e gjerë dhe tipike e dardhave Williams.":["Intense, broad aroma typical of Williams pears.","Profumo intenso, ampio e tipico delle pere Williams.","Intensiver, weiter Duft, typisch für Williamsbirnen."],"Ndjesi e jashtëzakonshme dhe e gjatë e shijeve tipike të frutit.":["An extraordinary, long sensation of the typical flavours of the fruit.","Sensazione straordinaria e lunga dei sapori tipici del frutto.","Ein außergewöhnlicher, langer Eindruck der typischen Fruchtaromen."],"E përsosur për sorbe ose për të pasuruar verë me shkumë ose shampanjë; edhe në koktejle.":["Perfect for sorbets or to enrich sparkling wine or champagne; also in cocktails.","Perfetta per sorbetti o per arricchire spumante o champagne; anche nei cocktail.","Perfekt für Sorbets oder zum Verfeinern von Sekt oder Champagner; auch in Cocktails."],"Aromë intensive dhe e pasur, me nuancë bajameje tipike e prunus-it (kumbullës)":["Intense, rich aroma, with an almond hint typical of prunus (plum)","Profumo intenso e ricco, con sfumatura di mandorla tipica del prunus (prugna)","Intensiver, reicher Duft, mit für Prunus (Pflaume) typischem Mandelanklang"],"Në qiellzë është erëzore, me ndjesi të jashtëzakonshme e të qëndrueshme të shijeve tipike të frutit":["On the palate it is spicy, with an extraordinary, persistent sensation of the typical flavours of the fruit","Al palato è speziata, con una sensazione straordinaria e persistente dei sapori tipici del frutto","Am Gaumen würzig, mit außergewöhnlichem, anhaltendem Eindruck der typischen Fruchtaromen"],"Në fund të drekës; e paharrueshme në përgatitjen e sorbetit dhe të akullores me krem":["At the end of lunch; unforgettable in making sorbet and cream ice cream","A fine pranzo; indimenticabile nella preparazione di sorbetti e gelati alla crema","Am Ende des Mittagessens; unvergesslich für Sorbet und Sahneeis"],"Ngjyrë ari qelibar, e dhënë vetëm nga druri":["Amber-gold colour, given only by the wood","Colore oro ambrato, dato solo dal legno","Bernsteingoldene Farbe, allein vom Holz gegeben"],"Nota lulore, frutore dhe erëzore, me nuanca vaniljeje, marzapani, ftoi dhe rrushi të thatë":["Floral, fruity and spicy notes, with hints of vanilla, marzipan, quince and raisins","Note floreali, fruttate e speziate, con sfumature di vaniglia, marzapane, mela cotogna e uvetta","Blumige, fruchtige und würzige Noten, mit Anklängen von Vanille, Marzipan, Quitte und Rosinen"],"Përzierje jashtëzakonisht e pasur; në gojë konfirmon pasurinë aromatike dhe frutore; e qëndrueshme":["An extraordinarily rich blend; on the palate it confirms its aromatic and fruity richness; persistent","Miscela straordinariamente ricca; in bocca conferma la ricchezza aromatica e fruttata; persistente","Eine außergewöhnlich reiche Mischung; am Gaumen bestätigt sie den aromatischen und fruchtigen Reichtum; anhaltend"],"E jashtëzakonshme për meditim; me çokollatë, ëmbëlsira me krem dhe fruta, pasta të thata dhe me puro":["Extraordinary for meditation; with chocolate, cream and fruit desserts, dry pastries and with a cigar","Straordinaria da meditazione; con cioccolato, dolci alla crema e alla frutta, pasticceria secca e con il sigaro","Außergewöhnlich zum Meditieren; zu Schokolade, Creme- und Obstdesserts, trockenem Gebäck und zur Zigarre"],"Niveli i ëmbëlsisë kap në mënyrë efektive shijen intensive dhe delikate të limonëve siçilianë; aroma dhe alkooli i moderuar e bëjnë veçanërisht tërheqës pas darkës":["The level of sweetness effectively captures the intense, delicate flavour of Sicilian lemons; the aroma and moderate alcohol make it especially appealing after dinner","Il livello di dolcezza cattura efficacemente il gusto intenso e delicato dei limoni siciliani; il profumo e l'alcol moderato lo rendono particolarmente piacevole dopo cena","Der Süßegrad fängt den intensiven, zarten Geschmack sizilianischer Zitronen wirkungsvoll ein; Duft und moderater Alkohol machen ihn nach dem Abendessen besonders ansprechend"],"Pas darkës; mund të përdoret edhe për kokteje ose ëmbëlsira":["After dinner; can also be used for cocktails or desserts","Dopo cena; si può usare anche per cocktail o dolci","Nach dem Abendessen; kann auch für Cocktails oder Desserts verwendet werden"],"E freskët, intensive dhe e rrumbullakët, me aroma limoni":["Fresh, intense and round, with lemon aromas","Fresco, intenso e rotondo, con profumi di limone","Frisch, intensiv und rund, mit Zitronenaromen"],"Karakteri agrumor del qartë në pah":["The citrus character comes clearly to the fore","Il carattere agrumato emerge nettamente","Der Zitruscharakter tritt deutlich hervor"],"Vetë pas vaktit; me ëmbëlsira të thjeshta, sallatë frutash ose akullore; bazë për kokteje dhe long drinks":["On its own after a meal; with simple desserts, fruit salad or ice cream; a base for cocktails and long drinks","Da solo dopo il pasto; con dolci semplici, macedonie o gelati; base per cocktail e long drink","Pur nach dem Essen; zu einfachen Desserts, Obstsalat oder Eis; Basis für Cocktails und Longdrinks"],"Aroma të klasit, sidomos rabarbar dhe kokrra dëllinje.":["Aromas of class, especially rhubarb and juniper berries.","Profumi di classe, soprattutto rabarbaro e bacche di ginepro.","Aromen von Klasse, besonders Rhabarber und Wacholderbeeren."],"E butë dhe ftuese, hapet me lëkurë portokalli të ndritshme, pastaj qetësohet në kokrra të kuqe të gatuara dhe erëza të ngrohta":["Soft and inviting, it opens with bright orange peel, then settles into cooked red berries and warm spices","Morbido e invitante, si apre con scorza d'arancia brillante, poi si distende in bacche rosse cotte e spezie calde","Weich und einladend, öffnet sich mit leuchtender Orangenschale und geht dann in gekochte rote Beeren und warme Gewürze über"],"Hyrje e ëmbël dhe agrumore, me kumbull të pjekur dhe nota kokrrash të errëta që të kujtojnë kolën; në mes dalin tone barishtore të hidhura, lëvore grejpfruti dhe jamball; përfundim mesatarisht i gjatë dhe i butë, me çokollatë të zezë, një skaj të lehtë të hidhur dhe lëkurë portokalli që zgjat":["A sweet, citrusy entry, with ripe plum and dark berry notes reminiscent of cola; in the middle bitter herbal tones, grapefruit peel and saffron emerge; a medium-long, soft finish, with dark chocolate, a light bitter edge and lingering orange peel","Ingresso dolce e agrumato, con prugna matura e note di bacche scure che ricordano la cola; a metà emergono toni erbacei amari, scorza di pompelmo e zafferano; finale di media lunghezza e morbido, con cioccolato fondente, una leggera punta amara e scorza d'arancia persistente","Süßer, zitrusartiger Auftakt mit reifer Pflaume und dunklen Beerennoten, die an Cola erinnern; in der Mitte bittere Kräutertöne, Grapefruitschale und Safran; mittellanger, weicher Abgang mit dunkler Schokolade, leichter Bitterkante und anhaltender Orangenschale"],"Tradicionalisht i pastër si digjestiv pas vaktit, edhe në kokteje; me ëmbëlsira me çokollatë të zezë dhe djathëra të stazhionuar si Parmigiano-Reggiano":["Traditionally neat as a digestif after a meal, also in cocktails; with dark-chocolate desserts and aged cheeses such as Parmigiano-Reggiano","Tradizionalmente liscio come digestivo dopo il pasto, anche nei cocktail; con dolci al cioccolato fondente e formaggi stagionati come il Parmigiano-Reggiano","Traditionell pur als Digestif nach dem Essen, auch in Cocktails; zu Desserts mit dunkler Schokolade und gereiften Käsen wie Parmigiano-Reggiano"],"E qartë, transparente":["Clear, transparent","Limpida, trasparente","Klar, transparent"],"Notë intensive e freskët barishtore me pak dru":["An intense, fresh herbal note with a little wood","Nota intensa e fresca di erbe con un po' di legno","Intensive, frische Kräuternote mit etwas Holz"],"Mesatarisht e thatë, e balancuar mirë, harmonike":["Medium dry, well balanced, harmonious","Mediamente secca, ben equilibrata, armonica","Halbtrocken, gut ausgewogen, harmonisch"],"Ëmbëlsira të freskëta e delikate, biskota me bajame, pjata të lehta me barishte":["Fresh, delicate desserts, almond biscuits, light herb dishes","Dolci freschi e delicati, biscotti alle mandorle, piatti leggeri alle erbe","Frische, zarte Desserts, Mandelkekse, leichte Kräutergerichte"],"Ngjyrë e ngrohtë qelibari":["Warm amber colour","Colore ambrato caldo","Warme Bernsteinfarbe"],"Aromë intensive bajamesh të pjekura, e hollë dhe elegante":["Intense aroma of roasted almonds, fine and elegant","Profumo intenso di mandorle tostate, fine ed elegante","Intensiver Duft gerösteter Mandeln, fein und elegant"],"Aroma e ëmbël marzipani takohet me bajame të pjekura imët, lehtësisht me shije arrash dhe harmonike":["The sweet aroma of marzipan meets finely roasted almonds, lightly nutty and harmonious","Il profumo dolce del marzapane incontra mandorle finemente tostate, leggermente nocciolato e armonico","Das süße Marzipanaroma trifft auf fein geröstete Mandeln, leicht nussig und harmonisch"],"Si shoqërues ëmbëlsirash, në kafe ose në kokteje; edhe mbi panna cotta ose tiramisu për aromë shtesë bajameje":["As a partner for desserts, in coffee or in cocktails; also over panna cotta or tiramisu for extra almond aroma","Come accompagnamento ai dolci, nel caffè o nei cocktail; anche su panna cotta o tiramisù per un aroma di mandorla in più","Als Begleiter zu Desserts, im Kaffee oder in Cocktails; auch über Panna cotta oder Tiramisu für zusätzliches Mandelaroma"],"E verdhë kashte e zbehtë":["Pale straw yellow","Giallo paglierino tenue","Blasses Strohgelb"],"Tërheqëse dhe intensive, me aromën karakteristike të Moscatos së sapovjelë":["Attractive and intense, with the characteristic aroma of freshly picked Moscato","Attraente e intensa, con il profumo caratteristico del Moscato appena vendemmiato","Ansprechend und intensiv, mit dem charakteristischen Duft frisch gelesenen Moscatos"],"E butë dhe e thellë, me shije frutore padyshim të pasura; pas-shije delikate e ëmbël dhe e qëndrueshme":["Soft and deep, with undeniably rich fruity flavours; a delicately sweet and persistent aftertaste","Morbida e profonda, con sapori fruttati indubbiamente ricchi; retrogusto delicatamente dolce e persistente","Weich und tief, mit unbestreitbar reichen fruchtigen Aromen; zart süßer, anhaltender Nachgeschmack"],"Fruta të thata, arra, bajame, ëmbëlsira dhe çokollatë; e shijshme edhe me djathëra të stazhionuar":["Dried fruit, walnuts, almonds, desserts and chocolate; delicious also with aged cheeses","Frutta secca, noci, mandorle, dolci e cioccolato; deliziosa anche con formaggi stagionati","Trockenfrüchte, Walnüsse, Mandeln, Desserts und Schokolade; köstlich auch zu gereiften Käsen"],"E gjallë, elegante dhe tërheqëse, me nota frutash të kuqe, vaniljeje, mjalti dhe arre":["Lively, elegant and engaging, with notes of red fruit, vanilla, honey and walnut","Vivace, elegante e coinvolgente, con note di frutti rossi, vaniglia, miele e noce","Lebendig, elegant und einnehmend, mit Noten roter Früchte, Vanille, Honig und Walnuss"],"E butë, e rafinuar dhe kadifeje, me nota vaniljeje dhe frutash të kandisura në pas-shije; mbyllje e gjatë dhe e qëndrueshme":["Soft, refined and velvety, with notes of vanilla and candied fruit in the aftertaste; a long, persistent close","Morbida, raffinata e vellutata, con note di vaniglia e frutta candita nel retrogusto; chiusura lunga e persistente","Weich, fein und samtig, mit Noten von Vanille und kandierten Früchten im Nachgeschmack; langer, anhaltender Ausklang"],"Fruta të thata, arra, bajame, ëmbëlsira dhe çokollatë; edhe me djathëra të stazhionuar dhe me puro":["Dried fruit, walnuts, almonds, desserts and chocolate; also with aged cheeses and with a cigar","Frutta secca, noci, mandorle, dolci e cioccolato; anche con formaggi stagionati e con il sigaro","Trockenfrüchte, Walnüsse, Mandeln, Desserts und Schokolade; auch zu gereiften Käsen und zur Zigarre"],"Grappa e qartë dhe e pastër, transparente":["A clear, clean, transparent grappa","Grappa limpida e pulita, trasparente","Ein klarer, sauberer, transparenter Grappa"],"Freski e pagabueshme me nota mollësh dhe dardhe të freskët, me prekje delikate lulore; e freskët, frutore, lehtësisht barishtore":["Unmistakable freshness with notes of fresh apple and pear, with delicate floral touches; fresh, fruity, lightly herbaceous","Freschezza inconfondibile con note di mela e pera fresche, con delicati tocchi floreali; fresca, fruttata, leggermente erbacea","Unverwechselbare Frische mit Noten von frischem Apfel und Birne, mit zarten Blütenanklängen; frisch, fruchtig, leicht krautig"],"E butë dhe harmonike, me ëmbëlsi të balancuar, që mbyllet me një përfundim lehtësisht pikant dhe qartësisht të qëndrueshëm":["Soft and harmonious, with balanced sweetness, closing with a lightly spicy and clearly persistent finish","Morbida e armonica, con dolcezza equilibrata, che chiude con un finale leggermente piccante e nettamente persistente","Weich und harmonisch, mit ausgewogener Süße, schließt mit leicht pikantem und deutlich anhaltendem Abgang"],"Digjestiv në fund të vaktit; shoqërim i shkëlqyer për ëmbëlsira me fruta ose çokollatë":["A digestif at the end of a meal; an excellent partner for fruit or chocolate desserts","Digestivo a fine pasto; ottimo accompagnamento per dolci alla frutta o al cioccolato","Ein Digestif zum Abschluss des Essens; ausgezeichneter Begleiter zu Obst- oder Schokoladendesserts"],"Ngjyrë e qartë dhe e shndritshme":["Clear, bright colour","Colore limpido e brillante","Klare, leuchtende Farbe"],"Varieteti e bën aromën të veçantë dhe tipike: të pastër dhe të qëndrueshme, por njëkohësisht të butë":["The variety makes the aroma special and typical: clean and persistent, yet at the same time soft","Il vitigno rende il profumo particolare e tipico: pulito e persistente, ma allo stesso tempo morbido","Die Rebsorte macht den Duft besonders und typisch: sauber und anhaltend, zugleich aber weich"],"Shkëlqyeshëm pas vaktit ose me një filxhan kafe":["Excellent after a meal or with a cup of coffee","Ottima dopo il pasto o con una tazza di caffè","Ausgezeichnet nach dem Essen oder zu einer Tasse Kaffee"],"Perfekt për akullore në shkop (lollies), granita dhe pije":["Perfect for ice lollies, granita and drinks","Perfetto per ghiaccioli, granite e drink","Perfekt für Eis am Stiel, Granita und Drinks"],"Grappa kristal e kthjellët nga Trentino":["A crystal-clear grappa from Trentino","Grapp const CATS = [()=>true,w=>w.type==="R",w=>w.type==="B",w=>w.type==="S",w=>w.type==="D"||w.type==="Ro",w=>w.type==="L",

const NUMW = {due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,
  quindici:15,sedici:16,diciassette:17,diciotto:18,diciannove:19,venti:20,trenta:30,cento:100};
function normText(s){
  s = String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ");
  s = s.replace(/(\d+(?:[.,]\d+)?)\s*(ml|cl|lt|litri|litro|liter|litre|l)\b\.?/g,(m,n,u)=>{
    let v = parseFloat(n.replace(",",".")); v = u==="ml" ? v/1000 : u==="cl" ? v/100 : v;
    return " "+(+v.toFixed(3))+"l ";
  });
  s = s.replace(/\b[a-z]+\b/g, x => NUMW[x]!=null ? String(NUMW[x]) : x);
  return s.replace(/\s+/g," ").trim();
}
const hasTok = (hay,t) => /^\d/.test(t) ? (" "+hay+" ").includes(" "+t+" ") : hay.includes(t);

/* ---------- LIST ---------- */
let CSV_DELIM=",";
let CSV_ERR="";
function parseCSVLine(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(ch===CSV_DELIM&&!q){out.push(cur);cur="";}
    else cur+=ch;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  const lines = text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  CSV_ERR="";
  if(lines.length<2){ CSV_ERR=U().csvShort; return []; }
  CSV_DELIM = lines[0].split(";").length > lines[0].split(",").length ? ";" : ",";
  const ALIAS={name:["name","nome","emri","vera","wine","articolo","prodotto"],producer:["producer","produttore","prodhuesi","winery"],
    type:["type","tipo","lloji"],region:["region","regione","rajoni"],grape:["grape","vitigno","rrushi"],grape_pct:["grape_pct","percentuale"],
    cls:["cls","class","classe","klasa","doc"],price:["price","prezzo","çmimi","cmimi","eur","euro","€"],image:["image","foto"],
    year:["year","annata","viti"],size:["size","formato","madesia"],
    color:["color","colore","ngjyra"],nose:["nose","profumo","aroma"],palate:["palate","gusto","shija"],food:["food","abbinamento","shoqerohet"],
    tasting_source:["tasting_source","fonte_degustazione"],verified_source:["verified_source","fonte"]};
  const raw = parseCSVLine(lines[0]).map(x=>x.trim().toLowerCase().replace(/^\uFEFF/,""));
  const h = raw.map(x=>{ for(const k in ALIAS){ if(ALIAS[k].includes(x)) return k; } return x; });
  if(h.indexOf("name")<0 || h.indexOf("price")<0){
    CSV_ERR=fmt(U().csvCols,{c:raw.join(" | ")});
    return [];
  }
  const col = k => h.indexOf(k);
  const tmap = {R:"R",ROSSO:"R",RED:"R",B:"B",BIANCO:"B",WHITE:"B",S:"S",SPUMANTE:"S",SPARKLING:"S",
                RO:"Ro",ROSATO:"Ro",ROSE:"Ro","ROSÉ":"Ro",D:"D",DOLCE:"D",DESSERT:"D",L:"L",LIQUORE:"L",GRAPPA:"L"};
  const out=[];
  lines.slice(1).forEach((line,i)=>{
    const v = parseCSVLine(line);
    const g = k => col(k)>=0 ? (v[col(k)]||"").trim() : "";
    const pr = parseFloat(g("price").replace(/[€\s]/g,"").replace(",","."));
    if(!g("name") || isNaN(pr)) return;
    out.push({id:i+1, p:g("producer"), n:g("name"), type:tmap[g("type").toUpperCase()]||"R",
              region:g("region"), grape:g("grape"), grape_pct:g("grape_pct"), cls:g("cls"), image:g("image"), pr,
              year:g("year"), size:g("size"), color:g("color"), nose:g("nose"), palate:g("palate"), food:g("food"),
              tsrc:g("tasting_source"), src:g("verified_source")});
  });
  return out;
}
async function loadI18n(){
  const el = document.getElementById("i18n-data");
  if(el){ try{ I18N = JSON.parse(el.textContent); }catch(e){} return; }
  try{ const r = await fetch("i18n.json",{cache:"no-store"}); if(r.ok) I18N = await r.json(); }catch(e){}
}

  if(saved) WINES = parseCSV(saved);
  else { try{ const r = await fetch("wines.csv",{cache:"no-store"}); if(r.ok) WINES = parseCSV(await r.text()); }catch(e){} }
  renderAll();
}

function srcLink(t){
  const m = String(t||"").match(/https?:\/\/[^\s)]+/);
  if(!m) return "";
  let host = m[0]; try{ host = new URL(m[0]).hostname.replace(/^www\./,""); }catch(e){}
  const lbl = isUnofficial(t) ? U().srcUnoff : U().srcOff;
  const s = String(t||"");
  const info = tr(s.slice(s.indexOf(m[0])+m[0].length).trim().replace(/^\(/,"").replace(/\)\s*$/,"").replace(/^JO ZYRTARE\s*–\s*/i,"").trim());
  return `<div class="note" style="margin:6px 2px 14px">${lbl}: <a href="${esc(m[0])}" target="_blank" rel="noopener" style="color:var(--gold2)">${esc(host)}</a>${info?`<br><span style="opacity:.8">${esc(info)}</span>`:""}</div>`;
}
function isUnofficial(t){ return /JO ZYRTAR/i.test(String(t||"")); }
function showDetail(id){
  const w = WINES.find(x=>x.id===id); if(!w) return;
  const base = w.n.replace(/\s*\d{4}\s*$/,"").trim();

      <div class="kv"><small>${u.region}</small><span>${esc(tr(w.region))||"—"}</span></div>
      <div class="kv wide"><small>${u.grape}${w.grape_pct?` · ${esc(w.grape_pct)}%`:""}</small><span>${esc(tr(w.grape))||"—"}</span></div>
      <div class="kv"><small>${u.year}</small><span>${esc(w.year)||"—"}</span></div>
      <div class="kv"><small>${u.size}</small><span>${esc(w.size)||"—"}</span></div>
    </div>

    ${(w.color||w.nose||w.palate||w.food)?`<div class="grid2">
      ${w.color?`<div class="kv wide"><small>${u.color}</small><span>${esc(tr(w.color))}</span></div>`:""}
      ${w.nose?`<div class="kv wide"><small>${u.nose}</small><span>${esc(tr(w.nose))}</span></div>`:""}

/* ---------- GEMINI ---------- */
async function gemini(parts, opts={}){
  const key = localStorage.getItem("geminiKey");
  if(!key) throw new Error(U().needKey);
  const body = {contents: opts.contents || [{parts}], generationConfig:{temperature:opts.temp??0.3,maxOutputTokens:opts.max||600}};
  if(opts.system) body.systemInstruction = {parts:[{text:opts.system}]};
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`,
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || "Gemini error");
  return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
}

/* ---------- PHOTO ---------- */
function onPhoto(e){
  const f = e.target.files[0]; if(!f) return;
  photoMime = f.type || "image/jpeg";
  const r = new FileReader();
  r.onload = ev => { photoData = ev.target.result; $("prev").src = photoData; $("prev").style.display="block"; identify(); };
  r.readAsDataURL(f);
  e.target.value = "";
}
async function identify(){
  $("camOut").innerHTML = `<div class="spin">${U().analyzing}</div>`;
  try{
    const prompt = `Read this wine bottle label. Return ONLY JSON, no markdown:
{"producer":"winery name","name":"wine name without producer","year":"vintage or null","region":"region or null","size":"bottle volume exactly as printed (e.g. 0,75 l / 70 cl / 1,5 l) or null if not visible"}`;
    const txt = await gemini([{text:prompt},{inline_data:{mime_type:photoMime,data:photoData.split(",")[1]}}],{temp:0.1,max:300});
    showMatch(JSON.parse(txt.replace(/```json|```/g,"").trim()));
  }catch(err){
    $("camOut").innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}
function showMatch(d){
  lastMatch = d;
  const tokens = normText(`${d.producer||""} ${d.name||""}`).split(" ").filter(t=>t.length>=3 || /^\d{2,}$/.test(t));
  const dsz = (normText(d.size||"").match(/\d+(?:\.\d+)?l/)||[])[0];
  const scored = WINES.map(w=>{
    const hay = normText(`${w.p} ${w.n}`);
    let s = 0; tokens.forEach(t=>{ if(hasTok(hay,t)) s += /^\d/.test(t) ? t.length+2 : t.length; });
    if(d.year && w.n.includes(String(d.year))) s+=8;
    if(dsz && (" "+normText(w.n+" "+w.size)+" ").includes(" "+dsz+" ")) s+=15;
    return {w,s};
  }).filter(x=>x.s>=6).sort((a,b)=>b.s-a.s).slice(0,6);
  $("camOut").innerHTML = `
    <div class="ai"><b>${U().detected}</b>
      ${d.producer?`<div>${esc(d.producer)}</div>`:""}
      ${d.name?`<div>${esc(d.name)}${d.year?" · "+esc(d.year):""}${d.size?" · "+esc(d.size):""}</div>`:""}
    </div>
    <div class="sec-title">${scored.length?U().found:U().notFound}</div>
    ${scored.map(x=>card(x.w)).join("")}`;
  $("camOut").querySelectorAll(".card").forEach((el,i)=>el.onclick=()=>showDetail(scored[i].w.id));
}

function renderChat(){

    ? chat.map(m=>`<div class="msg ${m.role==="user"?"u":"m"}">${esc(m.text)}</div>`).join("")
    : `<div class="empty">${U().askEmpty}</div>`;

async function ask(preset){
  const text = (preset || $("askIn").value).trim();
  if(!text) return;
  $("askIn").value = "";
  chat.push({role:"user",text}); chat.push({role:"model",text:"…"});
  renderChat();
  const catalog = WINES.map(w=>`${w.p} | ${w.n} | ${TYPE[w.type]?.en||w.type} | ${tr(w.region)} | ${tr(w.grape)} | ${eur(w.pr)} | ${[w.color,w.nose,w.palate].filter(Boolean).map(tr).join(" / ")} | ${tr(w.food)}`).join("\n");
  const system = `You are the sommelier of the restaurant "Il Sommelier". Recommend ONLY wines from the catalog below and quote the exact producer, name and price. Use ONLY the information written in the catalog (official producer data). Never add serving temperature, glassware, tasting notes or food pairings that are not in the catalog; if the catalog has no tasting notes for a wine, say that official notes are not available. If nothing fits, say so. Answer in language code "${lang}". Be concise.\n\nCATALOG (producer | name | type | region | grape | price | official tasting notes | official food pairing):\n${catalog}`;
  const contents = chat.slice(0,-1).slice(-10).map(m=>({role:m.role,parts:[{text:m.text}]}));
  try{
    chat[chat.length-1] = {role:"model", text: await gemini(null,{system,contents,temp:0.4,max:600})};
  }catch(err){
    chat[chat.length-1] = {role:"model", text: "⚠️ " + err.message};
  }
  renderChat();
}

  else { localStorage.removeItem("geminiKey"); $("keyMsg").innerHTML=`<div class="err">${U().deleted}</div>`; }

function importCsv(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const text = ev.target.result;
    const list = parseCSV(text);
    if(!list.length){ $("listMsg").innerHTML=`<div class="err">${esc(CSV_ERR || U().invalid)}</div>`; return; }
    localStorage.setItem("csvText", text);
    WINES = list; renderAll();
    $("listMsg").innerHTML = `<div class="ok">${fmt(U().imported,{n:list.length})}</div>`;
  };
  r.readAsText(f,"UTF-8");
  e.target.value = "";
}
function buildCsv(){
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const head = "name,producer,type,region,grape,grape_pct,price,year,size,color,nose,palate,food,tasting_source,verified_source,image";
  const rows = WINES.map(w=>[q(w.n),q(w.p),w.type,q(w.region),q(w.grape),q(w.grape_pct),w.pr,
      q(w.year),q(w.size),q(w.color),q(w.nose),q(w.palate),q(w.food),q(w.tsrc),q(w.src),q(w.image)].join(","));
  return "\uFEFF" + [head, ...rows].join("\n");
}
async function exportCsv(){
  const text = buildCsv();
  const file = new File([text], "wines.csv", {type:"text/csv"});
  // Phone: open the system share sheet (Save to Files / Drive / WhatsApp, etc.)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:U().shareTitle}); return; }catch(e){ /* user cancelled or unsupported: fall through */ }
  }
  // Desktop / fallback: plain download
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = "wines.csv";
  document.body.appendChild(a); a.click(); a.remove();
  $("listMsg").innerHTML = `<div class="ok">${U().exportOk}</div>`;
}
function showCsvText(){
  const box = $("csvBox");
  box.value = buildCsv();
  box.style.display = "block";
  box.select();
  $("listMsg").innerHTML = `<div class="note">${U().copyNote}</div>`;
}
function clearCsv(){
  localStorage.removeItem("csvText"); WINES = []; renderAll();
  $("listMsg").innerHTML = `<div class="note">${U().cleared}</div>`;
  loadList();
}

/* ---------- I18N ---------- */
function setLang(l){ lang = l; localStorage.setItem("lang",l); applyLang(); }
function applyLang(){
  const u = U();
  $("n-search").textContent=u.search; $("n-cam").textContent=u.cam; $("n-chat").textContent=u.chat; $("n-fav").textContent=u.fav;
  $("q").placeholder = u.ph; $("camTxt").textContent=u.camTxt; $("galTxt").textContent=u.galTxt;
  $("sTitle").textContent = u.sTitle; $("tagline").textContent = u.tagline; $("lang").value = lang;
  $("saveBtn").textContent = u.save; $("keyNote").textContent = u.keyNote; $("listLbl").textContent = u.listLbl;
  $("exportBtn").textContent = u.exportBtn; $("showBtn").textContent = u.showBtn; $("clearBtn").textContent = u.clearBtn;
  document.documentElement.lang = lang;
  renderAll();
  if($("v-detail").classList.contains("on") && curDetail!=null) showDetail(curDetail);
  if($("v-fav").classList.contains("on")) renderFavs();
  if($("v-cam").classList.contains("on") && lastMatch) showMatch(lastMatch);
}
function renderAll(){ renderFilters(); renderList(); if($("v-chat").classList.contains("on")) renderChat(); }

/* ---------- START ---------- */
applyLang();
loadList();
</script>
