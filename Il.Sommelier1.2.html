<title>Il Sommelier</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B1424;--card:#132038;--card2:#1A2B47;--line:rgba(200,169,106,.2);
  --gold:#C8A96A;--gold2:#E9D3A0;--txt:#EEF1F6;--mut:rgba(238,241,246,.58);--wine:#1E3A5F;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-weight:400}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* HERO */
.hero{position:relative;flex-shrink:0;height:150px;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 90% at 20% 0%,#2A4670 0%,#122038 55%,#0B1424 100%)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;display:none}
.hero.has-img img{display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,36,.1) 0%,rgba(11,20,36,.95) 100%)}
.hero-txt{position:absolute;left:18px;right:18px;bottom:14px;z-index:2}
.brand{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:.01em;line-height:1}
.brand em{color:var(--gold2);font-style:italic}
.tagline{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.hero-tools{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;display:flex;gap:8px}
.pill,.icon-btn{background:rgba(11,20,36,.6);border:1px solid var(--line);color:var(--txt);height:32px;border-radius:20px;font-size:12px;cursor:pointer;backdrop-filter:blur(6px);font-family:var(--sans)}
.pill{padding:0 10px}
.icon-btn{width:32px;font-size:14px}

main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 28px;display:none}
.view.on{display:block}

/* NAV */
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 11px;color:var(--mut);font-size:10.5px;letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--sans)}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--gold2)}

/* INPUTS */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--txt);font-size:16px;padding:13px 0;font-family:var(--sans)}
.search input::placeholder{color:var(--mut)}
input[type=text],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:16px;outline:none;font-family:var(--sans)}
input:focus{border-color:var(--gold)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:var(--sans)}
.chip.on{background:rgba(201,162,92,.14);color:var(--gold2);border-color:rgba(201,162,92,.45)}
.count{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:8px 2px 10px}

/* CARDS */
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px;cursor:pointer}
.card:active{background:var(--card2)}
.thumb{width:56px;height:70px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-family:var(--serif);font-size:26px;font-style:italic}
.cbody{flex:1;min-width:0}
.cname{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.15;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprod{font-size:12px;color:var(--mut);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.cprice{font-family:var(--serif);font-size:19px;color:var(--gold2);white-space:nowrap;padding-right:2px}
.heart{color:var(--gold2);margin-left:4px}
.empty{text-align:center;color:var(--mut);padding:44px 18px;font-size:14px;line-height:1.6}

/* PHOTO TAB */
.sec-title{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:20px 0 10px}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.photo-btns label{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 8px;text-align:center;font-size:12.5px;cursor:pointer;letter-spacing:.02em}
.photo-btns label span.i{display:block;font-size:26px;margin-bottom:8px;color:var(--gold2)}
#prev{width:100%;max-height:240px;object-fit:contain;border-radius:14px;border:1px solid var(--line);display:none;margin-bottom:10px;background:var(--card)}
.ai{background:var(--card);border:1px solid rgba(201,162,92,.35);border-radius:14px;padding:13px 15px;margin:10px 0;font-size:13px}
.ai b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:500}
.ai div{margin-top:4px;color:var(--mut)}
.spin{color:var(--mut);font-size:13px;padding:14px 0;text-align:center}

/* CHAT */
.msg{padding:12px 14px;border-radius:14px;margin:8px 0;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.u{background:rgba(30,58,95,.55);margin-left:30px}
.msg.m{background:var(--card);border:1px solid var(--line);margin-right:16px}
.askrow{display:flex;gap:8px;margin-top:12px}
.askrow input{flex:1}
.askrow button{padding:0 16px;border:0;border-radius:12px;background:var(--wine);color:var(--gold2);font-size:15px;cursor:pointer}

/* DETAIL */
.back{background:none;border:0;color:var(--gold);font-size:13px;cursor:pointer;padding:2px 0 12px;font-family:var(--sans);letter-spacing:.02em}
.dwrap{position:relative}
.dimg{width:100%;height:280px;border-radius:16px;overflow:hidden;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.dimg img{width:100%;height:100%;object-fit:contain}
.dimg .ph{font-family:var(--serif);font-size:72px;font-style:italic}
.dname{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1}
.dprod{font-size:13px;color:var(--mut);margin:6px 0 12px;letter-spacing:.02em}
.dprice{font-family:var(--serif);font-size:32px;color:var(--gold2);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kv small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.kv span{font-size:14px}
.kv.wide{grid-column:1/-1}
.kv.wide span{line-height:1.45}
.fav{position:absolute;right:0;top:0;background:none;border:1px solid var(--line);color:var(--gold2);width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;z-index:2;background:rgba(15,7,8,.7)}

/* SETTINGS */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet-in{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;border-top:1px solid var(--line)}
.sheet-in h2{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sheet-in label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--wine);color:var(--gold2);font-size:14px;cursor:pointer;margin-top:10px;font-family:var(--sans)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.55}
.ok{color:#9ad39a;font-size:12px;margin-top:8px}
.err{color:#E8A0A0;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<div class="hero" id="hero">
  <img id="heroImg" src="hero.jpg" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
  <div class="hero-tools">
    <select id="lang" class="pill" onchange="setLang(this.value)">
      <option value="sq">SQ</option><option value="en">EN</option><option value="it">IT</option><option value="de">DE</option>
    </select>
    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙</button>
  </div>
  <div class="hero-txt">
    <div class="brand">Il <em>Sommelier</em></div>
    <div class="tagline" id="tagline">Vera · Kultura · Shijimi</div>
  </div>
</div>

<main>
  <!-- SEARCH -->
  <section class="view on" id="v-search">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A25C" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="text" id="q" autocomplete="off" oninput="renderList()">
    </div>
    <div class="chips" id="filters"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <!-- CAMERA -->
  <section class="view" id="v-cam">
    <div class="photo-btns">
      <label><span class="i">◎</span><span id="camTxt">Bëj foto</span><input type="file" accept="image/*" capture="environment" hidden onchange="onPhoto(event)"></label>
      <label><span class="i">▣</span><span id="galTxt">Ngarko foto</span><input type="file" accept="image/*" hidden onchange="onPhoto(event)"></label>
    </div>
    <img id="prev" alt="">
    <div id="camOut"></div>
  </section>

  <!-- CHAT -->
  <section class="view" id="v-chat">
    <div class="chips" id="askChips"></div>
    <div id="log"></div>
    <div class="askrow">
      <input type="text" id="askIn" autocomplete="off" onkeydown="if(event.key==='Enter')ask()">
      <button onclick="ask()">➤</button>
    </div>
  </section>

  <!-- FAVOURITES -->
  <section class="view" id="v-fav"><div id="favList"></div></section>

  <!-- DETAIL -->
  <section class="view" id="v-detail"><div id="detail"></div></section>
</main>

<nav>
  <button data-v="search" class="on" onclick="go('search')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span id="n-search">Kërko</span></button>
  <button data-v="cam" onclick="go('cam')"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="n-cam">Kamera</span></button>
  <button data-v="chat" onclick="go('chat')"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span id="n-chat">Pyet</span></button>
  <button data-v="fav" onclick="go('fav')"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span id="n-fav">Preferuara</span></button>
</nav>

<!-- SETTINGS -->
<div class="sheet" id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="sheet-in">
    <h2><span id="sTitle">Cilësimet</span><button class="icon-btn" onclick="closeSettings()">✕</button></h2>

    <label>Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AIza...">
    <button class="btn" onclick="saveKey()" id="saveBtn">Ruaj</button>
    <div id="keyMsg"></div>
    <div class="note" id="keyNote">Falas nga aistudio.google.com → Get API Key. Ruhet vetëm në këtë telefon.</div>

    <label id="listLbl">Lista e verërave</label>
    <input type="file" id="csvIn" accept=".csv" onchange="importCsv(event)" style="width:100%;color:var(--mut);font-size:13px">
    <div id="listMsg" class="note"></div>
    <button class="btn" onclick="exportCsv()" id="exportBtn">📥 Shkarko / Ndaj listën (CSV)</button>
    <button class="btn ghost" onclick="showCsvText()" id="showBtn">📋 Shfaq tekstin e listës</button>
    <textarea id="csvBox" readonly style="display:none;width:100%;height:160px;margin-top:10px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;font-family:monospace"></textarea>
    <button class="btn ghost" onclick="clearCsv()" id="clearBtn">Fshi listën e ruajtur</button>
  </div>
</div>

<script id="i18n-data" type="application/json">{"E kuqe rubin e errët, gati e padepërtueshme, e dendur":["Dark ruby red, almost impenetrable, dense","Rosso rubino scuro, quasi impenetrabile, denso","Dunkles Rubinrot, fast undurchdringlich, dicht"],"Shpërthejnë aroma shumë elegante speci jeshil, me nota bimore, kajsie, vaniljeje dhe një përfundim manushaqeje":["Very elegant aromas of green spices burst out, with herbaceous notes, apricot, vanilla and a violet finish","Esplodono profumi molto eleganti di spezie verdi, con note erbacee, albicocca, vaniglia e un finale di violetta","Es entfalten sich sehr elegante Aromen grüner Gewürze, mit krautigen Noten, Aprikose, Vanille und einem Veilchenabschluss"],"Me tul, e dendur me fruta dhe elegante, me tanine të dendura dhe të rafinuara, të lëmuara në mënyrë të përsosur; mbyllet harmonike me nota reçeli dhe qëndrueshmëri gati të pafund":["Fleshy, dense with fruit and elegant, with dense, refined tannins, perfectly polished; it closes harmoniously with jammy notes and almost endless persistence","Polposo, denso di frutto ed elegante, con tannini fitti e raffinati, perfettamente levigati; chiude armonico con note di confettura e persistenza quasi infinita","Fleischig, dicht an Frucht und elegant, mit dichten, feinen, perfekt geschliffenen Tanninen; harmonischer Abschluss mit Konfitürenoten und fast endloser Länge"],"E kuqe rubin e përqendruar":["Concentrated ruby red","Rosso rubino concentrato","Konzentriertes Rubinrot"],"Aroma intensive, fruta të vogla të kuqe të pjekura, të përziera mirë me aroma erëzash dhe vaniljeje, deri në një ndjesi përfundimtare që të kujton lëkurën":["Intense aromas, ripe small red fruits, well blended with spice and vanilla aromas, up to a final sensation reminiscent of leather","Profumi intensi, piccoli frutti rossi maturi, ben fusi con aromi di spezie e vaniglia, fino a una sensazione finale che ricorda il cuoio","Intensive Aromen, reife kleine rote Früchte, gut verbunden mit Gewürz- und Vanillearomen, bis hin zu einem Abschluss, der an Leder erinnert"],"Në degustim ndihet thellësia e saj; hyrja në gojë është e gjerë, e plotë dhe e kënaqshme; elegante, e butë dhe joshëse, mbyllet harmonike dhe e gjatë me nota duhani dhe erëzash, bashkë me tanine të dendura e të këndshme":["On tasting its depth is felt; the entry on the palate is broad, full and satisfying; elegant, soft and seductive, it closes harmonious and long with notes of tobacco and spice, together with dense, pleasant tannins","All'assaggio se ne avverte la profondità; l'ingresso in bocca è ampio, pieno e appagante; elegante, morbido e seducente, chiude armonico e lungo con note di tabacco e spezie, insieme a tannini fitti e piacevoli","Beim Verkosten spürt man seine Tiefe; der Auftakt am Gaumen ist breit, voll und befriedigend; elegant, weich und verführerisch, mit harmonischem, langem Abschluss mit Tabak- und Gewürznoten und dichten, angenehmen Tanninen"],"Mish i kuq dhe djathëra me brumë të fortë; pëllumb i mbushur me foie gras":["Red meat and hard cheeses; pigeon stuffed with foie gras","Carni rosse e formaggi a pasta dura; piccione farcito con foie gras","Rotes Fleisch und Hartkäse; mit Foie gras gefüllte Taube"],"E kuqe rubin me nuanca vjollcë.":["Ruby red with violet hues.","Rosso rubino con sfumature violacee.","Rubinrot mit violetten Reflexen."],"Notë aromatike frutore e dominuar nga qershia, me nuanca më të freskëta barishtesh aromatike.":["Fruity aromatic note dominated by cherry, with fresher hints of aromatic herbs.","Nota aromatica fruttata dominata dalla ciliegia, con sfumature più fresche di erbe aromatiche.","Fruchtige Aromanote, dominiert von Kirsche, mit frischeren Anklängen von Kräutern."],"Nota të qarta qershie mbi një sfond barishtesh aromatike, piperi të bardhë dhe nënpylli.":["Clear notes of cherry on a background of aromatic herbs, white pepper and undergrowth.","Note nitide di ciliegia su un fondo di erbe aromatiche, pepe bianco e sottobosco.","Klare Kirschnoten vor einem Hintergrund aus Kräutern, weißem Pfeffer und Waldboden."],"E plotë dhe e ekuilibruar në mënyrë të përsosur; aciditeti dhe kripësia i japin peshë dhe gjatësi. Verë e strukturuar mirë dhe elegante.":["Full and perfectly balanced; acidity and saltiness give it weight and length. A well-structured, elegant wine.","Pieno e perfettamente equilibrato; acidità e sapidità gli danno peso e lunghezza. Vino ben strutturato ed elegante.","Voll und perfekt ausgewogen; Säure und Salzigkeit verleihen ihm Gewicht und Länge. Ein gut strukturierter, eleganter Wein."],"Mish i pjekur, sidomos pulë Guineje, derr, dhi dhe qengj; pjata me kërpudha; djathëra mesatarisht të stagjionuar.":["Roast meats, especially guinea fowl, pork, goat and lamb; mushroom dishes; medium-aged cheeses.","Carni arrosto, soprattutto faraona, maiale, capretto e agnello; piatti ai funghi; formaggi di media stagionatura.","Braten, besonders Perlhuhn, Schwein, Zicklein und Lamm; Pilzgerichte; mittelalte Käse."],"Nota erëzash dhe druri ndërthuren në mënyrë harmonike me ëmbëlsinë frutore dhe thellësinë aromatike: kumbull e pjekur, qershi, nënpyll dhe nota balsamike.":["Notes of spice and wood blend harmoniously with fruity sweetness and aromatic depth: ripe plum, cherry, undergrowth and balsamic notes.","Note di spezie e legno si fondono armoniosamente con la dolcezza fruttata e la profondità aromatica: prugna matura, ciliegia, sottobosco e note balsamiche.","Gewürz- und Holznoten verbinden sich harmonisch mit fruchtiger Süße und aromatischer Tiefe: reife Pflaume, Kirsche, Waldboden und balsamische Noten."],"Harmoni e përsosur midis ëmbëlsisë së lehtë nga tharja e rrushit dhe aciditetit të gjallë, që i japin strukturë dhe pijshmëri.":["Perfect harmony between the slight sweetness from the drying of the grapes and lively acidity, which give it structure and drinkability.","Perfetta armonia tra la leggera dolcezza dovuta all'appassimento delle uve e la vivace acidità, che gli danno struttura e bevibilità.","Perfekte Harmonie zwischen der leichten Süße aus dem Antrocknen der Trauben und der lebendigen Säure, die Struktur und Trinkfreude verleihen."],"Përqendrim i madh frutash: manaferra, qershi dhe vjollca, të ndjekura nga nota më terciare.":["Great concentration of fruit: blackberries, cherries and violets, followed by more tertiary notes.","Grande concentrazione di frutto: more, ciliegie e viole, seguite da note più terziarie.","Große Fruchtkonzentration: Brombeeren, Kirschen und Veilchen, gefolgt von tertiären Noten."],"Tanine të forta por të pjekura, që krijojnë një gllënjkë kadifeje me përfundim të gjatë frutash të kuqe dhe të zeza.":["Firm but ripe tannins, creating a velvety sip with a long finish of red and black fruit.","Tannini decisi ma maturi, che creano un sorso vellutato con un lungo finale di frutti rossi e neri.","Feste, aber reife Tannine, die einen samtigen Schluck mit langem Abgang von roten und schwarzen Früchten ergeben."],"Shumë e gjithanshme: pasta me mish si lazanja bolonjeze, kërpudha të stufuara, djathëra të stagjionuar jo pikantë.":["Very versatile: pasta with meat such as lasagne Bolognese, stewed mushrooms, aged cheeses that are not spicy.","Molto versatile: pasta con carne come lasagne alla bolognese, funghi in umido, formaggi stagionati non piccanti.","Sehr vielseitig: Pasta mit Fleisch wie Lasagne Bolognese, geschmorte Pilze, gereifte, nicht pikante Käse."],"E kuqe rubin e thellë; trupi i plotë është në ekuilibër të përsosur me aciditetin freskues.":["Deep ruby red; the full body is in perfect balance with the refreshing acidity.","Rosso rubino profondo; il corpo pieno è in perfetto equilibrio con l'acidità rinfrescante.","Tiefes Rubinrot; der volle Körper steht in perfektem Gleichgewicht mit der erfrischenden Säure."],"Nuanca nënpylli, grafiti dhe aroma terciare si arra, fiq dhe vanilje.":["Hints of undergrowth, graphite and tertiary aromas such as walnut, fig and vanilla.","Sentori di sottobosco, grafite e aromi terziari come noce, fico e vaniglia.","Anklänge von Waldboden, Graphit und tertiären Aromen wie Walnuss, Feige und Vanille."],"Gllënjkë intensive, me tanine të forta e të pjekura shumë të integruara dhe përfundim shumë të gjatë.":["Intense sip, with firm, ripe, very well-integrated tannins and a very long finish.","Sorso intenso, con tannini decisi e maturi molto ben integrati e finale lunghissimo.","Intensiver Schluck mit festen, reifen, sehr gut eingebundenen Tanninen und sehr langem Abgang."],"Pjata me shije vjeshte si rizoto me Amarone ose papardele me kërpudha; shkëlqyeshëm me djathëra të stagjionuar.":["Dishes with autumn flavours such as Amarone risotto or pappardelle with mushrooms; excellent with aged cheeses.","Piatti dai sapori autunnali come risotto all'Amarone o pappardelle ai funghi; ottimo con formaggi stagionati.","Gerichte mit Herbstaromen wie Amarone-Risotto oder Pappardelle mit Pilzen; ausgezeichnet zu gereiften Käsen."],"Aroma intensive dhe frutore: qershi, kumbull e pjekur dhe rrush frëngu i zi; nota lulesh vjollce dhe nuanca delikate barishtesh.":["Intense, fruity aromas: cherry, ripe plum and blackcurrant; notes of violet and delicate hints of herbs.","Profumi intensi e fruttati: ciliegia, prugna matura e ribes nero; note di viola e delicate sfumature erbacee.","Intensive, fruchtige Aromen: Kirsche, reife Pflaume und schwarze Johannisbeere; Veilchennoten und zarte Kräuteranklänge."],"Butësi dhe rrumbullakësi; tanine të pranishme por kadifeje; aciditet i gjallë që jep freski dhe pijshmëri.":["Softness and roundness; tannins present but velvety; lively acidity that gives freshness and drinkability.","Morbidezza e rotondità; tannini presenti ma vellutati; acidità vivace che dona freschezza e bevibilità.","Weichheit und Rundheit; präsente, aber samtige Tannine; lebendige Säure, die Frische und Trinkfreude gibt."],"Pjata me mish të bardhë si pulë në skarë ose e pjekur; pasta me salcë domateje ose kërpudhash; djathëra gjysmë të stagjionuar.":["White-meat dishes such as grilled or roast chicken; pasta with tomato or mushroom sauce; semi-aged cheeses.","Piatti di carne bianca come pollo alla griglia o arrosto; pasta al pomodoro o ai funghi; formaggi semistagionati.","Gerichte mit hellem Fleisch wie gegrilltes oder gebratenes Hähnchen; Pasta mit Tomaten- oder Pilzsauce; halbgereifte Käse."],"Qershi, luleshtrydhe dhe boronica të kuqe, të mbështetura mirë nga nota të thekura dhe të tymosura":["Cherry, strawberry and red currant, well supported by toasty and smoky notes","Ciliegia, fragola e ribes rosso, ben sostenuti da note tostate e affumicate","Kirsche, Erdbeere und rote Johannisbeere, gut getragen von gerösteten und rauchigen Noten"],"Qiellza është e pasur por freskuese, me tanine të forta e të pjekura që zgjasin, dhe një pas-shije frutash të kuqe e të zeza që e zgjat gllënjkën":["The palate is rich yet refreshing, with firm, ripe, lingering tannins and an aftertaste of red and black fruit that lengthens the sip","Il palato è ricco ma rinfrescante, con tannini decisi e maturi che persistono e un retrogusto di frutti rossi e neri che allunga il sorso","Der Gaumen ist reichhaltig und doch erfrischend, mit festen, reifen, anhaltenden Tanninen und einem Nachgeschmack von roten und schwarzen Früchten, der den Schluck verlängert"],"Shkon me shumë pjata falë strukturës së pasur; ideale me pasta al ragù, lazanja ose pappardelle me derr të egër":["Goes with many dishes thanks to its rich structure; ideal with pasta al ragù, lasagne or pappardelle with wild boar","Si abbina a molti piatti grazie alla sua struttura ricca; ideale con pasta al ragù, lasagne o pappardelle al cinghiale","Passt dank seiner reichen Struktur zu vielen Gerichten; ideal zu Pasta al ragù, Lasagne oder Pappardelle mit Wildschwein"],"Kujton reçel qershie, kanellë, karafil, si dhe çokollatë të zezë dhe mente.":["Recalls cherry jam, cinnamon, clove, as well as dark chocolate and mint.","Ricorda confettura di ciliegie, cannella, chiodi di garofano, cioccolato fondente e menta.","Erinnert an Kirschkonfitüre, Zimt, Nelke sowie dunkle Schokolade und Minze."],"Kadifeje, me tanine të buta por të pranishme që i japin gjatësi të madhe gllënjkës.":["Velvety, with soft but present tannins that give the sip great length.","Vellutato, con tannini morbidi ma presenti che danno grande lunghezza al sorso.","Samtig, mit weichen, aber präsenten Tanninen, die dem Schluck große Länge geben."],"Ëmbëlsira të thata ose me kakao; djathëra shumë të stagjionuar ose blu; pjata kryesore me fruta ose me salca frutash të kuqe.":["Dry or cocoa-based desserts; very aged or blue cheeses; main courses with fruit or with red-fruit sauces.","Dolci secchi o al cacao; formaggi molto stagionati o erborinati; secondi piatti con frutta o con salse di frutti rossi.","Trockene oder Kakao-Desserts; sehr gereifte Käse oder Blauschimmelkäse; Hauptgerichte mit Obst oder roten Fruchtsaucen."],"Nota intensive frutash të errëta të pjekura, të freskuara nga nuanca balsamike dhe minerale":["Intense notes of ripe dark fruit, freshened by balsamic and mineral hints","Note intense di frutti scuri maturi, rinfrescate da sfumature balsamiche e minerali","Intensive Noten reifer dunkler Früchte, aufgefrischt durch balsamische und mineralische Anklänge"],"Gllënjka, energjike dhe e fuqishme, mbështetet nga tanine të dendura dhe të mëndafshta":["The sip, energetic and powerful, is supported by dense, silky tannins","Il sorso, energico e potente, è sostenuto da tannini fitti e setosi","Der energische, kraftvolle Schluck wird von dichten, seidigen Tanninen getragen"],"Mish i stufuar i madh, gjah në përgjithësi, sidomos lepur, rosë me portokall, djathëra me stazhionim të gjatë; për ta guxuar me omar në salcë domateje, ose thjesht për meditim":["Large stewed meats, game in general, especially hare, duck à l'orange, long-aged cheeses; for the daring, with lobster in tomato sauce, or simply for meditation","Grandi carni in umido, selvaggina in genere, soprattutto lepre, anatra all'arancia, formaggi a lunga stagionatura; per i più audaci con astice al pomodoro, o semplicemente da meditazione","Große Schmorgerichte, Wild allgemein, besonders Hase, Ente mit Orange, lange gereifte Käse; für Mutige zu Hummer in Tomatensauce oder einfach als Meditationswein"],"E kuqe rubin, ndonjëherë me nuanca portokalli":["Ruby red, sometimes with orange hues","Rosso rubino, talvolta con riflessi aranciati","Rubinrot, manchmal mit orangefarbenen Reflexen"],"Buqetë e butë, delikate, karakteristike":["Soft, delicate, characteristic bouquet","Bouquet morbido, delicato, caratteristico","Weiches, zartes, charakteristisches Bouquet"],"Me trup të plotë, kadifeje, e thatë":["Full-bodied, velvety, dry","Corposo, vellutato, secco","Vollmundig, samtig, trocken"],"Pjata me makarona, rizoto, mish i bardhë dhe i kuq, djathëra të pjekur dhe të fortë":["Pasta dishes, risotto, white and red meat, mature and strong cheeses","Primi piatti di pasta, risotti, carni bianche e rosse, formaggi stagionati e forti","Pastagerichte, Risotto, helles und rotes Fleisch, gereifte und kräftige Käse"],"E kuqe rubin e shndritshme, që shkon drejt së kuqes granatë me vjetërsinë":["Bright ruby red, tending towards garnet with age","Rosso rubino brillante, che tende al granato con l'invecchiamento","Leuchtendes Rubinrot, das mit dem Alter zu Granatrot neigt"],"Buqetë intensive, e pastër, e këndshme dhe e rafinuar, që të kujton manushaqe të ëmbël, duhan, çokollatë dhe nuanca të këndshme frutash të pyllit e vaniljeje":["Intense, clean, pleasant and refined bouquet, reminiscent of sweet violets, tobacco, chocolate and pleasant hints of wild berries and vanilla","Bouquet intenso, pulito, piacevole e raffinato, che ricorda la viola dolce, il tabacco, il cioccolato e piacevoli sfumature di frutti di bosco e vaniglia","Intensives, sauberes, angenehmes und feines Bouquet, das an süße Veilchen, Tabak, Schokolade und angenehme Anklänge von Waldbeeren und Vanille erinnert"],"Shija i konfirmon plotësisht këto në një verë të ekuilibruar, me trup të plotë, tanine të mira dhe strukturë të fortë":["The palate fully confirms these in a balanced, full-bodied wine with good tannins and a firm structure","Il gusto li conferma pienamente in un vino equilibrato, di corpo pieno, con buoni tannini e struttura solida","Der Geschmack bestätigt dies voll in einem ausgewogenen, vollmundigen Wein mit guten Tanninen und fester Struktur"],"Nota të gjalla frutash të kuqe, qershie dhe ribesi të kuq, me nuanca lehtësisht erëzore":["Lively notes of red fruit, cherry and red currant, with slightly spicy hints","Note vivaci di frutti rossi, ciliegia e ribes rosso, con sfumature leggermente speziate","Lebhafte Noten von roten Früchten, Kirsche und roter Johannisbeere, mit leicht würzigen Anklängen"],"Goja është e plotë dhe e butë, me tanine të mëndafshta dhe përfundim të lëngshëm":["The palate is full and soft, with silky tannins and a juicy finish","La bocca è piena e morbida, con tannini setosi e un finale succoso","Der Gaumen ist voll und weich, mit seidigen Tanninen und saftigem Abgang"],"E verdhë e artë":["Golden yellow","Giallo dorato","Goldgelb"],"Jashtëzakonisht komplekse, me aroma kajsish në shurup, mango, papaje dhe qitroje të kandisur, me theks molle dhe pjeshke të verdhë":["Extraordinarily complex, with aromas of apricots in syrup, mango, papaya and candied citron, with accents of apple and yellow peach","Straordinariamente complesso, con profumi di albicocche sciroppate, mango, papaya e cedro candito, con accenti di mela e pesca gialla","Außergewöhnlich komplex, mit Aromen von Aprikosen in Sirup, Mango, Papaya und kandierter Zitronatzitrone, mit Akzenten von Apfel und gelbem Pfirsich"],"E ëmbël, kremoze, me aciditet të mirë por mbi të gjitha me një shtysë të fortë kripore/minerale në kontrast efektiv":["Sweet, creamy, with good acidity but above all with a strong salty/mineral thrust in effective contrast","Dolce, cremoso, con buona acidità ma soprattutto con una forte spinta sapida/minerale in efficace contrasto","Süß, cremig, mit guter Säure, vor allem aber mit einem kräftigen salzig-mineralischen Zug als wirkungsvollem Kontrast"],"Verë e ëmbël që shkon shumë mirë me karavidhe; e shkëlqyer me pate foie gras, djathëra dhe ëmbëlsira":["A sweet wine that goes very well with crayfish; excellent with foie gras pâté, cheeses and desserts","Vino dolce che si abbina molto bene con gli scampi; ottimo con paté di foie gras, formaggi e dolci","Ein Süßwein, der sehr gut zu Langustinen passt; ausgezeichnet zu Foie-gras-Pastete, Käse und Desserts"],"E kuqe rubin me nuanca granati":["Ruby red with garnet hues","Rosso rubino con riflessi granati","Rubinrot mit granatroten Reflexen"],"Aromë vere intensive":["Intense vinous aroma","Profumo vinoso intenso","Intensiver weiniger Duft"],"Verë me trup të plotë, e këndshme":["Full-bodied, pleasant wine","Vino di corpo pieno, piacevole","Vollmundiger, angenehmer Wein"],"Shkon në mënyrë të përsosur me mish të kuq dhe gjah":["Goes perfectly with red meat and game","Si abbina perfettamente a carni rosse e selvaggina","Passt perfekt zu rotem Fleisch und Wild"],"E kuqe rubin intensive me nuanca granate.":["Intense ruby red with garnet hues.","Rosso rubino intenso con riflessi granati.","Intensives Rubinrot mit granatroten Reflexen."],"Intensivisht verore, tipike e Cannonau-t.":["Intensely vinous, typical of Cannonau.","Intensamente vinoso, tipico del Cannonau.","Intensiv weinig, typisch für Cannonau."],"E ngrohtë, e rrumbullakët, e strukturuar mirë dhe shumë e ekuilibruar.":["Warm, round, well structured and very balanced.","Caldo, rotondo, ben strutturato e molto equilibrato.","Warm, rund, gut strukturiert und sehr ausgewogen."],"Pjata të para me salca të shijshme, gic qumështi i pjekur dhe qengj, djathë pecorino sard mesatarisht ose shumë i stagjionuar.":["First courses with tasty sauces, roast suckling pig and lamb, Pecorino Sardo of medium or long ageing.","Primi piatti con sughi saporiti, maialetto arrosto e agnello, pecorino sardo di media o lunga stagionatura.","Erste Gänge mit würzigen Saucen, gebratenes Spanferkel und Lamm, mittel oder lange gereifter Pecorino Sardo."],"E kuqe rubin intensive me nuancë tipike të Monica-s.":["Intense ruby red with a hue typical of Monica.","Rosso rubino intenso con riflesso tipico del Monica.","Intensives Rubinrot mit der für Monica typischen Nuance."],"Verore, intensive, karakteristike.":["Vinous, intense, characteristic.","Vinoso, intenso, caratteristico.","Weinig, intensiv, charakteristisch."],"E rrumbullakët, me pas-shije që priret drejt ëmbëlsisë, tipare tipike e rrushit Monica nga hardhitë në formë shkurreje.":["Round, with an aftertaste tending towards sweetness, a typical trait of Monica grapes from bush-trained vines.","Rotondo, con un retrogusto che tende al dolce, tratto tipico delle uve Monica da viti ad alberello.","Rund, mit einem Nachgeschmack, der zur Süße neigt, ein typischer Zug der Monica-Trauben aus Buscherziehung."],"Pasta tradicionale me salcë domateje, stufato peshku të shijshme, feta toni në skarë, qengj i stufuar, pecorino mesatarisht i stagjionuar.":["Traditional pasta with tomato sauce, tasty fish stews, grilled tuna steaks, stewed lamb, medium-aged pecorino.","Pasta tradizionale al pomodoro, zuppe di pesce saporite, tranci di tonno alla griglia, agnello in umido, pecorino di media stagionatura.","Traditionelle Pasta mit Tomatensauce, würzige Fischeintöpfe, gegrillte Thunfischsteaks, geschmortes Lamm, mittelalter Pecorino."],"E verdhë kashte me nuanca të lehta të gjelbra.":["Straw yellow with light greenish hues.","Giallo paglierino con leggeri riflessi verdolini.","Strohgelb mit leichten grünlichen Reflexen."],"E hollë, intensive dhe delikate, me aroma të mira primare dhe sekondare.":["Fine, intense and delicate, with good primary and secondary aromas.","Fine, intenso e delicato, con buoni profumi primari e secondari.","Fein, intensiv und zart, mit guten primären und sekundären Aromen."],"E freskët dhe e thatë, me kripësi, me ndjesi të këndshme delikate dhe të hollë.":["Fresh and dry, savoury, with a pleasant, delicate and fine sensation.","Fresco e secco, sapido, con una sensazione piacevole, delicata e fine.","Frisch und trocken, salzig, mit angenehmem, zartem und feinem Eindruck."],"Antipasta deti, fregola me krustace, stufato peshku, levrek me angjinare, djathëra të butë mesatarisht të stagjionuar.":["Seafood starters, fregola with shellfish, fish stews, sea bass with artichokes, soft medium-aged cheeses.","Antipasti di mare, fregola con crostacei, zuppe di pesce, spigola ai carciofi, formaggi molli di media stagionatura.","Meeresfrüchte-Vorspeisen, Fregola mit Krustentieren, Fischeintöpfe, Wolfsbarsch mit Artischocken, mittelalte Weichkäse."],"E kuqe rubin intensive.":["Intense ruby red.","Rosso rubino intenso.","Intensives Rubinrot."],"Intensive, e qëndrueshme, e ekuilibruar mirë.":["Intense, persistent, well balanced.","Intenso, persistente, ben equilibrato.","Intensiv, anhaltend, gut ausgewogen."],"Kadifeje, e plotë, harmonike, e ngrohtë, e rrumbullakët.":["Velvety, full, harmonious, warm, round.","Vellutato, pieno, armonico, caldo, rotondo.","Samtig, voll, harmonisch, warm, rund."],"Pjata të para me salca mishi, gic qumështi në hell, mish i kuq në skarë, qengj i pjekur, pulë me mirtë, salsiçe sarde, pecorino sard i stagjionuar.":["First courses with meat sauces, spit-roasted suckling pig, grilled red meat, roast lamb, chicken with myrtle, Sardinian sausages, aged Pecorino Sardo.","Primi piatti con sughi di carne, maialetto allo spiedo, carni rosse alla griglia, agnello arrosto, pollo al mirto, salsiccia sarda, pecorino sardo stagionato.","Erste Gänge mit Fleischsaucen, Spanferkel vom Spieß, gegrilltes rotes Fleisch, Lammbraten, Hähnchen mit Myrte, sardische Wurst, gereifter Pecorino Sardo."],"E kuqe intensive.":["Intense red.","Rosso intenso.","Intensives Rot."],"Buqetë e pasur dhe komplekse.":["Rich and complex bouquet.","Bouquet ricco e complesso.","Reiches und komplexes Bouquet."],"Strukturë e madhe, e ekuilibruar, e hollë dhe e qëndrueshme; butësi (souplesse) shumë e lartë.":["Great structure, balanced, fine and persistent; very high softness (souplesse).","Grande struttura, equilibrato, fine e persistente; morbidezza (souplesse) elevatissima.","Große Struktur, ausgewogen, fein und anhaltend; sehr hohe Geschmeidigkeit (Souplesse)."],"Derr i egër i stufuar, gjah me qime, mish i kuq me erëza, pecorino sard i stagjionuar.":["Stewed wild boar, furred game, spiced red meat, aged Pecorino Sardo.","Cinghiale in umido, selvaggina da pelo, carni rosse speziate, pecorino sardo stagionato.","Geschmortes Wildschwein, Haarwild, gewürztes rotes Fleisch, gereifter Pecorino Sardo."],"E kuqe granatë":["Garnet red","Rosso granato","Granatrot"],"Aromë eterike dhe intensive: katran me nuanca lulesh të thata, nënpylli, lëkure, tartufi dhe erëzash të ëmbla":["Ethereal, intense aroma: tar with hints of dried flowers, undergrowth, leather, truffle and sweet spices","Profumo etereo e intenso: catrame con sfumature di fiori secchi, sottobosco, cuoio, tartufo e spezie dolci","Ätherischer, intensiver Duft: Teer mit Anklängen von getrockneten Blumen, Waldboden, Leder, Trüffel und süßen Gewürzen"],"Qiellzë e pasur; ekuilibri dhe taninet e pjekura kontribuojnë në harmoninë, dallimin dhe intensitetin e saj":["Rich palate; the balance and ripe tannins contribute to its harmony, distinction and intensity","Palato ricco; l'equilibrio e i tannini maturi contribuiscono alla sua armonia, distinzione e intensità","Reicher Gaumen; Ausgewogenheit und reife Tannine tragen zu seiner Harmonie, Eleganz und Intensität bei"],"Ndikim aromatik shpërthyes; buqetë e gjerë nga reçeli i qershisë te mana, me nuanca lulesh visterie, çaji të zi dhe jamballi":["Explosive aromatic impact; a broad bouquet from cherry jam to mulberry, with hints of wisteria flowers, black tea and saffron","Impatto aromatico esplosivo; bouquet ampio dalla confettura di ciliegie alla mora di gelso, con sfumature di fiori di glicine, tè nero e zafferano","Explosiver aromatischer Eindruck; ein weites Bouquet von Kirschkonfitüre bis Maulbeere, mit Anklängen von Glyzinienblüten, Schwarztee und Safran"],"Gllënjka është e lëngshme, në harmoni të përsosur me përshtypjet aromatike, e pasuruar me nuanca erëzore në retro-olfaksion":["The sip is juicy, in perfect harmony with the aromatic impressions, enriched with spicy hints on the retronasal finish","Il sorso è succoso, in perfetta armonia con le sensazioni olfattive, arricchito da sfumature speziate al retrolfatto","Der Schluck ist saftig, in perfekter Harmonie mit den Aromaeindrücken, bereichert durch würzige Anklänge im Retronasal"],"Ngjyrë e ndritshme me intensitet mesatar, me reflekse të gjalla të kuqe-purpurt":["Bright colour of medium intensity, with lively red-purple reflections","Colore brillante di media intensità, con vivaci riflessi rosso porpora","Leuchtende Farbe mittlerer Intensität mit lebhaften purpurroten Reflexen"],"Hapet me aroma frutash të vogla të kuqe dhe lëngu shege":["Opens with aromas of small red fruits and pomegranate juice","Si apre con profumi di piccoli frutti rossi e succo di melograno","Öffnet sich mit Aromen kleiner roter Früchte und Granatapfelsaft"],"Shije shprehëse dhe e freskët, me nota të ëmbla qershie të pjekur, reçeli kumbulle dhe nuanca jamballi në përfundim":["Expressive, fresh taste, with sweet notes of ripe cherry, plum jam and hints of saffron on the finish","Gusto espressivo e fresco, con note dolci di ciliegia matura, confettura di prugne e sfumature di zafferano nel finale","Ausdrucksstarker, frischer Geschmack mit süßen Noten reifer Kirsche, Pflaumenkonfitüre und Safrananklängen im Abgang"],"E kuqe rubin e thellë me reflekse granate.":["Deep ruby red with garnet reflections.","Rosso rubino profondo con riflessi granati.","Tiefes Rubinrot mit granatroten Reflexen."],"Nota elegante balsamike, aroma lulesh dhe nuanca barishtesh aromatike.":["Elegant balsamic notes, floral aromas and hints of aromatic herbs.","Eleganti note balsamiche, profumi floreali e sfumature di erbe aromatiche.","Elegante balsamische Noten, Blütenaromen und Anklänge von Kräutern."],"Bujare dhe e rafinuar, me ekuilibër të shkëlqyer midis freskisë së gjallë dhe trupit të plotë; tanine të integruara mirë që çojnë në një përfundim të gjatë dhe të qëndrueshëm.":["Generous and refined, with an excellent balance between lively freshness and full body; well-integrated tannins leading to a long, persistent finish.","Generoso e raffinato, con un ottimo equilibrio tra freschezza vivace e corpo pieno; tannini ben integrati che portano a un finale lungo e persistente.","Großzügig und fein, mit ausgezeichnetem Gleichgewicht zwischen lebendiger Frische und vollem Körper; gut eingebundene Tannine führen zu einem langen, anhaltenden Abgang."],"Mish i kuq në skarë dhe i pjekur, gjah, qengj, derr i pjekur, djathëra të stagjionuar, kërpudha dhe tartuf.":["Grilled and roast red meat, game, lamb, roast pork, aged cheeses, mushrooms and truffle.","Carni rosse alla griglia e arrosto, selvaggina, agnello, maiale arrosto, formaggi stagionati, funghi e tartufo.","Gegrilltes und gebratenes rotes Fleisch, Wild, Lamm, Schweinebraten, gereifte Käse, Pilze und Trüffel."],"E kuqe rubin e thellë dhe intensive me reflekse purpur.":["Deep, intense ruby red with purple reflections.","Rosso rubino profondo e intenso con riflessi porpora.","Tiefes, intensives Rubinrot mit purpurnen Reflexen."],"Ekspresive dhe komplekse, me aroma të theksuara lulesh vjollce dhe irisi.":["Expressive and complex, with pronounced aromas of violet and iris.","Espressivo e complesso, con spiccati profumi di viola e iris.","Ausdrucksstark und komplex, mit ausgeprägten Aromen von Veilchen und Iris."],"Strukturë e shquar, që bashkon harmoninë, thatësinë dhe mineralitetin me kripësi.":["Remarkable structure, combining harmony, dryness and minerality with savouriness.","Struttura notevole, che unisce armonia, secchezza e mineralità con sapidità.","Bemerkenswerte Struktur, die Harmonie, Trockenheit und Mineralität mit Salzigkeit verbindet."],"Ribollita (supë toskane me bukë, fasule dhe perime), fasule, gjah dhe stufato; djathëra shumë të stagjionuar dhe çokollatë.":["Ribollita (Tuscan bread, bean and vegetable soup), beans, game and stews; very aged cheeses and chocolate.","Ribollita (zuppa toscana di pane, fagioli e verdure), fagioli, selvaggina e stufati; formaggi molto stagionati e cioccolato.","Ribollita (toskanische Suppe mit Brot, Bohnen und Gemüse), Bohnen, Wild und Schmorgerichte; sehr gereifte Käse und Schokolade."],"E kuqe intensive":["Intense red","Rosso intenso","Intensives Rot"],"Aromë vere me nuanca lulesh bajameje":["Vinous aroma with hints of almond blossom","Profumo vinoso con sfumature di fiori di mandorlo","Weiniger Duft mit Anklängen von Mandelblüten"],"Shije e thatë dhe me trup":["Dry, full-bodied taste","Sapore secco e di corpo","Trockener, körperreicher Geschmack"],"Ideale me mish të pjekur, mish të kuq dhe gjah":["Ideal with roast meat, red meat and game","Ideale con arrosti, carni rosse e selvaggina","Ideal zu Braten, rotem Fleisch und Wild"],"E kuqe e shndritshme me reflekse vjollcë":["Bright red with violet reflections","Rosso brillante con riflessi violacei","Leuchtendes Rot mit violetten Reflexen"],"Aromë intensive, karakteristike frutash të pjekura dhe erëzash të ëmbla":["Intense aroma, characteristic of ripe fruit and sweet spices","Profumo intenso, caratteristico di frutta matura e spezie dolci","Intensiver Duft, charakteristisch für reife Früchte und süße Gewürze"],"Ideale me pjata të para dhe të dyta me mish, mish të pjekur dhe gjah":["Ideal with first and second courses of meat, roast meat and game","Ideale con primi e secondi piatti di carne, arrosti e selvaggina","Ideal zu ersten und zweiten Gängen mit Fleisch, Braten und Wild"],"Mund të shoqërojë pjata me mish të kuq, gjah dhe djathë të stazhionuar":["Can accompany dishes with red meat, game and aged cheese","Può accompagnare piatti di carne rossa, selvaggina e formaggi stagionati","Kann Gerichte mit rotem Fleisch, Wild und gereiftem Käse begleiten"],"Verë intensive me aroma shumë frutore, të shoqëruara nga nota më komplekse reçeli, erëzash, duhani dhe kafeje.":["An intense wine with very fruity aromas, accompanied by more complex notes of jam, spices, tobacco and coffee.","Vino intenso con profumi molto fruttati, accompagnati da note più complesse di confettura, spezie, tabacco e caffè.","Intensiver Wein mit sehr fruchtigen Aromen, begleitet von komplexeren Noten von Konfitüre, Gewürzen, Tabak und Kaffee."],"Në gojë tregon gjithë madhështinë e saj, me tanine të ëmbla dhe nota shumë të qëndrueshme.":["On the palate it shows all its grandeur, with sweet tannins and very persistent notes.","In bocca mostra tutta la sua grandezza, con tannini dolci e note molto persistenti.","Am Gaumen zeigt er seine ganze Größe, mit süßen Tanninen und sehr anhaltenden Noten."],"Mish i kuq dhe djathëra të stagjionuar.":["Red meat and aged cheeses.","Carni rosse e formaggi stagionati.","Rotes Fleisch und gereifte Käse."],"Aroma të pasura ribesi, manaferrash dhe qershish":["Rich aromas of currant, blackberries and cherries","Ricchi profumi di ribes, more e ciliegie","Reiche Aromen von Johannisbeere, Brombeeren und Kirschen"],"E kuqe rubin e shndritshme.":["Bright ruby red.","Rosso rubino brillante.","Leuchtendes Rubinrot."],"Frutore, ku dallohet aroma e qershisë; lehtësisht me erëza dhe lule.":["Fruity, with cherry standing out; lightly spicy and floral.","Fruttato, dove spicca la ciliegia; leggermente speziato e floreale.","Fruchtig, mit hervortretender Kirsche; leicht würzig und blumig."],"Shije e freskët, e gjallë dhe lehtësisht taninike; qëndrueshmëri e këndshme.":["Fresh, lively and lightly tannic taste; pleasant persistence.","Gusto fresco, vivace e leggermente tannico; piacevole persistenza.","Frischer, lebendiger, leicht tanninbetonter Geschmack; angenehme Länge."],"Ideale me salume, pjata të para, pica dhe torta të kripura, mish i bardhë me erëza të lehta.":["Ideal with cold cuts, first courses, pizza and savoury pies, lightly spiced white meat.","Ideale con salumi, primi piatti, pizza e torte salate, carni bianche leggermente speziate.","Ideal zu Wurstwaren, ersten Gängen, Pizza und herzhaften Kuchen, leicht gewürztem hellem Fleisch."],"E verdhë kashte me reflekse të gjelbra; perlazh i hollë dhe i vazhdueshëm.":["Straw yellow with green reflections; fine, continuous perlage.","Giallo paglierino con riflessi verdi; perlage fine e continuo.","Strohgelb mit grünen Reflexen; feine, anhaltende Perlage."],"Aroma të gjera dhe mbështjellëse, nga frutat e pjekura te lulet e freskëta, deri te nota vanilje dhe pastiçerie.":["Broad, enveloping aromas, from ripe fruit to fresh flowers, up to notes of vanilla and pastry.","Profumi ampi e avvolgenti, dalla frutta matura ai fiori freschi, fino a note di vaniglia e pasticceria.","Weite, umhüllende Aromen, von reifen Früchten über frische Blumen bis zu Vanille- und Gebäcknoten."],"Në gojë me kripësi dhe e plotë, e freskët dhe e gjallë, shumë koherente me aromat. Përfundim i gjatë dhe harmonik.":["Savoury and full on the palate, fresh and lively, very consistent with the aromas. Long, harmonious finish.","In bocca sapido e pieno, fresco e vivace, molto coerente con i profumi. Finale lungo e armonico.","Am Gaumen salzig und voll, frisch und lebendig, sehr stimmig mit den Aromen. Langer, harmonischer Abgang."],"E verdhë kashte me reflekse të lehta të gjelbra; shkumë e butë dhe e bollshme, me perlazh të imët dhe të qëndrueshëm":["Straw yellow with light green reflections; soft, abundant mousse, with fine, persistent perlage","Giallo paglierino con leggeri riflessi verdi; spuma morbida e abbondante, con perlage fine e persistente","Strohgelb mit leichten grünen Reflexen; weicher, reichlicher Schaum mit feiner, anhaltender Perlage"],"Buqetë e pasur dhe e qëndrueshme, me nota frutash dhe lulesh, aroma të lehta majaje dhe kore buke":["Rich, persistent bouquet, with notes of fruit and flowers, light aromas of yeast and bread crust","Bouquet ricco e persistente, con note di frutta e fiori, leggeri sentori di lievito e crosta di pane","Reiches, anhaltendes Bouquet mit Frucht- und Blütennoten, leichten Aromen von Hefe und Brotkruste"],"E plotë, e pastër, me notë frutash të këndshme e të vendosur dhe acidike":["Full, clean, with a pleasant, decisive and acidic fruity note","Pieno, pulito, con una nota fruttata piacevole e decisa e acidula","Voll, sauber, mit angenehmer, entschiedener, säurebetonter Fruchtnote"],"Ideale si aperitiv; e përshtatshme për të gjitha llojet e antipastave dhe për pjata me peshk, oriz, pasta, mish të bardhë, peshq me shije të fortë dhe djathëra të freskët":["Ideal as an aperitif; suitable for all kinds of starters and for dishes with fish, rice, pasta, white meat, strongly flavoured fish and fresh cheeses","Ideale come aperitivo; adatto a tutti i tipi di antipasti e a piatti di pesce, riso, pasta, carni bianche, pesci di gusto deciso e formaggi freschi","Ideal als Aperitif; passt zu allen Vorspeisen und zu Gerichten mit Fisch, Reis, Pasta, hellem Fleisch, kräftigem Fisch und Frischkäse"],"E verdhë kashte me reflekse të buta të arta":["Straw yellow with soft golden reflections","Giallo paglierino con morbidi riflessi dorati","Strohgelb mit sanften goldenen Reflexen"],"Hapet me parfum të hollë dhe elegant, i pasuruar me nuanca të qëndrueshme frutash të bardha dhe nota të buta lulore":["Opens with a fine, elegant perfume, enriched with persistent hints of white fruit and soft floral notes","Si apre con un profumo fine ed elegante, arricchito da persistenti sentori di frutta bianca e morbide note floreali","Öffnet sich mit feinem, elegantem Duft, bereichert durch anhaltende Anklänge weißer Früchte und sanfte Blütennoten"],"E freskët në mënyrë të këndshme, me shumë shije dhe aciditet":["Pleasantly fresh, with plenty of flavour and acidity","Piacevolmente fresco, con molto sapore e acidità","Angenehm frisch, mit viel Geschmack und Säure"],"Ideale me pjata peshku, mish të bardhë dhe djathëra të stazhionuar":["Ideal with fish dishes, white meat and aged cheeses","Ideale con piatti di pesce, carni bianche e formaggi stagionati","Ideal zu Fischgerichten, hellem Fleisch und gereiften Käsen"],"E verdhë kashte me reflekse të lehta jeshile":["Straw yellow with light green reflections","Giallo paglierino con leggeri riflessi verdi","Strohgelb mit leichten grünen Reflexen"],"Hundë e gjerë, me nota frutore dhe lulore, aroma të lehta majaje dhe nota të buta kore buke":["Broad nose, with fruity and floral notes, light aromas of yeast and soft notes of bread crust","Naso ampio, con note fruttate e floreali, leggeri profumi di lievito e morbide note di crosta di pane","Weite Nase mit fruchtigen und blumigen Noten, leichten Hefearomen und sanften Noten von Brotkruste"],"Qiellza mbështillet nga një shije e plotë dhe e pastër, me një notë të theksuar freskie":["The palate is wrapped in a full, clean taste, with a marked note of freshness","Il palato è avvolto da un gusto pieno e pulito, con una spiccata nota di freschezza","Der Gaumen wird von einem vollen, sauberen Geschmack mit ausgeprägter Frische umhüllt"],"Me të gjitha antipastat me peshk, rizoto të shijshme, mish të bardhë dhe djathëra të freskët":["With all fish starters, tasty risottos, white meat and fresh cheeses","Con tutti gli antipasti di pesce, risotti saporiti, carni bianche e formaggi freschi","Zu allen Fischvorspeisen, würzigen Risotti, hellem Fleisch und Frischkäse"],"Rozë e zbehtë (mund të ndryshojë lehtë nga vjelja në vjelje); shkumë e butë dhe e bollshme, me perlazh të imët dhe të qëndrueshëm":["Pale pink (may vary slightly from vintage to vintage); soft, abundant mousse, with fine, persistent perlage","Rosa tenue (può variare leggermente da vendemmia a vendemmia); spuma morbida e abbondante, con perlage fine e persistente","Zartrosa (kann von Jahrgang zu Jahrgang leicht variieren); weicher, reichlicher Schaum mit feiner, anhaltender Perlage"],"Buqetë komplekse, e freskët dhe e gjallë, me nota të theksuara frutash të pyllit dhe frutash të pjekura":["Complex, fresh and lively bouquet, with marked notes of wild berries and ripe fruit","Bouquet complesso, fresco e vivace, con spiccate note di frutti di bosco e frutta matura","Komplexes, frisches und lebendiges Bouquet mit ausgeprägten Noten von Waldbeeren und reifen Früchten"],"E plotë, kadifeje, e butë, me trup të këndshëm":["Full, velvety, soft, with pleasant body","Pieno, vellutato, morbido, di piacevole corpo","Voll, samtig, weich, mit angenehmem Körper"],"Shkëlqyeshëm si aperitiv; me salumi, mish me shije të fortë, salca, djathëra me stazhionim mesatar, krustace; edhe me ëmbëlsira me notë acidike (luleshtrydhe ose boronica) dhe sallatë frutash të freskëta":["Excellent as an aperitif; with cold cuts, strongly flavoured meat, sauces, medium-aged cheeses, shellfish; also with desserts with an acidic note (strawberries or blueberries) and fresh fruit salad","Ottimo come aperitivo; con salumi, carni di gusto deciso, salse, formaggi di media stagionatura, crostacei; anche con dolci dalla nota acidula (fragole o mirtilli) e macedonia di frutta fresca","Ausgezeichnet als Aperitif; zu Wurstwaren, kräftigem Fleisch, Saucen, mittelalten Käsen, Krustentieren; auch zu Desserts mit säuerlicher Note (Erdbeeren oder Heidelbeeren) und frischem Obstsalat"],"E verdhë kashte me reflekse ari të vjetër; shkumë e bollshme dhe e butë, perlazh i hollë dhe i qëndrueshëm.":["Straw yellow with old-gold reflections; abundant, soft mousse, fine and persistent perlage.","Giallo paglierino con riflessi oro antico; spuma abbondante e morbida, perlage fine e persistente.","Strohgelb mit altgoldenen Reflexen; reichlicher, weicher Schaum, feine und anhaltende Perlage."],"Intensive, e qëndrueshme dhe komplekse, me nota kajsie dhe pjeshke të pjekur që shkrihen në përshtypje kremi Chantilly.":["Intense, persistent and complex, with notes of apricot and ripe peach melting into an impression of Chantilly cream.","Intenso, persistente e complesso, con note di albicocca e pesca matura che si fondono in sensazioni di crema chantilly.","Intensiv, anhaltend und komplex, mit Noten von Aprikose und reifem Pfirsich, die in einen Eindruck von Chantilly-Creme übergehen."],"Strukturë elegante, me ekuilibër të jashtëzakonshëm midis peshës së rrumbullakët e të pjekur dhe aciditetit të freskët.":["Elegant structure, with an extraordinary balance between round, ripe weight and fresh acidity.","Struttura elegante, con uno straordinario equilibrio tra peso rotondo e maturo e acidità fresca.","Elegante Struktur mit außergewöhnlichem Gleichgewicht zwischen runder, reifer Fülle und frischer Säure."],"Për gjithë vaktin: antipasta, pjata të para me pasta dhe oriz, mish i lehtë, peshk, edhe djathëra të stagjionuar.":["For the whole meal: starters, first courses of pasta and rice, light meat, fish, even aged cheeses.","Per tutto il pasto: antipasti, primi di pasta e riso, carni leggere, pesce, anche formaggi stagionati.","Für das ganze Menü: Vorspeisen, erste Gänge mit Pasta und Reis, leichtes Fleisch, Fisch, auch gereifte Käse."],"Manaferrë, jamball, erëza; profil frutor":["Blackberry, saffron, spices; fruity profile","Mora, zafferano, spezie; profilo fruttato","Brombeere, Safran, Gewürze; fruchtiges Profil"],"E thatë, me trup mesatar":["Dry, medium-bodied","Secco, di medio corpo","Trocken, mittlerer Körper"],"Gjah, djathëra të stazhionuar, mish i pjekur":["Game, aged cheeses, roast meat","Selvaggina, formaggi stagionati, carni arrosto","Wild, gereifte Käse, Braten"],"Lule të thara, mente, jamball, melasë, anason, erëza kafe, hekur, gjah dhe duhan në qiellzë; është plakur me hijeshi dhe tani është plotësisht e pjekur, me teksturë dhe aciditet Sangiovese për të mbajtur edhe 5–10 vjet":["Dried flowers, mint, saffron, molasses, anise, brown spices, iron, game and tobacco on the palate; it has aged gracefully and is now fully mature, with Sangiovese texture and acidity to hold for another 5–10 years","Fiori secchi, menta, zafferano, melassa, anice, spezie scure, ferro, selvaggina e tabacco al palato; è invecchiato con grazia ed è ora pienamente maturo, con la trama e l'acidità del Sangiovese per reggere altri 5–10 anni","Getrocknete Blumen, Minze, Safran, Melasse, Anis, braune Gewürze, Eisen, Wild und Tabak am Gaumen; er ist anmutig gereift und jetzt voll entwickelt, mit Sangiovese-Textur und -Säure für weitere 5–10 Jahre"],"E kuqe rubin intensive me reflekse granati":["Intense ruby red with garnet reflections","Rosso rubino intenso con riflessi granati","Intensives Rubinrot mit granatroten Reflexen"],"Një erëzim kompleks me një gjurmë elegante vaniljeje":["Complex spiciness with an elegant trace of vanilla","Speziatura complessa con un'elegante traccia di vaniglia","Komplexe Würze mit einer eleganten Spur Vanille"],"Hyrja në gojë është e butë dhe e fuqishme, e ndjekur nga një qendër kadifeje dhe me tul, me përfundim shumë të qëndrueshëm":["The entry is soft and powerful, followed by a velvety, fleshy mid-palate and a very persistent finish","L'ingresso in bocca è morbido e potente, seguito da un centro vellutato e polposo e da un finale molto persistente","Der Auftakt ist weich und kraftvoll, gefolgt von einer samtigen, fleischigen Mitte und einem sehr langen Abgang"],"Veçanërisht e përshtatshme me gjah me qime, i pjekur ose jo, dhe me pjata të rëndësishme me mish të kuq; ose me një pjatë djathërash të stazhionuar":["Especially suited to furred game, roasted or not, and to important red-meat dishes; or to a plate of aged cheeses","Particolarmente adatto alla selvaggina da pelo, arrosto e non, e a importanti piatti di carne rossa; oppure a un piatto di formaggi stagionati","Besonders geeignet zu Haarwild, gebraten oder nicht, und zu großen Gerichten mit rotem Fleisch; oder zu einer Platte gereifter Käse"],"Aroma magjepsëse reçeli delikat ribesi":["Enchanting aromas of delicate currant jam","Profumi incantevoli di delicata confettura di ribes","Bezaubernde Aromen zarter Johannisbeerkonfitüre"],"E kuqe rubin shumë intensive me reflekse granate":["Very intense ruby red with garnet reflections","Rosso rubino molto intenso con riflessi granati","Sehr intensives Rubinrot mit granatroten Reflexen"],"Aromë e gjerë, e pasur dhe komplekse, me shumë nuanca frutash dhe, në sfond, nota vaniljeje, jamballi dhe kakaoje":["Broad, rich and complex aroma, with many nuances of fruit and, in the background, notes of vanilla, saffron and cocoa","Profumo ampio, ricco e complesso, con molte sfumature di frutta e, sullo sfondo, note di vaniglia, zafferano e cacao","Weiter, reicher und komplexer Duft mit vielen Fruchtnuancen und im Hintergrund Noten von Vanille, Safran und Kakao"],"Shije e plotë, e fuqishme, me strukturë të madhe; elegante dhe e qëndrueshme, me ekuilibër harmonik":["Full, powerful taste with great structure; elegant and persistent, with harmonious balance","Gusto pieno, potente, di grande struttura; elegante e persistente, con equilibrio armonico","Voller, kraftvoller Geschmack mit großer Struktur; elegant und anhaltend, mit harmonischer Ausgewogenheit"],"Shoqëron pjata të mëdha me mish; e përshtatshme edhe për mish të pjekur me salca dhe djathëra të stazhionuar":["Accompanies important meat dishes; also suitable for roast meat with sauces and aged cheeses","Accompagna importanti piatti di carne; adatto anche ad arrosti con salse e formaggi stagionati","Begleitet große Fleischgerichte; passt auch zu Braten mit Saucen und gereiften Käsen"],"Fruta deti me guaskë dhe peshk, rizoto me kërpudha ose fruta deti, pasta dhe mish i bardhë; i preferuari: raviola shtëpie me rikota":["Shellfish and fish, risotto with mushrooms or seafood, pasta and white meat; the favourite: homemade ravioli with ricotta","Molluschi e pesce, risotto ai funghi o ai frutti di mare, pasta e carni bianche; il preferito: ravioli fatti in casa con ricotta","Schalentiere und Fisch, Risotto mit Pilzen oder Meeresfrüchten, Pasta und helles Fleisch; der Favorit: hausgemachte Ravioli mit Ricotta"],"Ushqime me shije intensive, shpendë të egra, mish i errët, qengj ose kau i skuqur ose në gjellë":["Intensely flavoured food, wild fowl, dark meat, lamb or beef, pan-fried or stewed","Cibi dal sapore intenso, selvaggina da piuma, carni scure, agnello o manzo, in padella o in umido","Intensiv gewürzte Speisen, Wildgeflügel, dunkles Fleisch, Lamm oder Rind, gebraten oder geschmort"],"Buqetë e gjatë qershie, frutash të zeza dhe një vazhdimësi erëzash, lëkure, katrani dhe dheu të lëruar":["A long bouquet of cherry, black fruit and a continuation of spice, leather, tar and ploughed earth","Un lungo bouquet di ciliegia, frutti neri e un seguito di spezie, cuoio, catrame e terra arata","Ein langes Bouquet von Kirsche, schwarzen Früchten und einer Fortsetzung von Gewürzen, Leder, Teer und gepflügter Erde"],"Ndjesia në gojë është njëkohësisht e strukturuar, e freskët dhe e lëngshme":["The mouthfeel is at once structured, fresh and juicy","La sensazione in bocca è allo stesso tempo strutturata, fresca e succosa","Das Mundgefühl ist zugleich strukturiert, frisch und saftig"],"Mish në skarë, mish kau dhe viçi i pjekur ose i stufuar, gjellë, peshk në skarë dhe pjata me pasta me salca të forta":["Grilled meat, roast or stewed beef and veal, stews, grilled fish and pasta dishes with strong sauces","Carni alla griglia, manzo e vitello arrosto o in umido, stufati, pesce alla griglia e piatti di pasta con sughi decisi","Gegrilltes Fleisch, gebratenes oder geschmortes Rind und Kalb, Eintöpfe, gegrillter Fisch und Pastagerichte mit kräftigen Saucen"],"Kumbulla, çokollatë dhe nuanca lëvoreje portokalli":["Plums, chocolate and hints of orange peel","Prugne, cioccolato e sfumature di scorza d'arancia","Pflaumen, Schokolade und Anklänge von Orangenschale"],"E kuqe e butë; trup mesatar; e freskët në përfundim":["Soft red; medium body; fresh on the finish","Rosso morbido; corpo medio; fresco nel finale","Weicher Rotwein; mittlerer Körper; frisch im Abgang"],"Pasta, mish i bardhë i pjekur ose i zier, shpendë, peshk i pjekur ose në skarë":["Pasta, roast or boiled white meat, poultry, baked or grilled fish","Pasta, carni bianche arrosto o bollite, pollame, pesce al forno o alla griglia","Pasta, gebratenes oder gekochtes helles Fleisch, Geflügel, Fisch aus dem Ofen oder vom Grill"],"Nuanca delikate lulesh të bardha, nota balsamike dhe gjurmë kajsie":["Delicate hints of white flowers, balsamic notes and traces of apricot","Delicate sfumature di fiori bianchi, note balsamiche e tracce di albicocca","Zarte Anklänge weißer Blüten, balsamische Noten und Spuren von Aprikose"],"Mbështjell gjithë qiellzën falë një thelbi të fortë kripor, i shoqëruar nga aciditet i fortë dhe i gjallë":["It envelops the whole palate thanks to a strong saline core, accompanied by firm, lively acidity","Avvolge tutto il palato grazie a un forte nucleo sapido, accompagnato da un'acidità decisa e vivace","Er umhüllt den ganzen Gaumen dank eines kräftigen salzigen Kerns, begleitet von fester, lebendiger Säure"],"Pjata me peshk të zier, në avull ose në skarë":["Dishes with boiled, steamed or grilled fish","Piatti di pesce bollito, al vapore o alla griglia","Gerichte mit gekochtem, gedämpftem oder gegrilltem Fisch"],"Nuanca frutash të pjekura, pjeshkë, mollë të verdha, me nota të freskëta balsamike":["Hints of ripe fruit, peach, yellow apples, with fresh balsamic notes","Sfumature di frutta matura, pesca, mele gialle, con fresche note balsamiche","Anklänge reifer Früchte, Pfirsich, gelbe Äpfel, mit frischen balsamischen Noten"],"Qiellza mbështillet nga një 'pushtim' shijeje, duke ruajtur gjithë freskinë dhe elegancën; aciditet i tendosur dhe karakter kripor":["The palate is wrapped in an 'invasion' of flavour while keeping all its freshness and elegance; taut acidity and saline character","Il palato è avvolto da un''invasione' di sapore, conservando tutta la freschezza e l'eleganza; acidità tesa e carattere sapido","Der Gaumen wird von einer 'Invasion' an Geschmack umhüllt und bewahrt dabei seine ganze Frische und Eleganz; straffe Säure und salziger Charakter"],"Supa dimri, bishtajore dhe pasta me salca të bardha, mish i bardhë, djathë me stazhionim mesatar; edhe peshk dhe fruta deti të gatuara gjatë":["Winter soups, legumes and pasta with white sauces, white meat, medium-aged cheese; also long-cooked fish and seafood","Zuppe invernali, legumi e pasta con sughi bianchi, carni bianche, formaggi di media stagionatura; anche pesce e frutti di mare a lunga cottura","Wintersuppen, Hülsenfrüchte und Pasta mit hellen Saucen, helles Fleisch, mittelalter Käse; auch lange gegarter Fisch und Meeresfrüchte"],"E artë e lehtë, e shndritshme, intensive dhe elegante":["Light gold, bright, intense and elegant","Oro chiaro, brillante, intenso ed elegante","Helles Gold, leuchtend, intensiv und elegant"],"Lule agrumesh, portokall gjaku dhe një nuancë frutash të kuqe, pastaj ftua dhe dardhë e thatë, me nota të errëta minerale dhe fruta të pjekura e të rafinuara":["Citrus blossom, blood orange and a hint of red fruit, then quince and dried pear, with dark mineral notes and ripe, refined fruit","Fiori di agrumi, arancia rossa e un tocco di frutti rossi, poi mela cotogna e pera secca, con note minerali scure e frutta matura e raffinata","Zitrusblüten, Blutorange und ein Hauch roter Früchte, dann Quitte und getrocknete Birne, mit dunklen mineralischen Noten und reifer, feiner Frucht"],"E ekuilibruar dhe delikate, me bërthamë frutore që mbetet elegante; flluska të imëta dhe të ngjeshura, përfundim shumë i gjatë":["Balanced and delicate, with a fruity core that remains elegant; fine, tight bubbles, very long finish","Equilibrato e delicato, con un nucleo fruttato che resta elegante; bollicine fini e fitte, finale lunghissimo","Ausgewogen und zart, mit fruchtigem Kern, der elegant bleibt; feine, dichte Bläschen, sehr langer Abgang"],"E verdhë kashte e ndritshme dhe intensive":["Bright, intense straw yellow","Giallo paglierino brillante e intenso","Leuchtendes, intensives Strohgelb"],"Hapet me nota intensive lajthish të thekura, nugati të hollë dhe çokollate të bardhë, pastaj ananas dhe banane të pasura":["Opens with intense notes of toasted hazelnuts, fine nougat and white chocolate, then rich pineapple and banana","Si apre con note intense di nocciole tostate, torrone fine e cioccolato bianco, poi ananas e banana ricchi","Öffnet sich mit intensiven Noten von gerösteten Haselnüssen, feinem Nougat und weißer Schokolade, dann reiche Ananas und Banane"],"E freskët dhe e qartë në qiellzë, lojë e bukur minerale, shkëlqen, shumë fruta të lëngshme; në fund bie pak shpejt":["Fresh and clear on the palate, a nice mineral play, it sparkles, plenty of juicy fruit; on the finish it fades a little quickly","Fresco e nitido al palato, bel gioco minerale, brilla, molta frutta succosa; nel finale cala un po' presto","Frisch und klar am Gaumen, schönes mineralisches Spiel, es funkelt, viel saftige Frucht; im Abgang lässt es etwas schnell nach"],"E verdhë kashte e shndritshme, perlazh shumë i imët":["Bright straw yellow, very fine perlage","Giallo paglierino brillante, perlage finissimo","Leuchtendes Strohgelb, sehr feine Perlage"],"Hundë shumë e qartë, me arra, biskota me gjalpë dhe brioche":["Very clear nose, with nuts, butter biscuits and brioche","Naso molto nitido, con frutta secca, biscotti al burro e brioche","Sehr klare Nase mit Nüssen, Butterkeksen und Brioche"],"Shumë harmonike në qiellzë, e ekuilibruar, shumë e qartë, përfundim i gjatë, e kripur":["Very harmonious on the palate, balanced, very clear, long finish, salty","Molto armonico al palato, equilibrato, molto nitido, finale lungo, sapido","Sehr harmonisch am Gaumen, ausgewogen, sehr klar, langer Abgang, salzig"],"E verdhë kashte e shndritshme me perlazh të imët":["Bright straw yellow with fine perlage","Giallo paglierino brillante con perlage fine","Leuchtendes Strohgelb mit feiner Perlage"],"Hundë intensive dhe me shumë shtresa: kafe e sapopjekur, lajthi, pak tym, mollë e pjekur dhe ananas":["Intense, multi-layered nose: freshly roasted coffee, hazelnut, a little smoke, baked apple and pineapple","Naso intenso e stratificato: caffè appena tostato, nocciola, un po' di fumo, mela cotta e ananas","Intensive, vielschichtige Nase: frisch gerösteter Kaffee, Haselnuss, etwas Rauch, Bratapfel und Ananas"],"Shumë e pasur në qiellzë, jashtëzakonisht e plotë, strukturë e bollshme, shumë thellësi; agrume të freskëta në përfundim, e gjatë dhe kremoze":["Very rich on the palate, extraordinarily full, ample structure, great depth; fresh citrus on the finish, long and creamy","Molto ricco al palato, straordinariamente pieno, struttura ampia, grande profondità; agrumi freschi nel finale, lungo e cremoso","Sehr reich am Gaumen, außergewöhnlich voll, üppige Struktur, große Tiefe; frische Zitrusfrüchte im Abgang, lang und cremig"],"E verdhë kashte e ndritshme me reflekse të arta, perlazh shumë i imët – i qëndrueshëm, i qetë, i saktë":["Bright straw yellow with golden reflections, very fine perlage – persistent, calm, precise","Giallo paglierino brillante con riflessi dorati, perlage finissimo – persistente, calmo, preciso","Leuchtendes Strohgelb mit goldenen Reflexen, sehr feine Perlage – anhaltend, ruhig, präzise"],"Limon i kandisur, lule bliri, lajthi të thekura, dyllë bletësh, kripë deti, gur i lagur":["Candied lemon, linden blossom, toasted hazelnuts, beeswax, sea salt, wet stone","Limone candito, fiori di tiglio, nocciole tostate, cera d'api, sale marino, pietra bagnata","Kandierte Zitrone, Lindenblüte, geröstete Haselnüsse, Bienenwachs, Meersalz, nasser Stein"],"E mëndafshtë në sulm, por kristal e qartë në strukturë, e mbajtur nga mineralitet i freskët dhe aciditet shumë i mprehtë":["Silky on the attack, but crystal-clear in structure, held up by fresh minerality and very sharp acidity","Setoso all'attacco, ma cristallino nella struttura, sostenuto da una fresca mineralità e da un'acidità molto tagliente","Seidig im Antrunk, aber kristallklar in der Struktur, getragen von frischer Mineralität und sehr straffer Säure"],"Aperitiv, havjar, fruta deti, ëmbëlsira":["Aperitif, caviar, seafood, desserts","Aperitivo, caviale, frutti di mare, dolci","Aperitif, Kaviar, Meeresfrüchte, Desserts"],"E verdhë kashte e pasur dhe e ndritshme":["Rich, bright straw yellow","Giallo paglierino ricco e brillante","Reiches, leuchtendes Strohgelb"],"Hundë aromatike me ananas dhe kivi, lehtësisht e kripur, lëvore limoni, tërheqëse":["Aromatic nose with pineapple and kiwi, slightly salty, lemon peel, attractive","Naso aromatico con ananas e kiwi, leggermente salato, scorza di limone, attraente","Aromatische Nase mit Ananas und Kiwi, leicht salzig, Zitronenschale, ansprechend"],"Shumë e gjallë në qiellzë, përhapet me shkumë të gjallë dhe aciditet të dukshëm; fruta të përmbajtura, koherente dhe e qartë, përfundim i drejtpërdrejtë":["Very lively on the palate, it spreads with lively mousse and noticeable acidity; restrained fruit, consistent and clear, straightforward finish","Molto vivace al palato, si diffonde con una spuma vivace e un'acidità evidente; frutto contenuto, coerente e nitido, finale diretto","Sehr lebendig am Gaumen, breitet sich mit lebhaftem Schaum und spürbarer Säure aus; zurückhaltende Frucht, stimmig und klar, geradliniger Abgang"],"Franciacorta mjaft e strukturuar, me aciditet të freskët e të këndshëm, me nota frutore mbi një bazë të shkëlqyer agrumesh":["A fairly structured Franciacorta, with fresh, pleasant acidity and fruity notes on an excellent citrus base","Franciacorta abbastanza strutturato, con un'acidità fresca e piacevole e note fruttate su un'ottima base agrumata","Ein recht strukturierter Franciacorta mit frischer, angenehmer Säure und fruchtigen Noten auf einer hervorragenden Zitrusbasis"],"Franciacorta e frymëzuar nga delikatesa e rrushit të bardhë nga vjen; kremoze dhe e butë.":["A Franciacorta inspired by the delicacy of the white grapes it comes from; creamy and soft.","Franciacorta ispirato alla delicatezza delle uve bianche da cui nasce; cremoso e morbido.","Ein Franciacorta, inspiriert von der Feinheit der weißen Trauben, aus denen er stammt; cremig und weich."],"Gjellë të ziera ngadalë (brasato), gjah, perime të glazuara":["Slow-cooked dishes (brasato), game, glazed vegetables","Piatti a lunga cottura (brasato), selvaggina, verdure glassate","Langsam geschmorte Gerichte (Brasato), Wild, glasiertes Gemüse"],"E kuqe rubin e errët, që anon nga granati te verërat më të vjetra":["Dark ruby red, leaning towards garnet in older wines","Rosso rubino scuro, che tende al granato nei vini più vecchi","Dunkles Rubinrot, bei älteren Weinen zu Granat neigend"],"Buqetë e fuqishme dhe komplekse":["Powerful, complex bouquet","Bouquet potente e complesso","Kraftvolles, komplexes Bouquet"],"E ngrohtë, e butë dhe mbështjellëse":["Warm, soft and enveloping","Caldo, morbido e avvolgente","Warm, weich und umhüllend"],"Brasato, mish i pjekur dhe gjah":["Brasato, roast meat and game","Brasato, carni arrosto e selvaggina","Brasato, Braten und Wild"],"Ngjyrë karakteristike rozë e shndritshme":["Characteristic bright pink colour","Caratteristico colore rosa brillante","Charakteristische leuchtend rosa Farbe"],"Aroma delikate frutash të vogla pylli, me nuanca shumë të holla erëzore":["Delicate aromas of small wild berries, with very fine spicy hints","Profumi delicati di piccoli frutti di bosco, con finissime sfumature speziate","Zarte Aromen kleiner Waldbeeren mit sehr feinen würzigen Anklängen"],"Ndjesi të lëngshme frutash të vogla të kuqe dhe freski rinore":["Juicy sensations of small red fruits and youthful freshness","Sensazioni succose di piccoli frutti rossi e freschezza giovanile","Saftige Eindrücke kleiner roter Früchte und jugendliche Frische"],"E kuqe rubin":["Ruby red","Rosso rubino","Rubinrot"],"Aroma qershish të tharta dhe të errëta dhe lule shtogu":["Aromas of sour and dark cherries and elderflower","Profumi di amarene e ciliegie scure e fiori di sambuco","Aromen von Sauerkirschen, dunklen Kirschen und Holunderblüten"],"E thatë, e rrumbullakët dhe e balancuar mirë":["Dry, round and well balanced","Secco, rotondo e ben equilibrato","Trocken, rund und gut ausgewogen"],"Mish lope, qengj, viç, shpendë, sallam e proshutë":["Beef, lamb, veal, poultry, salami and ham","Manzo, agnello, vitello, pollame, salame e prosciutto","Rind, Lamm, Kalb, Geflügel, Salami und Schinken"],"Rubin-vjollcë i shndritshëm":["Bright ruby-violet","Rubino-violaceo brillante","Leuchtendes Rubinviolett"],"Hundë shumë e qartë dhe e freskët, manaferra të lëngshme dhe ribes i zi, tone minerale në sfond":["Very clear, fresh nose, juicy blackberries and blackcurrant, mineral tones in the background","Naso molto nitido e fresco, more succose e ribes nero, toni minerali sullo sfondo","Sehr klare, frische Nase, saftige Brombeeren und schwarze Johannisbeere, mineralische Töne im Hintergrund"],"E guximshme dhe me trup të plotë në qiellzë, me shumë tanine kompakte, të rrethuara nga shumë butësi e ëmbël; përkëdhel qiellzën":["Bold and full-bodied on the palate, with plenty of compact tannins wrapped in much sweet softness; it caresses the palate","Audace e corposo al palato, con molti tannini compatti, avvolti da tanta morbidezza dolce; accarezza il palato","Kühn und vollmundig am Gaumen, mit vielen kompakten Tanninen, umhüllt von viel süßer Weichheit; streichelt den Gaumen"],"E kuqe rubin me reflekse granate":["Ruby red with garnet reflections","Rosso rubino con riflessi granati","Rubinrot mit granatroten Reflexen"],"Bie në sy për finesën dhe karakterin e fortë balsamik, me nuanca frutash të zeza të pjekura, piperi dhe sane":["Stands out for its finesse and strong balsamic character, with hints of ripe black fruit, pepper and hay","Si distingue per finezza e spiccato carattere balsamico, con sfumature di frutti neri maturi, pepe e fieno","Besticht durch Finesse und kräftigen balsamischen Charakter,
