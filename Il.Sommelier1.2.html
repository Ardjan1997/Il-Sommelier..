tti rossi maturi, con note di tabacco dolce e vaniglia.","Reich und komplex: Aromen reifer roter Früchte, mit Noten von süßem Tabak und Vanille."],"Ekuilibër i madh, kombinim i fortësisë dhe freskisë së këndshme.":["Great balance, a combination of firmness and pleasant freshness.","Grande equilibrio, combinazione di fermezza e piacevole freschezza.","Große Ausgewogenheit, eine Verbindung aus Festigkeit und angenehmer Frische."],"E kuqe rubin e thellë.":["Deep ruby red.","Rosso rubino profondo.","Tiefes Rubinrot."],"Shprehje aromatike e gjallë dhe intensive: fruta të kuqe, nota agrumesh, nuanca jamballi dhe shkurre mesdhetare.":["A lively, intense aromatic expression: red fruit, citrus notes, hints of saffron and Mediterranean scrub.","Espressione aromatica vivace e intensa: frutti rossi, note agrumate, sfumature di zafferano e macchia mediterranea.","Lebendiger, intensiver aromatischer Ausdruck: rote Früchte, Zitrusnoten, Anklänge von Safran und mediterraner Macchia."],"Mbështjellëse që në gllënjkën e parë, me të gjithë përbërësit të ekuilibruar; tanine të dendura dhe mëndafshi që mbushin gojën me elegancë dhe saktësi.":["Enveloping from the first sip, with all components balanced; dense, silky tannins that fill the mouth with elegance and precision.","Avvolgente fin dal primo sorso, con tutte le componenti in equilibrio; tannini fitti e setosi che riempiono la bocca con eleganza e precisione.","Umhüllend vom ersten Schluck an, mit allen Komponenten im Gleichgewicht; dichte, seidige Tannine, die den Mund mit Eleganz und Präzision füllen."],"Rubin intensiv.":["Intense ruby.","Rubino intenso.","Intensives Rubin."],"Buqetë magjepsëse me nota erëzash dhe balsamike, piper i zi, sherebelë dhe barishte aromatike.":["A captivating bouquet with spicy and balsamic notes, black pepper, sage and aromatic herbs.","Bouquet affascinante con note speziate e balsamiche, pepe nero, salvia ed erbe aromatiche.","Ein bezauberndes Bouquet mit würzigen und balsamischen Noten, schwarzem Pfeffer, Salbei und Kräutern."],"Njëkohësisht e plotë dhe e gjallë, mbush gojën me teksturë taninike të dendur dhe elegante, me përfundim të gjatë dhe shumë të freskët.":["At once full and lively, it fills the mouth with a dense, elegant tannic texture, with a long, very fresh finish.","Allo stesso tempo pieno e vivace, riempie la bocca con una trama tannica fitta ed elegante, con finale lungo e molto fresco.","Zugleich voll und lebendig, füllt den Mund mit dichter, eleganter Tannintextur, mit langem, sehr frischem Abgang."],"Ngjyrë intensive.":["Intense colour.","Colore intenso.","Intensive Farbe."],"Nota klasike frutash të kuqe dhe të zeza, çokollate dhe jamballi, të pasuruara delikat nga nota druri të thekur.":["Classic notes of red and black fruit, chocolate and saffron, delicately enriched by toasted wood notes.","Classiche note di frutti rossi e neri, cioccolato e zafferano, delicatamente arricchite da note di legno tostato.","Klassische Noten roter und schwarzer Früchte, Schokolade und Safran, zart bereichert durch geröstete Holznoten."],"E rrumbullakët dhe e plotë, me teksturë taninike të trashë dhe të dendur, me nota të pasura frutash dhe erëzash.":["Round and full, with a thick, dense tannic texture and rich notes of fruit and spices.","Rotondo e pieno, con una trama tannica spessa e fitta, con ricche note di frutta e spezie.","Rund und voll, mit dicker, dichter Tannintextur und reichen Noten von Frucht und Gewürzen."],"Frutë plotësisht e pjekur me freski dhe kompleksitet të madh, me nota delikate vanilje dhe kakaoje.":["Fully ripe fruit with great freshness and complexity, with delicate notes of vanilla and cocoa.","Frutto pienamente maturo con grande freschezza e complessità, con delicate note di vaniglia e cacao.","Vollreife Frucht mit großer Frische und Komplexität, mit zarten Noten von Vanille und Kakao."],"E plotë dhe e pasur, me dendësi të madhe dhe tanine rrallë të mëndafshta dhe të lëmuara; aroma frutash të zeza të shoqëruara nga një notë e fortë freskie.":["Full and rich, with great density and rarely silky, polished tannins; black-fruit aromas accompanied by a strong note of freshness.","Pieno e ricco, con grande densità e tannini di rara setosità e levigatezza; profumi di frutti neri accompagnati da una forte nota di freschezza.","Voll und reich, mit großer Dichte und selten seidigen, geschliffenen Tanninen; Aromen schwarzer Früchte, begleitet von einer kräftigen Frischenote."],"E errët dhe intensive.":["Dark and intense.","Scuro e intenso.","Dunkel und intensiv."],"E pasur në aroma, me nuanca frutash të kuqe plotësisht të pjekura dhe nota erëzash, balsamike dhe kakaoje.":["Rich in aromas, with hints of fully ripe red fruit and notes of spices, balsamic and cocoa.","Ricco di profumi, con sfumature di frutti rossi pienamente maturi e note di spezie, balsamiche e di cacao.","Reich an Aromen, mit Anklängen vollreifer roter Früchte und Noten von Gewürzen, Balsamischem und Kakao."],"Sensuale dhe e pasur, me dendësi të madhe dhe tanin të gjerë e të lëmuar në mënyrë të përsosur; notat frutore theksohen nga prania delikate e lisit.":["Sensual and rich, with great density and a broad, perfectly polished tannin; the fruity notes are accentuated by the delicate presence of oak.","Sensuale e ricco, con grande densità e un tannino ampio e perfettamente levigato; le note fruttate sono accentuate dalla delicata presenza del rovere.","Sinnlich und reich, mit großer Dichte und weitem, perfekt geschliffenem Tannin; die fruchtigen Noten werden durch die zarte Präsenz der Eiche betont."],"Ngjyrë pothuajse e zezë.":["Almost black colour.","Colore quasi nero.","Fast schwarze Farbe."],"Shprehje e pasur dhe e pjekur frutash të zeza, me nota erëzash dhe jamballi.":["A rich, ripe expression of black fruit, with notes of spices and saffron.","Espressione ricca e matura di frutti neri, con note di spezie e zafferano.","Reicher, reifer Ausdruck schwarzer Früchte, mit Noten von Gewürzen und Safran."],"Bashkon intensitet të madh dhe pjekje të frutave me një ndjenjë të shquar ekuilibri.":["It combines great intensity and ripeness of fruit with a remarkable sense of balance.","Unisce grande intensità e maturità del frutto a uno spiccato senso di equilibrio.","Verbindet große Intensität und Fruchtreife mit einem bemerkenswerten Gefühl für Ausgewogenheit."],"E verdhë kashte e shndritshme, klasike.":["Bright straw yellow, classic.","Giallo paglierino brillante, classico.","Leuchtendes Strohgelb, klassisch."],"Buqetë me intensitet të bukur aromatik: aroma bushi dhe lulesh të bardha, me nota pjeshke të bardhë, sherebeleje dhe barishtesh aromatike.":["A bouquet of lovely aromatic intensity: aromas of boxwood and white flowers, with notes of white peach, sage and aromatic herbs.","Bouquet di bella intensità aromatica: profumi di bosso e fiori bianchi, con note di pesca bianca, salvia ed erbe aromatiche.","Ein Bouquet schöner aromatischer Intensität: Aromen von Buchsbaum und weißen Blüten, mit Noten von weißem Pfirsich, Salbei und Kräutern."],"Mbush gojën me elegancë dhe vendosmëri, me ekuilibër të bukur midis freskisë acide dhe dendësisë; përfundim i gjallë dhe i qëndrueshëm, me notë të këndshme të thartë.":["It fills the mouth with elegance and determination, with a lovely balance between acidic freshness and density; a lively, persistent finish with a pleasant tart note.","Riempie la bocca con eleganza e decisione, con un bell'equilibrio tra freschezza acida e densità; finale vivace e persistente, con una piacevole nota acidula.","Füllt den Mund mit Eleganz und Entschlossenheit, mit schönem Gleichgewicht zwischen säuerlicher Frische und Dichte; lebendiger, anhaltender Abgang mit angenehm säuerlicher Note."],"E kuqe granatë e errët":["Dark garnet red","Rosso granato scuro","Dunkles Granatrot"],"Hundë elegante dhe e rrumbullakët, me nuanca të qëndrueshme frutore, erëzore, balsamike dhe minerale":["Elegant, round nose, with persistent fruity, spicy, balsamic and mineral hints","Naso elegante e rotondo, con sfumature persistenti fruttate, speziate, balsamiche e minerali","Elegante, runde Nase mit anhaltenden fruchtigen, würzigen, balsamischen und mineralischen Anklängen"],"Trup i fortë dhe i ngrohtë, me aroma të fuqishme dhe shije të ekuilibruara; përfundim i gjatë dhe intensiv":["Firm, warm body, with powerful aromas and balanced flavours; a long, intense finish","Corpo deciso e caldo, con profumi potenti e sapori equilibrati; finale lungo e intenso","Fester, warmer Körper mit kraftvollen Aromen und ausgewogenem Geschmack; langer, intensiver Abgang"],"Viç i pjekur, biftek i gatuar në verë Barolo, djathëra të stazhionuar":["Roast veal, steak cooked in Barolo wine, aged cheeses","Vitello arrosto, bistecca cotta nel Barolo, formaggi stagionati","Kalbsbraten, in Barolo gegartes Steak, gereifte Käse"],"E kuqe rubin e qartë":["Clear ruby red","Rosso rubino limpido","Klares Rubinrot"],"Aromë e fuqishme manushaqesh dhe qershish":["Powerful aroma of violets and cherries","Profumo potente di viole e ciliegie","Kräftiger Duft von Veilchen und Kirschen"],"Të pret në qiellzë me nota dheu, qershie dhe manaferre; strukturë e lehtë, qiellzë e thatë, me tanine të lëmuara dhe aciditet gjallërues në përfundim":["It greets the palate with notes of earth, cherry and blackberry; light structure, dry palate, with polished tannins and invigorating acidity on the finish","Accoglie il palato con note di terra, ciliegia e mora; struttura leggera, palato secco, con tannini levigati e acidità vivace nel finale","Begrüßt den Gaumen mit Noten von Erde, Kirsche und Brombeere; leichte Struktur, trockener Gaumen, mit geschliffenen Tanninen und belebender Säure im Abgang"],"Më mirë me pjata të para të lehta dhe me mish të kuq e të bardhë jo pikant":["Best with light first courses and non-spicy red and white meat","Meglio con primi piatti leggeri e carni rosse e bianche non piccanti","Am besten zu leichten ersten Gängen und nicht scharfem rotem und hellem Fleisch"],"Rubin i qartë dhe i pasur me shkëlqim vjollcë":["Clear, rich ruby with violet sheen","Rubino limpido e ricco con lucentezza violacea","Klares, reiches Rubin mit violettem Glanz"],"Hundë intensive me nota qershie të errët dhe boronice; pak çokollatë e zezë në sfond":["Intense nose with notes of dark cherry and blueberry; a little dark chocolate in the background","Naso intenso con note di ciliegia scura e mirtillo; un po' di cioccolato fondente sullo sfondo","Intensive Nase mit Noten dunkler Kirsche und Heidelbeere; etwas dunkle Schokolade im Hintergrund"],"Shumë frut qershie të pjekur në qiellzë, që zhvillohet drejt dhe me vrull të pasur; tanine elastike me kokërr të imët dhe përfundim i lëngshëm":["Lots of ripe cherry fruit on the palate, developing straight and with rich drive; elastic fine-grained tannins and a juicy finish","Molto frutto di ciliegia matura al palato, che si sviluppa diritto e con ricco slancio; tannini elastici a grana fine e finale succoso","Viel reife Kirschfrucht am Gaumen, die sich geradlinig und mit reichem Schwung entwickelt; elastische, feinkörnige Tannine und saftiger Abgang"],"Rubin-granatë i ndritshëm që çelet":["Bright ruby-garnet, lightening at the rim","Rubino-granato brillante che si schiarisce","Leuchtendes Rubin-Granat, am Rand heller werdend"],"Hundë e fortë, me barishte të thata, kokrra trëndafili të egër dhe mjedra, me jehonë shege dhe nenexhiku":["Firm nose, with dried herbs, rose hips and raspberries, with an echo of pomegranate and mint","Naso deciso, con erbe secche, bacche di rosa canina e lamponi, con un'eco di melograno e menta","Feste Nase mit getrockneten Kräutern, Hagebutten und Himbeeren, mit einem Echo von Granatapfel und Minze"],"E qartë dhe e lëngshme në qiellzë, me tanine të ekuilibruara, edhe lehtësisht e kripur, harmonike në përfundimin mesatarisht të gjatë":["Clear and juicy on the palate, with balanced tannins, also lightly salty, harmonious on the medium-long finish","Nitido e succoso al palato, con tannini equilibrati, anche leggermente sapido, armonico nel finale di media lunghezza","Klar und saftig am Gaumen, mit ausgewogenen Tanninen, auch leicht salzig, harmonisch im mittellangen Abgang"],"Rubin i pasur dhe i shndritshëm, me buzë granate":["Rich, bright ruby with a garnet rim","Rubino ricco e brillante, con unghia granata","Reiches, leuchtendes Rubin mit granatfarbenem Rand"],"Hundë me shumë shtresa, aroma intensive kumbulle të freskët dhe mjedre, pak dru kedri në sfond":["Multi-layered nose, intense aromas of fresh plum and raspberry, a little cedar wood in the background","Naso stratificato, intensi profumi di prugna fresca e lampone, un po' di legno di cedro sullo sfondo","Vielschichtige Nase, intensive Aromen frischer Pflaume und Himbeere, etwas Zedernholz im Hintergrund"],"Frut shumë i lëngshëm dhe i gjallë që të kujton qershinë, shpaloset me shumë tanine të forta e të kapshme, përfundim shumë i gjatë, thellësi e mirë":["Very juicy, lively fruit reminiscent of cherry, unfolding with plenty of firm, grippy tannins, a very long finish, good depth","Frutto molto succoso e vivace che ricorda la ciliegia, si distende con molti tannini decisi e grippanti, finale lunghissimo, buona profondità","Sehr saftige, lebendige Frucht, die an Kirsche erinnert, entfaltet sich mit vielen festen, griffigen Tanninen, sehr langer Abgang, gute Tiefe"],"Rubin i qartë":["Clear ruby","Rubino limpido","Klares Rubin"],"Hundë me shumë shtresa dhe intensive, fillimisht pak lëkurë, pastaj tartuf delikat, në fund kumbulla":["Multi-layered, intense nose, at first a little leather, then delicate truffle, finally plums","Naso stratificato e intenso, all'inizio un po' di cuoio, poi tartufo delicato, infine prugne","Vielschichtige, intensive Nase, zunächst etwas Leder, dann zarter Trüffel, zuletzt Pflaumen"],"E lëmuar dhe e hollë në qiellzë, shumë fruta të pjekura e kompakte, shpaloset me tanine elastike e të dendura; rrjedh qetë, me teksturë të bukur në përfundim":["Polished and fine on the palate, lots of ripe, compact fruit, unfolding with elastic, dense tannins; it flows calmly, with a lovely texture on the finish","Levigato e fine al palato, molto frutto maturo e compatto, si distende con tannini elastici e fitti; scorre calmo, con una bella trama nel finale","Geschliffen und fein am Gaumen, viel reife, kompakte Frucht, entfaltet sich mit elastischen, dichten Tanninen; fließt ruhig, mit schöner Textur im Abgang"],"Buqetë elegante dhe lulore me aroma të këndshme jaseminë dhe lule portokalli":["Elegant, floral bouquet with pleasant aromas of jasmine and orange blossom","Bouquet elegante e floreale con piacevoli profumi di gelsomino e zagara","Elegantes, blumiges Bouquet mit angenehmen Aromen von Jasmin und Orangenblüte"],"Shije e freskët dhe agrume, me nuanca grejpfruti dhe maraje të egër":["Fresh, citrusy taste, with hints of grapefruit and wild fennel","Gusto fresco e agrumato, con sfumature di pompelmo e finocchietto selvatico","Frischer, zitrusartiger Geschmack mit Anklängen von Grapefruit und wildem Fenchel"],"Buqetë delikate agrumesh dhe aroma të forta lulore jaseminë dhe lule portokalli":["Delicate citrus bouquet and strong floral aromas of jasmine and orange blossom","Bouquet delicato di agrumi e intensi profumi floreali di gelsomino e zagara","Zartes Zitrusbouquet und kräftige Blütenaromen von Jasmin und Orangenblüte"],"Shije e freskët dhe e ekuilibruar, me nota intensive rrushi, qitroje dhe limoni, të zbutura nga nuanca vaniljeje":["Fresh, balanced taste, with intense notes of grape, citron and lemon, softened by hints of vanilla","Gusto fresco ed equilibrato, con intense note di uva, cedro e limone, ammorbidite da sfumature di vaniglia","Frischer, ausgewogener Geschmack mit intensiven Noten von Traube, Zitronatzitrone und Zitrone, gemildert durch Vanilleanklänge"],"Buqetë intensive jaseminë dhe livando, me nuanca molle jeshile dhe qitroje":["Intense bouquet of jasmine and lavender, with hints of green apple and citron","Bouquet intenso di gelsomino e lavanda, con sfumature di mela verde e cedro","Intensives Bouquet von Jasmin und Lavendel, mit Anklängen von grünem Apfel und Zitronatzitrone"],"Shije e thatë dhe e freskët, me përfundim të gjatë aromatik agrumesh, pjeshkësh të verdha dhe mollësh jeshile":["Dry, fresh taste, with a long aromatic finish of citrus, yellow peaches and green apples","Gusto secco e fresco, con lungo finale aromatico di agrumi, pesche gialle e mele verdi","Trockener, frischer Geschmack mit langem aromatischem Abgang von Zitrus, gelben Pfirsichen und grünen Äpfeln"],"E kuqe e gjallë":["Lively red","Rosso vivace","Lebhaftes Rot"],"Nota frutash të kuqe dhe manushaqeje, të bashkuara me nuanca të këndshme balsamike dhe erëzore":["Notes of red fruit and violet, combined with pleasant balsamic and spicy hints","Note di frutti rossi e viola, unite a piacevoli sfumature balsamiche e speziate","Noten roter Früchte und Veilchen, verbunden mit angenehmen balsamischen und würzigen Anklängen"],"Shumë e butë, me strukturë të mirë, e balancuar dhe e qëndrueshme, me një freski të këndshme":["Very soft, well structured, balanced and persistent, with a pleasant freshness","Molto morbido, ben strutturato, equilibrato e persistente, con una piacevole freschezza","Sehr weich, gut strukturiert, ausgewogen und anhaltend, mit angenehmer Frische"],"Pjata të para dhe të dyta me mish":["First and second courses with meat","Primi e secondi piatti di carne","Erste und zweite Gänge mit Fleisch"],"Nuanca delikate frutash të kuqe dhe shege, të shoqëruara nga nota të ëmbla kumbulle të thatë dhe frutash të kandisura":["Delicate hints of red fruit and pomegranate, accompanied by sweet notes of dried plum and candied fruit","Delicate sfumature di frutti rossi e melograno, accompagnate da dolci note di prugna secca e frutta candita","Zarte Anklänge roter Früchte und Granatapfel, begleitet von süßen Noten von Trockenpflaume und kandierten Früchten"],"E butë, e ngrohtë dhe e qëndrueshme, me tanine të këndshme":["Soft, warm and persistent, with pleasant tannins","Morbido, caldo e persistente, con tannini piacevoli","Weich, warm und anhaltend, mit angenehmen Tanninen"],"Pjata me sallam, djathëra të freskët dhe të stazhionuar, perime tempura krokante; edhe me gjellë të forta dhe pjata rustike":["Plates of cured meats, fresh and aged cheeses, crispy vegetable tempura; also with hearty stews and rustic dishes","Taglieri di salumi, formaggi freschi e stagionati, tempura di verdure croccante; anche con stufati robusti e piatti rustici","Platten mit Wurstwaren, frische und gereifte Käse, knuspriges Gemüsetempura; auch zu kräftigen Eintöpfen und rustikalen Gerichten"],"E kuqe e ndritshme me reflekse vjollcë":["Bright red with violet reflections","Rosso brillante con riflessi violacei","Leuchtendes Rot mit violetten Reflexen"],"Shumë intensive dhe frutore në hundë, me nuanca frutash të kuqe (qershi dhe kumbulla) të ndërthurura me nota lehtësisht erëzore":["Very intense and fruity on the nose, with hints of red fruit (cherries and plums) interwoven with lightly spicy notes","Molto intenso e fruttato al naso, con sfumature di frutti rossi (ciliegie e prugne) intrecciate a note leggermente speziate","Sehr intensiv und fruchtig in der Nase, mit Anklängen roter Früchte (Kirschen und Pflaumen), verwoben mit leicht würzigen Noten"],"E butë, me korrespondencë të përsosur midis shijes dhe aromës, e mbështetur nga tanine të ëmbla dhe qëndrueshmëri e mirë":["Soft, with perfect correspondence between taste and aroma, supported by sweet tannins and good persistence","Morbido, con perfetta corrispondenza tra gusto e profumo, sostenuto da tannini dolci e buona persistenza","Weich, mit perfekter Übereinstimmung von Geschmack und Duft, getragen von süßen Tanninen und guter Länge"],"Ideale si verë aperitivi dhe me pjatë sallamesh e djathërash; befasuese me pjata të para me shije të fortë si pasta alla Norma":["Ideal as an aperitif wine and with a platter of cured meats and cheeses; surprising with strongly flavoured first courses such as pasta alla Norma","Ideale come vino da aperitivo e con un tagliere di salumi e formaggi; sorprendente con primi piatti dal gusto deciso come la pasta alla Norma","Ideal als Aperitifwein und zu einer Platte mit Wurst und Käse; überraschend zu kräftigen ersten Gängen wie Pasta alla Norma"],"E kuqe e ndritshme me reflekse të kuqe të errëta (karmin)":["Bright red with dark red (carmine) reflections","Rosso brillante con riflessi rosso scuro (carminio)","Leuchtendes Rot mit dunkelroten (karminroten) Reflexen"],"Nota të theksuara frutash të kuqe të pjekura, veçanërisht qershi dhe kumbull, të shoqëruara nga nota balsamike dhe erëzore":["Marked notes of ripe red fruit, especially cherry and plum, accompanied by balsamic and spicy notes","Spiccate note di frutti rossi maturi, soprattutto ciliegia e prugna, accompagnate da note balsamiche e speziate","Ausgeprägte Noten reifer roter Früchte, besonders Kirsche und Pflaume, begleitet von balsamischen und würzigen Noten"],"E butë dhe mbështjellëse, me tanine kadifeje dhe përfundim të qëndrueshëm":["Soft and enveloping, with velvety tannins and a persistent finish","Morbido e avvolgente, con tannini vellutati e finale persistente","Weich und umhüllend, mit samtigen Tanninen und anhaltendem Abgang"],"Me një pjatë të mirë me mish, ragù të pasur, djathëra të stazhionuar":["With a good meat dish, rich ragù, aged cheeses","Con un buon piatto di carne, ragù ricchi, formaggi stagionati","Zu einem guten Fleischgericht, reichhaltigem Ragù, gereiften Käsen"],"Buqetë me nota intensive agrumesh dhe aroma të këndshme pjeshke të verdhë, qitroje dhe pjepri":["Bouquet with intense citrus notes and pleasant aromas of yellow peach, citron and melon","Bouquet con intense note agrumate e piacevoli profumi di pesca gialla, cedro e melone","Bouquet mit intensiven Zitrusnoten und angenehmen Aromen von gelbem Pfirsich, Zitronatzitrone und Melone"],"Shije elegante dhe e qëndrueshme me nota pjeshkësh të verdha, pjepri, agrumesh dhe bajamesh":["Elegant, persistent taste with notes of yellow peaches, melon, citrus and almonds","Gusto elegante e persistente con note di pesche gialle, melone, agrumi e mandorle","Eleganter, anhaltender Geschmack mit Noten von gelben Pfirsichen, Melone, Zitrus und Mandeln"],"Buqetë frutore me nota të këndshme pjeshkësh të verdha, pjepri dhe agrumesh":["Fruity bouquet with pleasant notes of yellow peaches, melon and citrus","Bouquet fruttato con piacevoli note di pesche gialle, melone e agrumi","Fruchtiges Bouquet mit angenehmen Noten von gelben Pfirsichen, Melone und Zitrus"],"Shije delikate dhe harmonike me nota të qarta pjeshkësh të verdha":["Delicate, harmonious taste with clear notes of yellow peaches","Gusto delicato e armonico con nette note di pesche gialle","Zarter, harmonischer Geschmack mit klaren Noten gelber Pfirsiche"],"E verdhë e artë, pak a shumë intensive":["Golden yellow, more or less intense","Giallo dorato, più o meno intenso","Goldgelb, mehr oder weniger intensiv"],"Intensive dhe e qëndrueshme, me nuanca fiqsh të thatë, kajsish dhe mjalti akacie":["Intense and persistent, with hints of dried figs, apricots and acacia honey","Intenso e persistente, con sfumature di fichi secchi, albicocche e miele d'acacia","Intensiv und anhaltend, mit Anklängen von getrockneten Feigen, Aprikosen und Akazienhonig"],"E ngrohtë, harmonike, e qëndrueshme":["Warm, harmonious, persistent","Caldo, armonico, persistente","Warm, harmonisch, anhaltend"],"Shoqëruesi ideal për ëmbëlsirat e brumosura më të dashura, si panettone dhe colomba, dhe për nugat":["The ideal partner for the best-loved leavened cakes, such as panettone and colomba, and for nougat","Il compagno ideale dei più amati dolci lievitati, come panettone e colomba, e del torrone","Der ideale Begleiter zu den beliebtesten Hefekuchen wie Panettone und Colomba sowie zu Nougat"],"Ar i ngarkuar":["Deep gold","Oro carico","Kräftiges Gold"],"Intensive dhe komplekse, me nota të theksuara hurmash, fiqsh dhe kajsie të tharë; edhe nuanca mjalti, karrube dhe agrumesh të kandisura":["Intense and complex, with marked notes of dates, figs and dried apricot; also hints of honey, carob and candied citrus","Intenso e complesso, con spiccate note di datteri, fichi e albicocca secca; anche sfumature di miele, carruba e agrumi canditi","Intensiv und komplex, mit ausgeprägten Noten von Datteln, Feigen und getrockneter Aprikose; auch Anklänge von Honig, Johannisbrot und kandierten Zitrusfrüchten"],"E butë, me një kripësi të këndshme që ekuilibron ëmbëlsinë":["Soft, with a pleasant saltiness that balances the sweetness","Morbido, con una piacevole sapidità che equilibra la dolcezza","Weich, mit angenehmer Salzigkeit, die die Süße ausgleicht"],"Tortë me çokollatë me zemër të butë dhe djathëra të stazhionuar":["Chocolate cake with a soft centre and aged cheeses","Tortino al cioccolato dal cuore morbido e formaggi stagionati","Schokoladenküchlein mit weichem Kern und gereifte Käse"],"Buqetë eterike me aroma intensive pjepri dhe nota të lehta mjalti dhe mushmolle japoneze":["Ethereal bouquet with intense aromas of melon and light notes of honey and loquat","Bouquet etereo con intensi profumi di melone e leggere note di miele e nespola","Ätherisches Bouquet mit intensiven Aromen von Melone und leichten Noten von Honig und Japanischer Mispel"],"Shije e ëmbël me përfundim të gjatë, me nota të qarta kajsish dhe dardhash të gatuara":["Sweet taste with a long finish, with clear notes of apricots and cooked pears","Gusto dolce con lungo finale, con nette note di albicocche e pere cotte","Süßer Geschmack mit langem Abgang, mit klaren Noten von Aprikosen und gekochten Birnen"],"Buqetë e këndshme me aromë fiqsh të thatë dhe nuanca manash dhe kumbullash":["Pleasant bouquet with an aroma of dried figs and hints of mulberries and plums","Bouquet piacevole con profumo di fichi secchi e sfumature di more di gelso e prugne","Angenehmes Bouquet mit Duft getrockneter Feigen und Anklängen von Maulbeeren und Pflaumen"],"Shije e rrumbullakët me nota të ëmbla e mjaltore dhe nuanca fiqsh të thatë":["Round taste with sweet, honeyed notes and hints of dried figs","Gusto rotondo con note dolci e mielate e sfumature di fichi secchi","Runder Geschmack mit süßen, honigartigen Noten und Anklängen getrockneter Feigen"],"Hundë intensive frutash të errëta: kumbulla, shumë kokrra shtogu, pak jamballi":["Intense nose of dark fruit: plums, lots of elderberries, a little saffron","Naso intenso di frutti scuri: prugne, molte bacche di sambuco, un po' di zafferano","Intensive Nase dunkler Früchte: Pflaumen, viele Holunderbeeren, etwas Safran"],"E kripur dhe e pasur në fillim dhe në fund, shumë frut kumbulle, por edhe nota pak të gatuara në fund, si karamel; tanine të kapshme":["Salty and rich at the start and the end, lots of plum fruit, but also slightly cooked notes at the end, like caramel; grippy tannins","Sapido e ricco all'inizio e alla fine, molto frutto di prugna, ma anche note leggermente cotte nel finale, come caramello; tannini grippanti","Salzig und reich am Anfang und Ende, viel Pflaumenfrucht, aber am Ende auch leicht gekochte Noten wie Karamell; griffige Tannine"],"Rubin i pasur dhe i shndritshëm me shkëlqim vjollcë":["Rich, bright ruby with violet sheen","Rubino ricco e brillante con lucentezza violacea","Reiches, leuchtendes Rubin mit violettem Glanz"],"Hundë shumë intensive dhe e qartë, male frutash të pjekura kokrrash, por edhe nota të holla erëzore që i japin kompleksitet":["Very intense, clear nose, mountains of ripe berry fruit, but also fine spicy notes that give complexity","Naso molto intenso e nitido, montagne di frutti di bacca maturi, ma anche fini note speziate che danno complessità","Sehr intensive, klare Nase, Berge reifer Beerenfrüchte, aber auch feine würzige Noten, die Komplexität geben"],"Hapet madhështore në qiellzë, shumë frut i plotë, shpaloset me tanin të pranishëm me kokërr të imët; ndërtohet plot, e kripur në fund":["It opens majestically on the palate, lots of full fruit, unfolding with present fine-grained tannin; it builds fully, salty at the end","Si apre maestoso al palato, molto frutto pieno, si distende con tannino presente a grana fine; si costruisce pieno, sapido nel finale","Öffnet sich majestätisch am Gaumen, viel volle Frucht, entfaltet sich mit präsentem, feinkörnigem Tannin; baut sich voll auf, salzig am Ende"],"Hundë e vizatuar hollë me nota mjedrash dhe qershish të errëta, nota të holla lulore":["Finely drawn nose with notes of raspberries and dark cherries, fine floral notes","Naso finemente disegnato con note di lamponi e ciliegie scure, fini note floreali","Fein gezeichnete Nase mit Noten von Himbeeren und dunklen Kirschen, feine Blütennoten"],"E fortë, shpaloset me tanine të kapshme, tregon thellësi të bukur, nota dheu, e kripur":["Firm, unfolding with grippy tannins, showing lovely depth, earthy notes, salty","Deciso, si distende con tannini grippanti, mostra bella profondità, note terrose, sapido","Fest, entfaltet sich mit griffigen Tanninen, zeigt schöne Tiefe, erdige Noten, salzig"],"Ngjyrë limoni e zbehtë e shndritshme":["Bright pale lemon colour","Colore giallo limone tenue e brillante","Leuchtendes blasses Zitronengelb"],"E freskët dhe me intensitet të mirë, me nota delikate bajameje dhe nuanca marzapani":["Fresh and of good intensity, with delicate notes of almond and hints of marzipan","Fresco e di buona intensità, con delicate note di mandorla e sfumature di marzapane","Frisch und von guter Intensität, mit zarten Mandelnoten und Anklängen von Marzipan"],"E freskët, elastike dhe e kripur, me ekuilibër të këndshëm midis përqendrimit të frutave dhe freskisë së gjallë":["Fresh, elastic and savoury, with a pleasant balance between fruit concentration and lively freshness","Fresco, elastico e sapido, con un piacevole equilibrio tra concentrazione del frutto e freschezza vivace","Frisch, elastisch und salzig, mit angenehmem Gleichgewicht zwischen Fruchtkonzentration und lebendiger Frische"],"Antipasta, supa dhe pjata të para, sidomos me perime (asparagus, bizele, kungull i njomë); pjata me vezë, fruta deti dhe peshk ujërash të ëmbla; aperitiv i shkëlqyer me kanape të thjeshta":["Starters, soups and first courses, especially with vegetables (asparagus, peas, courgettes); egg dishes, seafood and freshwater fish; an excellent aperitif with simple canapés","Antipasti, zuppe e primi piatti, soprattutto con verdure (asparagi, piselli, zucchine); piatti a base di uova, frutti di mare e pesce d'acqua dolce; ottimo aperitivo con semplici tartine","Vorspeisen, Suppen und erste Gänge, besonders mit Gemüse (Spargel, Erbsen, Zucchini); Eiergerichte, Meeresfrüchte und Süßwasserfisch; ausgezeichneter Aperitif mit einfachen Kanapees"],"E verdhë kashte intensive, me nuanca të arta":["Intense straw yellow, with golden hues","Giallo paglierino intenso, con sfumature dorate","Intensives Strohgelb mit goldenen Nuancen"],"Të kujton fruta ekzotike, pjeshkë të verdhë dhe kajsi të thatë, arra e bajame, erëza të ëmbla si shafrani":["It recalls exotic fruit, yellow peach and dried apricot, walnuts and almonds, sweet spices such as saffron","Ricorda frutta esotica, pesca gialla e albicocca secca, noci e mandorle, spezie dolci come lo zafferano","Erinnert an exotische Früchte, gelben Pfirsich und getrocknete Aprikose, Walnüsse und Mandeln, süße Gewürze wie Safran"],"E ngrohtë, elegante, e butë dhe e qëndrueshme në qiellzë":["Warm, elegant, soft and persistent on the palate","Caldo, elegante, morbido e persistente al palato","Warm, elegant, weich und anhaltend am Gaumen"],"Pjata komplekse edhe me shije të forta, veçanërisht rizoto ose pasta e freskët; pjata të dyta si salmon, ngjalë ose kaçubeta (scallops), ose mish si viçi i pjekur në qumësht me salcë mustarde":["Complex dishes even with strong flavours, especially risotto or fresh pasta; main courses such as salmon, eel or scallops, or meat such as veal cooked in milk with mustard sauce","Piatti complessi anche dal gusto deciso, soprattutto risotti o pasta fresca; secondi come salmone, anguilla o capesante, o carni come vitello al latte con salsa di senape","Komplexe Gerichte auch mit kräftigem Geschmack, besonders Risotto oder frische Pasta; Hauptgerichte wie Lachs, Aal oder Jakobsmuscheln oder Fleisch wie in Milch gegartes Kalb mit Senfsauce"],"Salume dhe djathëra, mish në skarë; propozime të prodhuesit: skalopina me Marsala, fileto në kore.":["Cured meats and cheeses, grilled meat; producer's suggestions: escalopes with Marsala, fillet in a crust.","Salumi e formaggi, carni alla griglia; proposte del produttore: scaloppine al Marsala, filetto in crosta.","Wurstwaren und Käse, gegrilltes Fleisch; Vorschläge des Erzeugers: Schnitzel mit Marsala, Filet im Teigmantel."],"Linja \"Classici\" e prodhuesit: të gjalla, të freskëta dhe të kthjella; bashkojnë identitetin e varietetit me një mineralitet të këndshëm.":["The producer's \"Classici\" line: lively, fresh and clear; they combine the identity of the variety with a pleasant minerality.","La linea \"Classici\" del produttore: vivaci, freschi e limpidi; uniscono l'identità del vitigno a una piacevole mineralità.","Die Linie \"Classici\" des Erzeugers: lebendig, frisch und klar; sie verbinden die Identität der Rebsorte mit angenehmer Mineralität."],"Mish, pjata të para me pasta me salcë gjahu; propozime: lazanja me ragù lepuri dhe kërpudha, brinjë derri me krem kungulli dhe taleggio, plëndës alla parmigiana.":["Meat, first courses with pasta with game sauce; suggestions: lasagne with rabbit ragù and mushrooms, pork ribs with pumpkin cream and taleggio, tripe alla parmigiana.","Carni, primi piatti di pasta con ragù di selvaggina; proposte: lasagne al ragù di coniglio e funghi, costine di maiale con crema di zucca e taleggio, trippa alla parmigiana.","Fleisch, erste Gänge mit Pasta und Wildragù; Vorschläge: Lasagne mit Kaninchenragù und Pilzen, Schweinerippchen mit Kürbiscreme und Taleggio, Kutteln alla parmigiana."],"Peshk dhe mish; propozime: copa peshku murgu në kore bajamesh, kanelone me krem brokoli e rikota dhe ragù me erëza, skalopina me verë të bardhë dhe majdanoz.":["Fish and meat; suggestions: monkfish morsels in an almond crust, cannelloni with broccoli and ricotta cream and spiced ragù, escalopes with white wine and parsley.","Pesce e carne; proposte: bocconcini di rana pescatrice in crosta di mandorle, cannelloni con crema di broccoli e ricotta e ragù speziato, scaloppine al vino bianco e prezzemolo.","Fisch und Fleisch; Vorschläge: Seeteufelhappen in Mandelkruste, Cannelloni mit Brokkoli-Ricotta-Creme und gewürztem Ragù, Schnitzel mit Weißwein und Petersilie."],"Djathëra të freskët, rizoto, pjata të para me pasta, peshk në furrë; propozime: sallatë e ngrohtë me oktapod dhe patate, levrek me agrume.":["Fresh cheeses, risotto, first courses with pasta, baked fish; suggestions: warm octopus and potato salad, sea bass with citrus.","Formaggi freschi, risotti, primi piatti di pasta, pesce al forno; proposte: insalata tiepida di polpo e patate, branzino agli agrumi.","Frischkäse, Risotto, erste Gänge mit Pasta, Fisch aus dem Ofen; Vorschläge: lauwarmer Oktopus-Kartoffel-Salat, Wolfsbarsch mit Zitrus."],"Peshk, krustace dhe fruta deti, pjata të para me pasta, mish i bardhë; propozime: pulë e marinuar në Chardonnay me patate e karota, krostina me krem thjerrëzash, peshk akrep me trumzë.":["Fish, shellfish and seafood, first courses with pasta, white meat; suggestions: chicken marinated in Chardonnay with potatoes and carrots, crostini with lentil cream, scorpion fish with thyme.","Pesce, crostacei e frutti di mare, primi piatti di pasta, carni bianche; proposte: pollo marinato allo Chardonnay con patate e carote, crostini con crema di lenticchie, scorfano al timo.","Fisch, Krustentiere und Meeresfrüchte, erste Gänge mit Pasta, helles Fleisch; Vorschläge: in Chardonnay marinierte Hähnchen mit Kartoffeln und Karotten, Crostini mit Linsencreme, Drachenkopf mit Thymian."],"Mish i pjekur dhe djathëra të stagjionuar, speck, proshutë, mish në skarë; propozime: hamburger piemontez me aioli të tymosur, rrotull polente me salsiçe dhe kërpudha, medaljone derri me roquefort.":["Roast meat and aged cheeses, speck, ham, grilled meat; suggestions: Piedmontese burger with smoked aioli, polenta roll with sausage and mushrooms, pork medallions with Roquefort.","Carni arrosto e formaggi stagionati, speck, prosciutto, carni alla griglia; proposte: hamburger piemontese con aioli affumicato, rotolo di polenta con salsiccia e funghi, medaglioni di maiale al roquefort.","Braten und gereifte Käse, Speck, Schinken, gegrilltes Fleisch; Vorschläge: piemontesischer Burger mit geräuchertem Aioli, Polentarolle mit Wurst und Pilzen, Schweinemedaillons mit Roquefort."],"Nota delikate lulesh dhe frutash; në disa vjelje dalin nota dredhëzash të egra, pjepri dhe frutash ekzotike.":["Delicate notes of flowers and fruit; in some vintages notes of wild strawberries, melon and exotic fruit emerge.","Delicate note di fiori e frutta; in alcune annate emergono note di fragoline di bosco, melone e frutta esotica.","Zarte Noten von Blumen und Früchten; in manchen Jahrgängen zeigen sich Noten von Walderdbeeren, Melone und exotischen Früchten."],"Rozé dinamike dhe me kripësi, që kujton menjëherë mineralitetin e territorit; freski, lehtësi dhe elegancë.":["A dynamic, savoury rosé that immediately recalls the minerality of the territory; freshness, lightness and elegance.","Rosé dinamico e sapido, che richiama subito la mineralità del territorio; freschezza, leggerezza ed eleganza.","Ein dynamischer, salziger Rosé, der sofort an die Mineralität des Gebiets erinnert; Frische, Leichtigkeit und Eleganz."],"Peshk, krustace dhe fruta deti, rizoto, sallata, pica; propozime: rizoto me krem deti dhe topinambur, pica me bufala, borzilok dhe domate të freskëta, guaska Shën Jakobi gratinë me gjalpë dhe brandy.":["Fish, shellfish and seafood, risotto, salads, pizza; suggestions: risotto with sea urchin cream and Jerusalem artichoke, pizza with buffalo mozzarella, basil and fresh tomatoes, scallops au gratin with butter and brandy.","Pesce, crostacei e frutti di mare, risotti, insalate, pizza; proposte: risotto con crema di ricci di mare e topinambur, pizza con bufala, basilico e pomodori freschi, capesante gratinate al burro e brandy.","Fisch, Krustentiere und Meeresfrüchte, Risotto, Salate, Pizza; Vorschläge: Risotto mit Seeigelcreme und Topinambur, Pizza mit Büffelmozzarella, Basilikum und frischen Tomaten, gratinierte Jakobsmuscheln mit Butter und Brandy."],"Peshk si antipastë, pjata të para me pasta ose pjata kryesore; propozime: bakalar ëmbël-thartë alla ligure, lazanja me shparg, karkaleca në hell me lime e mjaltë, supë-krem me qiqra dhe midhje e guaska.":["Fish as a starter, first courses with pasta or main courses; suggestions: sweet-and-sour salt cod Ligurian style, asparagus lasagne, prawn skewers with lime and honey, chickpea cream soup with mussels and clams.","Pesce come antipasto, primi piatti di pasta o secondi; proposte: baccalà in agrodolce alla ligure, lasagne agli asparagi, spiedini di gamberi al lime e miele, crema di ceci con cozze e vongole.","Fisch als Vorspeise, erste Gänge mit Pasta oder Hauptgerichte; Vorschläge: süßsaurer Stockfisch nach ligurischer Art, Spargellasagne, Garnelenspieße mit Limette und Honig, Kichererbsencremesuppe mit Mies- und Venusmuscheln."],"Sashimi, rizoto, pjata të para me pasta, peshk në furrë; propozime: rizoto me karkaleca, kungulleshka dhe lule kungulli, spageti integrale me rikota, brokoli dhe speck krokant.":["Sashimi, risotto, first courses with pasta, baked fish; suggestions: risotto with prawns, courgettes and courgette flowers, wholemeal spaghetti with ricotta, broccoli and crispy speck.","Sashimi, risotti, primi piatti di pasta, pesce al forno; proposte: risotto con gamberi, zucchine e fiori di zucca, spaghetti integrali con ricotta, broccoli e speck croccante.","Sashimi, Risotto, erste Gänge mit Pasta, Fisch aus dem Ofen; Vorschläge: Risotto mit Garnelen, Zucchini und Zucchiniblüten, Vollkornspaghetti mit Ricotta, Brokkoli und knusprigem Speck."],"E verdhë kashte e shndritshme dhe intensive":["Bright, intense straw yellow","Giallo paglierino brillante e intenso","Leuchtendes, intensives Strohgelb"],"Hundë e qartë dhe e paharrueshme me nota kulumbrie (gooseberry), mango jeshile dhe një nuancë lajthie":["Clear, unforgettable nose with notes of gooseberry, green mango and a hint of hazelnut","Naso nitido e indimenticabile con note di uva spina, mango verde e un tocco di nocciola","Klare, unvergessliche Nase mit Noten von Stachelbeere, grüner Mango und einem Hauch Haselnuss"],"E lëngshme në sulm dhe në qiellzë, frut i hollë, grejpfrut dhe kulumbri, nota delikate druri lisi në përfundim":["Juicy on the attack and on the palate, fine fruit, grapefruit and gooseberry, delicate notes of oak on the finish","Succoso all'attacco e al palato, frutto fine, pompelmo e uva spina, delicate note di rovere nel finale","Saftig im Antrunk und am Gaumen, feine Frucht, Grapefruit und Stachelbeere, zarte Eichennoten im Abgang"],"Nota të qarta kokrrash të errëta dhe erëzash fisnike; aroma të pjekura të integruara mirë plotësojnë paletën":["Clear notes of dark berries and noble spices; well-integrated roasted aromas complete the palette","Note nitide di bacche scure e spezie nobili; aromi tostati ben integrati completano la tavolozza","Klare Noten dunkler Beeren und edler Gewürze; gut eingebundene Röstaromen runden die Palette ab"],"Intensive dhe e lakueshme në qiellzë, pa aciditet të mprehtë dhe me tanine të integruara mirë; përfundim i qëndrueshëm dhe harmonik":["Intense and supple on the palate, without sharp acidity and with well-integrated tannins; a persistent, harmonious finish","Intenso e flessuoso al palato, senza acidità spigolosa e con tannini ben integrati; finale persistente e armonico","Intensiv und geschmeidig am Gaumen, ohne scharfe Säure und mit gut eingebundenen Tanninen; anhaltender, harmonischer Abgang"],"Dalin gradualisht aroma intensive qershie, kakaoje, jodi dhe rozmarine.":["Intense aromas of cherry, cocoa, iodine and rosemary gradually emerge.","Emergono gradualmente intensi profumi di ciliegia, cacao, iodio e rosmarino.","Nach und nach treten intensive Aromen von Kirsche, Kakao, Jod und Rosmarin hervor."],"E kuqe e fuqishme, e ndërtuar mbi një strukturë taninike të dendur dhe të rëndësishme, e ekuilibruar nga alkool i theksuar; shije mirte dhe qershish të konservuara të përziera me lëkurë.":["A powerful red, built on a dense, important tannic structure, balanced by marked alcohol; flavours of myrtle and preserved cherries mixed with leather.","Rosso potente, costruito su una struttura tannica fitta e importante, bilanciata da un alcol marcato; sapori di mirto e ciliegie sotto spirito misti a cuoio.","Ein kraftvoller Roter, gebaut auf einer dichten, gewichtigen Tanninstruktur, ausgeglichen durch ausgeprägten Alkohol; Geschmack von Myrte und eingemachten Kirschen, gemischt mit Leder."],"Ar i lehtë dhe i pasur, i thellë por transparent.":["Light, rich gold, deep but transparent.","Oro chiaro e ricco, profondo ma trasparente.","Helles, reiches Gold, tief, aber transparent."],"Aroma torfe, drithërash dhe të thekura në përfundim.":["Aromas of peat, cereals and toastiness on the finish.","Profumi di torba, cereali e tostatura nel finale.","Aromen von Torf, Getreide und Röstung im Abgang."],"Verë e bardhë e butë, e mbështetur nga një notë freskuese aciditeti në çdo gllënjkë; kontrast i këndshëm midis kremozitetit dhe freskisë krokante; prekje e lehtë minerale; shije pjeshkësh të verdha të pjekura, mjalti akacie dhe marzapani.":["A soft white wine, supported by a refreshing note of acidity in every sip; a pleasant contrast between creaminess and crisp freshness; a light mineral touch; flavours of ripe yellow peaches, acacia honey and marzipan.","Vino bianco morbido, sostenuto da una nota rinfrescante di acidità in ogni sorso; piacevole contrasto tra cremosità e freschezza croccante; leggero tocco minerale; sapori di pesche gialle mature, miele d'acacia e marzapane.","Ein weicher Weißwein, getragen von einer erfrischenden Säurenote in jedem Schluck; angenehmer Kontrast zwischen Cremigkeit und knackiger Frische; leichter mineralischer Hauch; Geschmack von reifen gelben Pfirsichen, Akazienhonig und Marzipan."],"Rubin i ngjeshur.":["Compact ruby.","Rubino compatto.","Kompaktes Rubin."],"Aroma shumë të pasura me lëngun e ëmbël të rrushit të zi të frëngut dhe vjollcës së kandisur, që alternojnë me trumzë dhe livando.":["Very rich aromas with the sweet juice of blackcurrant and candied violet, alternating with thyme and lavender.","Profumi molto ricchi con il succo dolce del ribes nero e della viola candita, che si alternano a timo e lavanda.","Sehr reiche Aromen mit dem süßen Saft schwarzer Johannisbeere und kandierten Veilchen, im Wechsel mit Thymian und Lavendel."],"Strukturë e gjithanshme dhe e gjallë taninesh, forcë shijeje intensive dhe me kripësi.":["A versatile, lively tannic structure, intense flavour strength and saltiness.","Struttura tannica versatile e vivace, intensa forza gustativa e sapidità.","Vielseitige, lebendige Tanninstruktur, intensive Geschmackskraft und Salzigkeit."],"Hapet me nota makjeje mesdhetare dhe aroma algash deti të grumbulluara në plazhet siciliane.":["It opens with notes of Mediterranean maquis and aromas of seaweed piled on Sicilian beaches.","Si apre con note di macchia mediterranea e profumi di alghe ammucchiate sulle spiagge siciliane.","Öffnet sich mit Noten mediterraner Macchia und Aromen von an sizilianischen Stränden aufgehäuften Algen."],"Fruti i pjekur bashkohet mirë me taninin e drurit duke shoqëruar një tanin me teksturë shumë të dendur, por të hapur dhe të matur ndaj strukturës; personalitet kompleks dhe i pagabueshëm.":["The ripe fruit blends well with the wood tannin, accompanying a very dense-textured tannin that is nevertheless open and measured towards the structure; a complex, unmistakable personality.","Il frutto maturo si fonde bene con il tannino del legno accompagnando un tannino di trama molto fitta, ma aperto e misurato rispetto alla struttura; personalità complessa e inconfondibile.","Die reife Frucht verbindet sich gut mit dem Holztannin und begleitet ein sehr dicht texturiertes, aber offenes und zur Struktur maßvolles Tannin; eine komplexe, unverwechselbare Persönlichkeit."],"Granat i shkëlqyeshëm, me buzë pak të zbehtë":["Brilliant garnet, with a slightly pale rim","Granato brillante, con unghia leggermente tenue","Glänzendes Granat mit leicht blassem Rand"],"Shumë aromatike dhe e qartë në hundë, me qershi të kuqe të pjekur intensive dhe mjedër delikate; ftuese":["Very aromatic and clear on the nose, with intense ripe red cherry and delicate raspberry; inviting","Molto aromatico e nitido al naso, con intensa ciliegia rossa matura e delicato lampone; invitante","Sehr aromatisch und klar in der Nase, mit intensiver reifer roter Kirsche und zarter Himbeere; einladend"],"E lëngshme dhe e rrumbullakët në qiellzë, hapet me tanine të theksuara e të endura imët; frutore në mënyrë të mprehtë, e thellë dhe e kripur, me përfundim të gjatë":["Juicy and round on the palate, it opens with marked, finely woven tannins; sharply fruity, deep and salty, with a long finish","Succoso e rotondo al palato, si apre con tannini marcati e finemente intessuti; fruttato in modo incisivo, profondo e sapido, con finale lungo","Saftig und rund am Gaumen, öffnet sich mit ausgeprägten, fein gewobenen Tanninen; prägnant fruchtig, tief und salzig, mit langem Abgang"],"Rubin i shndritshëm me nuancë të lehtë vjollcë":["Bright ruby with a light violet hue","Rubino brillante con leggera sfumatura violacea","Leuchtendes Rubin mit leichtem violettem Schimmer"],"Hundë shumë intensive dhe tërheqëse me aroma frutash të ëmbla kokrrash, shumë qershi, pak karafil në sfond":["Very intense, attractive nose with aromas of sweet berry fruit, lots of cherry, a little clove in the background","Naso molto intenso e attraente con profumi di frutti di bacca dolci, molta ciliegia, un po' di chiodo di garofano sullo sfondo","Sehr intensive, ansprechende Nase mit Aromen süßer Beerenfrüchte, viel Kirsche, etwas Nelke im Hintergrund"],"Shumë frut qershie i hollë dhe i pjekur në sulm, pastaj tanin i fuqishëm me kokërr të imët; e gjatë dhe e butë, presion i plotë në përfundim":["Lots of fine, ripe cherry fruit on the attack, then powerful fine-grained tannin; long and soft, full pressure on the finish","Molto frutto di ciliegia fine e maturo all'attacco, poi tannino potente a grana fine; lungo e morbido, piena spinta nel finale","Viel feine, reife Kirschfrucht im Antrunk, dann kraftvolles feinkörniges Tannin; lang und weich, voller Druck im Abgang"],"E kuqe rubin e errët dhe elegante me buzë që çelet delikat":["Dark, elegant ruby red with a delicately lightening rim","Rosso rubino scuro ed elegante con unghia che si schiarisce delicatamente","Dunkles, elegantes Rubinrot mit zart aufhellendem Rand"],"Hundë e fortë dhe tërheqëse me komponentë të hollë dheu, ribes i zi dhe fruta pylli; lëkurë e hollë, në fund manushaqe të thata":["Firm, attractive nose with fine earthy components, blackcurrant and wild berries; fine leather, finally dried violets","Naso deciso e attraente con fini componenti terrose, ribes nero e frutti di bosco; cuoio fine, infine viole secche","Feste, ansprechende Nase mit feinen erdigen Komponenten, schwarzer Johannisbeere und Waldbeeren; feines Leder, zuletzt getrocknete Veilchen"],"E thurur dendur dhe komplekse në qiellzë, strukturë e konsiderueshme pa qenë e rëndë; lëngshmëri e bukur në fund, tashmë e ekuilibruar dhe e afrueshme":["Densely woven and complex on the palate, considerable structure without being heavy; lovely juiciness at the end, already balanced and approachable","Fittamente intessuto e complesso al palato, struttura notevole senza essere pesante; bella succosità nel finale, già equilibrato e accessibile","Dicht gewoben und komplex am Gaumen, beträchtliche Struktur, ohne schwer zu sein; schöne Saftigkeit am Ende, schon ausgewogen und zugänglich"],"Aroma qershie, kumbulle, hekuri dhe duhani":["Aromas of cherry, plum, iron and tobacco","Profumi di ciliegia, prugna, ferro e tabacco","Aromen von Kirsche, Pflaume, Eisen und Tabak"],"Stil i pasur dhe i lëmuar, me shije qershie, kumbulle, hekuri dhe duhani; e balancuar, me një linjë solide taninesh që e mbështet":["A rich, polished style, with flavours of cherry, plum, iron and tobacco; balanced, with a solid line of tannins supporting it","Stile ricco e levigato, con sapori di ciliegia, prugna, ferro e tabacco; equilibrato, con una solida linea tannica che lo sostiene","Reicher, geschliffener Stil, mit Geschmack von Kirsche, Pflaume, Eisen und Tabak; ausgewogen, mit einer soliden Tanninlinie, die ihn trägt"],"Rubin i errët dhe i shndritshëm me vjollcë":["Dark, bright ruby with violet","Rubino scuro e brillante con violaceo","Dunkles, leuchtendes Rubin mit Violett"],"Hundë shumë bukur e vizatuar me nota manushaqeje dhe qershish të errëta":["A very beautifully drawn nose with notes of violets and dark cherries","Naso molto ben disegnato con note di viola e ciliegie scure","Eine sehr schön gezeichnete Nase mit Noten von Veilchen und dunklen Kirschen"],"E lëngshme dhe e rrumbullakët në qiellzë, shumë qershi, tanin i kapshëm, e fortë; ka ende potencial plakjeje":["Juicy and round on the palate, lots of cherry, grippy tannin, firm; it still has ageing potential","Succoso e rotondo al palato, molta ciliegia, tannino grippante, deciso; ha ancora potenziale di invecchiamento","Saftig und rund am Gaumen, viel Kirsche, griffiges Tannin, fest; hat noch Reifepotenzial"],"E kuqe granatë intensive":["Intense garnet red","Rosso granato intenso","Intensives Granatrot"],"Komplekse, me nota frutash të pyllit, erëzash dhe barishtesh aromatike, të ndjekura nga nuanca duhani të ëmbël, jamballi, piperi të zi dhe nuanca delikate balsamike":["Complex, with notes of wild berries, spices and aromatic herbs, followed by hints of sweet tobacco, saffron, black pepper and delicate balsamic nuances","Complesso, con note di frutti di bosco, spezie ed erbe aromatiche, seguite da sfumature di tabacco dolce, zafferano, pepe nero e delicate note balsamiche","Komplex, mit Noten von Waldbeeren, Gewürzen und Kräutern, gefolgt von Anklängen von süßem Tabak, Safran, schwarzem Pfeffer und zarten balsamischen Nuancen"],"Kadifeje, harmonike dhe elegante, me përfundim të gjatë e të qëndrueshëm":["Velvety, harmonious and elegant, with a long, persistent finish","Vellutato, armonico ed elegante, con finale lungo e persistente","Samtig, harmonisch und elegant, mit langem, anhaltendem Abgang"],"E kuqe rubin mesatare":["Medium ruby red","Rosso rubino medio","Mittleres Rubinrot"],"Delikatisht erëzore në hundë, joshëse dhe e afrueshme; nuanca të lehta pylli, manushaqe, barishte kuzhine, qershi të kuqe":["Delicately spicy on the nose, seductive and approachable; light hints of forest, violet, kitchen herbs, red cherries","Delicatamente speziato al naso, seducente e accessibile; leggere sfumature di bosco, viola, erbe da cucina, ciliegie rosse","Zart würzig in der Nase, verführerisch und zugänglich; leichte Anklänge von Wald, Veilchen, Küchenkräutern, roten Kirschen"],"E ngjeshur në qiellzë; tanine të pranishme, aciditet i balancuar mirë, teksturë gati muskulore":["Compact on the palate; tannins present, well-balanced acidity, an almost muscular texture","Compatto al palato; tannini presenti, acidità ben bilanciata, trama quasi muscolosa","Kompakt am Gaumen; präsente Tannine, gut ausgewogene Säure, fast muskulöse Textur"],"Shkon mirë me lepur (coniglio) ose brasato me polenta":["Goes well with rabbit (coniglio) or brasato with polenta","Si abbina bene al coniglio o al brasato con polenta","Passt gut zu Kaninchen (Coniglio) oder Brasato mit Polenta"],"E kuqe rubin e ndritshme":["Bright ruby red","Rosso rubino brillante","Leuchtendes Rubinrot"],"Bujare, me nota manafer and bitter almond","Fresco e di gusto abbastanza secco; piacevole ritorno fruttato e di mandorla amara","Frisch, mit recht trockenem Geschmack; angenehme Rückkehr von Frucht und Bittermandel"],"E përshtatshme për shumë pjata dhe për çdo rast, në tryezë dhe jashtë vakteve":["Suitable for many dishes and any occasion, at the table and between meals","Adatto a molti piatti e a ogni occasione, a tavola e fuori pasto","Passt zu vielen Gerichten und jedem Anlass, bei Tisch und zwischen den Mahlzeiten"],"Qershi e zezë, erëza pastiçerie, nota dheu":["Black cherry, pastry spices, earthy notes","Ciliegia nera, spezie da pasticceria, note terrose","Schwarzkirsche, Backgewürze, erdige Noten"],"Nota qershish të kuqe, kokrrash të egra dhe erëza delikate":["Notes of red cherries, wild berries and delicate spices","Note di ciliegie rosse, bacche selvatiche e spezie delicate","Noten von roten Kirschen, Wildbeeren und zarten Gewürzen"],"Mish në skarë, qengj në skarë, brinjë qengji":["Grilled meat, grilled lamb, lamb chops","Carni alla griglia, agnello alla griglia, costolette d'agnello","Gegrilltes Fleisch, gegrilltes Lamm, Lammkoteletts"],"Rubin i vendosur me vija vjollcë":["Decisive ruby with violet streaks","Rubino deciso con venature violacee","Entschiedenes Rubin mit violetten Schlieren"],"E mbështjellë nga aroma të gjera dhe me intensitet të madh, me nota vishnje, ribesi të zi, duhani dhe erëzash":["Wrapped in broad aromas of great intensity, with notes of sour cherry, blackcurrant, tobacco and spices","Avvolto da profumi ampi e di grande intensità, con note di amarena, ribes nero, tabacco e spezie","Umhüllt von weiten, sehr intensiven Aromen, mit Noten von Sauerkirsche, schwarzer Johannisbeere, Tabak und Gewürzen"],"Gllënjka, ritmike dhe e mëndafshtë, ka peshë dhe strukturë që aciditeti i mirë i mban në ekuilibër të jashtëzakonshëm; përfundim i ngrohtë, joshës dhe me qëndrueshmëri shumë të gjatë":["The sip, rhythmic and silky, has weight and structure that good acidity keeps in extraordinary balance; a warm, seductive finish with very long persistence","Il sorso, ritmato e setoso, ha peso e struttura che una buona acidità mantiene in straordinario equilibrio; finale caldo, seducente e di lunghissima persistenza","Der rhythmische, seidige Schluck hat Gewicht und Struktur, die eine gute Säure in außergewöhnlicher Balance hält; warmer, verführerischer Abgang mit sehr langer Länge"],"Buqetë e gjerë dhe komplekse, ku manushaqja, trëndafili, qershia dhe ribesi takojnë nuanca elegante erëzash":["A broad, complex bouquet where violet, rose, cherry and currant meet elegant spicy hints","Bouquet ampio e complesso, dove viola, rosa, ciliegia e ribes incontrano eleganti sfumature speziate","Ein weites, komplexes Bouquet, in dem Veilchen, Rose, Kirsche und Johannisbeere auf elegante Gewürzanklänge treffen"],"Në gojë e plotë, e fortë, e ngrohtë dhe bujare, por e ekuilibruar mirë, e freskët dhe e thellë; përfundim i qëndrueshëm me teksturë të mëndafshtë":["Full, firm, warm and generous on the palate, yet well balanced, fresh and deep; a persistent finish with a silky texture","In bocca pieno, deciso, caldo e generoso, ma ben equilibrato, fresco e profondo; finale persistente dalla trama setosa","Am Gaumen voll, fest, warm und großzügig, aber gut ausgewogen, frisch und tief; anhaltender Abgang mit seidiger Textur"],"E strukturuar dhe elegante, me tanine të mëndafshta dhe përfundim të gjatë":["Structured and elegant, with silky tannins and a long finish","Strutturato ed elegante, con tannini setosi e finale lungo","Strukturiert und elegant, mit seidigen Tanninen und langem Abgang"],"E kuqe e errët që shkon drejt së zezës":["Dark red tending towards black","Rosso scuro tendente al nero","Dunkelrot, zu Schwarz neigend"],"Aroma komplekse kafeje, kakaoje dhe frutash të pyllit":["Complex aromas of coffee, cocoa and wild berries","Profumi complessi di caffè, cacao e frutti di bosco","Komplexe Aromen von Kaffee, Kakao und Waldbeeren"],"E rrumbullakët, e fuqishme dhe me trup të plotë":["Round, powerful and full-bodied","Rotondo, potente e di corpo pieno","Rund, kraftvoll und vollmundig"],"Pjata të forta me mish, si fileto kau, të gjitha pjatat me gjah dhe djathëra të stazhionuar të çdo lloji":["Hearty meat dishes such as beef fillet, all game dishes and aged cheeses of every kind","Piatti robusti di carne come filetto di manzo, tutti i piatti di selvaggina e formaggi stagionati di ogni tipo","Kräftige Fleischgerichte wie Rinderfilet, alle Wildgerichte und gereifte Käse aller Art"],"E verdhë-jeshile":["Yellow-green","Giallo-verde","Gelbgrün"],"Aromë e dendur frutash të verdha, kulumbrie, luleje shtogu dhe ribesi të kuq të pjekur":["Dense aroma of yellow fruit, gooseberry, elderflower and ripe red currant","Profumo fitto di frutta gialla, uva spina, fiori di sambuco e ribes rosso maturo","Dichter Duft von gelben Früchten, Stachelbeere, Holunderblüte und reifer roter Johannisbeere"],"Aciditet i freskët, trup i butë dhe plotësi elegante":["Fresh acidity, soft body and elegant fullness","Acidità fresca, corpo morbido ed elegante pienezza","Frische Säure, weicher Körper und elegante Fülle"],"Shoqërim i shkëlqyer për festa ekskluzive dhe raste të veçanta; me peshk të skuqur si levrek oqeani, shojzë ose salmon alpin mbi krem piperi, ose me rizoto perimesh me shije të plotë":["An excellent partner for exclusive celebrations and special occasions; with pan-fried fish such as ocean sea bass, sole or Alpine char on pepper cream, or with a full-flavoured vegetable risotto","Ottimo compagno per feste esclusive e occasioni speciali; con pesce in padella come branzino d'oceano, sogliola o salmerino alpino su crema di peperoni, o con un risotto di verdure saporito","Ein ausgezeichneter Begleiter für exklusive Feste und besondere Anlässe; zu gebratenem Fisch wie Meerwolfsbarsch, Seezunge oder Saibling auf Paprikacreme oder zu einem kräftigen Gemüserisotto"],"E ndritshme dhe transparente, me reflekse jeshile lime dhe të arta që përcjellin freski dhe vitalitet":["Bright and transparent, with lime-green and golden reflections conveying freshness and vitality","Brillante e trasparente, con riflessi verde lime e dorati che trasmettono freschezza e vitalità","Leuchtend und transparent, mit limettengrünen und goldenen Reflexen, die Frische und Vitalität vermitteln"],"E rafinuar dhe komplekse: fruta të lehta me nota ribesi të bardhë dhe kulumbrie, barishte alpine dhe theks të lehtë balsamik":["Refined and complex: light fruit with notes of white currant and gooseberry, Alpine herbs and a light balsamic accent","Raffinato e complesso: frutta leggera con note di ribes bianco e uva spina, erbe alpine e un leggero accento balsamico","Fein und komplex: helle Frucht mit Noten von weißer Johannisbeere und Stachelbeere, Alpenkräutern und leichtem balsamischem Akzent"],"E gjallë dhe harmonike, ndërthur freskinë dhe thellësinë, me qëndrueshmëri aromatike shumë të gjatë":["Lively and harmonious, it combines freshness and depth, with very long aromatic persistence","Vivace e armonico, unisce freschezza e profondità, con lunghissima persistenza aromatica","Lebendig und harmonisch, verbindet Frische und Tiefe, mit sehr langer aromatischer Länge"],"Goca deti dhe fruta deti me guaskë, peshk në salcë gjalpi; edhe rizoto me porcini ose mish i bardhë me kërpudha cardoncelli ose shiitake":["Sea snails and shellfish, fish in butter sauce; also risotto with porcini or white meat with cardoncelli or shiitake mushrooms","Lumache di mare e molluschi, pesce al burro; anche risotto ai porcini o carni bianche con funghi cardoncelli o shiitake","Meeresschnecken und Schalentiere, Fisch in Buttersauce; auch Risotto mit Steinpilzen oder helles Fleisch mit Kräuterseitlingen oder Shiitake"],"E verdhë e ndritshme":["Bright yellow","Giallo brillante","Leuchtendes Gelb"],"Aroma frutash: mollë e pjekur, pjepër dhe banane":["Aromas of fruit: baked apple, melon and banana","Profumi di frutta: mela cotta, melone e banana","Fruchtaromen: Bratapfel, Melone und Banane"],"E butë, e lëngshme dhe e qëndrueshme":["Soft, juicy and persistent","Morbido, succoso e persistente","Weich, saftig und anhaltend"],"Vera e tarracës për mbrëmjet e ngrohta të verës; me antipasta si karpaçio me porcini, ushqime të lehta dhe sallatë të ftohtë me pasta":["The terrace wine for warm summer evenings; with starters such as porcini carpaccio, light snacks and cold pasta salad","Il vino da terrazza per le calde serate estive; con antipasti come carpaccio di porcini, spuntini leggeri e insalata di pasta fredda","Der Terrassenwein für warme Sommerabende; zu Vorspeisen wie Steinpilzcarpaccio, leichten Snacks und kaltem Nudelsalat"],"E verdhë kashte me shkëlqim të lehtë të gjelbër":["Straw yellow with a light green sheen","Giallo paglierino con leggera lucentezza verde","Strohgelb mit leichtem grünem Schimmer"],"Aromë frutash të pjekura dhe nota vanilje të tymosur":["Aroma of ripe fruit and smoky vanilla notes","Profumo di frutta matura e note di vaniglia affumicata","Duft reifer Früchte und rauchige Vanillenoten"],"E fortë, minerale, me notë gjalpi dhe trup të plotë":["Firm, mineral, with a buttery note and full body","Deciso, minerale, con nota burrosa e corpo pieno","Fest, mineralisch, mit Butternote und vollem Körper"],"Pjata të forta si fritto misto (fruta deti të skuqura), raviola me kërpudha porcini në salcë kremi, rizoto me djathë Graukäse dhe djegës; edhe me pulë të pjekur dhe 'Wiener Schnitzel'":["Hearty dishes such as fritto misto (fried seafood), porcini ravioli in cream sauce, risotto with Graukäse and chilli; also with roast chicken and Wiener Schnitzel","Piatti robusti come fritto misto di mare, ravioli ai porcini in salsa di panna, risotto con Graukäse e peperoncino; anche con pollo arrosto e Wiener Schnitzel","Kräftige Gerichte wie Fritto misto (frittierte Meeresfrüchte), Steinpilzravioli in Rahmsauce, Risotto mit Graukäse und Chili; auch zu Brathähnchen und Wiener Schnitzel"],"Nota kulumbrie (gooseberry) të pjekur, agrumesh dhe lulesh të bardha":["Notes of ripe gooseberry, citrus and white flowers","Note di uva spina matura, agrumi e fiori bianchi","Noten reifer Stachelbeere, Zitrus und weißer Blüten"],"Strukturë e lëngshme, aciditet i bukur, përfundim i gjatë me nuanca biskote dhe një ndjesi minerale":["Juicy structure, lovely acidity, a long finish with hints of biscuit and a mineral sensation","Struttura succosa, bella acidità, finale lungo con sfumature di biscotto e una sensazione minerale","Saftige Struktur, schöne Säure, langer Abgang mit Anklängen von Keks und mineralischem Eindruck"],"Fruta ekzotike, kulumbri, banane, shtog, pjeshkë e bardhë dhe ananas i freskët":["Exotic fruit, gooseberry, banana, elder, white peach and fresh pineapple","Frutta esotica, uva spina, banana, sambuco, pesca bianca e ananas fresco","Exotische Früchte, Stachelbeere, Banane, Holunder, weißer Pfirsich und frische Ananas"],"Minerale, aciditet i gjallë, trup i plotë; tregon finesë, elegancë dhe gjatësi":["Mineral, lively acidity, full body; it shows finesse, elegance and length","Minerale, acidità vivace, corpo pieno; mostra finezza, eleganza e lunghezza","Mineralisch, lebendige Säure, voller Körper; zeigt Finesse, Eleganz und Länge"],"Pjata të forta me peshk, variacione të ndryshme rizotoje, mish i bardhë":["Hearty fish dishes, various risotto variations, white meat","Piatti di pesce robusti, varie interpretazioni di risotto, carni bianche","Kräftige Fischgerichte, verschiedene Risotto-Variationen, helles Fleisch"],"Shpreh plotësisht potencialin aromatik të terroirit.":["It fully expresses the aromatic potential of the terroir.","Esprime pienamente il potenziale aromatico del terroir.","Bringt das aromatische Potenzial des Terroirs voll zum Ausdruck."],"Freski aromatike.":["Aromatic freshness.","Freschezza aromatica.","Aromatische Frische."],"Verë komplekse dhe me shije, me aroma të përqendruara.":["A complex, flavourful wine with concentrated aromas.","Vino complesso e saporito, con profumi concentrati.","Ein komplexer, geschmackvoller Wein mit konzentrierten Aromen."],"Pjesa e vjelë herët ruan aciditet të lartë dhe mineralitet; vjelja e vonë jep strukturë dhe trup.":["The early-harvested part keeps high acidity and minerality; the late harvest gives structure and body.","La parte vendemmiata precocemente conserva elevata acidità e mineralità; la vendemmia tardiva dà struttura e corpo.","Der früh gelesene Teil bewahrt hohe Säure und Mineralität; die späte Lese gibt Struktur und Körper."],"Aroma të mprehta; emri kujton aromat lulesh të varietetit.":["Sharp aromas; the name recalls the floral aromas of the variety.","Profumi netti; il nome richiama i profumi floreali del vitigno.","Prägnante Aromen; der Name erinnert an die Blütenaromen der Rebsorte."],"Lehtësi në gojë; e freskët dhe e ekuilibruar.":["Lightness on the palate; fresh and balanced.","Leggerezza in bocca; fresco ed equilibrato.","Leichtigkeit am Gaumen; frisch und ausgewogen."],"Elegancë dhe ekuilibër midis austeritetit dhe plotësisë; strukturë e mirë dhe shumë e pijshme.":["Elegance and balance between austerity and fullness; good structure and very drinkable.","Eleganza ed equilibrio tra austerità e pienezza; buona struttura e grande bevibilità.","Eleganz und Gleichgewicht zwischen Strenge und Fülle; gute Struktur und sehr trinkig."],"Aroma primare intensive, pa tejpjekje.":["Intense primary aromas, without overripeness.","Profumi primari intensi, senza surmaturazione.","Intensive Primäraromen, ohne Überreife."],"Tanine të buta dhe elegante, pa notë pushtuese druri.":["Soft, elegant tannins, without an invasive wood note.","Tannini morbidi ed eleganti, senza nota invadente di legno.","Weiche, elegante Tannine, ohne aufdringliche Holznote."],"E freskët në rini dhe e aftë për jetëgjatësi të pazakontë; ekuilibron aromat terciare me intensitet frutor.":["Fresh in youth and capable of unusual longevity; it balances tertiary aromas with fruity intensity.","Fresco in gioventù e capace di insolita longevità; bilancia i profumi terziari con l'intensità fruttata.","Frisch in der Jugend und zu ungewöhnlicher Langlebigkeit fähig; gleicht tertiäre Aromen mit fruchtiger Intensität aus."],"Verë e fuqishme dhe austere, me një freski tipike të gjerësive të tjera gjeografike.":["A powerful, austere wine, with a freshness typical of other latitudes.","Vino potente e austero, con una freschezza tipica di altre latitudini.","Ein kraftvoller, strenger Wein mit einer Frische, wie man sie aus anderen Breitengraden kennt."],"E verdhë kashte intensivisht e ndritshme, me reflekse të arta":["Intensely bright straw yellow, with golden reflections","Giallo paglierino intensamente luminoso, con riflessi dorati","Intensiv leuchtendes Strohgelb mit goldenen Reflexen"],"Nota ekzotike intensive mango, papaje dhe ananasi, me një nuancë dylli bletësh dhe vaniljeje":["Intense exotic notes of mango, papaya and pineapple, with a hint of beeswax and vanilla","Intense note esotiche di mango, papaya e ananas, con un tocco di cera d'api e vaniglia","Intensive exotische Noten von Mango, Papaya und Ananas, mit einem Hauch Bienenwachs und Vanille"],"Frutore dhe e lëngshme në qiellzë, me teksturë delikate dhe përfundim të gjatë e erëzor":["Fruity and juicy on the palate, with a delicate texture and a long, spicy finish","Fruttato e succoso al palato, con trama delicata e finale lungo e speziato","Fruchtig und saftig am Gaumen, mit zarter Textur und langem, würzigem Abgang"],"Nuk tepron me nota të tejpjekura, por me pjekje të plotë fenolike.":["It does not overdo overripe notes, but has full phenolic ripeness.","Non eccede in note surmature, ma ha piena maturità fenolica.","Übertreibt nicht mit überreifen Noten, hat aber volle phenolische Reife."],"E gjallë, energjike dhe e vrullshme në rini; me plakjen zhvillon një prekje kadifeje pa humbur strukturë dhe shije.":["Lively, energetic and impetuous in youth; with ageing it develops a velvety touch without losing structure and flavour.","Vivace, energico e irruento in gioventù; con l'invecchiamento sviluppa un tocco vellutato senza perdere struttura e sapore.","Lebendig, energisch und ungestüm in der Jugend; mit der Reife entwickelt er einen samtigen Touch, ohne Struktur und Geschmack zu verlieren."],"Mineralitet, nota squfuri dhe, me plakjen, nuanca nafte (petrol).":["Minerality, sulphur notes and, with ageing, hints of petrol.","Mineralità, note sulfuree e, con l'invecchiamento, sfumature di idrocarburi (petrolio).","Mineralität, Schwefelnoten und mit der Reife Anklänge von Petrol."],"Shprehje e \"vertikalitetit\" të verërave të Etnës.":["An expression of the 'verticality' of Etna wines.","Espressione della 'verticalità' dei vini dell'Etna.","Ausdruck der 'Vertikalität' der Ätna-Weine."],"Rubin i pasur me buzë granati":["Rich ruby with a garnet rim","Rubino ricco con unghia granata","Reiches Rubin mit granatfarbenem Rand"],"E freskët dhe e mbledhur në vetvete, me qershi të pjekura, mjedra turshi dhe erëza të holla":["Fresh and self-contained, with ripe cherries, pickled raspberries and fine spices","Fresco e raccolto, con ciliegie mature, lamponi in salamoia e spezie fini","Frisch und in sich ruhend, mit reifen Kirschen, eingelegten Himbeeren und feinen Gewürzen"],"E lëngshme në sulm dhe në qiellzë, ndërtohet shumë mirë, tanine me shumë shtresa, shtrihet në një gamë të gjerë":["Juicy on the attack and on the palate, it builds very well, multi-layered tannins, it spans a wide range","Succoso all'attacco e al palato, si costruisce molto bene, tannini stratificati, si estende su un'ampia gamma","Saftig im Antrunk und am Gaumen, baut sich sehr gut auf, vielschichtige Tannine, spannt einen weiten Bogen"],"Nerello Mascalese i vërtetë në hundë: delikat dhe i pastër":["True Nerello Mascalese on the nose: delicate and clean","Vero Nerello Mascalese al naso: delicato e pulito","Echter Nerello Mascalese in der Nase: zart und sauber"],"Shumë dinamike në gojë, falë freskisë dhe gjallërisë":["Very dynamic on the palate, thanks to its freshness and liveliness","Molto dinamico in bocca, grazie alla freschezza e alla vivacità","Sehr dynamisch am Gaumen, dank Frische und Lebendigkeit"],"E freskët dhe frutore, me nota të theksuara piperi":["Fresh and fruity, with marked peppery notes","Fresco e fruttato, con spiccate note pepate","Frisch und fruchtig, mit ausgeprägten Pfeffernoten"],"Nga antipastat me mish të tharë te pasta, mishi i bardhë dhe i kuq, pjatat me peshk; edhe djathëra të butë dhe të freskët":["From starters with cured meats to pasta, white and red meat, fish dishes; also soft and fresh cheeses","Dagli antipasti di salumi alla pasta, carni bianche e rosse, piatti di pesce; anche formaggi morbidi e freschi","Von Vorspeisen mit Wurstwaren bis zu Pasta, hellem und rotem Fleisch, Fischgerichten; auch weiche und frische Käse"],"Nota frutash të vogla të kuqe, mjedra dhe qershi, me nuanca vanilje, duhani dhe nota delikate sheqeri pambuk.":["Notes of small red fruits, raspberries and cherries, with hints of vanilla, tobacco and delicate notes of candyfloss.","Note di piccoli frutti rossi, lamponi e ciliegie, con sfumature di vaniglia, tabacco e delicate note di zucchero filato.","Noten kleiner roter Früchte, Himbeeren und Kirschen, mit Anklängen von Vanille, Tabak und zarten Noten von Zuckerwatte."],"E ekuilibruar dhe mbushëse; freski e këndshme, qëndrueshmëri e shkëlqyer dhe përfundim i këndshëm frutor.":["Balanced and filling; pleasant freshness, excellent persistence and a pleasant fruity finish.","Equilibrato e appagante; piacevole freschezza, ottima persistenza e piacevole finale fruttato.","Ausgewogen und sättigend; angenehme Frische, ausgezeichnete Länge und angenehmer fruchtiger Abgang."],"Intensitet i jashtëzakonshëm me nota kumbullash, manaferrash dhe ribesi të zi; nuanca duhani dhe rrënje jamballi, mbyllet me nota të lehta nenexhiku dhe portokalli gjaku":["Extraordinary intensity with notes of plums, blackberries and blackcurrant; hints of tobacco and liquorice root, closing with light notes of mint and blood orange","Straordinaria intensità con note di prugne, more e ribes nero; sfumature di tabacco e radice di liquirizia, chiude con leggere note di menta e arancia rossa","Außergewöhnliche Intensität mit Noten von Pflaumen, Brombeeren und schwarzer Johannisbeere; Anklänge von Tabak und Süßholzwurzel, schließt mit leichten Noten von Minze und Blutorange"],"Qiellza bën përshtypje me teksturën taninike të dendur që mbush gojën; thellësi dhe këndshmëri e jashtëzakonshme në mes të qiellzës dhe në përfundim":["The palate impresses with a dense tannic texture that fills the mouth; extraordinary depth and pleasantness in the mid-palate and on the finish","Il palato colpisce per la trama tannica fitta che riempie la bocca; profondità e piacevolezza straordinarie a centro bocca e nel finale","Der Gaumen beeindruckt mit dichter Tannintextur, die den Mund füllt; außergewöhnliche Tiefe und Gefälligkeit in der Mitte und im Abgang"],"Aroma lulore dhe nota frutash me tul të bardhë":["Floral aromas and notes of white-fleshed fruit","Profumi floreali e note di frutta a polpa bianca","Blütenaromen und Noten weißfleischiger Früchte"],"Verë këndshëm harmonike me aciditet të freskët":["A pleasantly harmonious wine with fresh acidity","Vino piacevolmente armonico con acidità fresca","Ein angenehm harmonischer Wein mit frischer Säure"],"Ideale me fruta deti":["Ideal with seafood","Ideale con frutti di mare","Ideal zu Meeresfrüchten"],"Lulore dhe frutore, me nota akacie, agrumesh, pjeshke dhe frutash tropikale":["Floral and fruity, with notes of acacia, citrus, peach and tropical fruit","Floreale e fruttato, con note di acacia, agrumi, pesca e frutta tropicale","Blumig und fruchtig, mit Noten von Akazie, Zitrus, Pfirsich und tropischen Früchten"],"Frutore, e freskët dhe e thatë, me nota aromatike molle dhe dardhe":["Fruity, fresh and dry, with aromatic notes of apple and pear","Fruttato, fresco e secco, con note aromatiche di mela e pera","Fruchtig, frisch und trocken, mit aromatischen Noten von Apfel und Birne"],"Hapet me petale trëndafili, jamballi dhe kakao, me nota të ngrohta erëzash – karafil, piper i errët":["It opens with rose petals, saffron and cocoa, with warm notes of spice – clove, dark pepper","Si apre con petali di rosa, zafferano e cacao, con calde note di spezie – chiodi di garofano, pepe scuro","Öffnet sich mit Rosenblättern, Safran und Kakao, mit warmen Gewürznoten – Nelke, dunkler Pfeffer"],"Me trup të plotë, e lëngshme, me aciditet të gjallë tipik për Barbera, mirë i integruar falë plakjes":["Full-bodied, juicy, with the lively acidity typical of Barbera, well integrated thanks to ageing","Di corpo pieno, succoso, con l'acidità vivace tipica della Barbera, ben integrata grazie all'affinamento","Vollmundig, saftig, mit der für Barbera typischen lebendigen Säure, dank der Reifung gut eingebunden"],"Pasta al ragù, brinjë qengji në skarë, Parmigiano Reggiano ose çokollatë e zezë":["Pasta al ragù, grilled lamb chops, Parmigiano Reggiano or dark chocolate","Pasta al ragù, costolette d'agnello alla griglia, Parmigiano Reggiano o cioccolato fondente","Pasta al ragù, gegrillte Lammkoteletts, Parmigiano Reggiano oder dunkle Schokolade"],"E kuqe rubin e ndritshme me reflekse granate":["Bright ruby red with garnet reflections","Rosso rubino brillante con riflessi granati","Leuchtendes Rubinrot mit granatroten Reflexen"],"Pak e përmbajtur në hundë, pastaj kumbull e tepërpjekur, boronicë e kuqe dhe kardamom, me pas-shije petalesh trëndafili dhe nënpylli":["A little restrained on the nose, then overripe plum, cranberry and cardamom, with an aftertaste of rose petals and undergrowth","Un po' contenuto al naso, poi prugna surmatura, mirtillo rosso e cardamomo, con retrogusto di petali di rosa e sottobosco","Etwas verhalten in der Nase, dann überreife Pflaume, Cranberry und Kardamom, mit Nachgeschmack von Rosenblättern und Waldboden"],"E lëngshme në qiellzë, me tanine të forta dhe shumë fruta të kuqe, e ekuilibruar mirë, pak e gjerë në përfundim":["Juicy on the palate, with firm tannins and lots of red fruit, well balanced, slightly broad on the finish","Succoso al palato, con tannini decisi e molto frutto rosso, ben equilibrato, un po' largo nel finale","Saftig am Gaumen, mit festen Tanninen und viel roter Frucht, gut ausgewogen, etwas breit im Abgang"],"Ngjyrë rubin e thellë":["Deep ruby colour","Colore rubino profondo","Tiefe Rubinfarbe"],"Buqetë kokrrash të kuqe të pjekura si qershi dhe mjedra":["Bouquet of ripe red berries such as cherries and raspberries","Bouquet di bacche rosse mature come ciliegie e lamponi","Bouquet reifer roter Beeren wie Kirschen und Himbeeren"],"Përvojë me trup mesatar dhe aciditet freskues":["A medium-bodied experience with refreshing acidity","Esperienza di medio corpo con acidità rinfrescante","Ein mittelkräftiges Erlebnis mit erfrischender Säure"],"E kuqe rubin me buzë që çelen":["Ruby red with a lightening rim","Rosso rubino con unghia che si schiarisce","Rubinrot mit aufhellendem Rand"],"Kumbull, qershi të pjekura dhe një nuancë barishtesh kuzhine":["Plum, ripe cherries and a hint of kitchen herbs","Prugna, ciliegie mature e un tocco di erbe da cucina","Pflaume, reife Kirschen und ein Hauch Küchenkräuter"],"E lëngshme në qiellzë me fruta të pasura, teksturë të imët dhe një notë delikate të hidhur, e qëndrueshme":["Juicy on the palate with rich fruit, fine texture and a delicate bitter note, persistent","Succoso al palato con frutto ricco, trama fine e una delicata nota amara, persistente","Saftig am Gaumen mit reicher Frucht, feiner Textur und zarter Bitternote, anhaltend"],"Aromë limoni, sherebele dhe xhenxhefili":["Aroma of lemon, sage and ginger","Profumo di limone, salvia e zenzero","Duft von Zitrone, Salbei und Ingwer"],"Shije e freskët, elegante, me ekuilibër të përsosur mes ëmbëlsisë dhe aciditetit":["Fresh, elegant taste, with a perfect balance between sweetness and acidity","Gusto fresco ed elegante, con perfetto equilibrio tra dolcezza e acid
