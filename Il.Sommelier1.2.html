, me rrumbullakësi më të theksuar te lloji i ëmbël":["From dry to sweet (amabile), harmonious, velvety, with more pronounced roundness in the sweet type","Da secco ad amabile, armonico, vellutato, con rotondità più marcata nella tipologia dolce","Von trocken bis lieblich (amabile), harmonisch, samtig, mit ausgeprägterer Rundheit beim süßen Typ"],"Si verë ëmbëlsire me pasticeri të thatë, sidomos ëmbëlsira sieneze – kombinimi i përsosur është me cantucci toskanë; versioni lehtë i ëmbël me djathë të freskët Marzolino, ai më i thatë me raveggiolo":["As a dessert wine with dry pastries, especially Sienese sweets – the perfect match is Tuscan cantucci; the lightly sweet version with fresh Marzolino cheese, the drier one with raveggiolo","Come vino da dessert con pasticceria secca, soprattutto dolci senesi – l'abbinamento perfetto è con i cantucci toscani; la versione leggermente dolce con il Marzolino fresco, quella più secca con il raveggiolo","Als Dessertwein zu trockenem Gebäck, besonders Sieneser Süßigkeiten – die perfekte Kombination sind toskanische Cantucci; die leicht süße Version zu frischem Marzolino, die trockenere zu Raveggiolo"],"Rubin-vjollcë i qartë dhe i pasur":["Clear, rich ruby-violet","Rubino-violaceo limpido e ricco","Klares, reiches Rubinviolett"],"Nota erëzore të theksuara druri kedri, pastaj shumë aroma të pjekura":["Marked spicy notes of cedar wood, then lots of ripe aromas","Spiccate note speziate di legno di cedro, poi molti profumi maturi","Ausgeprägte würzige Noten von Zedernholz, dann viele reife Aromen"],"Rubin-vjollcë i ndritshëm dhe intensiv":["Bright, intense ruby-violet","Rubino-violaceo brillante e intenso","Leuchtendes, intensives Rubinviolett"],"Hundë mrekullisht joshëse, aroma mjedre, manaferre dhe çokollate të hollë":["Wonderfully seductive nose, aromas of raspberry, blackberry and fine chocolate","Naso meravigliosamente seducente, profumi di lampone, mora e cioccolato fine","Wunderbar verführerische Nase, Aromen von Himbeere, Brombeere und feiner Schokolade"],"Fillimisht pak e ngurruar, tregon shumë fruta të lëngshme kokrrash, pastaj ngrihet dhe hapet në shumë shtresa, me tanine me kokërr të imët; ndërtohet gjatë, përfundim i fortë me vrull të bukur":["A little hesitant at first, it shows lots of juicy berry fruit, then rises and opens in many layers, with fine-grained tannins; it builds long, a firm finish with lovely drive","Un po' esitante all'inizio, mostra molto frutto succoso di bacche, poi si alza e si apre in molti strati, con tannini a grana fine; si costruisce a lungo, finale deciso con bella spinta","Anfangs etwas zögerlich, zeigt viel saftige Beerenfrucht, steigt dann an und öffnet sich in vielen Schichten, mit feinkörnigen Tanninen; baut sich lange auf, fester Abgang mit schönem Schwung"],"Rubin i ndritshëm dhe intensiv me shkëlqim të theksuar vjollcë":["Bright, intense ruby with a marked violet sheen","Rubino brillante e intenso con spiccata lucentezza violacea","Leuchtendes, intensives Rubin mit ausgeprägtem violettem Glanz"],"Hapet me nota nënpylli, pak piper dhe galangal, pastaj kumbull, pak grafit":["It opens with notes of undergrowth, a little pepper and galangal, then plum, a little graphite","Si apre con note di sottobosco, un po' di pepe e galanga, poi prugna, un po' di grafite","Öffnet sich mit Noten von Waldboden, etwas Pfeffer und Galgant, dann Pflaume, etwas Graphit"],"Përhapet bukur në qiellzë, tanine të kapshme me kokërr të imët në shumë shtresa; ka vrull dhe lëng, shumë kumbull në përfundim":["It spreads nicely on the palate, grippy fine-grained tannins in many layers; it has drive and juice, lots of plum on the finish","Si distende bene al palato, tannini grippanti a grana fine in molti strati; ha slancio e succo, molta prugna nel finale","Breitet sich schön am Gaumen aus, griffige feinkörnige Tannine in vielen Schichten; hat Schwung und Saft, viel Pflaume im Abgang"],"E kuqe rubin e thellë dhe e shndritshme":["Deep, bright ruby red","Rosso rubino profondo e brillante","Tiefes, leuchtendes Rubinrot"],"Elegante dhe komplekse, me nota vishnjeje, ribesi të zi, reçeli boronice, anasoni, piperi jeshil dhe një nuancë puroje":["Elegant and complex, with notes of sour cherry, blackcurrant, blueberry jam, anise, green pepper and a hint of cigar","Elegante e complesso, con note di amarena, ribes nero, confettura di mirtilli, anice, pepe verde e un tocco di sigaro","Elegant und komplex, mit Noten von Sauerkirsche, schwarzer Johannisbeere, Heidelbeerkonfitüre, Anis, grünem Pfeffer und einem Hauch Zigarre"],"E ngrohtë dhe harmonike, me tanine të dendura dhe me kokërr të imët, të integruara bukur; përfundim i gjatë dhe i qëndrueshëm me rikthim aromatik të rafinuar":["Warm and harmonious, with dense, fine-grained tannins, beautifully integrated; a long, persistent finish with a refined aromatic return","Caldo e armonico, con tannini fitti e a grana fine, ben integrati; finale lungo e persistente con un raffinato ritorno aromatico","Warm und harmonisch, mit dichten, feinkörnigen, schön eingebundenen Tanninen; langer, anhaltender Abgang mit feiner aromatischer Rückkehr"],"Fileto alla Rossini":["Fillet alla Rossini","Filetto alla Rossini","Filet alla Rossini"],"E verdhë e artë me reflekse qelibari":["Golden yellow with amber reflections","Giallo dorato con riflessi ambrati","Goldgelb mit bernsteinfarbenen Reflexen"],"Hapet me buqetë aromatike elegante: hurmë kaki e pjekur, bajame e thekur dhe hurma të thara në diell":["It opens with an elegant aromatic bouquet: ripe persimmon, toasted almond and sun-dried dates","Si apre con un elegante bouquet aromatico: cachi maturi, mandorla tostata e datteri essiccati al sole","Öffnet sich mit einem eleganten aromatischen Bouquet: reife Kaki, geröstete Mandel und sonnengetrocknete Datteln"],"Në qiellzë jep ëmbëlsi të pasur dhe mbështjellëse; e ngrohtë, kadifeje dhe e qëndrueshme":["On the palate it gives a rich, enveloping sweetness; warm, velvety and persistent","Al palato dona una dolcezza ricca e avvolgente; caldo, vellutato e persistente","Am Gaumen gibt er eine reiche, umhüllende Süße; warm, samtig und anhaltend"],"Djathë Fiorino Riserva del Fondatore, kaçubeta me foie gras dhe reçel qepe Santa Fiora":["Fiorino Riserva del Fondatore cheese, chanterelles with foie gras and Santa Fiora onion jam","Formaggio Fiorino Riserva del Fondatore, finferli con foie gras e confettura di cipolle di Santa Fiora","Käse Fiorino Riserva del Fondatore, Pfifferlinge mit Foie gras und Zwiebelkonfitüre aus Santa Fiora"],"Rubin i shndritshëm me granat":["Bright ruby with garnet","Rubino brillante con granato","Leuchtendes Rubin mit Granat"],"Hundë elegante dhe ftuese me luleshtrydhe të pjekura, kokrra të egra, një prekje piperi dhe nota dheu (panxhar)":["Elegant, inviting nose with ripe strawberries, wild berries, a touch of pepper and earthy notes (beetroot)","Naso elegante e invitante con fragole mature, bacche selvatiche, un tocco di pepe e note terrose (barbabietola)","Elegante, einladende Nase mit reifen Erdbeeren, Wildbeeren, einem Hauch Pfeffer und erdigen Noten (Rote Bete)"],"Ndjesi shumë elegante dhe e hollë në qiellzë, shtrihet jashtëzakonisht e lëmuar mbi gjuhë; finesë, qartësi, gjatësi e madhe dhe përfundim vetëm pak tharës":["Very elegant and fine sensation on the palate, it lies extraordinarily smooth on the tongue; finesse, clarity, great length and a only slightly drying finish","Sensazione molto elegante e fine al palato, si distende straordinariamente levigato sulla lingua; finezza, nitidezza, grande lunghezza e finale solo leggermente asciugante","Sehr elegantes, feines Gefühl am Gaumen, liegt außergewöhnlich glatt auf der Zunge; Finesse, Klarheit, große Länge und ein nur leicht trocknender Abgang"],"Ngjyra varion nga rubin deri në rozë":["The colour ranges from ruby to pink","Il colore varia dal rubino al rosa","Die Farbe reicht von Rubin bis Rosa"],"Freski, aromë dhe një lehtësi që është vetëm në dukje":["Freshness, aroma and a lightness that is only apparent","Freschezza, profumo e una leggerezza solo apparente","Frische, Duft und eine Leichtigkeit, die nur scheinbar ist"],"Karakter i drejtpërdrejtë, i gjallë dhe i menjëhershëm, me gaz":["A direct, lively and immediate character, sparkling","Carattere diretto, vivace e immediato, frizzante","Direkter, lebendiger und unmittelbarer Charakter, perlend"],"Shoqëruesi natyral i kuzhinës emiliane: nga lazanja me ragù deri te mishi i zier tradicional":["The natural partner of Emilian cuisine: from lasagne with ragù to traditional boiled meats","Il compagno naturale della cucina emiliana: dalle lasagne al ragù al bollito tradizionale","Der natürliche Begleiter der emilianischen Küche: von Lasagne mit Ragù bis zum traditionellen Bollito"],"E verdhë kashte.":["Straw yellow.","Giallo paglierino.","Strohgelb."],"Delikate dhe e re, me nota frutash të freskëta (pjeshkë, mollë jeshile) dhe në fund një notë elegante lulesh.":["Delicate and young, with notes of fresh fruit (peach, green apple) and finally an elegant floral note.","Delicato e giovane, con note di frutta fresca (pesca, mela verde) e infine un'elegante nota floreale.","Zart und jung, mit Noten frischer Früchte (Pfirsich, grüner Apfel) und zuletzt einer eleganten Blütennote."],"E gjallë, lehtësisht e thartë, me strukturë mesatare dhe përfundim të butë e frutor; pak e ëmbël (amabile).":["Lively, lightly tart, of medium structure with a soft, fruity finish; slightly sweet (amabile).","Vivace, leggermente acidulo, di media struttura e con finale morbido e fruttato; leggermente amabile.","Lebendig, leicht säuerlich, mittlere Struktur mit weichem, fruchtigem Abgang; leicht lieblich (amabile)."],"Karpaçio levreku, oriz i bardhë ose integral me perime, sallatë ruse; pene me domate të freskëta, mocarela dhe borzilok; pasta e ftohtë me ullinj, açuge dhe kaperi; krahë pule të skuqur, caprese, peshk i skuqur i përzier, sallatë nisoaz.":["Sea bass carpaccio, white or brown rice with vegetables, Russian salad; penne with fresh tomatoes, mozzarella and basil; cold pasta with olives, anchovies and capers; fried chicken wings, caprese, mixed fried fish, salade niçoise.","Carpaccio di spigola, riso bianco o integrale con verdure, insalata russa; penne con pomodoro fresco, mozzarella e basilico; pasta fredda con olive, acciughe e capperi; ali di pollo fritte, caprese, frittura mista di pesce, insalata nizzarda.","Wolfsbarsch-Carpaccio, weißer oder Vollkornreis mit Gemüse, russischer Salat; Penne mit frischen Tomaten, Mozzarella und Basilikum; kalte Pasta mit Oliven, Sardellen und Kapern; frittierte Hähnchenflügel, Caprese, gemischter frittierter Fisch, Salade niçoise."],"Rozë salmoni e zbehtë me nuanca të lehta vjollcë.":["Pale salmon pink with light violet hues.","Rosa salmone tenue con leggere sfumature violacee.","Zartes Lachsrosa mit leichten violetten Nuancen."],"E freskët, me lule, delikate dhe e ekuilibruar; kujton trëndafilin, glicinën dhe anasonin yll, me nota vishnjeje dhe mjedre në fund.":["Fresh, floral, delicate and balanced; it recalls rose, wisteria and star anise, with notes of sour cherry and raspberry at the end.","Fresco, floreale, delicato ed equilibrato; ricorda la rosa, il glicine e l'anice stellato, con note di amarena e lampone nel finale.","Frisch, blumig, zart und ausgewogen; erinnert an Rose, Glyzinie und Sternanis, mit Noten von Sauerkirsche und Himbeere am Ende."],"E freskët dhe elegante minerale, me përfundim me kripësi dhe pas-shije të butë.":["Fresh and elegantly mineral, with a savoury finish and soft aftertaste.","Fresco ed elegantemente minerale, con finale sapido e retrogusto morbido.","Frisch und elegant mineralisch, mit salzigem Abgang und weichem Nachgeschmack."],"Antipasta, salume, supa, borsh; edhe byrekë të kripur, mish i bardhë, peshk deti dhe liqeni, peshk i skuqur, omëleta dhe pasta me peshk.":["Starters, cured meats, soups, borscht; also savoury pies, white meat, sea and lake fish, fried fish, omelettes and pasta with fish.","Antipasti, salumi, zuppe, borscht; anche torte salate, carni bianche, pesce di mare e di lago, fritture di pesce, frittate e pasta con il pesce.","Vorspeisen, Wurstwaren, Suppen, Borschtsch; auch herzhafte Kuchen, helles Fleisch, Meeres- und Seefisch, frittierter Fisch, Omeletts und Pasta mit Fisch."],"E kuqe rubin intensive dhe e gjallë.":["Intense, lively ruby red.","Rosso rubino intenso e vivace.","Intensives, lebendiges Rubinrot."],"Nota intensive vishnjesh, frutash të vogla të kuqe, jamballi dhe një sfond mineral me elegancë të rafinuar.":["Intense notes of sour cherries, small red fruits, saffron and a mineral background of refined elegance.","Intense note di amarene, piccoli frutti rossi, zafferano e un fondo minerale di raffinata eleganza.","Intensive Noten von Sauerkirschen, kleinen roten Früchten, Safran und ein mineralischer Hintergrund von feiner Eleganz."],"Që në fillim e fuqishme, me përqendrim të madh dhe një notë të qartë reçeli të kuq.":["Powerful from the start, with great concentration and a clear note of red jam.","Potente fin dall'inizio, con grande concentrazione e una netta nota di confettura rossa.","Von Anfang an kraftvoll, mit großer Konzentration und einer klaren Note roter Konfitüre."],"Pjata të kuzhinës së rafinuar ndërkombëtare: fileto me piper dhe mustardë japoneze, pëllumb me tartuf të zi.":["Dishes of refined international cuisine: fillet with pepper and Japanese mustard, pigeon with black truffle.","Piatti di raffinata cucina internazionale: filetto al pepe e senape giapponese, piccione al tartufo nero.","Gerichte der feinen internationalen Küche: Filet mit Pfeffer und japanischem Senf, Taube mit schwarzem Trüffel."],"E kuqe rubin e thellë me nuanca vjollcë.":["Deep ruby red with violet hues.","Rosso rubino profondo con sfumature violacee.","Tiefes Rubinrot mit violetten Nuancen."],"Intensive, komplekse dhe e gjerë; fruta të kuqe dhe erëza të ëmbla.":["Intense, complex and broad; red fruit and sweet spices.","Intenso, complesso e ampio; frutti rossi e spezie dolci.","Intensiv, komplex und weit; rote Früchte und süße Gewürze."],"Përqendrim i madh, harmonike dhe mbështjellëse, e lëngshme, me tanine të dendura dhe të ngrohta; përfundim shumë i gjatë dhe këndshëm i freskët.":["Great concentration, harmonious and enveloping, juicy, with dense, warm tannins; a very long, pleasantly fresh finish.","Grande concentrazione, armonico e avvolgente, succoso, con tannini fitti e caldi; finale lunghissimo e piacevolmente fresco.","Große Konzentration, harmonisch und umhüllend, saftig, mit dichten, warmen Tanninen; sehr langer, angenehm frischer Abgang."],"Papardele me derr të egër, lepur në salmì, mish i pjekur në hell, djathëra të stagjionuar; edhe biftek Stroganoff, supë Solyanka.":["Pappardelle with wild boar, hare in salmì, spit-roasted meat, aged cheeses; also beef Stroganoff, Solyanka soup.","Pappardelle al cinghiale, lepre in salmì, carni allo spiedo, formaggi stagionati; anche manzo alla Stroganoff, zuppa Solyanka.","Pappardelle mit Wildschwein, Hase in Salmì, Fleisch vom Spieß, gereifte Käse; auch Rinder-Stroganoff, Soljanka."],"Topaz intensiv dhe i shndritshëm.":["Intense, bright topaz.","Topazio intenso e brillante.","Intensives, leuchtendes Topas."],"Kujton lule portokalli, me aromë delikate bajameje dhe frutash të kandisura.":["It recalls orange blossom, with a delicate aroma of almond and candied fruit.","Ricorda i fiori d'arancio, con un delicato profumo di mandorla e frutta candita.","Erinnert an Orangenblüten, mit zartem Duft von Mandel und kandierten Früchten."],"E butë në gojë, e ngrohtë dhe delikatisht alkoolike; përfundim shumë i gjatë me nota frutash të bardha të thata, kajsie dhe fiku.":["Soft on the palate, warm and delicately alcoholic; a very long finish with notes of dried white fruit, apricot and fig.","Morbido in bocca, caldo e delicatamente alcolico; finale lunghissimo con note di frutta bianca secca, albicocca e fico.","Weich am Gaumen, warm und zart alkoholisch; sehr langer Abgang mit Noten getrockneter heller Früchte, Aprikose und Feige."],"Dardhë dhe rikota në brumë petë me salcë kremi, ëmbëlsirë umbriane me bajame, ëmbëlsira me krem; edhe tarta dhe biskota të thata.":["Pear and ricotta in pastry with cream sauce, Umbrian almond cake, cream desserts; also tarts and dry biscuits.","Pera e ricotta in pasta sfoglia con salsa alla crema, dolce umbro alle mandorle, dolci al cucchiaio; anche crostate e biscotti secchi.","Birne und Ricotta im Teig mit Vanillesauce, umbrischer Mandelkuchen, Cremedesserts; auch Tartes und trockene Kekse."],"Aroma të përqendruara manaferrash të pjekura dhe nuanca barishtesh të shijshme.":["Concentrated aromas of ripe blackberries and hints of savoury herbs.","Profumi concentrati di more mature e sfumature di erbe saporite.","Konzentrierte Aromen reifer Brombeeren und Anklänge würziger Kräuter."],"E thatë, me tanine me kokërr të imët dhe teksturë mëndafshi.":["Dry, with fine-grained tannins and a silky texture.","Secco, con tannini a grana fine e trama setosa.","Trocken, mit feinkörnigen Tanninen und seidiger Textur."],"Pjata të para të forta si ragù me mish dhe mish i pjekur ose në skarë.":["Hearty first courses such as meat ragù and roast or grilled meat.","Primi piatti robusti come ragù di carne e carni arrosto o alla griglia.","Kräftige erste Gänge wie Fleischragù sowie Braten oder Gegrilltes."],"E kuqe rubin e pasur me reflekse purpur.":["Rich ruby red with purple reflections.","Rosso rubino ricco con riflessi porpora.","Reiches Rubinrot mit purpurnen Reflexen."],"Aroma intensive frutash të kuqe, boronicash dhe mjedrash, me nota erëzash kakaoje dhe kafeje.":["Intense aromas of red fruit, blueberries and raspberries, with spicy notes of cocoa and coffee.","Profumi intensi di frutti rossi, mirtilli e lamponi, con note speziate di cacao e caffè.","Intensive Aromen von roten Früchten, Heidelbeeren und Himbeeren, mit würzigen Noten von Kakao und Kaffee."],"Shprehje e ekuilibruar taninesh me kokërr të imët; me trup të plotë, me shije dhe elegancë.":["A balanced expression of fine-grained tannins; full-bodied, flavourful and elegant.","Espressione equilibrata di tannini a grana fine; di corpo pieno, saporito ed elegante.","Ausgewogener Ausdruck feinkörniger Tannine; vollmundig, geschmackvoll und elegant."],"Mish i kuq në skarë ose i pjekur, ose djathëra të stagjionuar.":["Grilled or roast red meat, or aged cheeses.","Carni rosse alla griglia o arrosto, oppure formaggi stagionati.","Gegrilltes oder gebratenes rotes Fleisch oder gereifte Käse."],"Aroma intensive por elegante frutash të kuqe dhe jamballi të zi.":["Intense yet elegant aromas of red fruit and black saffron.","Profumi intensi ma eleganti di frutti rossi e zafferano nero.","Intensive, aber elegante Aromen von roten Früchten und schwarzem Safran."],"E thatë dhe me trup të plotë, me tanine me kokërr të imët shumë të integruara.":["Dry and full-bodied, with very well-integrated fine-grained tannins.","Secco e di corpo pieno, con tannini a grana fine molto ben integrati.","Trocken und vollmundig, mit sehr gut eingebundenen feinkörnigen Tanninen."],"Mish i kuq në skarë, i stufuar, në tavë ose i pjekur.":["Red meat grilled, stewed, in casserole or roasted.","Carni rosse alla griglia, in umido, in casseruola o arrosto.","Rotes Fleisch vom Grill, geschmort, aus der Kasserolle oder gebraten."],"E verdhë e zbehtë.":["Pale yellow.","Giallo tenue.","Blassgelb."],"Nota shumë aromatike, besnike ndaj varietetit: rrush, mjaltë dhe lule portokalli.":["Very aromatic notes, true to the variety: grape, honey and orange blossom.","Note molto aromatiche, fedeli al vitigno: uva, miele e fiori d'arancio.","Sehr aromatische, sortentypische Noten: Traube, Honig und Orangenblüte."],"E ëmbël, e ekuilibruar dhe me trup të plotë, por njëkohësisht e freskët dhe e gjallë, me përfundim të gjatë dhe të qëndrueshëm.":["Sweet, balanced and full-bodied, yet at the same time fresh and lively, with a long, persistent finish.","Dolce, equilibrato e di corpo pieno, ma allo stesso tempo fresco e vivace, con finale lungo e persistente.","Süß, ausgewogen und vollmundig, zugleich aber frisch und lebendig, mit langem, anhaltendem Abgang."],"Pastiçeri, tarta me fruta, ëmbëlsira shtëpie dhe ëmbëlsira të pasura me krem.":["Pastries, fruit tarts, homemade cakes and rich cream desserts.","Pasticceria, crostate di frutta, dolci casalinghi e dolci ricchi alla crema.","Gebäck, Obsttartes, hausgemachte Kuchen und reichhaltige Cremedesserts."],"E artë e shndritshme.":["Bright gold.","Oro brillante.","Leuchtendes Gold."],"Aroma intensive mjalti, lulesh, vanilje dhe një prekje erëzash elegante druri.":["Intense aromas of honey, flowers, vanilla and a touch of elegant wood spice.","Profumi intensi di miele, fiori, vaniglia e un tocco di elegante speziatura del legno.","Intensive Aromen von Honig, Blumen, Vanille und einem Hauch eleganter Holzwürze."],"E ëmbël dhe me trup të plotë, me ekuilibër të shkëlqyer midis aciditetit dhe sheqerit; përfundim i qartë dhe i gjallë, me qëndrueshmëri të mirë.":["Sweet and full-bodied, with an excellent balance between acidity and sugar; a clear, lively finish with good persistence.","Dolce e di corpo pieno, con ottimo equilibrio tra acidità e zucchero; finale netto e vivace, di buona persistenza.","Süß und vollmundig, mit ausgezeichnetem Gleichgewicht zwischen Säure und Zucker; klarer, lebendiger Abgang mit guter Länge."],"Pastiçeri e vogël ose ëmbëlsira vendase si \"fregolota\"; djathëra mesatarisht ose shumë të stagjionuar si Asiago Stravecchio, ose djathëra blu intensivë.":["Petits fours or local sweets such as 'fregolota'; medium or long-aged cheeses such as Asiago Stravecchio, or intense blue cheeses.","Piccola pasticceria o dolci locali come la 'fregolota'; formaggi di media o lunga stagionatura come l'Asiago Stravecchio, o erborinati intensi.","Feingebäck oder lokale Süßigkeiten wie 'Fregolota'; mittel oder lange gereifte Käse wie Asiago Stravecchio oder intensive Blauschimmelkäse."],"Ar i vjetër, i thellë dhe i shndritshëm.":["Old gold, deep and bright.","Oro antico, profondo e brillante.","Altgold, tief und leuchtend."],"Buqetë e madhe, intensive dhe me erëza: mjaltë, fruta të thata, rrush i thatë dhe notë minerale stralli.":["A large, intense and spicy bouquet: honey, dried fruit, raisins and a mineral flinty note.","Bouquet ampio, intenso e speziato: miele, frutta secca, uvetta e una nota minerale di pietra focaia.","Ein großes, intensives und würziges Bouquet: Honig, Trockenfrüchte, Rosinen und eine mineralische Feuersteinnote."],"E ëmbël por elegante; me trup të plotë, elegante dhe madhështore.":["Sweet but elegant; full-bodied, elegant and majestic.","Dolce ma elegante; di corpo pieno, elegante e maestoso.","Süß, aber elegant; vollmundig, elegant und majestätisch."],"Foie gras.":["Foie gras.","Foie gras.","Foie gras."],"Ngjyrë e verdhë e artë":["Golden yellow colour","Colore giallo dorato","Goldgelbe Farbe"],"Aromë intensive dhe frutore, edhe me nuanca vaniljeje":["Intense, fruity aroma, also with hints of vanilla","Profumo intenso e fruttato, anche con sfumature di vaniglia","Intensiver, fruchtiger Duft, auch mit Vanilleanklängen"],"E ëmbël, kadifeje, e rrumbullakët, me nuanca të mundshme vaniljeje":["Sweet, velvety, round, with possible hints of vanilla","Dolce, vellutato, rotondo, con eventuali sfumature di vaniglia","Süß, samtig, rund, mit möglichen Vanilleanklängen"],"Nota intensive frutore qershie dhe rrush frëngu të kuq.":["Intense fruity notes of cherry and red currant.","Intense note fruttate di ciliegia e ribes rosso.","Intensive fruchtige Noten von Kirsche und roter Johannisbeere."],"Me kripësi, me një venë të shijshme aciditeti dhe tanine mëndafshi e të lëmuara.":["Savoury, with a tasty vein of acidity and silky, polished tannins.","Sapido, con una gustosa vena acida e tannini setosi e levigati.","Salzig, mit köstlicher Säureader und seidigen, geschliffenen Tanninen."],"Dominojnë nota intensive frutore qershie dhe rrush frëngu të kuq, me nuanca të integruara vjollce dhe një prekje të lehtë lisi të thekur.":["Intense fruity notes of cherry and red currant dominate, with integrated hints of violet and a light touch of toasted oak.","Dominano intense note fruttate di ciliegia e ribes rosso, con sfumature integrate di viola e un leggero tocco di rovere tostato.","Intensive fruchtige Noten von Kirsche und roter Johannisbeere dominieren, mit eingebundenen Veilchenanklängen und einem leichten Hauch gerösteter Eiche."],"E freskët dhe me kripësi, me tanine të buta; përfundimi dhe pas-shija kujtojnë ndjesitë e hundës.":["Fresh and savoury, with soft tannins; the finish and aftertaste recall the sensations of the nose.","Fresco e sapido, con tannini morbidi; finale e retrogusto richiamano le sensazioni olfattive.","Frisch und salzig, mit weichen Tanninen; Abgang und Nachgeschmack erinnern an die Eindrücke der Nase."],"Aroma frutash të kuqe, të shkrira mirë me nota erëzash dhe balsamike.":["Aromas of red fruit, well blended with spicy and balsamic notes.","Profumi di frutti rossi, ben fusi con note speziate e balsamiche.","Aromen roter Früchte, gut verbunden mit würzigen und balsamischen Noten."],"E gjerë dhe mbështjellëse, me tanine të forta dhe të buta.":["Broad and enveloping, with firm yet soft tannins.","Ampio e avvolgente, con tannini decisi e morbidi.","Weit und umhüllend, mit festen und doch weichen Tanninen."],"E verdhë kashte me reflekse të gjelbra.":["Straw yellow with green reflections.","Giallo paglierino con riflessi verdi.","Strohgelb mit grünen Reflexen."],"Komplekse, me nota intensive agrumesh dhe lulesh akacie që shkrihen me nuanca vanilje.":["Complex, with intense notes of citrus and acacia flowers merging with hints of vanilla.","Complesso, con intense note di agrumi e fiori d'acacia che si fondono con sfumature di vaniglia.","Komplex, mit intensiven Noten von Zitrus und Akazienblüten, die mit Vanilleanklängen verschmelzen."],"E pasur dhe minerale, me nota të lehta gjalpi lajthie.":["Rich and mineral, with light notes of hazelnut butter.","Ricco e minerale, con leggere note di burro di nocciola.","Reich und mineralisch, mit leichten Noten von Haselnussbutter."],"E kuqe rubin e shndritshme me reflekse granate.":["Bright ruby red with garnet reflections.","Rosso rubino brillante con riflessi granati.","Leuchtendes Rubinrot mit granatroten Reflexen."],"Komplekse dhe intensive, me nota erëzash dhe balsamike.":["Complex and intense, with spicy and balsamic notes.","Complesso e intenso, con note speziate e balsamiche.","Komplex und intensiv, mit würzigen und balsamischen Noten."],"E gjerë dhe mbështjellëse, me teksturë mëndafshi dhe progresion intensiv shijesh.":["Broad and enveloping, with a silky texture and an intense progression of flavours.","Ampio e avvolgente, con trama setosa e un'intensa progressione di sapori.","Weit und umhüllend, mit seidiger Textur und intensiver Geschmacksentwicklung."],"E kuqe rubin e thellë dhe e shndritshme.":["Deep, bright ruby red.","Rosso rubino profondo e brillante.","Tiefes, leuchtendes Rubinrot."],"Aroma komplekse dhe intensive: nota lulesh me qershi të egra, mjedra dhe agrume, pastaj çokollatë, gjethe duhani të thekura dhe jamball, me prani kumbulle, mente dhe eukalipti.":["Complex and intense aromas: floral notes with wild cherries, raspberries and citrus, then chocolate, toasted tobacco leaves and saffron, with plum, mint and eucalyptus.","Profumi complessi e intensi: note floreali con ciliegie selvatiche, lamponi e agrumi, poi cioccolato, foglie di tabacco tostate e zafferano, con presenza di prugna, menta ed eucalipto.","Komplexe, intensive Aromen: Blütennoten mit Wildkirschen, Himbeeren und Zitrus, dann Schokolade, geröstete Tabakblätter und Safran, mit Pflaume, Minze und Eukalyptus."],"E ekuilibruar dhe e gjerë, me shije dhe teksturë të plotë e intensive; elegante dhe fisnike në ndjesitë taktile të taninëve dhe shumë minerale.":["Balanced and broad, with full, intense flavour and texture; elegant and noble in the tactile sensations of the tannins, and very mineral.","Equilibrato e ampio, con sapore e trama pieni e intensi; elegante e nobile nelle sensazioni tattili dei tannini e molto minerale.","Ausgewogen und weit, mit vollem, intensivem Geschmack und Textur; elegant und edel im Tanningefühl und sehr mineralisch."],"E kuqe rubin intensive me vezullim vjollce":["Intense ruby red with a violet shimmer","Rosso rubino intenso con luccichio violaceo","Intensives Rubinrot mit violettem Schimmer"],"Aromatike në hundë, me nota qershish, kumbullash dhe hibiskusi":["Aromatic on the nose, with notes of cherries, plums and hibiscus","Aromatico al naso, con note di ciliegie, prugne e ibisco","Aromatisch in der Nase, mit Noten von Kirschen, Pflaumen und Hibiskus"],"Mjaft e hollë dhe e lëngshme në qiellzë, tanine të lehta, aciditet freskues, përfundim i kripur":["Fairly slender and juicy on the palate, light tannins, refreshing acidity, salty finish","Abbastanza snello e succoso al palato, tannini leggeri, acidità rinfrescante, finale sapido","Recht schlank und saftig am Gaumen, leichte Tannine, erfrischende Säure, salziger Abgang"],"E kuqe rubin intensive dhe e shndritshme.":["Intense, bright ruby red.","Rosso rubino intenso e brillante.","Intensives, leuchtendes Rubinrot."],"Nota frutash të kuqe të pjekura me nuanca manaferre të freskët dhe frutash të egra; aroma delikate dhe të integruara vanilje dhe çokollate të zezë me ndjesi të lehta erëzash.":["Notes of ripe red fruit with hints of fresh blackberry and wild fruit; delicate, integrated aromas of vanilla and dark chocolate with light spicy sensations.","Note di frutti rossi maturi con sfumature di mora fresca e frutti selvatici; delicati e integrati profumi di vaniglia e cioccolato fondente con leggere sensazioni speziate.","Noten reifer roter Früchte mit Anklängen frischer Brombeere und Wildfrüchte; zarte, eingebundene Aromen von Vanille und dunkler Schokolade mit leichter Würze."],"E gjallë, me tanine mëndafshi dhe të rafinuara; e ekuilibruar dhe intensive, me përfundim të gjatë, kompleks dhe të qëndrueshëm.":["Lively, with silky, refined tannins; balanced and intense, with a long, complex and persistent finish.","Vivace, con tannini setosi e raffinati; equilibrato e intenso, con finale lungo, complesso e persistente.","Lebendig, mit seidigen, feinen Tanninen; ausgewogen und intensiv, mit langem, komplexem und anhaltendem Abgang."],"Kompleksitet i shquar: fruta të kuqe të pjekura si qershi në alkool, vishnje, mjedra dhe kumbulla, me aroma delikate erëzash karafili dhe jamballi; nota balsamike të ëmbla mente dhe çokollate plotësojnë buqetën.":["Remarkable complexity: ripe red fruit such as cherries in alcohol, sour cherries, raspberries and plums, with delicate aromas of clove and saffron; sweet balsamic notes of mint and chocolate complete the bouquet.","Notevole complessità: frutti rossi maturi come ciliegie sotto spirito, amarene, lamponi e prugne, con delicati profumi di chiodi di garofano e zafferano; dolci note balsamiche di menta e cioccolato completano il bouquet.","Bemerkenswerte Komplexität: reife rote Früchte wie Kirschen in Alkohol, Sauerkirschen, Himbeeren und Pflaumen, mit zarten Aromen von Nelke und Safran; süße balsamische Noten von Minze und Schokolade runden das Bouquet ab."],"E pasur, mbushëse dhe e gjallë, me tanine të buta dhe kadifeje.":["Rich, filling and lively, with soft, velvety tannins.","Ricco, appagante e vivace, con tannini morbidi e vellutati.","Reich, füllig und lebendig, mit weichen, samtigen Tanninen."],"E kuqe granatë e thellë me nuanca rubini":["Deep garnet red with ruby hues","Rosso granato profondo con sfumature rubino","Tiefes Granatrot mit Rubinnuancen"],"Aromë intensive dhe e qëndrueshme me nota të qarta erëzash, kanelle, absinthi, duhani dhe trëndafili të egër":["Intense, persistent aroma with clear notes of spices, cinnamon, absinthe, tobacco and wild rose","Profumo intenso e persistente con nette note di spezie, cannella, assenzio, tabacco e rosa canina","Intensiver, anhaltender Duft mit klaren Noten von Gewürzen, Zimt, Absinth, Tabak und Wildrose"],"Shije e plotë dhe elegante, me tanine të buta dhe mbështjellëse; nota të këndshme erëzore dhe druri që shkrihen në mënyrë të përsosur":["Full, elegant taste, with soft, enveloping tannins; pleasant spicy and woody notes that blend perfectly","Gusto pieno ed elegante, con tannini morbidi e avvolgenti; piacevoli note speziate e legnose che si fondono perfettamente","Voller, eleganter Geschmack mit weichen, umhüllenden Tanninen; angenehme würzige und holzige Noten, die perfekt verschmelzen"],"Pasta tradicionale me vezë të Langhe (tajarin), raviola me mish, mish i kuq, mish i zier, i stufuar dhe gjah; ideale me toma delesh e dhie dhe djathëra të fortë të stazhionuar":["Traditional Langhe egg pasta (tajarin), meat ravioli, red meat, boiled and stewed meat and game; ideal with sheep and goat toma and strong aged cheeses","Pasta all'uovo tradizionale delle Langhe (tajarin), ravioli di carne, carni rosse, bolliti, stufati e selvaggina; ideale con tome di pecora e capra e formaggi forti stagionati","Traditionelle Eiernudeln der Langhe (Tajarin), Fleischravioli, rotes Fleisch, Gekochtes, Geschmortes und Wild; ideal zu Schaf- und Ziegen-Toma und kräftigen gereiften Käsen"],"Hundë e qartë dhe intensive, me nota manaferre dhe barishtesh erëzore, shumë trumzë, pak dru kedri në sfond":["Clear, intense nose, with notes of blackberry and spicy herbs, lots of thyme, a little cedar wood in the background","Naso nitido e intenso, con note di mora ed erbe speziate, molto timo, un po' di legno di cedro sullo sfondo","Klare, intensive Nase mit Noten von Brombeere und würzigen Kräutern, viel Thymian, etwas Zedernholz im Hintergrund"],"Hapet në qiellzë me shumë fruta të lëngshme, manaferra dhe kokrra shtogu; tanine të dendura me bërthamë të ëmbël, përfundim i gjatë":["It opens on the palate with lots of juicy fruit, blackberries and elderberries; dense tannins with a sweet core, long finish","Si apre al palato con molto frutto succoso, more e bacche di sambuco; tannini fitti con cuore dolce, finale lungo","Öffnet sich am Gaumen mit viel saftiger Frucht, Brombeeren und Holunderbeeren; dichte Tannine mit süßem Kern, langer Abgang"],"Rubin i shkëlqyer":["Brilliant ruby","Rubino brillante","Glänzendes Rubin"],"Hundë e dendur dhe e afrueshme, me nota të theksuara kumbulle dhe ribesi të zi, tërheqëse":["Dense, approachable nose, with marked notes of plum and blackcurrant, attractive","Naso fitto e accessibile, con spiccate note di prugna e ribes nero, attraente","Dichte, zugängliche Nase mit ausgeprägten Noten von Pflaume und schwarzer Johannisbeere, ansprechend"],"Rubin i ndritshëm dhe intensiv":["Bright, intense ruby","Rubino brillante e intenso","Leuchtendes, intensives Rubin"],"Hundë e hollë dhe e hapur, me nota mjedrash të pjekura, kumbullash dhe mirabelash të errëta":["Fine, open nose, with notes of ripe raspberries, plums and dark mirabelles","Naso fine e aperto, con note di lamponi maturi, prugne e mirabelle scure","Feine, offene Nase mit Noten reifer Himbeeren, Pflaumen und dunkler Mirabellen"],"Kompakte dhe e pranishme në qiellzë, me nota të holla erëzore; taninet fillimisht të fuqishme e të dendura, pastaj zhvillohet mirë; përfundim i kripur dhe i gjatë":["Compact and present on the palate, with fine spicy notes; the tannins at first powerful and dense, then it develops well; salty, long finish","Compatto e presente al palato, con fini note speziate; tannini inizialmente potenti e fitti, poi si sviluppa bene; finale sapido e lungo","Kompakt und präsent am Gaumen, mit feinen würzigen Noten; die Tannine zunächst kraftvoll und dicht, dann entwickelt er sich gut; salziger, langer Abgang"],"Rubin i pasur dhe i errët me shkëlqim vjollcë":["Rich, dark ruby with violet sheen","Rubino ricco e scuro con lucentezza violacea","Reiches, dunkles Rubin mit violettem Glanz"],"Hapet në hundë me nota erëzore qershish të konservuara dhe manaferrash, tërheqëse":["It opens on the nose with spicy notes of preserved cherries and blackberries, attractive","Si apre al naso con note speziate di ciliegie sciroppate e more, attraente","Öffnet sich in der Nase mit würzigen Noten eingemachter Kirschen und Brombeeren, ansprechend"],"Kompakte dhe e lëmuar në qiellzë, hapet me shumë tanine me kokërr të imët dhe bërthamë të ëmbël; ndërtohet bukur, e qëndrueshme në përfundim":["Compact and polished on the palate, it opens with plenty of fine-grained tannins and a sweet core; it builds nicely, persistent on the finish","Compatto e levigato al palato, si apre con molti tannini a grana fine e cuore dolce; si costruisce bene, persistente nel finale","Kompakt und geschliffen am Gaumen, öffnet sich mit vielen feinkörnigen Tanninen und süßem Kern; baut sich schön auf, anhaltend im Abgang"],"Hundë e hollë me shumë fruta të pranishme, ribes i errët dhe qershi të errëta, e qartë dhe tërheqëse":["Fine nose with plenty of fruit, dark currant and dark cherries, clear and attractive","Naso fine con molto frutto presente, ribes scuro e ciliegie scure, nitido e attraente","Feine Nase mit viel präsenter Frucht, dunkler Johannisbeere und dunklen Kirschen, klar und ansprechend"],"Shumë e lëngshme në qiellzë, shumë fruta të kuqe; hapet me tanine të holla e të lëmuara, shpaloset me elegancë":["Very juicy on the palate, lots of red fruit; it opens with fine, polished tannins and unfolds elegantly","Molto succoso al palato, molto frutto rosso; si apre con tannini fini e levigati, si distende con eleganza","Sehr saftig am Gaumen, viel rote Frucht; öffnet sich mit feinen, geschliffenen Tanninen und entfaltet sich elegant"],"E kuqe rubin e pasur dhe intensive":["Rich, intense ruby red","Rosso rubino ricco e intenso","Reiches, intensives Rubinrot"],"Hundë e shënuar hollë me qershi të pjekura, shegë dhe manaferra, me shije delikate lëkure dhe piper në sfond":["Finely marked nose with ripe cherries, pomegranate and blackberries, with delicate hints of leather and pepper in the background","Naso finemente marcato con ciliegie mature, melograno e more, con delicati sentori di cuoio e pepe sullo sfondo","Fein gezeichnete Nase mit reifen Kirschen, Granatapfel und Brombeeren, mit zarten Anklängen von Leder und Pfeffer im Hintergrund"],"Hapet shumë e lëngshme në qiellzë, tanin kompakt, shtrin një hark elegant, e lëngshme dhe e qartë, me përfundim butësisht të qëndrueshëm":["It opens very juicy on the palate, compact tannin, it draws an elegant arc, juicy and clear, with a gently persistent finish","Si apre molto succoso al palato, tannino compatto, disegna un arco elegante, succoso e nitido, con finale dolcemente persistente","Öffnet sich sehr saftig am Gaumen, kompaktes Tannin, spannt einen eleganten Bogen, saftig und klar, mit sanft anhaltendem Abgang"],"Rubin i shndritshëm me buzë që çelet delikat":["Bright ruby with a delicately lightening rim","Rubino brillante con unghia che si schiarisce delicatamente","Leuchtendes Rubin mit zart aufhellendem Rand"],"Hundë për t'u dashuruar: fillimisht aromë trëndafilash, pastaj ribes i zi, qershi të errëta dhe një nuancë kardamomi":["A nose to fall in love with: first rose aromas, then blackcurrant, dark cherries and a hint of cardamom","Un naso di cui innamorarsi: prima profumi di rosa, poi ribes nero, ciliegie scure e un tocco di cardamomo","Eine Nase zum Verlieben: zuerst Rosenduft, dann schwarze Johannisbeere, dunkle Kirschen und ein Hauch Kardamom"],"Shumë fruta të lëngshme në qiellzë; hapet me tanine të integruara mirë dhe me kokërr të imët, e kripur dhe pafundësisht e gjatë":["Lots of juicy fruit on the palate; it opens with well-integrated, fine-grained tannins, salty and endlessly long","Molto frutto succoso al palato; si apre con tannini ben integrati e a grana fine, sapido e infinitamente lungo","Viel saftige Frucht am Gaumen; öffnet sich mit gut eingebundenen, feinkörnigen Tanninen, salzig und endlos lang"],"E verdhë kashte e zbehtë; shkumë e bardhë; perlazh i gjallë":["Pale straw yellow; white mousse; lively perlage","Giallo paglierino tenue; spuma bianca; perlage vivace","Blasses Strohgelb; weißer Schaum; lebhafte Perlage"],"Shprehje delikate lulore akacie me nuanca të ëmbla frutash të kandisura":["Delicate floral expression of acacia with sweet hints of candied fruit","Delicata espressione floreale di acacia con dolci sfumature di frutta candita","Zarter blumiger Ausdruck von Akazie mit süßen Anklängen kandierter Früchte"],"E lehtë, e freskët dhe e drejtpërdrejtë; e pëlqyer që nga gllënjka e parë për aromën dhe këndshmërinë; pas-shije lehtësisht aromatike":["Light, fresh and direct; liked from the first sip for its aroma and pleasantness; lightly aromatic aftertaste","Leggero, fresco e diretto; apprezzato fin dal primo sorso per profumo e piacevolezza; retrogusto leggermente aromatico","Leicht, frisch und direkt; vom ersten Schluck an beliebt wegen Duft und Gefälligkeit; leicht aromatischer Nachgeschmack"],"Perfekte për aperitiv, me finger food nga më të ndryshmet, të kripura dhe të ëmbla":["Perfect for aperitifs, with the most varied finger food, savoury and sweet","Perfetto per l'aperitivo, con i finger food più vari, salati e dolci","Perfekt zum Aperitif, mit den verschiedensten Fingerfoods, herzhaft und süß"],"E kthjellët, e verdhë kashte me reflekse të gjelbra.":["Clear, straw yellow with green reflections.","Limpido, giallo paglierino con riflessi verdi.","Klar, strohgelb mit grünen Reflexen."],"Buqetë e rafinuar dhe intensive: aroma frutash të verdha, kajsie dhe barishtesh.":["Refined and intense bouquet: aromas of yellow fruit, apricot and herbs.","Bouquet raffinato e intenso: profumi di frutta gialla, albicocca ed erbe.","Feines und intensives Bouquet: Aromen von gelben Früchten, Aprikose und Kräutern."],"Mish i bardhë dhe delikat (pulë, gjel deti), sushi.":["Delicate white meat (chicken, turkey), sushi.","Carni bianche e delicate (pollo, tacchino), sushi.","Zartes helles Fleisch (Huhn, Truthahn), Sushi."],"E verdhë e artë, e shndritshme dhe komplekse":["Golden yellow, bright and complex","Giallo dorato, brillante e complesso","Goldgelb, leuchtend und komplex"],"Shumë intensive, aromë e plotë lulesh; nota bajameje siciliane, pjeshke të bardhë dhe molle":["Very intense, full floral aroma; notes of Sicilian almond, white peach and apple","Molto intenso, profumo floreale pieno; note di mandorla siciliana, pesca bianca e mela","Sehr intensiv, voller Blütenduft; Noten von sizilianischer Mandel, weißem Pfirsich und Apfel"],"Peshk në furrë, mish i bardhë, djathë":["Baked fish, white meat, cheese","Pesce al forno, carni bianche, formaggi","Fisch aus dem Ofen, helles Fleisch, Käse"],"E artë, e shndritshme.":["Golden, bright.","Dorato, brillante.","Golden, leuchtend."],"Buqetë intensive dhe komplekse: nota lulesh gjinestre dhe jasemini, aroma mushmolle.":["Intense and complex bouquet: notes of broom flowers and jasmine, aromas of medlar.","Bouquet intenso e complesso: note di fiori di ginestra e gelsomino, profumi di nespola.","Intensives und komplexes Bouquet: Noten von Ginsterblüten und Jasmin, Aromen von Mispel."],"Shumë e kripur (sapide) dhe e qëndrueshme në gojë, me fruta tropikale.":["Very savoury (sapido) and persistent on the palate, with tropical fruit.","Molto sapido e persistente in bocca, con frutta tropicale.","Sehr salzig (sapido) und anhaltend am Gaumen, mit tropischen Früchten."],"Pjata me peshk, tartare, fruta deti me guaskë.":["Fish dishes, tartare, shellfish.","Piatti di pesce, tartare, molluschi.","Fischgerichte, Tatar, Schalentiere."],"E kuqe rubin e thellë dhe e kthjellët":["Deep, clear ruby red","Rosso rubino profondo e limpido","Tiefes, klares Rubinrot"],"Buqetë intensive dhe komplekse: qershi të errëta, manaferra, mjedra të zeza dhe nënpyll":["Intense and complex bouquet: dark cherries, blackberries, black raspberries and undergrowth","Bouquet intenso e complesso: ciliegie scure, more, lamponi neri e sottobosco","Intensives und komplexes Bouquet: dunkle Kirschen, Brombeeren, schwarze Himbeeren und Waldboden"],"Mish i pjekur në skarë (barbecue)":["Grilled meat (barbecue)","Carni alla griglia (barbecue)","Gegrilltes Fleisch (Barbecue)"],"E kuqe rubin e thellë dhe e kthjellët, me reflekse granate":["Deep, clear ruby red, with garnet reflections","Rosso rubino profondo e limpido, con riflessi granati","Tiefes, klares Rubinrot mit granatroten Reflexen"],"Buqetë intensive dhe komplekse":["Intense and complex bouquet","Bouquet intenso e complesso","Intensives und komplexes Bouquet"],"Shije frutash, erëzash dhe nënpylli":["Flavours of fruit, spices and undergrowth","Sapori di frutta, spezie e sottobosco","Geschmack von Früchten, Gewürzen und Waldboden"],"Mish i pjekur në skarë, gjellë të ziera (stufato)":["Grilled meat, stews (stufato)","Carni alla griglia, stufati","Gegrilltes Fleisch, Schmorgerichte (Stufato)"],"Aroma intensive të ribesit të zi dhe boronicës":["Intense aromas of blackcurrant and blueberry","Profumi intensi di ribes nero e mirtillo","Intensive Aromen von schwarzer Johannisbeere und Heidelbeere"],"Trup i plotë, i butë dhe voluminoz, me tanine të lëngshme dhe përfundim të kripur":["Full body, soft and voluminous, with juicy tannins and a salty finish","Corpo pieno, morbido e voluminoso, con tannini succosi e finale sapido","Voller Körper, weich und voluminös, mit saftigen Tanninen und salzigem Abgang"],"Rubin intensiv me reflekse purpur.":["Intense ruby with purple reflections.","Rubino intenso con riflessi porpora.","Intensives Rubin mit purpurnen Reflexen."],"Intensive dhe e qëndrueshme: fruta të kuqe të pjekura, fruta të thata, nota erëzash, kakao, piper i zi, jamball.":["Intense and persistent: ripe red fruit, dried fruit, spicy notes, cocoa, black pepper, saffron.","Intenso e persistente: frutti rossi maturi, frutta secca, note speziate, cacao, pepe nero, zafferano.","Intensiv und anhaltend: reife rote Früchte, Trockenfrüchte, würzige Noten, Kakao, schwarzer Pfeffer, Safran."],"Derr i egër i pjekur ose i marinuar, qengj në furrë, gjah, djathëra të stagjionuar, çokollatë e hidhur.":["Roast or marinated wild boar, baked lamb, game, aged cheeses, bitter chocolate.","Cinghiale arrosto o marinato, agnello al forno, selvaggina, formaggi stagionati, cioccolato amaro.","Gebratenes oder mariniertes Wildschwein, Lamm aus dem Ofen, Wild, gereifte Käse, Bitterschokolade."],"E kuqe rubin e errët me buzë të ndritshme":["Dark ruby red with a bright rim","Rosso rubino scuro con unghia brillante","Dunkles Rubinrot mit leuchtendem Rand"],"Aroma të fuqishme vishnjeje dhe frutash të pyllit, me një nuancë torte frutash":["Powerful aromas of sour cherry and wild berries, with a hint of fruit cake","Profumi potenti di amarena e frutti di bosco, con una sfumatura di torta alla frutta","Kräftige Aromen von Sauerkirsche und Waldbeeren, mit einem Anklang von Früchtekuchen"],"Strukturë imponuese e mbështetur nga aciditet i mirë; mbizotërojnë shijet e qershisë së gatuar":["Imposing structure supported by good acidity; flavours of cooked cherry dominate","Struttura imponente sostenuta da una buona acidità; dominano i sapori di ciliegia cotta","Imposante Struktur, getragen von guter Säure; der Geschmack gekochter Kirschen dominiert"],"Verë me trup të plotë për mish të kuq në skarë ose të pjekur, gjah dhe djathëra të fortë me shije, si parmixhani":["A full-bodied wine for grilled or roast red meat, game and strong, flavourful cheeses such as Parmesan","Vino di corpo pieno per carni rosse alla griglia o arrosto, selvaggina e formaggi forti e saporiti come il parmigiano","Ein vollmundiger Wein zu gegrilltem oder gebratenem rotem Fleisch, Wild und kräftigen, würzigen Käsen wie Parmesan"],"E verdhë kashte me reflekse të gjelbra":["Straw yellow with green reflections","Giallo paglierino con riflessi verdi","Strohgelb mit grünen Reflexen"],"E freskët dhe frutore, me nota të forta e të qëndrueshme agrumesh, frutash tropikale, pjeshke, bananeje dhe lulesh të bardha":["Fresh and fruity, with strong, persistent notes of citrus, tropical fruit, peach, banana and white flowers","Fresco e fruttato, con note decise e persistenti di agrumi, frutta tropicale, pesca, banana e fiori bianchi","Frisch und fruchtig, mit kräftigen, anhaltenden Noten von Zitrus, tropischen Früchten, Pfirsich, Banane und weißen Blüten"],"Shumë e freskët dhe e qëndrueshme, me përshtypje përfundimtare të këndshme e frutore":["Very fresh and persistent, with a pleasant, fruity final impression","Molto fresco e persistente, con una piacevole impressione finale fruttata","Sehr frisch und anhaltend, mit angenehmem, fruchtigem Schlusseindruck"],"Antipasta: fruta deti me guaskë, finger food; pjata të para: pasta dhe rizoto me fruta deti; pjata të dyta: sepje, vongole dhe pjata me fruta deti":["Starters: shellfish, finger food; first courses: pasta and risotto with seafood; main courses: cuttlefish, clams and seafood dishes","Antipasti: molluschi, finger food; primi: pasta e risotto ai frutti di mare; secondi: seppie, vongole e piatti di mare","Vorspeisen: Schalentiere, Fingerfood; erste Gänge: Pasta und Risotto mit Meeresfrüchten; Hauptgerichte: Sepia, Venusmuscheln und Meeresfrüchtegerichte"],"Nota frutore intensive dhe komplekse: agrume, pjeshkë, ananas, kajsi dhe lime.":["Intense, complex fruity notes: citrus, peach, pineapple, apricot and lime.","Note fruttate intense e complesse: agrumi, pesca, ananas, albicocca e lime.","Intensive, komplexe fruchtige Noten: Zitrus, Pfirsich, Ananas, Aprikose und Limette."],"E freskët, shumë minerale, e strukturuar dhe elegante, me pas-shije dominuese qitroje.":["Fresh, very mineral, structured and elegant, with a dominant citron aftertaste.","Fresco, molto minerale, strutturato ed elegante, con retrogusto dominante di cedro.","Frisch, sehr mineralisch, strukturiert und elegant, mit dominierendem Zitronatzitronen-Nachgeschmack."],"Supa dhe krustace; rizoto dhe pjata me peshk; mish i bardhë, krustace, peshk dhe perime të skuqura.":["Soups and shellfish; risotto and fish dishes; white meat, shellfish, fish and fried vegetables.","Zuppe e crostacei; risotti e piatti di pesce; carni bianche, crostacei, pesce e verdure fritte.","Suppen und Krustentiere; Risotto und Fischgerichte; helles Fleisch, Krustentiere, Fisch und frittiertes Gemüse."],"Delikate, me nota frutash të freskëta, bajameje, lajthie, lulesh të bardha, agrumesh, barishtesh aromatike dhe lulesh të vyshkura.":["Delicate, with notes of fresh fruit, almond, hazelnut, white flowers, citrus, aromatic herbs and withered flowers.","Delicato, con note di frutta fresca, mandorla, nocciola, fiori bianchi, agrumi, erbe aromatiche e fiori appassiti.","Zart, mit Noten frischer Früchte, Mandel, Haselnuss, weißer Blüten, Zitrus, Kräutern und welker Blumen."],"Delikate, me trup, me nota të qarta lulesh.":["Delicate, with body, with clear floral notes.","Delicato, di corpo, con nette note floreali.","Zart, mit Körper, mit klaren Blütennoten."],"Supa, fruta deti, djathëra të freskët, mocarela bufale; pjata me bishtajore, fruta deti dhe salca peshku; mish i bardhë, krustace, salmon, ton.":["Soups, seafood, fresh cheeses, buffalo mozzarella; dishes with legumes, seafood and fish sauces; white meat, shellfish, salmon, tuna.","Zuppe, frutti di mare, formaggi freschi, mozzarella di bufala; piatti con legumi, frutti di mare e sughi di pesce; carni bianche, crostacei, salmone, tonno.","Suppen, Meeresfrüchte, Frischkäse, Büffelmozzarella; Gerichte mit Hülsenfrüchten, Meeresfrüchten und Fischsaucen; helles Fleisch, Krustentiere, Lachs, Thunfisch."],"Shumë aroma: barishte aromatike (trumzë dhe sherebelë), dardhë, ananas, akacie, lajthi, agrume, murriz dhe nuanca lulesh.":["Many aromas: aromatic herbs (thyme and sage), pear, pineapple, acacia, hazelnut, citrus, hawthorn and floral hints.","Molti profumi: erbe aromatiche (timo e salvia), pera, ananas, acacia, nocciola, agrumi, biancospino e sfumature floreali.","Viele Aromen: Kräuter (Thymian und Salbei), Birne, Ananas, Akazie, Haselnuss, Zitrus, Weißdorn und Blütenanklänge."],"Aciditet i mirë por njëkohësisht butësi e madhe; notat fillestare të pjeshkës së bardhë dhe grejpfrutit mbyllen me nota të theksuara frutash të thata.":["Good acidity but at the same time great softness; the initial notes of white peach and grapefruit close with marked notes of dried fruit.","Buona acidità ma allo stesso tempo grande morbidezza; le note iniziali di pesca bianca e pompelmo chiudono con spiccate note di frutta secca.","Gute Säure, zugleich aber große Weichheit; die anfänglichen Noten von weißem Pfirsich und Grapefruit schließen mit ausgeprägten Noten von Trockenfrüchten."],"Sallata deti, pjata me bishtajore, djathëra të freskët dhe me brumë të tërhequr; pjata me peshk dhe krustace; peshk në furrë dhe në skarë, djathëra të pastagjionuar, mish i bardhë.":["Seafood salads, legume dishes, fresh and stretched-curd cheeses; fish and shellfish dishes; baked and grilled fish, unaged cheeses, white meat.","Insalate di mare, piatti di legumi, formaggi freschi e a pasta filata; piatti di pesce e crostacei; pesce al forno e alla griglia, formaggi non stagionati, carni bianche.","Meeresfrüchtesalate, Hülsenfruchtgerichte, Frisch- und Filata-Käse; Fisch- und Krustentiergerichte; Fisch aus dem Ofen und vom Grill, ungereifte Käse, helles Fleisch."],"Aroma intensive vishnjeje, manaferre të egër, vjollce dhe erëzash.":["Intense aromas of sour cherry, wild blackberry, violet and spices.","Profumi intensi di amarena, mora selvatica, viola e spezie.","Intensive Aromen von Sauerkirsche, wilder Brombeere, Veilchen und Gewürzen."],"Elegante dhe e butë, me nota që kujtojnë frutat e pyllit dhe reçelin e dredhëzave.":["Elegant and soft, with notes recalling wild berries and strawberry jam.","Elegante e morbido, con note che ricordano i frutti di bosco e la confettura di fragole.","Elegant und weich, mit Noten, die an Waldbeeren und Erdbeerkonfitüre erinnern."],"Supa, salume, djathëra të freskët dhe të stagjionuar; pjata me salca mishi, kërpudha dhe tartuf; mish i bardhë dhe i kuq.":["Soups, cured meats, fresh and aged cheeses; dishes with meat sauces, mushrooms and truffle; white and red meat.","Zuppe, salumi, formaggi freschi e stagionati; piatti con sughi di carne, funghi e tartufo; carni bianche e rosse.","Suppen, Wurstwaren, frische und gereifte Käse; Gerichte mit Fleischsaucen, Pilzen und Trüffel; helles und rotes Fleisch."],"Buqetë komplekse, intensive dhe mbështjellëse: aroma intensive frutash të kuqe, sidomos dredhëz dhe mjedër, dhe erëza si vanilje, duhan, kakao dhe kafe.":["A complex, intense and enveloping bouquet: intense aromas of red fruit, especially strawberry and raspberry, and spices such as vanilla, tobacco, cocoa and coffee.","Bouquet complesso, intenso e avvolgente: profumi intensi di frutti rossi, soprattutto fragola e lampone, e spezie come vaniglia, tabacco, cacao e caffè.","Ein komplexes, intensives und umhüllendes Bouquet: intensive Aromen roter Früchte, besonders Erdbeere und Himbeere, und Gewürze wie Vanille, Tabak, Kakao und Kaffee."],"E ngrohtë, mbështjellëse, me strukturë të madhe, qëndrueshmëri të gjatë dhe butësi të shquar.":["Warm, enveloping, with great structure, long persistence and remarkable softness.","Caldo, avvolgente, di grande struttura, lunga persistenza e notevole morbidezza.","Warm, umhüllend, mit großer Struktur, langer Länge und bemerkenswerter Weichheit."],"Salume dhe djathëra të stagjionuar; pjata të përpunuara me salca mishi, kërpudha dhe tartuf; mish i kuq dhe gjah në skarë ose i gatuar gjatë.":["Cured meats and aged cheeses; elaborate dishes with meat sauces, mushrooms and truffle; red meat and game, grilled or long-cooked.","Salumi e formaggi stagionati; piatti elaborati con sughi di carne, funghi e tartufo; carni rosse e selvaggina alla griglia o a lunga cottura.","Wurstwaren und gereifte Käse; aufwendige Gerichte mit Fleischsaucen, Pilzen und Trüffel; rotes Fleisch und Wild, gegrillt oder lange gegart."],"Elegante, me shije të freskëta frutash të kuqe, kadifeje, aromatike dhe e butë.":["Elegant, with fresh flavours of red fruit, velvety, aromatic and soft.","Elegante, con sapori freschi di frutti rossi, vellutato, aromatico e morbido.","Elegant, mit frischem Geschmack roter Früchte, samtig, aromatisch und weich."],"Salume, pasta me salcë mishi ose gjahu, pica, peshk i madh në skarë, mish i stufuar.":["Cured meats, pasta with meat or game sauce, pizza, large grilled fish, stewed meat.","Salumi, pasta al ragù di carne o selvaggina, pizza, pesce grande alla griglia, carni in umido.","Wurstwaren, Pasta mit Fleisch- oder Wildragù, Pizza, großer gegrillter Fisch, geschmortes Fleisch."],"Trup i ekuilibruar dhe elegant, shije frutash të errëta pylli dhe erëzash të freskëta; shije intensive dhe e butë.":["Balanced and elegant body, flavours of dark wild berries and fresh spices; intense and soft taste.","Corpo equilibrato ed elegante, sapori di frutti di bosco scuri e spezie fresche; gusto intenso e morbido.","Ausgewogener, eleganter Körper, Geschmack dunkler Waldbeeren und frischer Gewürze; intensiver und weicher Geschmack."],"Pasta me salca të errëta, BBQ, mish i zier me salca pikante, djathë i stagjionuar.":["Pasta with dark sauces, BBQ, boiled meat with spicy sauces, aged cheese.","Pasta con sughi scuri, barbecue, bolliti con salse piccanti, formaggi stagionati.","Pasta mit dunklen Saucen, BBQ, gekochtes Fleisch mit scharfen Saucen, gereifter Käse."],"E freskët, taninike, me aromë frutash pylli, strukturë e fortë, shije tokësore dhe intensive.":["Fresh, tannic, with aromas of wild berries, firm structure, earthy and intense flavour.","Fresco, tannico, con profumi di frutti di bosco, struttura decisa, gusto terroso e intenso.","Frisch, tanninbetont, mit Waldbeerenaromen, fester Struktur, erdigem und intensivem Geschmack."],"Pasta me salcë gjahu, stufato, mish i kuq në skarë, djathëra mesatarisht të stagjionuar (fletët e viteve 2015–2017).":["Pasta with game sauce, stews, grilled red meat, medium-aged cheeses (sheets of the 2015–2017 vintages).","Pasta al ragù di selvaggina, stufati, carni rosse alla griglia, formaggi di media stagionatura (schede delle annate 2015–2017).","Pasta mit Wildragù, Schmorgerichte, gegrilltes rotes Fleisch, mittelalte Käse (Datenblätter der Jahrgänge 2015–2017)."],"Kombinim i përsosur elegance, strukture dhe karakteri mineral":["A perfect combination of elegance, structure and mineral character","Perfetta combinazione di eleganza, struttura e carattere minerale","Perfekte Verbindung von Eleganz, Struktur und mineralischem Charakter"],"Pjata me shije të fortë, gjah, gjellë, tartufi, djathëra të stazhionuar":["Strongly flavoured dishes, game, stews, truffle, aged cheeses","Piatti dal gusto deciso, selvaggina, stufati, tartufo, formaggi stagionati","Kräftig gewürzte Gerichte, Wild, Schmorgerichte, Trüffel, gereifte Käse"],"E pasur dhe e lëngshme, me nota nënpylli dhe frutash të zeza; e fuqishme dhe e hollë.":["Rich and juicy, with notes of undergrowth and black fruit; powerful and fine.","Ricco e succoso, con note di sottobosco e frutti neri; potente e fine.","Reich und saftig, mit Noten von Waldboden und schwarzen Früchten; kraftvoll und fein."],"Pjata me erëza, gjah i stufuar, djathëra të stagjionuar (fletët e viteve 2018–2020).":["Spiced dishes, stewed game, aged cheeses (sheets of the 2018–2020 vintages).","Piatti speziati, selvaggina in umido, formaggi stagionati (schede delle annate 2018–2020).","Gewürzte Gerichte, geschmortes Wild, gereifte Käse (Datenblätter der Jahrgänge 2018–2020)."],"E ndërtuar në mënyrë monumentale, me nota krokante shtogu, kumbulle, frutash pylli, sandalli dhe duhani; përfundim shumë i gjatë dhe i ndritshëm.":["Monumentally built, with crunchy notes of elderberry, plum, wild berries, sandalwood and tobacco; a very long, bright finish.","Costruito in modo monumentale, con note croccanti di sambuco, prugna, frutti di bosco, sandalo e tabacco; finale lunghissimo e luminoso.","Monumental gebaut, mit knackigen Noten von Holunder, Pflaume, Waldbeeren, Sandelholz und Tabak; sehr langer, leuchtender Abgang."],"Pjata me shije dhe teksturë, salca të errëta, gjah, djathëra blu.":["Dishes with flavour and texture, dark sauces, game, blue cheeses.","Piatti di sapore e consistenza, salse scure, selvaggina, formaggi erborinati.","Gerichte mit Geschmack und Textur, dunkle Saucen, Wild, Blauschimmelkäse."],"E ndërtuar mirë, me shije frutash pylli dhe lëkure portokalli të diellosur; shije e gjatë dhe me shtresa.":["Well built, with flavours of wild berries and sun-drenched orange peel; a long, layered taste.","Ben costruito, con sapori di frutti di bosco e scorza d'arancia soleggiata; gusto lungo e stratificato.","Gut gebaut, mit Geschmack von Waldbeeren und sonnengereifter Orangenschale; langer, vielschichtiger Geschmack."],"Supa peshku me erëza, pjata të shijshme me pasta dhe oriz, mish i kuq dhe perime në skarë.":["Spiced fish soups, tasty pasta and rice dishes, red meat and grilled vegetables.","Zuppe di pesce speziate, piatti saporiti di pasta e riso, carni rosse e verdure alla griglia.","Gewürzte Fischsuppen, würzige Pasta- und Reisgerichte, rotes Fleisch und gegrilltes Gemüse."],"Trup i plotë, i pjekur dhe intrigues; shije e gjatë me pas-shije të këndshme dhe të freskët.":["Full-bodied, mature and intriguing; a long taste with a pleasant, fresh aftertaste.","Corpo pieno, maturo e intrigante; gusto lungo con un retrogusto piacevole e fresco.","Vollmundig, reif und faszinierend; langer Geschmack mit angenehm frischem Nachgeschmack."],"Gjah i stufuar, djathëra të stagjionuar dhe blu, ushqim pikant.":["Stewed game, aged and blue cheeses, spicy food.","Selvaggina in umido, formaggi stagionati ed erborinati, cibi piccanti.","Geschmortes Wild, gereifte und Blauschimmelkäse, scharfe Speisen."],"Nuanca të holla frutash të verdha të pjekura, me nota agrumesh, sidomos limoni dhe bergamoti; edhe kore buke dhe bajame të ëmbla.":["Fine hints of ripe yellow fruit, with citrus notes, especially lemon and bergamot; also bread crust and sweet almonds.","Fini sfumature di frutta gialla matura, con note agrumate, soprattutto limone e bergamotto; anche crosta di pane e mandorle dolci.","Feine Anklänge reifer gelber Früchte, mit Zitrusnoten, besonders Zitrone und Bergamotte; auch Brotkruste und süße Mandeln."],"Perlazh shumë kremoz dhe i butë; shije e gjerë dhe e pasur; përfundim shumë i gjatë dhe i qëndrueshëm.":["Very creamy, soft perlage; broad, rich taste; a very long, persistent finish.","Perlage molto cremoso e morbido; gusto ampio e ricco; finale lunghissimo e persistente.","Sehr cremige, weiche Perlage; weiter, reicher Geschmack; sehr langer, anhaltender Abgang."],"Nuanca delikate frutash pylli, nota elegante dredhëzash dhe manaferrash, me një nuancë lajthie në fund.":["Delicate hints of wild berries, elegant notes of strawberries and blackberries, with a hint of hazelnut at the end.","Delicate sfumature di frutti di bosco, eleganti note di fragole e more, con un accenno di nocciola nel finale.","Zarte Anklänge von Waldbeeren, elegante Noten von Erdbeeren und Brombeeren, mit einem Hauch Haselnuss am Ende."],"Perlazh mëndafshi dhe i qëndrueshëm, kripësi e mirë dhe nota elegante lulesh në përfundim.":["Silky, persistent perlage, good saltiness and elegant floral notes on the finish.","Perlage setoso e persistente, buona sapidità ed eleganti note floreali nel finale.","Seidige, anhaltende Perlage, gute Salzigkeit und elegante Blütennoten im Abgang."],"E kuqe rubin me reflekse të purpurta":["Ruby red with purple reflections","Rosso rubino con riflessi porpora","Rubinrot mit purpurnen Reflexen"],"Strukturë shumë e mirë, shumë elegante dhe me rrumbullakësi të shkëlqyer; aroma balsamike, lulore, frutore, minerale, erëzore dhe të thekura":["Very good structure, very elegant and with excellent roundness; balsamic, floral, fruity, mineral, spicy and toasty aromas","Ottima struttura, molto elegante e di eccellente rotondità; profumi balsamici, floreali, fruttati, minerali, speziati e tostati","Sehr gute Struktur, sehr elegant und von ausgezeichneter Rundheit; balsamische, blumige, fruchtige, mineralische, würzige und geröstete Aromen"],"Intensive dhe mbështjellëse, me delikatesë të madhe":["Intense and enveloping, with great delicacy","Intenso e avvolgente, con grande delicatezza","Intensiv und umhüllend, mit großer Zartheit"],"Pjata të para me perime ose me mish, mish i bardhë, mish i kuq":["First courses with vegetables or meat, white meat, red meat","Primi piatti con verdure o carne, carni bianche, carni rosse","Erste Gänge mit Gemüse oder Fleisch, helles Fleisch, rotes Fleisch"],"Elegante dhe intensive, me nota frutash të kuqe të freskëta e të pjekura, si qershi dhe rrush frëngu.":["Elegant and intense, with notes of fresh and ripe red fruit, such as cherry and currant.","Elegante e intenso, con note di frutti rossi freschi e maturi, come ciliegia e ribes.","Elegant und intensiv, mit Noten frischer und reifer roter Früchte wie Kirsche und Johannisbeere."],"Harmonike, me strukturë dhe rrumbullakësi të mirë, përfundim i bukur me kripësi.":["Harmonious, with good structure and roundness, a lovely savoury finish.","Armonico, con buona struttura e rotondità, bel finale sapido.","Harmonisch, mit guter Struktur und Rundheit, schöner salziger Abgang."],"Pasta me domate, pica, peshk alla livornese, mish i bardhë.":["Pasta with tomato, pizza, fish alla livornese, white meat.","Pasta al pomodoro, pizza, pesce alla livornese, carni bianche.","Pasta mit Tomate, Pizza, Fisch alla livornese, helles Fleisch."],"E kuqe granati e lehtë":["Light garnet red","Rosso granato chiaro","Helles Granatrot"],"Hundë mjaft femërore me parfume kumbullash të kuqe dhe qershish, por edhe petalesh lulesh dhe mente":["A rather feminine nose with perfumes of red plums and cherries, but also flower petals and mint","Naso piuttosto femminile con profumi di prugne rosse e ciliegie, ma anche petali di fiori e menta","Eine eher feminine Nase mit Düften von roten Pflaumen und Kirschen, aber auch Blütenblättern und Minze"],"Fillim i butë që intensifikohet pak nga pak, me aroma të freskëta tipike të Piemontit: fruta të kuqe, trëndafil i egër dhe ribes, me nuanca piperi; qëndrueshmëri e bukur deri në përfundimin e gjatë":["A soft attack that intensifies little by little, with fresh aromas typical of Piedmont: red fruit, wild rose and currant, with hints of pepper; lovely persistence up to the long finish","Attacco morbido che si intensifica poco a poco, con profumi freschi tipici del Piemonte: frutti rossi, rosa canina e ribes, con sfumature di pepe; bella persistenza fino al lungo finale","Weicher Auftakt, der sich nach und nach verstärkt, mit frischen, typisch piemontesischen Aromen: rote Früchte, Wildrose und Johannisbeere, mit Pfefferanklängen; schöne Länge bis zum langen Abgang"],"Taglierini me bolognese, mish i papjekur (carne cruda), rrotulla mishi, lepur, kërci viçi dhe djathëra me brumë të fortë":["Taglierini Bolognese, raw meat (carne cruda), meat rolls, rabbit, veal shank and hard cheeses","Taglierini alla bolognese, carne cruda, involtini di carne, coniglio, stinco di vitello e formaggi a pasta dura","Taglierini Bolognese, rohes Fleisch (Carne cruda), Rouladen, Kaninchen, Kalbshaxe und Hartkäse"],"E ndritshme dhe frutore, një Barbera me thartësi gjallëruese":["Bright and fruity, a Barbera with invigorating tartness","Brillante e fruttato, un Barbera dall'acidità vivificante","Leuchtend und fruchtig, ein Barbera mit belebender Säure"],"E kuqe rubin me nuanca të shndritshme.":["Ruby red with bright hues.","Rosso rubino con sfumature brillanti.","Rubinrot mit leuchtenden Nuancen."],"Intensive, aristokratike, komplekse, me nota frutash të vogla, jamballi dhe duhani të ëmbël.":["Intense, aristocratic, complex, with notes of small fruits, saffron and sweet tobacco.","Intenso, aristocratico, complesso, con note di piccoli frutti, zafferano e tabacco dolce.","Intensiv, aristokratisch, komplex, mit Noten kleiner Früchte, Safran und süßem Tabak."],"Mbështjellëse, e pasur, me tanine mëndafshi që shoqërojnë ndjesinë e trupit dhe plotësisë.":["Enveloping, rich, with silky tannins that accompany the sensation of body and fullness.","Avvolgente, ricco, con tannini setosi che accompagnano la sensazione di corpo e pienezza.","Umhüllend, reich, mit seidigen Tanninen, die das Gefühl von Körper und Fülle begleiten."],"Mish i pjekur, taliolini me tartuf, gjah, djathëra të stagjionuar mirë.":["Roast meat, tagliolini with truffle, game, well-aged cheeses.","Carni arrosto, tagliolini al tartufo, selvaggina, formaggi ben stagionati.","Braten, Tagliolini mit Trüffel, Wild, gut gereifte Käse."],"E kuqe rubin dhe granate me nuanca të shndritshme.":["Ruby and garnet red with bright hues.","Rosso rubino e granato con sfumature brillanti.","Rubin- und Granatrot mit leuchtenden Nuancen."],"Komplekse, me karakter të madh, me nota frutash të pjekura, mente, eukalipti, gencianë dhe erëzash të holla.":["Complex, of great character, with notes of ripe fruit, mint, eucalyptus, gentian and fine spices.","Complesso, di grande carattere, con note di frutta matura, menta, eucalipto, genziana e spezie fini.","Komplex, von großem Charakter, mit Noten reifer Früchte, Minze, Eukalyptus, Enzian und feiner Gewürze."],"E pasur në strukturë, me thurje të ngushtë taninesh të holla; dallohet për elegancë dhe harmoni.":["Rich in structure, with a tight weave of fine tannins; it stands out for elegance and harmony.","Ricco di struttura, con una trama fitta di tannini fini; si distingue per eleganza e armonia.","Strukturreich, mit dichtem Gewebe feiner Tannine; besticht durch Eleganz und Harmonie."],"Vezë me tartuf të bardhë të Albës, biftek qengji në tigan, viç i stufuar në Barolo, djathë Castelmagno.":["Eggs with Alba white truffle, pan-fried lamb steak, veal braised in Barolo, Castelmagno cheese.","Uova al tartufo bianco d'Alba, bistecca d'agnello in padella, vitello brasato al Barolo, formaggio Castelmagno.","Eier mit weißem Alba-Trüffel, in der Pfanne gebratenes Lammsteak, in Barolo geschmortes Kalb, Castelmagno-Käse."],"Rubin i errët e i shndritshëm":["Dark, bright ruby","Rubino scuro e brillante","Dunkles, leuchtendes Rubin"],"Frut shumë i qartë dhe i shkëlqyer në hundë, boronica dhe mjedra":["Very clear, brilliant fruit on the nose, blueberries and raspberries","Frutto molto nitido e brillante al naso, mirtilli e lamponi","Sehr klare, brillante Frucht in der Nase, Heidelbeeren und Himbeeren"],"Shpaloset në qiellzë me tanine të buta, frut që shkrihet bukur, shumë kokrra të errëta; kadifeje":["It unfolds on the palate with soft tannins, fruit that melts beautifully, lots of dark berries; velvety","Si distende al palato con tannini morbidi, frutto che si scioglie splendidamente, molte bacche scure; vellutato","Entfaltet sich am Gaumen mit weichen Tanninen, wunderbar schmelzende Frucht, viele dunkle Beeren; samtig"],"E verdhë kashte intensive":["Intense straw yellow","Giallo paglierino intenso","Intensives Strohgelb"],"Aroma intensive dhe tërheqëse frutash të pjekura (pjeshkë dhe dardhë), të pasuruara me nuanca bajameje":["Intense, attractive aromas of ripe fruit (peach and pear), enriched with hints of almond","Profumi intensi e attraenti di frutta matura (pesca e pera), arricchiti da sfumature di mandorla","Intensive, ansprechende Aromen reifer Früchte (Pfirsich und Birne), bereichert durch Mandelanklänge"],"Hyrje që mbush gojën, plot ndjesi prekëse të buta dhe sensuale, e ndjekur nga një ndjesi intensive – por kurrë e plogësht; përfundim i plotë dhe i thatë":["A mouth-filling entry, full of soft, sensual tactile sensations, followed by an intense – but never flabby – sensation; a full, dry finish","Ingresso che riempie la bocca, ricco di sensazioni tattili morbide e sensuali, seguito da una sensazione intensa – ma mai molle; finale pieno e secco","Ein den Mund füllender Auftakt voller weicher, sinnlicher Tasteindrücke, gefolgt von einem intensiven – aber nie schlaffen – Eindruck; voller, trockener Abgang"],"Flan ose krem supë perimesh, sallata me fruta deti, pasta me mbushje delikate":["Vegetable flan or cream soup, seafood salads, pasta with delicate fillings","Sformati o vellutate di verdure, insalate di mare, pasta con ripieni delicati","Gemüseflan oder Gemüsecremesuppe, Meeresfrüchtesalate, Pasta mit zarter Füllung"],"Mish i kuq, gjah, djathëra":["Red meat, game, cheeses","Carni rosse, selvaggina, formaggi","Rotes Fleisch, Wild, Käse"],"Aroma frutash të kuqe tepër të pjekura dhe nota balsamike":["Aromas of overripe red fruit and balsamic notes","Profumi di frutti rossi surmaturi e note balsamiche","Aromen überreifer roter Früchte und balsamische Noten"],"Shije e thatë, e ngrohtë, me nota erëzash, jamballi, manaferre dhe qershie të pjekur":["Dry, warm taste, with notes of spices, saffron, blackberry and ripe cherry","Gusto secco, caldo, con note di spezie, zafferano, mora e ciliegia matura","Trockener, warmer Geschmack mit Noten von Gewürzen, Safran, Brombeere und reifer Kirsche"],"Shoqëron të gjitha pjatat me mish dhe gjah, si dhe djathërat e stazhionuar":["It accompanies all meat and game dishes, as well as aged cheeses","Accompagna tutti i piatti di carne e selvaggina, oltre ai formaggi stagionati","Begleitet alle Fleisch- und Wildgerichte sowie gereifte Käse"],"Nota frutash të kuqe të pjekura dhe qershish në alkool":["Notes of ripe red fruit and cherries in alcohol","Note di frutti rossi maturi e ciliegie sotto spirito","Noten reifer roter Früchte und Kirschen in Alkohol"],"E rreptë dhe kadifeje në qiellzë, me pas-shije manaferre dhe erëzash":["Austere and velvety on the palate, with an aftertaste of blackberry and spices","Austero e vellutato al palato, con retrogusto di mora e spezie","Streng und samtig am Gaumen, mit Nachgeschmack von Brombeere und Gewürzen"],"Pjata të para me shije, pjata të dyta me mish të kuq, gjah dhe djathëra të stazhionuar":["Flavourful first courses, main courses of red meat, game and aged cheeses","Primi piatti saporiti, secondi di carne rossa, selvaggina e formaggi stagionati","Würzige erste Gänge, Hauptgerichte mit rotem Fleisch, Wild und gereiften Käsen"],"Rubin i shndritshëm me një vezullim të lehtë granati":["Bright ruby with a light garnet shimmer","Rubino brillante con un leggero luccichio granato","Leuchtendes Rubin mit leichtem Granatschimmer"],"Hundë shumë emocionuese dhe ftuese, me mjedër, pak manaferra të ëmbla, shalqi; e qartë dhe e drejtpërdrejtë":["A very exciting, inviting nose, with raspberry, a little sweet blackberry, watermelon; clear and direct","Naso molto emozionante e invitante, con lampone, un po' di mora dolce, anguria; nitido e diretto","Eine sehr aufregende, einladende Nase mit Himbeere, etwas süßer Brombeere, Wassermelone; klar und direkt"],"Karakter i lëmuar; hapet me tanine me kokërr të imët, e lëngshme, me presion që ndërtohet fort; përfundim shumë i theksuar":["Polished character; it opens with fine-grained tannins, juicy, with pressure that builds strongly; a very pronounced finish","Carattere levigato; si apre con tannini a grana fine, succoso, con una spinta che cresce con forza; finale molto marcato","Geschliffener Charakter; öffnet sich mit feinkörnigen Tanninen, saftig, mit kräftig aufbauendem Druck; sehr ausgeprägter Abgang"],"E kuqe rubin intensive, si zakonisht.":["Intense ruby red, as usual.","Rosso rubino intenso, come di consueto.","Intensives Rubinrot, wie gewohnt."],"Nota të këndshme frutash të kuqe të pjekura dhe erëzash.":["Pleasant notes of ripe red fruit and spices.","Piacevoli note di frutti rossi maturi e spezie.","Angenehme Noten reifer roter Früchte und Gewürze."],"Aciditet krokant dhe teksturë taninike e gjerë dhe mbështjellëse.":["Crisp acidity and a broad, enveloping tannic texture.","Acidità croccante e trama tannica ampia e avvolgente.","Knackige Säure und weite, umhüllende Tannintextur."],"Rubin-vjollcë i pasur dhe i shndritshëm":["Rich, bright ruby-violet","Rubino-violaceo ricco e brillante","Reiches, leuchtendes Rubinviolett"],"Hapet me nota të holla erëzore, pak fara maraje, pastaj shumë qershi të errëta, lozonjare":["It opens with fine spicy notes, a little fennel seed, then lots of dark cherries, playful","Si apre con fini note speziate, un po' di semi di finocchio, poi molte ciliegie scure, giocoso","Öffnet sich mit feinen würzigen Noten, etwas Fenchelsamen, dann viele dunkle Kirschen, verspielt"],"E qartë dhe e lëngshme në qiellzë, hapet me tanine të holla; nota të bukura ribesi të zi dhe jamballi në përfundim":["Clear and juicy on the palate, it opens with fine tannins; lovely notes of blackcurrant and saffron on the finish","Nitido e succoso al palato, si apre con tannini fini; belle note di ribes nero e zafferano nel finale","Klar und saftig am Gaumen, öffnet sich mit feinen Tanninen; schöne Noten von schwarzer Johannisbeere und Safran im Abgang"],"Ngjyrë e thellë.":["Deep colour.","Colore profondo.","Tiefe Farbe."],"Aroma të ngrohta frutash të kuqe, kakaoje dhe erëzash.":["Warm aromas of red fruit, cocoa and spices.","Profumi caldi di frutti rossi, cacao e spezie.","Warme Aromen von roten Früchten, Kakao und Gewürzen."],"E gjerë dhe e rrumbullakët, me tanine të pjekura në mënyrë të përsosur dhe të lëmuara; frutë e pasur e mbështetur nga aciditet i ekuilibruar në mënyrë të përsosur.":["Broad and round, with perfectly ripe, polished tannins; rich fruit supported by perfectly balanced acidity.","Ampio e rotondo, con tannini perfettamente maturi e levigati; frutto ricco sostenuto da un'acidità perfettamente equilibrata.","Weit und rund, mit perfekt reifen, geschliffenen Tanninen; reiche Frucht, getragen von perfekt ausgewogener Säure."],"Rubin mesatarisht intensiv.":["Medium-intense ruby.","Rubino di media intensità.","Mittelintensives Rubin."],"Frutë e freskët dhe krokante, e theksuar nga nota të holla erëzash.":["Fresh, crisp fruit, accentuated by fine notes of spice.","Frutto fresco e croccante, accentuato da fini note speziate.","Frische, knackige Frucht, betont durch feine Gewürznoten."],"Trup mesatar me nota frutash të kuqe; tanine të holla, mëndafshi dhe shumë të lëmuara; mbështjellëse dhe shumë e butë, me përfundim të pastër dhe të gjallë.":["Medium body with notes of red fruit; fine, silky and very polished tannins; enveloping and very soft, with a clean, lively finish.","Corpo medio con note di frutti rossi; tannini fini, setosi e molto levigati; avvolgente e molto morbido, con finale pulito e vivace.","Mittlerer Körper mit Noten roter Früchte; feine, seidige und sehr geschliffene Tannine; umhüllend und sehr weich, mit sauberem, lebendigem Abgang."],"E kuqe rubin e gjallë.":["Lively ruby red.","Rosso rubino vivace.","Lebhaftes Rubinrot."],"Aroma frutash pylli, manaferre, mjedre dhe qershie të kuqe, me nota lulesh trëndafili të egër dhe erëzash piperi rozë dhe jamballi.":["Aromas of wild berries, blackberry, raspberry and red cherry, with notes of wild rose and spices of pink pepper and saffron.","Profumi di frutti di bosco, mora, lampone e ciliegia rossa, con note di rosa canina e spezie di pepe rosa e zafferano.","Aromen von Waldbeeren, Brombeere, Himbeere und roter Kirsche, mit Noten von Wildrose und Gewürzen wie rosa Pfeffer und Safran."],"Strukturë e mirë taninike, mbështjellëse dhe e ekuilibruar, me përfundim krokant dhe me kripësi.":["Good tannic structure, enveloping and balanced, with a crisp, savoury finish.","Buona struttura tannica, avvolgente ed equilibrato, con finale croccante e sapido.","Gute Tanninstruktur, umhüllend und ausgewogen, mit knackigem, salzigem Abgang."],"Ngjyrë intensive dhe e errët, që paralajmëron një verë me përqendrim të bukur.":["Intense, dark colour, heralding a wine of lovely concentration.","Colore intenso e scuro, che annuncia un vino di bella concentrazione.","Intensive, dunkle Farbe, die einen Wein schöner Konzentration ankündigt."],"E pasur dhe komplekse: aroma frutash të kuqe të pjekura, me nota duhani të ëmbël dhe vanilje.":["Rich and complex: aromas of ripe red fruit, with notes of sweet tobacco and vanilla.","Ricco e complesso: profumi di fru
