h si stufat derri të egër ose rosë në furrë":["Main courses of red meat cooked long and slowly (salmì, peposo, stews); also game such as wild boar stew or roast duck","Secondi di carne rossa a lunga e lenta cottura (salmì, peposo, stufati); anche selvaggina come stufato di cinghiale o anatra al forno","Hauptgerichte mit lange und langsam gegartem rotem Fleisch (Salmì, Peposo, Schmorgerichte); auch Wild wie Wildschweinragout oder Ente aus dem Ofen"],"Mish kau, qengj në furrë ose në skarë, gjah, mish i stufuar, djathëra të stazhionuar me shije të plotë dhe pjata të rafinuara":["Beef, lamb roasted or grilled, game, stews, full-flavoured aged cheeses and refined dishes","Manzo, agnello al forno o alla griglia, selvaggina, stufati, formaggi stagionati saporiti e piatti raffinati","Rind, Lamm aus dem Ofen oder vom Grill, Wild, Schmorgerichte, kräftige gereifte Käse und feine Gerichte"],"E kuqe rubin intensive":["Intense ruby red","Rosso rubino intenso","Intensives Rubinrot"],"Verë shumëplanëshe në hundë: luleshtrydhe të egra, mjedër dhe qershi ndërthuren me nota erëzore elegante e të përmbajtura dhe aroma stralli":["A multi-layered wine on the nose: wild strawberries, raspberries and cherries mingle with elegant, restrained spicy notes and flint aromas","Vino dal naso stratificato: fragoline di bosco, lamponi e ciliegie si intrecciano con note speziate eleganti e misurate e sentori di pietra focaia","Vielschichtiger Wein in der Nase: Walderdbeeren, Himbeeren und Kirschen verbinden sich mit eleganten, zurückhaltenden Gewürznoten und Feuersteinaromen"],"E ekuilibruar mirë, me elegancë minerale që e bën të 'kërcejë' në qiellzë; përfundim i gjatë dhe emocionues":["Well balanced, with a mineral elegance that makes it 'dance' on the palate; long, exciting finish","Ben equilibrato, con un'eleganza minerale che lo fa 'danzare' al palato; finale lungo ed emozionante","Gut ausgewogen, mit mineralischer Eleganz, die ihn am Gaumen 'tanzen' lässt; langer, aufregender Abgang"],"Shoqërues ideal për shpinë dreri me pure molle me verë të kuqe dhe spätzle me djathë quark":["Ideal partner for saddle of venison with apple purée in red wine and spätzle with quark","Compagno ideale per sella di cervo con purea di mele al vino rosso e spätzle al quark","Idealer Begleiter zu Hirschrücken mit Rotwein-Apfelpüree und Topfenspätzle"],"E verdhë e zbehtë e shndritshme me nuanca të gjelbra":["Bright pale yellow with green hues","Giallo tenue brillante con riflessi verdi","Leuchtendes Blassgelb mit grünen Reflexen"],"Mollë jeshile dhe pjeshkë e bardhë ndërthuren me nuanca të holla melise dhe nenexhiku":["Green apple and white peach mingle with fine hints of lemon balm and mint","Mela verde e pesca bianca si intrecciano con fini sfumature di melissa e menta","Grüner Apfel und weißer Pfirsich verbinden sich mit feinen Anklängen von Zitronenmelisse und Minze"],"Pjeshka është shumë e fortë edhe në qiellzë, duke i dhënë verës karakterin e saj të gjallë":["The peach is very strong on the palate too, giving the wine its lively character","La pesca è molto forte anche al palato, donando al vino il suo carattere vivace","Der Pfirsich ist auch am Gaumen sehr ausgeprägt und verleiht dem Wein seinen lebendigen Charakter"],"Zgjedhje tradicionale rajonale me supë vere Terlano, sallatë me asparagus të bardhë të papjekur; edhe pica, pasta, pjata tiroleze dhe mish viçi":["Traditional regional choices with Terlano wine soup, raw white asparagus salad; also pizza, pasta, Tyrolean dishes and veal","Scelte regionali tradizionali come la zuppa al vino di Terlano, insalata di asparagi bianchi crudi; anche pizza, pasta, piatti tirolesi e vitello","Traditionelle regionale Wahl mit Terlaner Weinsuppe, Salat von rohem weißem Spargel; auch Pizza, Pasta, Tiroler Gerichte und Kalb"],"Buqetë me nota të forta frutash të kuqe dhe erëzash, me një nuancë të këndshme balsamike":["Bouquet with strong notes of red fruit and spices, with a pleasant balsamic hint","Bouquet con decise note di frutti rossi e spezie, con una piacevole sfumatura balsamica","Bouquet mit kräftigen Noten roter Früchte und Gewürze, mit angenehm balsamischem Anklang"],"E butë, e balancuar, me tanine mesatarisht të qëndrueshme, shije erëzore dhe nota kumbulle të tharë":["Soft, balanced, with medium-persistent tannins, spicy taste and notes of dried plum","Morbido, equilibrato, con tannini di media persistenza, gusto speziato e note di prugna secca","Weich, ausgewogen, mit mittel anhaltenden Tanninen, würzigem Geschmack und Noten von Trockenpflaume"],"Pasuron pjata të strukturuara me mish të kuq; për t'u provuar me derr të egër në salcë siciliane me barishte aromatike":["It enhances structured red-meat dishes; try it with wild boar in a Sicilian sauce with aromatic herbs","Esalta piatti strutturati di carne rossa; da provare con cinghiale in salsa siciliana alle erbe aromatiche","Unterstreicht strukturierte Gerichte mit rotem Fleisch; probieren mit Wildschwein in sizilianischer Kräutersauce"],"E kuqe rubin e ndritshme dhe e gjallë":["Bright, lively ruby red","Rosso rubino brillante e vivace","Leuchtendes, lebendiges Rubinrot"],"Një shpërthim aromash frutash të kuqe, lulesh të kuqe dhe erëzash":["An explosion of aromas of red fruit, red flowers and spices","Un'esplosione di profumi di frutti rossi, fiori rossi e spezie","Eine Explosion von Aromen roter Früchte, roter Blüten und Gewürze"],"Me trup të plotë, e butë dhe e balancuar në qiellzë, me rikthim aromash frutash të kuqe":["Full-bodied, soft and balanced on the palate, with a return of red-fruit aromas","Di corpo pieno, morbido ed equilibrato al palato, con un ritorno di aromi di frutti rossi","Vollmundig, weich und ausgewogen am Gaumen, mit Rückkehr der roten Fruchtaromen"],"Shkon mirë me makarona, mish në skarë, açuge, perime dhe djathë të stazhionuar":["Goes well with pasta, grilled meat, anchovies, vegetables and aged cheese","Si abbina bene a pasta, carni alla griglia, acciughe, verdure e formaggi stagionati","Passt gut zu Pasta, gegrilltem Fleisch, Sardellen, Gemüse und gereiftem Käse"],"E kuqe e ndritshme":["Bright red","Rosso brillante","Leuchtendes Rot"],"Buqetë e freskët dhe frutore":["Fresh, fruity bouquet","Bouquet fresco e fruttato","Frisches, fruchtiges Bouquet"],"Verë e shkumëzuar gjysmë e ëmbël, me shije të butë dhe harmonike":["Semi-sweet sparkling wine, with a soft, harmonious taste","Vino frizzante semidolce, dal gusto morbido e armonico","Halbsüßer Schaumwein mit weichem, harmonischem Geschmack"],"Shkon mirë me pjata të lehta dhe është e shkëlqyer me recetat tradicionale të Emilia-Romagna-s; befasuese e gjithanshme me ushqime pikante, mish në skarë dhe pica":["Goes well with light dishes and is excellent with traditional Emilia-Romagna recipes; surprisingly versatile with spicy food, grilled meat and pizza","Si abbina bene a piatti leggeri ed è ottimo con le ricette tradizionali dell'Emilia-Romagna; sorprendentemente versatile con cibi piccanti, carni alla griglia e pizza","Passt gut zu leichten Gerichten und ist ausgezeichnet zu traditionellen Rezepten der Emilia-Romagna; überraschend vielseitig zu scharfen Speisen, Gegrilltem und Pizza"],"Aromë frutore, aromatike dhe e lëngshme":["Fruity, aromatic and juicy aroma","Profumo fruttato, aromatico e succoso","Fruchtiger, aromatischer und saftiger Duft"],"Frutore, aromatike dhe e lëngshme, me profil mesatarisht të ëmbël që anon qartë nga i ëmbli":["Fruity, aromatic and juicy, with a medium-sweet profile that clearly leans towards sweet","Fruttato, aromatico e succoso, con un profilo mediamente dolce che tende chiaramente al dolce","Fruchtig, aromatisch und saftig, mit halbsüßem Profil, das deutlich zur Süße neigt"],"Klasikisht me makarona dhe pica – ëmbëlsia e Lambrusco-s balancon mirë salcat pikante me domate":["Classically with pasta and pizza – the sweetness of the Lambrusco balances spicy tomato sauces well","Classicamente con pasta e pizza – la dolcezza del Lambrusco bilancia bene i sughi piccanti al pomodoro","Klassisch zu Pasta und Pizza – die Süße des Lambrusco gleicht scharfe Tomatensaucen gut aus"],"Shkumë me tekstur të hollë.":["Fine-textured mousse.","Spuma dalla trama fine.","Feinporiger Schaum."],"Aroma komplekse që vijnë nga majaja.":["Complex aromas deriving from the yeast.","Profumi complessi che derivano dal lievito.","Komplexe Aromen aus der Hefe."],"Shpejt pasohen nga frutë me shije qershie dhe boronice, pastaj nota lulesh.":["Quickly followed by fruit with cherry and blueberry flavours, then floral notes.","Subito seguiti da frutta con sapori di ciliegia e mirtillo, poi note floreali.","Schnell gefolgt von Frucht mit Kirsch- und Heidelbeergeschmack, dann Blütennoten."],"Shumë e mirë me pjatat tradicionale emiliane: cappelletti në lëng mishi, Parmigiano dhe pasta e mbushur.":["Very good with traditional Emilian dishes: cappelletti in broth, Parmigiano and filled pasta.","Ottimo con i piatti tradizionali emiliani: cappelletti in brodo, Parmigiano e pasta ripiena.","Sehr gut zu traditionellen emilianischen Gerichten: Cappelletti in Brühe, Parmigiano und gefüllte Pasta."],"Rubin intensiv i thellë":["Deep, intense ruby","Rubino intenso e profondo","Tiefes, intensives Rubin"],"E rafinuar dhe komplekse, me aroma vaniljeje dhe frutash të vogla të errëta të pyllit":["Refined and complex, with aromas of vanilla and small dark wild berries","Raffinato e complesso, con profumi di vaniglia e piccoli frutti di bosco scuri","Fein und komplex, mit Aromen von Vanille und kleinen dunklen Waldbeeren"],"E ngrohtë, e thatë, e qëndrueshme dhe harmonike":["Warm, dry, persistent and harmonious","Caldo, secco, persistente e armonico","Warm, trocken, anhaltend und harmonisch"],"Supa, pasta dhe bishtajore, mish në skarë, i stufuar ose në gjellë":["Soups, pasta and legumes, grilled meat, stewed or braised","Zuppe, pasta e legumi, carni alla griglia, stufate o in umido","Suppen, Pasta und Hülsenfrüchte, gegrilltes, geschmortes oder gedünstetes Fleisch"],"E kuqe rubin e thellë":["Deep ruby red","Rosso rubino profondo","Tiefes Rubinrot"],"Në gjerësinë e saj gjejmë qershi në alkool dhe çokollatë, manushaqe, vanilje dhe erëza të tjera":["In its breadth we find cherries in alcohol and chocolate, violet, vanilla and other spices","Nella sua ampiezza troviamo ciliegie sotto spirito e cioccolato, viola, vaniglia e altre spezie","In seiner Weite finden sich Kirschen in Alkohol und Schokolade, Veilchen, Vanille und andere Gewürze"],"E plotë dhe e butë, e ekuilibruar në mënyrë të përsosur nga tanine të gjalla dhe kadifeje":["Full and soft, perfectly balanced by lively, velvety tannins","Pieno e morbido, perfettamente equilibrato da tannini vivaci e vellutati","Voll und weich, perfekt ausbalanciert durch lebendige, samtige Tannine"],"Verë e strukturuar me trup të plotë, që shkëlqen me mish të kuq dhe mish të pjekur; e shkëlqyer edhe me mish të tharë":["A structured, full-bodied wine that shines with red meat and roasts; excellent also with cured meats","Vino strutturato e corposo che brilla con carni rosse e arrosti; ottimo anche con i salumi","Ein strukturierter, vollmundiger Wein, der zu rotem Fleisch und Braten glänzt; ausgezeichnet auch zu Wurstwaren"],"E kuqe patëllxhani e errët me buzë më të çelur":["Dark aubergine red with a lighter rim","Rosso melanzana scuro con unghia più chiara","Dunkles Auberginenrot mit hellerem Rand"],"Hundë delikate me aroma kokrrash të kuqe, me nuanca buke të errët dhe manaferrash":["Delicate nose with aromas of red berries, with hints of dark bread and blackberries","Naso delicato con profumi di bacche rosse, con sfumature di pane scuro e more","Zarte Nase mit Aromen roter Beeren, Anklängen von dunklem Brot und Brombeeren"],"E rrumbullakët në qiellzë, me tanine të mëndafshta, jo tepër e harlisur; përfundim mesatarisht i gjatë dhe frutor":["Round on the palate, with silky tannins, not overly exuberant; medium-long, fruity finish","Rotondo al palato, con tannini setosi, non troppo esuberante; finale di media lunghezza e fruttato","Rund am Gaumen, mit seidigen Tanninen, nicht zu üppig; mittellanger, fruchtiger Abgang"],"Ngjyrë rubin e errët me pak qelibar në buzë":["Dark ruby colour with a little amber on the rim","Colore rubino scuro con un po' di ambra sull'unghia","Dunkle Rubinfarbe mit etwas Bernstein am Rand"],"Hundë e jashtëzakonshme me aroma provokuese mishi në skarë, qershish të zeza të ëmbla, erëzash aziatike, si dhe nota balsamike dhe tymi":["An exceptional nose with provocative aromas of grilled meat, sweet black cherries, Asian spices, as well as balsamic and smoky notes","Un naso eccezionale con profumi provocanti di carne alla griglia, ciliegie nere dolci, spezie asiatiche, oltre a note balsamiche e affumicate","Eine außergewöhnliche Nase mit provokanten Aromen von gegrilltem Fleisch, süßen schwarzen Kirschen, asiatischen Gewürzen sowie balsamischen und rauchigen Noten"],"Pasuri e shkëlqyer, frut tepër i ëmbël dhe i pastër, trup i plotë dhe shtresa thellësie; përfundimi zgjat lehtësisht 35–40 sekonda":["Excellent richness, extremely sweet and pure fruit, full body and layers of depth; the finish easily lasts 35–40 seconds","Ricchezza eccellente, frutto estremamente dolce e puro, corpo pieno e strati di profondità; il finale dura facilmente 35–40 secondi","Hervorragende Fülle, äußerst süße und reine Frucht, voller Körper und Schichten von Tiefe; der Abgang hält leicht 35–40 Sekunden"],"Rubin intensiv":["Intense ruby","Rubino intenso","Intensives Rubin"],"Hapet në hundë me kompleksitet elegant dhe aroma karakteristike frutash të kuqe të freskëta, me nota erëzore":["It opens on the nose with elegant complexity and characteristic aromas of fresh red fruit, with spicy notes","Si apre al naso con elegante complessità e profumi caratteristici di frutti rossi freschi, con note speziate","Öffnet sich in der Nase mit eleganter Komplexität und charakteristischen Aromen frischer roter Früchte, mit würzigen Noten"],"Harmonike në shije, me strukturë të madhe taninike dhe aciditet të shkëlqyer, qëndrueshmë , armonici e delicati","Tanninbetonter Geschmack; die Tannine sind reif, harmonisch und zart"],"E kuqe rubin e errët me nuanca të kuqe të ndezura":["Dark ruby red with bright red hues","Rosso rubino scuro con riflessi rosso acceso","Dunkles Rubinrot mit leuchtend roten Reflexen"],"Nota frutore të pasura me fruta të pyllit dhe kumbull, me nuanca frutash të pjekura dhe reçeli":["Rich fruity notes of wild berries and plum, with hints of ripe fruit and jam","Ricche note fruttate di frutti di bosco e prugna, con sfumature di frutta matura e confettura","Reiche fruchtige Noten von Waldbeeren und Pflaume, mit Anklängen von reifen Früchten und Konfitüre"],"Sulm delikat, tanine kadifeje, shije e pasur dhe e rrumbullakët, e qëndrueshme dhe me stil":["Delicate attack, velvety tannins, rich and round taste, persistent and stylish","Attacco delicato, tannini vellutati, gusto ricco e rotondo, persistente e di stile","Zarter Auftakt, samtige Tannine, reicher und runder Geschmack, anhaltend und stilvoll"],"E kuqe vjollcë me nuanca manushaqeje; e padepërtueshme":["Violet red with violet hues; impenetrable","Rosso violaceo con riflessi di viola; impenetrabile","Violettrot mit Veilchenreflexen; undurchdringlich"],"Fruta të kuqe, manaferra; erëzore si vanilje, piper i zi në kokrra dhe dëllinjë":["Red fruit, blackberries; spicy such as vanilla, black peppercorns and juniper","Frutti rossi, more; speziato come vaniglia, pepe nero in grani e ginepro","Rote Früchte, Brombeeren; würzig wie Vanille, schwarze Pfefferkörner und Wacholder"],"Jashtëzakonisht elegante, e butë dhe mbështjellëse, me tanin të mëndafshtë por të fuqishëm":["Extraordinarily elegant, soft and enveloping, with silky but powerful tannin","Straordinariamente elegante, morbido e avvolgente, con tannino setoso ma potente","Außergewöhnlich elegant, weich und umhüllend, mit seidigem, aber kraftvollem Tannin"],"Verë e kuqe frizzante, e thatë":["Dry, sparkling (frizzante) red wine","Vino rosso frizzante, secco","Trockener, perlender (frizzante) Rotwein"],"Aromatike":["Aromatic","Aromatico","Aromatisch"],"Lambrusco i lehtë, freskues dhe aromatik":["A light, refreshing, aromatic Lambrusco","Lambrusco leggero, rinfrescante e aromatico","Ein leichter, erfrischender, aromatischer Lambrusco"],"E kuqe":["Red","Rosso","Rot"],"Kompleksitet aromash, nga nota frutash pylli të pjekura deri te nuanca delikate erëzore":["Complexity of aromas, from notes of ripe wild berries to delicate spicy hints","Complessità di profumi, da note di frutti di bosco maturi a delicate sfumature speziate","Komplexe Aromen, von Noten reifer Waldbeeren bis zu zarten würzigen Anklängen"],"Mbështjellëse, me tanine të buta dhe qëndrueshmëri të këndshme":["Enveloping, with soft tannins and pleasant persistence","Avvolgente, con tannini morbidi e piacevole persistenza","Umhüllend, mit weichen Tanninen und angenehmer Länge"],"Pjata me mish të kuq, gjah ose djathëra të stazhionuar":["Dishes with red meat, game or aged cheeses","Piatti di carne rossa, selvaggina o formaggi stagionati","Gerichte mit rotem Fleisch, Wild oder gereiften Käsen"],"Ngjyra rubin intensive tërheq vëmendjen":["The intense ruby colour catches the eye","Il colore rubino intenso cattura lo sguardo","Die intensive Rubinfarbe zieht den Blick auf sich"],"Thurje olfaktive mbështjellëse, ku nota frutash të kuqe të pjekura ndërthuren me nuanca delikate lehtësisht erëzore":["An enveloping olfactory weave, where notes of ripe red fruit mingle with delicate, lightly spicy hints","Una trama olfattiva avvolgente, dove note di frutti rossi maturi si intrecciano con delicate sfumature leggermente speziate","Ein umhüllendes Duftgewebe, in dem sich Noten reifer roter Früchte mit zarten, leicht würzigen Anklängen verbinden"],"Ekuilibër i hollë mes freskisë dhe strukturës":["A fine balance between freshness and structure","Un fine equilibrio tra freschezza e struttura","Ein feines Gleichgewicht zwischen Frische und Struktur"],"Mish i kuq, djathëra të stazhionuar, pjata të shijs umë fruta të plota dhe shumë të ëmbla në qiellzë, ndërtohet shtresë pas shtrese, me shumë tanin me kokërr të imët; e re por tashmë shumë e pijshme, në fund boronica":["Lots of full, very sweet fruit on the palate, building layer after layer, with plenty of fine-grained tannin; young but already very drinkable, blueberries on the finish","Molto frutto pieno e dolcissimo al palato, si costruisce strato dopo strato, con molto tannino a grana fine; giovane ma già molto bevibile, mirtilli nel finale","Viel volle, sehr süße Frucht am Gaumen, baut sich Schicht für Schicht auf, mit viel feinkörnigem Tannin; jung, aber schon sehr trinkig, Heidelbeeren im Abgang"],"Rubin-vjollcë i dendur që shkëlqen":["Dense, shining ruby-violet","Rubino-violaceo fitto e brillante","Dichtes, glänzendes Rubinviolett"],"Hundë e hollë me nota mjedrash të pjekura, jargavani, manaferrash":["Fine nose with notes of ripe raspberries, lilac, blackberries","Naso fine con note di lamponi maturi, lillà, more","Feine Nase mit Noten reifer Himbeeren, Flieder, Brombeeren"],"Shumë e balancuar në qiellzë, me tanine të holla, e endur dendur, shumë frut kokrrash të errëta me bërthamë të ëmbël; e kapshme, shtrihet me hark të bukur, përfundim i gjatë":["Very balanced on the palate, with fine tannins, densely woven, lots of dark berry fruit with a sweet core; grippy, it stretches in a lovely arc, long finish","Molto equilibrato al palato, con tannini fini, fittamente intessuto, molto frutto di bacche scure con un cuore dolce; grippante, si distende con un bell'arco, finale lungo","Sehr ausgewogen am Gaumen, mit feinen Tanninen, dicht gewoben, viel dunkle Beerenfrucht mit süßem Kern; griffig, spannt einen schönen Bogen, langer Abgang"],"Rozë e zbehtë me intensitet të ndryshëm; shkumë e imët dhe e qëndrueshme":["Pale pink of varying intensity; fine, persistent mousse","Rosa tenue di intensità variabile; spuma fine e persistente","Zartrosa von unterschiedlicher Intensität; feiner, anhaltender Schaum"],"Aroma elegante me nuanca lulesh të bardha dhe frutash të kuqe, edhe akacie, glicine dhe manushaqe":["Elegant aromas with hints of white flowers and red fruit, also acacia, wisteria and violet","Profumi eleganti con sfumature di fiori bianchi e frutti rossi, anche acacia, glicine e viola","Elegante Aromen mit Anklängen weißer Blüten und roter Früchte, auch Akazie, Glyzinie und Veilchen"],"Aciditet i ndritshëm dhe i gjallë që jep freski; strukturë e butë dhe e rafinuar":["Bright, lively acidity that gives freshness; soft, refined structure","Acidità brillante e vivace che dona freschezza; struttura morbida e raffinata","Leuchtende, lebendige Säure, die Frische verleiht; weiche, feine Struktur"],"Brut: me shumë pjata të kuzhinave ndërkombëtare; Extra Dry: ideale si aperitiv dhe me pjata me shije delikate":["Brut: with many dishes of international cuisines; Extra Dry: ideal as an aperitif and with delicately flavoured dishes","Brut: con molti piatti delle cucine internazionali; Extra Dry: ideale come aperitivo e con piatti dal gusto delicato","Brut: zu vielen Gerichten internationaler Küchen; Extra Dry: ideal als Aperitif und zu zart gewürzten Gerichten"],"Aromë intensive":["Intense aroma","Profumo intenso","Intensiver Duft"],"Stil dhe finesë; Prosecco me shije të pagabueshme dhe elegante":["Style and finesse; a Prosecco with an unmistakable, elegant taste","Stile e finezza; un Prosecco dal gusto inconfondibile ed elegante","Stil und Finesse; ein Prosecco mit unverwechselbarem, elegantem Geschmack"],"Shkon në mënyrë të përsosur me pasta salmoni, pjata të lehta dhe aperitivë":["Goes perfectly with salmon pasta, light dishes and aperitifs","Si abbina perfettamente a pasta al salmone, piatti leggeri e aperitivi","Passt perfekt zu Lachspasta, leichten Gerichten und Aperitifs"],"Aromë e freskët dhe frutore që të kujton mollën e papjekur dhe bananen; nota lulore dominuese është lulja e akacies":["Fresh, fruity aroma reminiscent of unripe apple and banana; the dominant floral note is acacia blossom","Profumo fresco e fruttato che ricorda la mela acerba e la banana; la nota floreale dominante è il fiore d'acacia","Frischer, fruchtiger Duft, der an unreifen Apfel und Banane erinnert; die dominierende Blütennote ist Akazienblüte"],"Në gojë zbulon mollë, dardhë, portokall, kumbull, mushmollë, ananas, por edhe kulumbri dhe bajame të freskët; freski dhe kripësi e madhe, e drejtpërdrejtë dhe vertikale":["On the palate it reveals apple, pear, orange, plum, medlar, pineapple, but also greengage and fresh almonds; great freshness and saltiness, straight and vertical","In bocca rivela mela, pera, arancia, prugna, nespola, ananas, ma anche susina verde e mandorle fresche; grande freschezza e sapidità, diretto e verticale","Am Gaumen zeigt er Apfel, Birne, Orange, Pflaume, Mispel, Ananas, aber auch Reneklode und frische Mandeln; große Frische und Salzigkeit, geradlinig und vertikal"],"Shumë e mirë si aperitiv":["Very good as an aperitif","Ottimo come aperitivo","Sehr gut als Aperitif"],"E kuqe rubin me reflekse vjollcë":["Ruby red with violet reflections","Rosso rubino con riflessi violacei","Rubinrot mit violetten Reflexen"],"Hundë intensive me nota të qarta të ëmbla qershie, ribesi të kuq, mjedre dhe luleshtrydheje të egër":["Intense nose with clear sweet notes of cherry, red currant, raspberry and wild strawberry","Naso intenso con nitide note dolci di ciliegia, ribes rosso, lampone e fragolina di bosco","Intensive Nase mit klaren süßen Noten von Kirsche, roter Johannisbeere, Himbeere und Walderdbeere"],"Strukturë e mirë, butësi dhe elegancë në qiellzë; rimerr frutin me një nuancë të lehtë pikante. Pak plakje shtesë nuk do t'i bënte keq, por vera është tashmë interesante dhe e afrueshme":["Good structure, softness and elegance on the palate; it picks up the fruit with a light spicy hint. A little more ageing would not hurt, but the wine is already interesting and approachable","Buona struttura, morbidezza ed eleganza al palato; riprende il frutto con una leggera sfumatura piccante. Un po' di affinamento in più non guasterebbe, ma il vino è già interessante e accessibile","Gute Struktur, Weichheit und Eleganz am Gaumen; greift die Frucht mit leicht pikantem Anklang auf. Etwas mehr Reife würde nicht schaden, aber der Wein ist schon interessant und zugänglich"],"Rubin i shndritshëm me nuanca granati":["Bright ruby with garnet hues","Rubino brillante con riflessi granati","Leuchtendes Rubin mit granatroten Reflexen"],"Aroma të holla erëzore: karafil, bajame të kripura, nuanca të lehta gështenje dhe manushaqeje":["Fine spicy aromas: clove, salted almonds, light hints of chestnut and violet","Fini profumi speziati: chiodi di garofano, mandorle salate, leggere sfumature di castagna e viola","Feine würzige Aromen: Nelke, gesalzene Mandeln, leichte Anklänge von Kastanie und Veilchen"],"E pasur në qiellzë, ndërtohet bukur, por pastaj shfaq tanine mjaft të ashpra; përfundim i gjatë, mund të fitojë ende shumë me plakjen":["Rich on the palate, it builds nicely but then shows rather rough tannins; long finish, it can still gain much with ageing","Ricco al palato, si costruisce bene ma poi mostra tannini piuttosto ruvidi; finale lungo, può ancora guadagnare molto con l'invecchiamento","Reich am Gaumen, baut sich schön auf, zeigt dann aber recht raue Tannine; langer Abgang, kann mit der Reife noch viel gewinnen"],"E kuqe rubin e shndritshme":["Bright ruby red","Rosso rubino brillante","Leuchtendes Rubinrot"],"Fruta të kuqe të pjekura, qershi, ribes":["Ripe red fruit, cherry, currant","Frutti rossi maturi, ciliegia, ribes","Reife rote Früchte, Kirsche, Johannisbeere"],"Me strukturë të mirë, dinamike":["Well structured, dynamic","Ben strutturato, dinamico","Gut strukturiert, dynamisch"],"Pasta e fagioli, rizoto me porcini, pulë alla cacciatora":["Pasta e fagioli, risotto with porcini, chicken alla cacciatora","Pasta e fagioli, risotto ai porcini, pollo alla cacciatora","Pasta e fagioli, Risotto mit Steinpilzen, Huhn alla cacciatora"],"Rubin i shndritshëm me një nuancë të lehtë vjollce":["Bright ruby with a light violet hue","Rubino brillante con una leggera sfumatura violacea","Leuchtendes Rubin mit leicht violettem Schimmer"],"Hundë tërheqëse aromatike me qershi dhe reçel luleshtrydhesh, manaferra, ribes i zi dhe disa nuanca jamballi":["Attractive aromatic nose with cherry and strawberry jam, blackberries, blackcurrant and some hints of saffron","Naso aromatico attraente con ciliegia e confettura di fragole, more, ribes nero e qualche sfumatura di zafferano","Ansprechende aromatische Nase mit Kirsche und Erdbeerkonfitüre, Brombeeren, schwarzer Johannisbeere und etwas Safran"],"Masive dhe e fuqishme në qiellzë, me substancë dhe lëng të konsiderueshëm, mbështjellëse dhe me shumë shtresa; lojë e mrekullueshme mes frutit dhe aciditetit, potencial i mëtejshëm plakjeje":["Massive and powerful on the palate, with considerable substance and juice, enveloping and multi-layered; a wonderful play between fruit and acidity, further ageing potential","Massiccio e potente al palato, con notevole sostanza e succo, avvolgente e stratificato; meraviglioso gioco tra frutto e acidità, ulteriore potenziale di invecchiamento","Massiv und kraftvoll am Gaumen, mit beträchtlicher Substanz und Saft, umhüllend und vielschichtig; wunderbares Spiel zwischen Frucht und Säure, weiteres Reifepotenzial"],"E kuqe rubin e shndritshme me vezullim vjollce":["Bright ruby red with a violet shimmer","Rosso rubino brillante con un luccichio violaceo","Leuchtendes Rubinrot mit violettem Schimmer"],"Hundë e përmbajtur me nota dominuese pikante vaniljeje dhe jamballi":["Restrained nose with dominant spicy notes of vanilla and saffron","Naso contenuto con note dominanti speziate di vaniglia e zafferano","Zurückhaltende Nase mit dominierenden würzigen Noten von Vanille und Safran"],"Çuditërisht frutore në qiellzë, me pije të gjallë":["Surprisingly fruity on the palate, lively to drink","Sorprendentemente fruttato al palato, di beva vivace","Überraschend fruchtig am Gaumen, lebendig zu trinken"],"E kuqe rubin me nuanca të lehta vjollcë.":["Ruby red with light violet hues.","Rosso rubino con leggeri riflessi violacei.","Rubinrot mit leichten violetten Reflexen."],"Komplekse dhe elegante, plot nota frutash të kuqe dhe erëzash.":["Complex and elegant, full of notes of red fruit and spices.","Complesso ed elegante, ricco di note di frutti rossi e spezie.","Komplex und elegant, voller Noten von roten Früchten und Gewürzen."],"E thatë, e gjerë dhe harmonike, me trup të plotë.":["Dry, broad and harmonious, full-bodied.","Secco, ampio e armonico, di corpo pieno.","Trocken, weit und harmonisch, vollmundig."],"Një shpërthim aromash: fruta të kuqe me nuanca vishnje (marasca)":["An explosion of aromas: red fruit with hints of sour cherry (marasca)","Un'esplosione di profumi: frutti rossi con sfumature di amarena (marasca)","Eine Explosion von Aromen: rote Früchte mit Anklängen von Sauerkirsche (Marasca)"],"Shije e kripur dhe e butë":["Savoury, soft taste","Gusto sapido e morbido","Salziger, weicher Geschmack"],"Antipasta, pjata të para të shijshme me mish, mish i pjekur, djathëra të freskët":["Starters, tasty first courses with meat, roast meat, fresh cheeses","Antipasti, primi piatti saporiti di carne, carni arrosto, formaggi freschi","Vorspeisen, würzige erste Gänge mit Fleisch, Braten, Frischkäse"],"Ngjyrë e verdhë kashte e ndritshme":["Bright straw-yellow colour","Colore giallo paglierino brillante","Leuchtend strohgelbe Farbe"],"Profile aromatike që lëkunden mes lulesh të bardha, lëkure agrumesh dhe një note delikate bajameje të hidhur":["Aromatic profiles ranging between white flowers, citrus peel and a delicate note of bitter almond","Profili aromatici che oscillano tra fiori bianchi, scorza di agrumi e una delicata nota di mandorla amara","Aromaprofile zwischen weißen Blüten, Zitrusschale und einer zarten Note von Bittermandel"],"Gllënjka është e freskët dhe nervoze, e mbështetur nga një kripësi e këndshme që e zgjat pijen pa e rënduar":["The sip is fresh and nervy, supported by a pleasant saltiness that lengthens the drink without weighing it down","Il sorso è fresco e nervoso, sostenuto da una piacevole sapidità che allunga la beva senza appesantirla","Der Schluck ist frisch und nervig, getragen von angenehmer Salzigkeit, die ihn verlängert, ohne zu beschweren"],"Shkon lehtë me pjata me fruta deti, krustace dhe peshk në skarë, rizoto me fruta deti dhe përgatitje delikate si sashimi":["Pairs easily with seafood dishes, shellfish and grilled fish, seafood risotto and delicate preparations such as sashimi","Si abbina facilmente a piatti di mare, crostacei e pesce alla griglia, risotto ai frutti di mare e preparazioni delicate come il sashimi","Passt leicht zu Meeresfrüchtegerichten, Krustentieren und gegrilltem Fisch, Meeresfrüchte-Risotto und zarten Zubereitungen wie Sashimi"],"Ngjyra të zbehta pudre dhe perle":["Pale powder and pearl tones","Tonalità tenui di cipria e perla","Blasse Puder- und Perltöne"],"Aroma ekzotike (në një version tjetër të fletës: agrume) dhe manushaqe":["Exotic aromas (in another version of the sheet: citrus) and violet","Profumi esotici (in un'altra versione della scheda: agrumi) e viola","Exotische Aromen (in einer anderen Version des Datenblatts: Zitrus) und Veilchen"],"Shije joshëse, të mëndafshta dhe me shumë hijeshi; qëndrueshmëri me kripësi të rrallë":["Seductive, silky flavours with great charm; persistence with rare saltiness","Sapori seducenti, setosi e di grande fascino; persistenza di rara sapidità","Verführerische, seidige Aromen mit viel Charme; Länge mit seltener Salzigkeit"],"E kuqe rubin e errët me nuanca vjollce":["Dark ruby red with violet hues","Rosso rubino scuro con sfumature violacee","Dunkles Rubinrot mit violetten Nuancen"],"Aroma të paharrueshme kumbulle të tharë, rrushi të thatë, trumze, ulliri të zi dhe nota lehtësisht balsamike":["Unforgettable aromas of dried plum, raisins, thyme, black olive and lightly balsamic notes","Profumi indimenticabili di prugna secca, uvetta, timo, oliva nera e note leggermente balsamiche","Unvergessliche Aromen von Trockenpflaume, Rosinen, Thymian, schwarzer Olive und leicht balsamischen Noten"],"Lojë e gjallë në një qiellzë të shkathët, me aciditet të freskët, tanine të holla dhe shumë frut të tejpjekur në përfundim; e lehtë për t'u pirë":["Lively play on an agile palate, with fresh acidity, fine tannins and plenty of overripe fruit on the finish; easy to drink","Gioco vivace su un palato agile, con acidità fresca, tannini fini e molto frutto surmaturo nel finale; facile da bere","Lebendiges Spiel an einem agilen Gaumen, mit frischer Säure, feinen Tanninen und viel überreifer Frucht im Abgang; leicht zu trinken"],"Granatë intensive, e thellë dhe e shndritshme, me nota rubini":["Intense, deep and bright garnet, with ruby notes","Granato intenso, profondo e brillante, con note rubino","Intensives, tiefes und leuchtendes Granat mit Rubinnoten"],"Aroma stralli dhe kinine":["Aromas of flint and quinine","Profumi di pietra focaia e chinino","Aromen von Feuerstein und Chinin"],"Fruta të vogla të kuqe me piper i japin lëvizje një fuqie taninike të mprehtë në qiellzë":["Peppery small red fruits give movement to a sharp tannic power on the palate","Piccoli frutti rossi pepati danno movimento a una tagliente potenza tannica al palato","Pfeffrige kleine rote Früchte bringen Bewegung in eine kantige Tanninkraft am Gaumen"],"Ideale me mish të kuq në skarë, mish të stufuar dhe gjah; shoqërim i shkëlqyer me djathëra me stazhionim mesatar dhe të gjatë":["Ideal with grilled red meat, stews and game; an excellent match for medium- and long-aged cheeses","Ideale con carni rosse alla griglia, stufati e selvaggina; ottimo abbinamento con formaggi di media e lunga stagionatura","Ideal zu gegrilltem rotem Fleisch, Schmorgerichten und Wild; ausgezeichnet zu mittel und lange gereiften Käsen"],"E kuqe rubin mjaft intensive":["Fairly intense ruby red","Rosso rubino abbastanza intenso","Recht intensives Rubinrot"],"Aromë e këndshme manushaqeje, barbarozë dhe frutash të freskëta":["Pleasant aroma of violet, rose and fresh fruit","Piacevole profumo di viola, rosa e frutta fresca","Angenehmer Duft von Veilchen, Rose und frischen Früchten"],"E ëmbël, harmonike, me aciditetin e duhur":["Sweet, harmonious, with the right acidity","Dolce, armonico, con la giusta acidità","Süß, harmonisch, mit der richtigen Säure"],"Shoqëruesja ideale për ëmbëlsira, e shkëlqyer me çokollatë; edhe me djathëra dhie, toma të stazhionuar dhe mish të tharë, ose në kokteje me lëngje frutash":["The ideal companion for desserts, excellent with chocolate; also with goat cheeses, aged toma and cured meats, or in cocktails with fruit juices","Il compagno ideale per i dolci, ottimo con il cioccolato; anche con formaggi di capra, toma stagionata e salumi, o in cocktail con succhi di frutta","Der ideale Begleiter zu Desserts, ausgezeichnet zu Schokolade; auch zu Ziegenkäse, gereiftem Toma und Wurstwaren oder in Cocktails mit Fruchtsäften"],"Fillimisht disi e përmbajtur në hundë; me kohën bëhet pikante, me grafit, piper xhamajkan dhe një nuancë dylli qiriri, e gjitha me fruta të errëta të pjekura":["At first somewhat restrained on the nose; with time it becomes spicy, with graphite, allspice and a hint of candle wax, all with ripe dark fruit","All'inizio un po' contenuto al naso; col tempo diventa speziato, con grafite, pimento e un tocco di cera di candela, il tutto con frutta scura matura","Zunächst etwas verhalten in der Nase; mit der Zeit würzig, mit Graphit, Piment und einem Hauch Kerzenwachs, alles mit reifer dunkler Frucht"],"Strukturë e lëngshme dhe e dendur në qiellzë, me frut të bukur kokrrash të pjekura dhe të njëjtat nota pikante në përfundim; tanine me kokërr të imët":["Juicy, dense structure on the palate, with lovely ripe berry fruit and the same spicy notes on the finish; fine-grained tannins","Struttura succosa e densa al palato, con bel frutto di bacche mature e le stesse note speziate nel finale; tannini a grana fine","Saftige, dichte Struktur am Gaumen, mit schöner reifer Beerenfrucht und denselben würzigen Noten im Abgang; feinkörnige Tannine"],"Rubin i thellë, i mrekullueshëm":["Deep, wonderful ruby","Rubino profondo, meraviglioso","Tiefes, wunderbares Rubin"],"Profume me spektër aromatik shumë të gjerë, ku shkrihen nota të shijshme vaniljeje, frutash të vogla të kuqe, shtresa reçeli dhe kompleksitetet e para të erëzave të ëmbla":["Perfumes with a very broad aromatic spectrum, blending tasty notes of vanilla, small red fruits, layers of jam and the first complexities of sweet spices","Profumi dallo spettro aromatico molto ampio, dove si fondono golose note di vaniglia, piccoli frutti rossi, strati di confettura e le prime complessità di spezie dolci","Düfte mit sehr breitem Aromaspektrum, in dem köstliche Noten von Vanille, kleinen roten Früchten, Konfitüreschichten und die ersten Komplexitäten süßer Gewürze verschmelzen"],"Në qiellzë shfaqet me rrumbullakësi dhe butësi të plotë aristokratike, shumë elegante në shije, e këndshme dhe e qëndrueshme":["On the palate it shows roundness and full, aristocratic softness, very elegant in taste, pleasant and persistent","Al palato si presenta con rotondità e piena morbidezza aristocratica, molto elegante nel gusto, piacevole e persistente","Am Gaumen zeigt er Rundheit und volle, aristokratische Weichheit, sehr elegant im Geschmack, angenehm und anhaltend"],"Pjata me mish të kuzhinës së madhe":["Meat dishes of fine cuisine","Piatti di carne della grande cucina","Fleischgerichte der gehobenen Küche"],"Ngjyrë qelibari intensive":["Intense amber colour","Colore ambrato intenso","Intensive Bernsteinfarbe"],"Në hundë e ngrohtë, eterike, me aroma intensive frutash të thata, mjalti dhe nota balsamike":["Warm and ethereal on the nose, with intense aromas of dried fruit, honey and balsamic notes","Al naso caldo, etereo, con intensi profumi di frutta secca, miele e note balsamiche","In der Nase warm, ätherisch, mit intensiven Aromen von Trockenfrüchten, Honig und balsamischen Noten"],"Në gojë e ëmbël, e butë, me konsistencë gati vajore për shkak të përqendrimit të lartë të verës, me përfundim lehtësisht tanik; qëndrueshmëri e lartë shije-aromë":["Sweet and soft on the palate, with an almost oily consistency due to the wine's high concentration, with a slightly tannic finish; high taste-aroma persistence","In bocca dolce, morbido, di consistenza quasi oleosa per l'elevata concentrazione del vino, con finale leggermente tannico; elevata persistenza gusto-olfattiva","Am Gaumen süß, weich, mit fast öliger Konsistenz wegen der hohen Konzentration des Weins, mit leicht tanninbetontem Abgang; hohe Geschmacks- und Aromalänge"],"Shoqërimi i preferuar me cantucci klasike dhe me gjithë pasticerinë e thatë":["The favourite pairing is classic cantucci and all dry pastries","L'abbinamento preferito è con i classici cantucci e con tutta la pasticceria secca","Die bevorzugte Begleitung sind klassische Cantucci und alles trockene Gebäck"],"E kuqe rubin me reflekse granati":["Ruby red with garnet reflections","Rosso rubino con riflessi granati","Rubinrot mit granatroten Reflexen"],"Buqetë frutore dhe mjaft e qëndrueshme, që të kujton frutat e kuqe, qershitë maraschino dhe kumbullat, me nuanca vaniljeje":["Fruity, fairly persistent bouquet, recalling red fruit, maraschino cherries and plums, with hints of vanilla","Bouquet fruttato e abbastanza persistente, che ricorda frutti rossi, ciliegie marasche e prugne, con sfumature di vaniglia","Fruchtiges, recht anhaltendes Bouquet, das an rote Früchte, Maraschino-Kirschen und Pflaumen erinnert, mit Vanilleanklängen"],"Me trup të plotë në qiellzë, me ekuilibër të mirë dhe tanine të forta":["Full-bodied on the palate, with good balance and firm tannins","Di corpo pieno al palato, con buon equilibrio e tannini decisi","Vollmundig am Gaumen, mit guter Ausgewogenheit und festen Tanninen"],"Sallam, pjata të para të shijshme, mish i kuq dhe djathëra":["Salami, tasty first courses, red meat and cheeses","Salumi, primi piatti saporiti, carni rosse e formaggi","Salami, würzige erste Gänge, rotes Fleisch und Käse"],"E kuqe e errët dhe e dendur me reflekse vjollce":["Dark, dense red with violet reflections","Rosso scuro e fitto con riflessi violacei","Dunkles, dichtes Rot mit violetten Reflexen"],"Aroma që të kujtojnë kokrrat e zeza, kumbullat dhe dëllinjën, të plotësuara nga erëza të holla dhe jamball":["Aromas recalling black berries, plums and juniper, complemented by fine spices and saffron","Profumi che ricordano bacche nere, prugne e ginepro, completati da spezie fini e zafferano","Aromen, die an schwarze Beeren, Pflaumen und Wacholder erinnern, ergänzt durch feine Gewürze und Safran"],"Me tanin të pjekur – ndihet se rrushi është përkëdhelur nga rrezet e ngrohta të diellit":["With ripe tannin – you can feel the grapes have been caressed by the warm rays of the sun","Con tannino maturo – si sente che l'uva è stata accarezzata dai caldi raggi del sole","Mit reifem Tannin – man spürt, dass die Trauben von warmen Sonnenstrahlen gestreichelt wurden"],"Shkon në mënyrë të përsosur me djathë të fortë, qengj dhe mish lope":["Goes perfectly with strong cheese, lamb and beef","Si abbina perfettamente a formaggi forti, agnello e manzo","Passt perfekt zu kräftigem Käse, Lamm und Rind"],"Fruta të errëta në hundë, me kumbulla të pjekura, manaferra dhe qershi të thata; edhe nota kedri, druri sandal dhe vaniljeje":["Dark fruit on the nose, with ripe plums, blackberries and dried cherries; also notes of cedar, sandalwood and vanilla","Frutti scuri al naso, con prugne mature, more e ciliegie secche; anche note di cedro, legno di sandalo e vaniglia","Dunkle Früchte in der Nase, mit reifen Pflaumen, Brombeeren und getrockneten Kirschen; auch Noten von Zeder, Sandelholz und Vanille"],"E fuqishme dhe e guximshme në qiellzë, me aroma intensive dhe tanine të dukshme":["Powerful and bold on the palate, with intense aromas and noticeable tannins","Potente e audace al palato, con aromi intensi e tannini evidenti","Kraftvoll und kühn am Gaumen, mit intensiven Aromen und spürbaren Tanninen"],"Aromë intensive dhe e qëndrueshme, me nuanca çokollate që nuk mbizotërojnë kurrë mbi frutat e bollshme":["Intense, persistent aroma, with hints of chocolate that never dominate the abundant fruit","Profumo intenso e persistente, con sfumature di cioccolato che non prevalgono mai sul frutto abbondante","Intensiver, anhaltender Duft mit Schokoladenanklängen, die nie die reichliche Frucht überdecken"],"Strukturë e mirë, tanine të mira dhe e ekuilibruar mirë":["Good structure, good tannins and well balanced","Buona struttura, buoni tannini e ben equilibrato","Gute Struktur, gute Tannine und gut ausgewogen"],"T-bone steak, burgera gourmet dhe gjah; e shijshme edhe me Stroganoff viçi me kërpudha ose patëllxhanë":["T-bone steak, gourmet burgers and game; also delicious with beef Stroganoff with mushrooms or aubergines","Bistecca T-bone, hamburger gourmet e selvaggina; delizioso anche con manzo alla Stroganoff con funghi o melanzane","T-Bone-Steak, Gourmet-Burger und Wild; auch köstlich zu Rinder-Stroganoff mit Pilzen oder Auberginen"],"E kuqe granate.":["Garnet red.","Rosso granato.","Granatrot."],"Intensive dhe e qëndrueshme, me erëza (duhan dhe reçel), aroma jamballi, frutore, pak eterike.":["Intense and persistent, with spices (tobacco and jam), saffron, fruity, slightly ethereal aromas.","Intenso e persistente, con spezie (tabacco e confettura), sentori di zafferano, fruttato, leggermente etereo.","Intensiv und anhaltend, mit Gewürzen (Tabak und Konfitüre), Safran, fruchtigen, leicht ätherischen Aromen."],"Verë me trup të plotë, e butë, e ekuilibruar, intensive dhe e qëndrueshme.":["Full-bodied, soft, balanced, intense and persistent wine.","Vino di corpo pieno, morbido, equilibrato, intenso e persistente.","Vollmundiger, weicher, ausgewogener, intensiver und anhaltender Wein."],"Bishtajore, kërpudha dhe mish i shijshëm; shkon shumë mirë me gjel deti dhe mish barbecue; provojeni edhe me ushqim aziatik si rosë, viç dhe derr në tenxhere.":["Legumes, mushrooms and tasty meat; goes very well with turkey and barbecue meat; try it also with Asian food such as duck, beef and pork hot pot.","Legumi, funghi e carni saporite; si abbina molto bene a tacchino e carni al barbecue; da provare anche con cucina asiatica come anatra, manzo e maiale in pentola.","Hülsenfrüchte, Pilze und würziges Fleisch; passt sehr gut zu Truthahn und Grillfleisch; auch zu asiatischer Küche wie Ente, Rind und Schwein aus dem Topf probieren."],"E kuqe rubin e thellë me reflekse të holla portokalli":["Deep ruby red with fine orange reflections","Rosso rubino profondo con fini riflessi aranciati","Tiefes Rubinrot mit feinen orangefarbenen Reflexen"],"Buqetë me aroma intensive kokrrash të egra të pjekura, e mbështetur nga nota elegante druri":["Bouquet with intense aromas of ripe wild berries, supported by elegant wood notes","Bouquet con intensi profumi di bacche selvatiche mature, sostenuto da eleganti note di legno","Bouquet mit intensiven Aromen reifer Wildbeeren, getragen von eleganten Holznoten"],"E thatë dhe e balancuar në qiellzë, me tanine të lakueshme dhe shije të theksuara mjedre, vaniljeje dhe bajamesh të pjekura":["Dry and balanced on the palate, with supple tannins and marked flavours of raspberry, vanilla and roasted almonds","Secco ed equilibrato al palato, con tannini flessuosi e spiccati sapori di lampone, vaniglia e mandorle tostate","Trocken und ausgewogen am Gaumen, mit geschmeidigen Tanninen und ausgeprägtem Geschmack von Himbeere, Vanille und gerösteten Mandeln"],"Struktura e hollë dhe erëzimi i qëndrueshëm e bëjnë shoqërues ideal për djathëra të stazhionuar dhe mish të kuq të shijshëm":["Its fine structure and persistent spiciness make it an ideal partner for aged cheeses and tasty red meat","La struttura fine e la speziatura persistente lo rendono compagno ideale di formaggi stagionati e carni rosse saporite","Feine Struktur und anhaltende Würze machen ihn zum idealen Begleiter für gereifte Käse und würziges rotes Fleisch"],"E kuqe rubin me reflekse purpur.":["Ruby red with purple reflections.","Rosso rubino con riflessi porpora.","Rubinrot mit purpurnen Reflexen."],"Intensive, me nota frutash të kuqe.":["Intense, with notes of red fruit.","Intenso, con note di frutti rossi.","Intensiv, mit Noten roter Früchte."],"E plotë dhe mbështjellëse.":["Full and enveloping.","Pieno e avvolgente.","Voll und umhüllend."],"Salume, djathëra, pjata të para, mish i bardhë dhe i kuq.":["Cold cuts, cheeses, first courses, white and red meat.","Salumi, formaggi, primi piatti, carni bianche e rosse.","Wurstwaren, Käse, erste Gänge, helles und rotes Fleisch."],"E kuqe rubin me tone të pasura dhe intensive.":["Ruby red with rich, intense tones.","Rosso rubino dai toni ricchi e intensi.","Rubinrot mit reichen, intensiven Tönen."],"Shumëllojshmëri barishtesh aromatike, me nota bujare duhani dhe dheu të lagur; rrush frëngu i zi dhe jamball; edhe dhe i thatë.":["A variety of aromatic herbs, with generous notes of tobacco and wet earth; blackcurrant and saffron; also dry earth.","Una varietà di erbe aromatiche, con generose note di tabacco e terra bagnata; ribes nero e zafferano; anche terra secca.","Eine Vielfalt an Kräutern mit großzügigen Noten von Tabak und nasser Erde; schwarze Johannisbeere und Safran; auch trockene Erde."],"Konsistencë e mirë taninesh mesatarisht të buta që sigurojnë plakje të gjatë; strukturë dhe peshë e pasur, finesë elegante në përfundim.":["Good consistency of medium-soft tannins that ensure long ageing; rich structure and weight, elegant finesse on the finish.","Buona consistenza di tannini mediamente morbidi che garantiscono un lungo invecchiamento; struttura e peso ricchi, eleganza fine nel finale.","Gute Konsistenz mittelweicher Tannine, die eine lange Reifung sichern; reiche Struktur und Fülle, elegante Finesse im Abgang."],"E verdhë kashte e gjallë me reflekse të lehta të gjelbra; perlazh i hollë dhe i qëndrueshëm.":["Lively straw yellow with light green reflections; fine, persistent perlage.","Giallo paglierino vivace con leggeri riflessi verdi; perlage fine e persistente.","Lebhaftes Strohgelb mit leichten grünen Reflexen; feine, anhaltende Perlage."],"E freskët dhe intensive, me notë të gjerë frutash (mollë Golden Delicious të pjekura) dhe lule të egra, mbi një aromë delikate majaje.":["Fresh and intense, with a broad note of fruit (ripe Golden Delicious apples) and wild flowers, over a delicate yeasty aroma.","Fresco e intenso, con un'ampia nota di frutta (mele Golden Delicious mature) e fiori di campo, su un delicato profumo di lievito.","Frisch und intensiv, mit breiter Fruchtnote (reife Golden-Delicious-Äpfel) und Wildblumen über einem zarten Hefeduft."],"Harmonike dhe e ekuilibruar, me nuancë tërheqëse frutash të pjekura dhe nota kore buke.":["Harmonious and balanced, with an attractive hint of ripe fruit and notes of bread crust.","Armonico ed equilibrato, con un'attraente sfumatura di frutta matura e note di crosta di pane.","Harmonisch und ausgewogen, mit ansprechendem Anklang reifer Früchte und Noten von Brotkruste."],"Ngjyrë e artë e dalluar, perlazh i imët dhe i vazhdueshëm":["Distinctive golden colour, fine and continuous perlage","Colore dorato distintivo, perlage fine e continuo","Markante Goldfarbe, feine und anhaltende Perlage"],"Kompleksitet dhe stil i rafinuar; nota agrumesh ananasi dhe grejpfruti, nuanca mollësh Renetë të pjekura":["Complexity and refined style; citrus notes of pineapple and grapefruit, hints of ripe Reinette apples","Complessità e stile raffinato; note agrumate di ananas e pompelmo, sfumature di mele renette mature","Komplexität und feiner Stil; Zitrusnoten von Ananas und Grapefruit, Anklänge reifer Renettenäpfel"],"Në qiellzë e plotë dhe e ekuilibruar, me aciditet veçanërisht të kripur":["Full and balanced on the palate, with particularly saline acidity","Al palato pieno ed equilibrato, con un'acidità particolarmente sapida","Am Gaumen voll und ausgewogen, mit besonders salziger Säure"],"Bakër që shkon drejt rozës antike; perlazh i vazhdueshëm dhe i qëndrueshëm.":["Copper tending towards antique pink; continuous, persistent perlage.","Ramato tendente al rosa antico; perlage continuo e persistente.","Kupfer, zu Altrosa neigend; anhaltende, beständige Perlage."],"E dalluar, me finesë të madhe; aromë e freskët lulesh murrizi dhe nota rrush frëngu e dredhëzash të egra.":["Distinctive, with great finesse; fresh scent of hawthorn blossom and notes of currant and wild strawberries.","Distintivo, di grande finezza; fresco profumo di fiori di biancospino e note di ribes e fragoline di bosco.","Markant, von großer Finesse; frischer Duft von Weißdornblüten und Noten von Johannisbeere und Walderdbeeren."],"E thatë, e pastër dhe elegante, me sfond delikat bajameje të ëmbël dhe myshku aromatik, shumë e qëndrueshme.":["Dry, clean and elegant, with a delicate background of sweet almond and aromatic musk, very persistent.","Secco, pulito ed elegante, con un delicato fondo di mandorla dolce e muschio aromatico, molto persistente.","Trocken, sauber und elegant, mit zartem Hintergrund von süßer Mandel und aromatischem Moschus, sehr anhaltend."],"E verdhë kashte e ndritshme me reflekse të gjelbra":["Bright straw yellow with green reflections","Giallo paglierino brillante con riflessi verdi","Leuchtendes Strohgelb mit grünen Reflexen"],"Aroma të freskëta me intensitet të mirë, me nota frutash të verdha, agrumesh dhe barishtesh aromatike":["Fresh aromas of good intensity, with notes of yellow fruit, citrus and aromatic herbs","Profumi freschi di buona intensità, con note di frutta gialla, agrumi ed erbe aromatiche","Frische Aromen guter Intensität, mit Noten von gelben Früchten, Zitrus und Kräutern"],"E butë dhe e rrumbullakët, me një farë lëngshmërie, pastaj dobësohet pak në fund":["Soft and round, with a certain juiciness, then fades a little at the end","Morbido e rotondo, con una certa succosità, poi cala un po' nel finale","Weich und rund, mit gewisser Saftigkeit, lässt dann am Ende etwas nach"],"E verdhë kashte e zbehtë me reflekse jeshile":["Pale straw yellow with green reflections","Giallo paglierino tenue con riflessi verdi","Blasses Strohgelb mit grünen Reflexen"],"Nota limoni, mandarine dhe molle të verdhë":["Notes of lemon, mandarin and yellow apple","Note di limone, mandarino e mela gialla","Noten von Zitrone, Mandarine und gelbem Apfel"],"E thartë në mënyrë të këndshme, me aciditet të gjallë, të hap gojën, me përfundim mesatarisht të gjatë":["Pleasantly tart, with lively acidity, mouth-opening, with a medium-long finish","Piacevolmente acidulo, con acidità vivace, apre la bocca, con finale di media lunghezza","Angenehm säuerlich, mit lebendiger Säure, belebend, mit mittellangem Abgang"],"E kuqe rubin.":["Ruby red.","Rosso rubino.","Rubinrot."],"Nota të qarta frutash të kuqe të sapovjela.":["Clear notes of freshly picked red fruit.","Nitide note di frutti rossi appena colti.","Klare Noten frisch gepflückter roter Früchte."],"Freski dhe butësi, me kënaqësinë e frutave të freskëta të pyllit dhe tanin të ëmbël.":["Freshness and softness, with the pleasure of fresh wild berries and sweet tannin.","Freschezza e morbidezza, con il piacere dei frutti di bosco freschi e un tannino dolce.","Frische und Weichheit, mit dem Genuss frischer Waldbeeren und süßem Tannin."],"Pjata të thjeshta me mish, edhe në skarë.":["Simple meat dishes, also grilled.","Piatti semplici di carne, anche alla griglia.","Einfache Fleischgerichte, auch gegrillt."],"E kuqe rubin e shndritshme me reflekse granate":["Bright ruby red with garnet reflections","Rosso rubino brillante con riflessi granati","Leuchtendes Rubinrot mit granatroten Reflexen"],"Aroma të freskëta vishnjeje (visciola dhe marasca), kanelle dhe arrëmyshku, vaniljeje dhe anasoni":["Fresh aromas of sour cherry (visciola and marasca), cinnamon and nutmeg, vanilla and anise","Profumi freschi di amarena (visciola e marasca), cannella e noce moscata, vaniglia e anice","Frische Aromen von Sauerkirsche (Visciola und Marasca), Zimt und Muskatnuss, Vanille und Anis"],"E plotë dhe e ekuilibruar, me tanine të ëmbla dhe të buta që i japin qëndrueshmëri të mirë aromatike":["Full and balanced, with sweet, soft tannins that give it good aromatic persistence","Pieno ed equilibrato, con tannini dolci e morbidi che gli conferiscono una buona persistenza aromatica","Voll und ausgewogen, mit süßen, weichen Tanninen, die ihm gute aromatische Länge verleihen"],"Verë e shkëlqyer me mish të kuq të pjekur, shpendë fisnikë dhe mish të stufuar me Aglianico":["An excellent wine with roast red meat, noble fowl and meat stewed in Aglianico","Ottimo vino con carni rosse arrosto, pollame nobile e carni stufate all'Aglianico","Ausgezeichneter Wein zu gebratenem rotem Fleisch, edlem Geflügel und in Aglianico geschmortem Fleisch"],"Aroma intensive manaferrash, katrani dhe kumbullash":["Intense aromas of blackberries, tar and plums","Intensi profumi di more, catrame e prugne","Intensive Aromen von Brombeeren, Teer und Pflaumen"],"E kuqe rubin e ndritshme dhe e pasur, me buzë që çelet pak":["Bright, rich ruby red, with a slightly lighter rim","Rosso rubino brillante e ricco, con unghia leggermente più chiara","Leuchtendes, reiches Rubinrot mit etwas hellerem Rand"],"Në hundë vishnja të pjekura dhe kumbulla, pastaj jamballi dhe kafe":["On the nose ripe sour cherries and plums, then saffron and coffee","Al naso amarene mature e prugne, poi zafferano e caffè","In der Nase reife Sauerkirschen und Pflaumen, dann Safran und Kaffee"],"Shumë e përqendruar në qiellzë, me tanine të forta, e lëngshme, e ekuilibruar mirë, me përfundim të gjatë":["Very concentrated on the palate, with firm tannins, juicy, well balanced, with a long finish","Molto concentrato al palato, con tannini decisi, succoso, ben equilibrato, con finale lungo","Sehr konzentriert am Gaumen, mit festen Tanninen, saftig, gut ausgewogen, mit langem Abgang"],"Të kujton ripërtëritjen e tokës dhe bimëve pas një shiu të fortë":["It recalls the renewal of the earth and plants after a heavy rain","Ricorda il rinnovarsi della terra e delle piante dopo una forte pioggia","Erinnert an die Erneuerung von Erde und Pflanzen nach einem kräftigen Regen"],"Jashtëzakonisht e përqendruar, por me aciditet të mjaftueshëm dhe tanine të freskëta që e balancojnë dhe nuk e lënë të bëhet e rëndë; një mrekulli në qiellzë":["Extraordinarily concentrated, yet with enough acidity and fresh tannins to balance it and keep it from becoming heavy; a marvel on the palate","Straordinariamente concentrato, ma con acidità sufficiente e tannini freschi che lo bilanciano e non lo lasciano diventare pesante; una meraviglia al palato","Außergewöhnlich konzentriert, aber mit genug Säure und frischen Tanninen, die ihn ausbalancieren und nicht schwer werden lassen; ein Wunder am Gaumen"],"Ngjyrë e errët, shumë e thellë, gati e patejdukshme":["Dark colour, very deep, almost opaque","Colore scuro, molto profondo, quasi impenetrabile","Dunkle Farbe, sehr tief, fast undurchsichtig"],"Buqetë shumë e përmbajtur, nuanca delikate reçeli kokrrash të errëta":["Very restrained bouquet, delicate hints of dark-berry jam","Bouquet molto contenuto, delicate sfumature di confettura di bacche scure","Sehr zurückhaltendes Bouquet, zarte Anklänge von dunkler Beerenkonfitüre"],"Mjaft e ëmbël në qiellzë, ndoshta me pak sheqer të mbetur, duket pak e rëndë; gjatësi mesatare për momentin, zhvillimi i mëtejshëm është i vështirë të vlerësohet":["Quite sweet on the palate, perhaps with a little residual sugar, it seems a bit heavy; medium length for now, further development is hard to judge","Abbastanza dolce al palato, forse con un po' di zucchero residuo, sembra un po' pesante; lunghezza media per ora, l'evoluzione è difficile da valutare","Recht süß am Gaumen, vielleicht mit etwas Restzucker, wirkt etwas schwer; derzeit mittlere Länge, die weitere Entwicklung ist schwer einzuschätzen"],"Qershi e errët, pak kumbull, një nuancë duhani dhe barishtesh të thata (trumzë, ndoshta rigon)":["Dark cherry, a little plum, a hint of tobacco and dried herbs (thyme, perhaps oregano)","Ciliegia scura, un po' di prugna, un tocco di tabacco ed erbe secche (timo, forse origano)","Dunkle Kirsche, etwas Pflaume, ein Hauch von Tabak und getrockneten Kräutern (Thymian, vielleicht Oregano)"],"Trup mesatar, tanine të buta, përfundim pak i hidhur-i ëmbël, tipik për Negroamaro":["Medium body, soft tannins, a slightly bittersweet finish, typical of Negroamaro","Corpo medio, tannini morbidi, finale leggermente agrodolce, tipico del Negroamaro","Mittlerer Körper, weiche Tannine, leicht bittersüßer Abgang, typisch für Negroamaro"],"Makarona me salcë domate, brinjë qengji në skarë, caponata ose djathë i fortë delje":["Pasta with tomato sauce, grilled lamb chops, caponata or hard sheep's cheese","Pasta al pomodoro, costolette d'agnello alla griglia, caponata o formaggio di pecora stagionato","Pasta mit Tomatensauce, gegrillte Lammkoteletts, Caponata oder harter Schafskäse"],"E kuqe vjollcë shumë e thellë":["Very deep violet red","Rosso violaceo molto profondo","Sehr tiefes Violettrot"],"E gjerë dhe komplekse në hundë, me nota erëzash, frutash të buta dhe reçeli qershie":["Broad and complex on the nose, with notes of spices, soft fruit and cherry jam","Ampio e complesso al naso, con note di spezie, frutta morbida e confettura di ciliegie","Weit und komplex in der Nase, mit Noten von Gewürzen, weichen Früchten und Kirschkonfitüre"],"Verë me trup të plotë, e butë dhe e ekuilibruar, e pasur me tanine të holla, me përfundim të këndshëm e të qëndrueshëm":["A full-bodied, soft and balanced wine, rich in fine tannins, with a pleasant, persistent finish","Vino di corpo pieno, morbido ed equilibrato, ricco di tannini fini, con finale piacevole e persistente","Vollmundiger, weicher und ausgewogener Wein, reich an feinen Tanninen, mit angenehmem, anhaltendem Abgang"],"Pjata të para me shije të fortë, mish i kuq, gjah dhe djathëra të stazhionuar":["Strongly flavoured first courses, red meat, game and aged cheeses","Primi piatti dal gusto deciso, carni rosse, selvaggina e formaggi stagionati","Kräftig gewürzte erste Gänge, rotes Fleisch, Wild und gereifte Käse"],"Buqetë e gjerë dhe komplekse, frutore, me aromë kumbulle të thatë dhe reçeli qershie, nuanca duhani":["Broad, complex, fruity bouquet, with aromas of dried plum and cherry jam, hints of tobacco","Bouquet ampio e complesso, fruttato, con profumi di prugna secca e confettura di ciliegie, sfumature di tabacco","Weites, komplexes, fruchtiges Bouquet mit Aromen von Trockenpflaume und Kirschkonfitüre, Tabakanklänge"],"Verë me trup të plotë, e ekuilibruar, e butë dhe e pasur me tanine elegante; përfundim i gjatë me nota kakaoje, kafeje dhe vanilje":["A full-bodied wine, balanced, soft and rich in elegant tannins; long finish with notes of cocoa, coffee and vanilla","Vino di corpo pieno, equilibrato, morbido e ricco di tannini eleganti; finale lungo con note di cacao, caffè e vaniglia","Vollmundiger Wein, ausgewogen, weich und reich an eleganten Tanninen; langer Abgang mit Noten von Kakao, Kaffee und Vanille"],"Pjata të para me shije të fortë, mish i kuq dhe gjah":["Strongly flavoured first courses, red meat and game","Primi piatti dal gusto deciso, carni rosse e selvaggina","Kräftig gewürzte erste Gänge, rotes Fleisch und Wild"],"E kuqe rubin elegante":["Elegant ruby red","Rosso rubino elegante","Elegantes Rubinrot"],"Buqetë freskuese kumbulle të zezë, kajsie dhe anasoni":["Refreshing bouquet of black plum, apricot and anise","Bouquet rinfrescante di prugna nera, albicocca e anice","Erfrischendes Bouquet von schwarzer Pflaume, Aprikose und Anis"],"Nuanca frutore mjedre, qershie të zezë dhe boronice; trup mesatar dhe aciditet i dallueshëm, e balancuar me tanine të holla, me shumë karakter dhe klas":["Fruity hints of raspberry, black cherry and blueberry; medium body and noticeable acidity, balanced by fine tannins, with plenty of character and class","Sfumature fruttate di lampone, ciliegia nera e mirtillo; corpo medio e acidità evidente, bilanciata da tannini fini, con molto carattere e classe","Fruchtige Anklänge von Himbeere, schwarzer Kirsche und Heidelbeere; mittlerer Körper und spürbare Säure, ausgeglichen durch feine Tannine, mit viel Charakter und Klasse"],"Shkon mirë me pjata kryesore pikante, qengj, gjah, djathë dhe makarona":["Goes well with spicy main courses, lamb, game, cheese and pasta","Si abbina bene a secondi piatti speziati, agnello, selvaggina, formaggi e pasta","Passt gut zu würzigen Hauptgerichten, Lamm, Wild, Käse und Pasta"],"E kuqe rubin intensive, me reflekse granate":["Intense ruby red, with garnet reflections","Rosso rubino intenso, con riflessi granati","Intensives Rubinrot mit granatroten Reflexen"],"E qëndrueshme dhe komplekse në hundë, me nota frutash të pjekura që të kujtojnë reçel qershie dhe fiq të thatë; lehtësisht erëzore":["Persistent and complex on the nose, with notes of ripe fruit recalling cherry jam and dried figs; lightly spicy","Persistente e complesso al naso, con note di frutta matura che ricordano la confettura di ciliegie e i fichi secchi; leggermente speziato","Anhaltend und komplex in der Nase, mit Noten reifer Früchte, die an Kirschkonfitüre und getrocknete Feigen erinnern; leicht würzig"],"Trupi i plotë jep në gojë ndjesi të këndshme mjalti, të mbështetura nga një strukturë e mirë acide":["The full body gives pleasant honeyed sensations on the palate, supported by a good acidic structure","Il corpo pieno dona al palato piacevoli sensazioni di miele, sostenute da una buona struttura acida","Der volle Körper gibt am Gaumen angenehme Honigeindrücke, getragen von guter Säurestruktur"],"Kek me bajame të thata, tarta frutash, djathëra të stazhionuar":["Dry almond cakes, fruit tarts, aged cheeses","Torte secche alle mandorle, crostate di frutta, formaggi stagionati","Trockene Mandelkuchen, Obsttartes, gereifte Käse"],"Fruta të pjekura, nota erëzash dhe elemente të thekura.":["Ripe fruit, notes of spice and toasty elements.","Frutta matura, note di spezie ed elementi tostati.","Reife Früchte, Gewürznoten und Röstaromen."],"Gllënjkë e ngrohtë dhe mbështjellëse, strukturë e mirë, thurje e hollë taninike, qëndrueshmëri e shkëlqyer.":["Warm, enveloping sip, good structure, fine tannic weave, excellent persistence.","Sorso caldo e avvolgente, buona struttura, trama tannica fine, ottima persistenza.","Warmer, umhüllender Schluck, gute Struktur, feines Tanningewebe, ausgezeichnete Länge."],"Mish i zgjedhur, gjah fisnik, mish i kuq i stufuar.":["Fine meats, noble game, stewed red meat.","Carni pregiate, selvaggina nobile, carni rosse in umido.","Edles Fleisch, edles Wild, geschmortes rotes Fleisch."],"Nota të holla dhe aromatike frutash të vegjël të kuq, barishtesh mesdhetare dhe lulesh të kuqe.":["Fine, aromatic notes of small red fruits, Mediterranean herbs and red flowers.","Note fini e aromatiche di piccoli frutti rossi, erbe mediterranee e fiori rossi.","Feine, aromatische Noten kleiner roter Früchte, mediterraner Kräuter und roter Blüten."],"E freskët dhe frutore, lehtësisht me kripësi, e rrjedhshme dhe me strukturë mesatare; shumë e lehtë për t'u shoqëruar dhe e gjithanshme.":["Fresh and fruity, lightly savoury, flowing and of medium structure; very easy to pair and versatile.","Fresco e fruttato, leggermente sapido, scorrevole e di media struttura; molto facile da abbinare e versatile.","Frisch und fruchtig, leicht salzig, fließend und mittelstrukturiert; sehr leicht zu kombinieren und vielseitig."],"Nota piperi të zi dhe erëzash orientale, fruta të vogla pylli, esenca që kujtojnë makjen mesdhetare.":["Notes of black pepper and oriental spices, small wild berries, essences recalling the Mediterranean maquis.","Note di pepe nero e spezie orientali, piccoli frutti di bosco, essenze che ricordano la macchia mediterranea.","Noten von schwarzem Pfeffer und orientalischen Gewürzen, kleine Waldbeeren, Essenzen, die an die mediterrane Macchia erinnern."],"Karakter intensiv dhe personalitet i fortë, me frutë ekspresive dhe të vendosur.":["Intense character and strong personality, with expressive, decisive fruit.","Carattere intenso e forte personalità, con frutto espressivo e deciso.","Intensiver Charakter und starke Persönlichkeit, mit ausdrucksvoller, entschiedener Frucht."],"Fruta të kuqe të pjekura dhe erëza të ëmbla, me nota të lehta balsamike dhe çokollate.":["Ripe red fruit and sweet spices, with light balsamic and chocolate notes.","Frutti rossi maturi e spezie dolci, con leggere note balsamiche e di cioccolato.","Reife rote Früchte und süße Gewürze, mit leichten balsamischen und Schokoladennoten."],"E thellë dhe me strukturë të madhe, me thurje aromatike të ngrohtë, të plotë, harmonike dhe elegante taninike.":["Deep and with great structure, with a warm, full, harmonious and elegant tannic aromatic weave.","Profondo e di grande struttura, con una trama aromatica calda, piena, armonica ed elegantemente tannica.","Tief und mit großer Struktur, mit warmem, vollem, harmonischem und elegant tanninbetontem Aromagewebe."],"Mish i zgjedhur, mish i pjekur i përzier.":["Fine meats, mixed roast meats.","Carni pregiate, arrosti misti.","Edles Fleisch, gemischte Braten."],"E verdhë e artë intensive dhe e gjallë":["Intense, lively golden yellow","Giallo dorato intenso e vivace","Intensives, lebendiges Goldgelb"],"Nuanca të këndshme frutash të freskëta: pjeshkë, pjepër dhe ananas; edhe lule të egra të bardha, lajthi, vanilje dhe bajame":["Pleasant hints of fresh fruit: peach, melon and pineapple; also white wild flowers, hazelnut, vanilla and almond","Piacevoli sfumature di frutta fresca: pesca, melone e ananas; anche fiori bianchi di campo, nocciola, vaniglia e mandorla","Angenehme Anklänge frischer Früchte: Pfirsich, Melone und Ananas; auch weiße Wildblumen, Haselnuss, Vanille und Mandel"],"Frut i pashoq dhe i pasur, gati i fryrë, i mbështetur nga një damar acid shumë i qartë dhe i ekuilibruar; teksturë e dendur dhe e butë":["Peerless, rich fruit, almost swelling, supported by a very clear and balanced acidic vein; dense, soft texture","Frutto impareggiabile e ricco, quasi gonfio, sostenuto da una vena acida molto netta ed equilibrata; trama densa e morbida","Unvergleichliche, reiche Frucht, fast überquellend, getragen von einer sehr klaren, ausgewogenen Säureader; dichte, weiche Textur"],"Pesto rosso alla Trapanese (receta e sugjeruar nga prodhuesi)":["Pesto rosso alla Trapanese (recipe suggested by the producer)","Pesto rosso alla trapanese (ricetta suggerita dal produttore)","Pesto rosso alla Trapanese (vom Erzeuger empfohlenes Rezept)"],"E kuqe rubin e thellë, e padepërtueshme, me nuanca intensive vjollcë":["Deep, impenetrable ruby red, with intense violet hues","Rosso rubino profondo, impenetrabile, con intense sfumature violacee","Tiefes, undurchdringliches Rubinrot mit intensiven violetten Nuancen"],"Nuanca të përqendruara dhe të përcaktuara mirë vishnjeje (marasca), frutash të pyllit, raven, karafili, barishtesh aromatike dhe kumbullash, që alternohen me aroma tërheqëse jamballi, boje dhe gjethesh duhani":["Concentrated, well-defined hints of sour cherry (marasca), wild berries, rhubarb, clove, aromatic herbs and plums, alternating with attractive aromas of saffron, ink and tobacco leaves","Sfumature concentrate e ben definite di amarena (marasca), frutti di bosco, rabarbaro, chiodi di garofano, erbe aromatiche e prugne, che si alternano ad attraenti profumi di zafferano, inchiostro e foglie di tabacco","Konzentrierte, klar definierte Anklänge von Sauerkirsche (Marasca), Waldbeeren, Rhabarber, Nelke, Kräutern und Pflaumen, im Wechsel mit ansprechenden Aromen von Safran, Tinte und Tabakblättern"],"E butë dhe përkëdhelëse, me personalitet të madh dhe natyrë të fortë mesdhetare; strukturë e fortë dhe e bollshme, gjallëri e jashtëzakonshme shijeje dhe tanine kadifeje me fisnikëri të rrallë":["Soft and caressing, with great personality and a strong Mediterranean nature; firm, ample structure, extraordinary liveliness of flavour and velvety tannins of rare nobility","Morbido e carezzevole, di grande personalità e forte natura mediterranea; struttura solida e ampia, straordinaria vivacità gustativa e tannini vellutati di rara nobiltà","Weich und schmeichelnd, mit großer Persönlichkeit und starkem mediterranem Wesen; feste, üppige Struktur, außergewöhnliche geschmackliche Lebendigkeit und samtige Tannine von seltener Noblesse"],"Kaponatë e rishikuar (receta e sugjeruar nga prodhuesi)":["Caponata revisited (recipe suggested by the producer)","Caponata rivisitata (ricetta suggerita dal produttore)","Neu interpretierte Caponata (vom Erzeuger empfohlenes Rezept)"],"E kuqe rubin me reflekse granate që me kohën bëhen portokalli":["Ruby red with garnet reflections that turn orange with time","Rosso rubino con riflessi granati che col tempo diventano aranciati","Rubinrot mit granatroten Reflexen, die mit der Zeit orange werden"],"I qartë dhe intensiv, i gjerë, me aroma tipike lulesh të vyshkura, erëzash, gjethesh të thata dhe nënpylli":["Clear and intense, broad, with typical aromas of withered flowers, spices, dry leaves and undergrowth","Netto e intenso, ampio, con tipici profumi di fiori appassiti, spezie, foglie secche e sottobosco","Klar und intensiv, weit, mit typischen Aromen welker Blumen, Gewürze, trockener Blätter und Waldboden"],"Verë e pasur me strukturë, e plotë dhe e fortë, e aftë të rezistojë mirë ndër vite":["A wine rich in structure, full and firm, able to hold up well over the years","Vino ricco di struttura, pieno e deciso, capace di resistere bene negli anni","Ein strukturreicher, voller und fester Wein, der sich über Jahre gut hält"],"Ideale me pjata me mish të kuq dhe djathëra me stazhionim mesatar ose të gjatë":["Ideal with red-meat dishes and medium- or long-aged cheeses","Ideale con piatti di carne rossa e formaggi di media o lunga stagionatura","Ideal zu Gerichten mit rotem Fleisch und mittel oder lange gereiften Käsen"],"Ngjyrë rozë korali e shndritshme dhe magjepsëse":["Bright, captivating coral pink","Rosa corallo brillante e affascinante","Leuchtendes, bezauberndes Korallenrosa"],"Buqetë aromatike intensive dhe e qëndrueshme, tipike mesdhetare; mbizotërojnë nota frutash të vogla të kuqe të freskëta si luleshtrydhja, mjedra dhe qershia":["Intense, persistent aromatic bouquet, typically Mediterranean; notes of fresh small red fruits such as strawberry, raspberry and cherry dominate","Bouquet aromatico intenso e persistente, tipicamente mediterraneo; dominano note di piccoli frutti rossi freschi come fragola, lampone e ciliegia","Intensives, anhaltendes Aromabouquet, typisch mediterran; Noten frischer kleiner roter Früchte wie Erdbeere, Himbeere und Kirsche dominieren"],"E thatë, e freskët dhe me kripësi të këndshme, e rrjedhshme dhe e kënaqshme për t'u pirë":["Dry, fresh and pleasantly savoury, flowing and satisfying to drink","Secco, fresco e piacevolmente sapido, scorrevole e appagante da bere","Trocken, frisch und angenehm salzig, fließend und befriedigend zu trinken"],"Sallame të lehta, djathëra të freskët (mocarela, burrata), friselle dhe perime në vaj; shumë e mirë me peshk blu në skarë, peshk të skuqur, supa peshku dhe krustace":["Light cured meats, fresh cheeses (mozzarella, burrata), friselle and vegetables in oil; very good with grilled oily fish, fried fish, fish soups and shellfish","Salumi leggeri, formaggi freschi (mozzarella, burrata), friselle e verdure sott'olio; ottimo con pesce azzurro alla griglia, fritture di pesce, zuppe di pesce e crostacei","Leichte Wurstwaren, Frischkäse (Mozzarella, Burrata), Friselle und Gemüse in Öl; sehr gut zu gegrilltem Blaufisch, frittiertem Fisch, Fischsuppen und Krustentieren"],"Rubin; ende pa shenja plakjeje":["Ruby; no signs of ageing yet","Rubino; ancora nessun segno di invecchiamento","Rubin; noch keine Alterungsanzeichen"],"Vishnje e dallueshme në hundë":["Noticeable sour cherry on the nose","Amarena evidente al naso","Deutliche Sauerkirsche in der Nase"],"Aciditet i fortë por i balancuar, tanin i fortë, i theksuar por jo agresiv":["Firm but balanced acidity, firm tannin, marked but not aggressive","Acidità decisa ma equilibrata, tannino deciso, marcato ma non aggressivo","Feste, aber ausgewogene Säure, festes Tannin, ausgeprägt, aber nicht aggressiv"],"Rubin i plotë, i padepërtueshëm me vjollcë":["Full ruby, impenetrable with violet","Rubino pieno, impenetrabile con violaceo","Volles Rubin, undurchdringlich mit Violett"],"Hapet në hundë me nota të theksuara druri sandali dhe jamballi, pastaj shumë kumbull":["It opens on the nose with marked notes of sandalwood and saffron, then lots of plum","Si apre al naso con spiccate note di legno di sandalo e zafferano, poi molta prugna","Öffnet sich in der Nase mit ausgeprägten Noten von Sandelholz und Safran, dann viel Pflaume"],"Me lëndë dhe e plotë në qiellzë, ndërtohet në shumë shtresa të vogla, shumë butësi e ëmbël, jehonë shumë e gjatë":["Substantial and full on the palate, it builds in many small layers, much sweet softness, a very long echo","Materico e pieno al palato, si costruisce in tanti piccoli strati, molta morbidezza dolce, eco lunghissima","Substanzreich und voll am Gaumen, baut sich in vielen kleinen Schichten auf, viel süße Weichheit, sehr langer Nachhall"],"Rubin-vjollcë i dendur dhe i shndritshëm":["Dense, bright ruby-violet","Rubino-violaceo fitto e brillante","Dichtes, leuchtendes Rubinviolett"],"Hundë shumë intensive dhe tërheqëse me frut të plotë: qershi të errëta, manaferra, pak kokos dhe një nuancë piperi të zi":["Very intense, attractive nose with full fruit: dark cherries, blackberries, a little coconut and a hint of black pepper","Naso molto intenso e attraente con frutto pieno: ciliegie scure, more, un po' di cocco e un tocco di pepe nero","Sehr intensive, ansprechende Nase mit voller Frucht: dunkle Kirschen, Brombeeren, etwas Kokos und ein Hauch schwarzer Pfeffer"],"Shumë e lëngshme në qiellzë, më pas tregon skelet të dendur taninesh, shumë qershi të errëta, përfundim i plotë me presion të bukur":["Very juicy on the palate, then it shows a dense tannic backbone, lots of dark cherries, a full finish with good pressure","Molto succoso al palato, poi mostra uno scheletro tannico fitto, molte ciliegie scure, finale pieno con bella spinta","Sehr saftig am Gaumen, zeigt dann ein dichtes Tanningerüst, viele dunkle Kirschen, voller Abgang mit schönem Druck"],"Ngjyrë rubin e pasur me një nuancë të lehtë vjollce":["Rich ruby colour with a light violet hue","Colore rubino ricco con una leggera sfumatura violacea","Reiche Rubinfarbe mit leichtem violettem Schimmer"],"Aromë me nuanca qershish të pjekura, kokrrash të egra dhe erëzash":["Aroma with hints of ripe cherries, wild berries and spices","Profumo con sfumature di ciliegie mature, bacche selvatiche e spezie","Duft mit Anklängen reifer Kirschen, Wildbeeren und Gewürze"],"E butë, me tanine mesatare dhe nota vaniljeje e lisi; përfundim i gjatë dhe elegant":["Soft, with medium tannins and notes of vanilla and oak; long, elegant finish","Morbido, con tannini medi e note di vaniglia e rovere; finale lungo ed elegante","Weich, mit mittleren Tanninen und Noten von Vanille und Eiche; langer, eleganter Abgang"],"Shkon mirë me pjata me mish, gjah dhe djathëra të pjekur":["Goes well with meat dishes, game and mature cheeses","Si abbina bene a piatti di carne, selvaggina e formaggi stagionati","Passt gut zu Fleischgerichten, Wild und gereiften Käsen"],"Ngjyrë e kuqe e errët":["Dark red colour","Colore rosso scuro","Dunkelrote Farbe"],"Aroma qershie dhe manaferre":["Aromas of cherry and blackberry","Profumi di ciliegia e mora","Aromen von Kirsche und Brombeere"],"Verë e strukturuar dhe me tul, me nota qershie, kirsch-i dhe fiqsh të zinj; përfundim i gjatë ku dalin edhe nota kakaoje dhe duhani":["A structured, fleshy wine with notes of cherry, kirsch and black figs; a long finish where notes of cocoa and tobacco also emerge","Vino strutturato e polposo con note di ciliegia, kirsch e fichi neri; finale lungo in cui emergono anche note di cacao e tabacco","Ein strukturierter, fleischiger Wein mit Noten von Kirsche, Kirschwasser und schwarzen Feigen; langer Abgang, in dem auch Kakao- und Tabaknoten auftauchen"],"Nuancë e thellë vjollce":["Deep violet hue","Sfumatura violacea profonda","Tiefer violetter Schimmer"],"Nota manaferre, kumbulle dhe jamballi":["Notes of blackberry, plum and saffron","Note di mora, prugna e zafferano","Noten von Brombeere, Pflaume und Safran"],"Në qiellzë e fuqishme dhe mbështjellëse, por e ngritur nga freskia dhe një strukturë e fortë, autoritare":["Powerful and enveloping on the palate, but lifted by freshness and a firm, authoritative structure","Al palato potente e avvolgente, ma sollevato dalla freschezza e da una struttura solida e autorevole","Am Gaumen kraftvoll und umhüllend, aber gehoben durch Frische und eine feste, souveräne Struktur"],"Frut i errët dhe aroma të rafinuara":["Dark fruit and refined aromas","Frutti scuri e profumi raffinati","Dunkle Früchte und feine Aromen"],"Tanine të mëndafshta; pas 30 muajsh në dru zbulon një karakter elegant dhe të qëndrueshëm":["Silky tannins; after 30 months in wood it reveals an elegant, persistent character","Tannini setosi; dopo 30 mesi in legno rivela un carattere elegante e persistente","Seidige Tannine; nach 30 Monaten im Holz zeigt er einen eleganten, anhaltenden Charakter"],"Ngjyrë tulle":["Brick colour","Colore mattone","Ziegelrote Farbe"],"Nebbiolo thellësisht e pjekur: aroma frutash të thata dhe dyshemeje pylli, me nuanca katrani dhe tartufi":["Deeply mature Nebbiolo: aromas of dried fruit and forest floor, with hints of tar and truffle","Nebbiolo profondamente evoluto: profumi di frutta secca e sottobosco, con sfumature di catrame e tartufo","Tief gereifter Nebbiolo: Aromen von Trock
