enfrüchten und Waldboden, mit Anklängen von Teer und Trüffel"],"Tanine të holla, të shkrira prej kohësh; verë e vjetër e brishtë, për meditim":["Fine tannins, long since melted; a fragile old wine, for meditation","Tannini fini, fusi da tempo; vino vecchio e fragile, da meditazione","Feine, längst geschmolzene Tannine; ein zerbrechlicher alter Wein zum Meditieren"],"Ngjyrë e zbehtë, me nuanca tulle":["Pale colour, with brick hues","Colore tenue, con sfumature mattone","Blasse Farbe mit ziegelroten Nuancen"],"Nebbiolo thellësisht e pjekur: qershi e tharë, katran, lëkurë dhe dysheme pylli":["Deeply mature Nebbiolo: dried cherry, tar, leather and forest floor","Nebbiolo profondamente evoluto: ciliegia secca, catrame, cuoio e sottobosco","Tief gereifter Nebbiolo: getrocknete Kirsche, Teer, Leder und Waldboden"],"Taninet janë shkrirë prej kohësh; një shishe e vjetër delikate, për meditim":["The tannins have long since melted; a delicate old bottle, for meditation","I tannini si sono fusi da tempo; una vecchia bottiglia delicata, da meditazione","Die Tannine sind längst geschmolzen; eine zarte alte Flasche zum Meditieren"],"Aromë e përmbajtur, jo e theksuar":["Restrained, not pronounced aroma","Profumo contenuto, non marcato","Zurückhaltender, nicht ausgeprägter Duft"],"Shije e ëmbël-thartë me një notë të lehtë të hidhur":["Sweet-and-sour taste with a light bitter note","Gusto agrodolce con una leggera nota amara","Süßsäuerlicher Geschmack mit leichter Bitternote"],"Ngjyrë rubini intensive me bërthamë që vezullon":["Intense ruby colour with a sparkling core","Colore rubino intenso con un cuore scintillante","Intensive Rubinfarbe mit funkelndem Kern"],"Qershi dhe pjeshkë të harlisura, të shtresuara me nota lehtësisht shkumësore":["Lush cherries and peaches, layered with lightly chalky notes","Ciliegie e pesche rigogliose, stratificate con note leggermente gessose","Üppige Kirschen und Pfirsiche, geschichtet mit leicht kreidigen Noten"],"E kapshme dhe e lëngshme, me tërheqje të mirë, e freskët por me trup të plotë, e balancuar mirë, me shtytje të fortë në përfundim":["Grippy and juicy, with good pull, fresh but full-bodied, well balanced, with a strong push on the finish","Grippante e succoso, con bella trazione, fresco ma di corpo pieno, ben equilibrato, con una forte spinta nel finale","Griffig und saftig, mit gutem Zug, frisch, aber vollmundig, gut ausgewogen, mit kräftigem Schub im Abgang"],"E kuqe rubin e shndritshme me një turbullirë të lehtë":["Bright ruby red with a slight haze","Rosso rubino brillante con una leggera velatura","Leuchtendes Rubinrot mit leichter Trübung"],"Shumë luleshtrydhe, sheqer pluhur, shurup kokrrash të kuqe":["Lots of strawberry, icing sugar, red-berry syrup","Molta fragola, zucchero a velo, sciroppo di bacche rosse","Viel Erdbeere, Puderzucker, Sirup roter Beeren"],"Frutore dhe lulore, fillim i mirë, por bie në pjesën e dytë dhe mbyllet ashpër":["Fruity and floral, a good start, but it drops in the second half and closes harshly","Fruttato e floreale, buon inizio, ma cala nella seconda parte e chiude ruvido","Fruchtig und blumig, guter Beginn, fällt aber in der zweiten Hälfte ab und schließt rau"],"Hundë jo plotësisht e qartë, me pluhur, disi shtazore":["A not entirely clean nose, dusty, somewhat animal","Naso non del tutto pulito, polveroso, un po' animale","Nicht ganz saubere Nase, staubig, etwas animalisch"],"Strukturë e hollë, edhe në qiellzë mjaft shtazore":["Thin structure, fairly animal on the palate too","Struttura esile, piuttosto animale anche al palato","Dünne Struktur, auch am Gaumen recht animalisch"],"E bardhë me reflekse qelibari.":["White with amber reflections.","Bianco con riflessi ambrati.","Weiß mit bernsteinfarbenen Reflexen."],"Harmonike, karakteristike e rrushit Zibibbo.":["Harmonious, characteristic of the Zibibbo grape.","Armonico, caratteristico del vitigno Zibibbo.","Harmonisch, charakteristisch für die Zibibbo-Traube."],"E ëmbël, aromatike, me nota kajsie, mjalti dhe fiku të thatë.":["Sweet, aromatic, with notes of apricot, honey and dried fig.","Dolce, aromatico, con note di albicocca, miele e fico secco.","Süß, aromatisch, mit Noten von Aprikose, Honig und getrockneter Feige."],"Shkon shumë mirë me akullore, ëmbëlsira të thata dhe ëmbëlsira me rikota.":["Goes very well with ice cream, dry pastries and ricotta desserts.","Si abbina molto bene a gelati, pasticceria secca e dolci alla ricotta.","Passt sehr gut zu Eis, trockenem Gebäck und Ricotta-Desserts."],"Qelibar i errët.":["Dark amber.","Ambra scuro.","Dunkles Bernstein."],"Intensive, harmonike, karakteristike e rrushit Zibibbo.":["Intense, harmonious, characteristic of the Zibibbo grape.","Intenso, armonico, caratteristico del vitigno Zibibbo.","Intensiv, harmonisch, charakteristisch für die Zibibbo-Traube."],"E plotë, e butë, me nota mjalti.":["Full, soft, with notes of honey.","Pieno, morbido, con note di miele.","Voll, weich, mit Honignoten."],"Shkon shumë mirë me akullore, ëmbëlsira të thata dhe ëmbëlsira me rikota; përbërës i shkëlqyer për pastiçeri dhe akullore.":["Goes very well with ice cream, dry pastries and ricotta desserts; an excellent ingredient for pastry and ice cream.","Si abbina molto bene a gelati, pasticceria secca e dolci alla ricotta; ottimo ingrediente per pasticceria e gelateria.","Passt sehr gut zu Eis, trockenem Gebäck und Ricotta-Desserts; eine ausgezeichnete Zutat für Konditorei und Eis."],"Vjollcë mbresëlënëse, e dendur por e shndritshme":["Impressive violet, dense yet bright","Viola impressionante, fitto ma brillante","Eindrucksvolles Violett, dicht und doch leuchtend"],"Aroma të theksuara erëzash, kryesisht kanellë dhe karafil, që shfaqen menjëherë":["Marked aromas of spice, mainly cinnamon and clove, which appear immediately","Spiccati profumi di spezie, soprattutto cannella e chiodi di garofano, che si mostrano subito","Ausgeprägte Gewürzaromen, vor allem Zimt und Nelke, die sofort erscheinen"],"Një pëlhurë e butë taninesh të dendura bën përshtypje menjëherë në qiellzë":["A soft fabric of dense tannins makes an immediate impression on the palate","Un morbido tessuto di tannini fitti colpisce subito al palato","Ein weiches Gewebe dichter Tannine beeindruckt sofort am Gaumen"],"Partner i shkëlqyer me çdo pjatë mishi të gatuar gjatë, si marinata, mish i pjekur në tenxhere dhe gjellë":["An excellent partner for any long-cooked meat dish, such as marinades, pot roasts and stews","Ottimo compagno di qualsiasi piatto di carne a lunga cottura, come marinate, brasati in pentola e stufati","Ausgezeichneter Partner für jedes lange gegarte Fleischgericht wie Marinaden, Schmorbraten und Eintöpfe"],"Vjollcë jashtëzakonisht intensive dhe e shndritshme":["Extraordinarily intense and bright violet","Viola straordinariamente intenso e brillante","Außergewöhnlich intensives und leuchtendes Violett"],"Fruta të pasura dhe të përqendruara, me bollëk ribesi të zi dhe boronice, reçel kumbulle dhe nuanca piperi të zi e kanelle":["Rich, concentrated fruit, with plenty of blackcurrant and blueberry, plum jam and hints of black pepper and cinnamon","Frutto ricco e concentrato, con abbondanza di ribes nero e mirtillo, confettura di prugne e sfumature di pepe nero e cannella","Reiche, konzentrierte Frucht mit viel schwarzer Johannisbeere und Heidelbeere, Pflaumenkonfitüre und Anklängen von schwarzem Pfeffer und Zimt"],"Zhvillohet me trup të plotë në qiellzë, e ngrohtë dhe bujare, me tanine kadifeje dhe aciditet që ekuilibron":["It develops full-bodied on the palate, warm and generous, with velvety tannins and balancing acidity","Si sviluppa corposo al palato, caldo e generoso, con tannini vellutati e un'acidità che equilibra","Entwickelt sich vollmundig am Gaumen, warm und großzügig, mit samtigen Tanninen und ausgleichender Säure"],"Qengj i pjekur ose në skarë, shpendë gjahu (fazan), biftek kau në tigan":["Roast or grilled lamb, game birds (pheasant), pan-fried beef steak","Agnello arrosto o alla griglia, selvaggina da piuma (fagiano), bistecca di manzo in padella","Gebratenes oder gegrilltes Lamm, Federwild (Fasan), in der Pfanne gebratenes Rindersteak"],"E kuqe-purpur e dendur por e ndritshme.":["Dense but bright purple-red.","Rosso porpora fitto ma brillante.","Dichtes, aber leuchtendes Purpurrot."],"Një përzierje komplekse aromash, nga frutat e kuqe të egra deri te nota të mprehta karafili.":["A complex mix of aromas, from wild red fruit to sharp notes of clove.","Un complesso mix di profumi, dai frutti rossi selvatici a note pungenti di chiodi di garofano.","Eine komplexe Mischung von Aromen, von wilden roten Früchten bis zu scharfen Nelkennoten."],"Bën përshtypje me butësinë kadifeje, ndjesinë e këndshme në gojë dhe përqendrimin.":["It impresses with velvety softness, a pleasant mouthfeel and concentration.","Colpisce per la morbidezza vellutata, la piacevole sensazione in bocca e la concentrazione.","Beeindruckt mit samtiger Weichheit, angenehmem Mundgefühl und Konzentration."],"Ideale me çdo lloj mishi të pjekur në furrë, në skarë dhe në barbecue, me fileto viçi të skuqur; provojeni edhe me djathëra delikatë.":["Ideal with any kind of oven-roasted, grilled and barbecued meat, with pan-fried beef fillet; try it also with delicate cheeses.","Ideale con ogni tipo di carne al forno, alla griglia e al barbecue, con filetto di manzo in padella; da provare anche con formaggi delicati.","Ideal zu jeder Art von Fleisch aus dem Ofen, vom Grill und vom Barbecue, zu gebratenem Rinderfilet; auch zu milden Käsen probieren."],"Rubin-granatë i shkëlqyer dhe i pasur":["Brilliant, rich ruby-garnet","Rubino-granato brillante e ricco","Glänzendes, reiches Rubin-Granat"],"Hundë e përcaktuar hollë, intensive dhe e qartë, me nota qershie, pak pjeshkë e konservuar, mjedër, tërheqëse":["Finely defined, intense and clear nose, with notes of cherry, a little preserved peach, raspberry, attractive","Naso finemente definito, intenso e nitido, con note di ciliegia, un po' di pesca sciroppata, lampone, attraente","Fein definierte, intensive und klare Nase mit Noten von Kirsche, etwas eingemachtem Pfirsich, Himbeere, ansprechend"],"Me trup të plotë dhe e pasur, shumë tanin i dendur, zgjatet gjatë, fruta të lëngshme, e fortë dhe e kapshme në fund; ende shumë e re, potencial i shkëlqyer":["Full-bodied and rich, plenty of dense tannin, it stretches long, juicy fruit, firm and grippy at the end; still very young, excellent potential","Corposo e ricco, molto tannino fitto, si allunga a lungo, frutto succoso, deciso e grippante nel finale; ancora molto giovane, ottimo potenziale","Vollmundig und reich, viel dichtes Tannin, zieht sich lang, saftige Frucht, fest und griffig am Ende; noch sehr jung, ausgezeichnetes Potenzial"],"Rubin-vjollcë i ndritshëm":["Bright ruby-violet","Rubino-violaceo brillante","Leuchtendes Rubinviolett"],"Pak lëkurë, nota shumë të bukura jamballi, fillimisht e përmbajtur, pastaj hapet me nota të holla ribesi të zi":["A little leather, very lovely saffron notes, restrained at first, then it opens with fine notes of blackcurrant","Un po' di cuoio, bellissime note di zafferano, inizialmente contenuto, poi si apre con fini note di ribes nero","Etwas Leder, sehr schöne Safrannoten, zunächst verhalten, dann öffnet er sich mit feinen Noten schwarzer Johannisbeere"],"Shumë presion (e fuqishme), e gjatë":["Lots of pressure (powerful), long","Molta spinta (potente), lungo","Viel Druck (kraftvoll), lang"],"E verdhë kashte":["Straw yellow","Giallo paglierino","Strohgelb"],"Hundë e pasur me nuanca bukë të thekur dhe vaniljeje, si dhe aroma frutash agrume":["Rich nose with hints of toasted bread and vanilla, as well as aromas of citrus fruit","Naso ricco con sfumature di pane tostato e vaniglia, oltre a profumi di agrumi","Reiche Nase mit Anklängen von Toastbrot und Vanille sowie Zitrusaromen"],"Në qiellzë me trup të plotë, me fruta të përqendruara dhe të pjekura, të ekuilibruara nga një aciditet i gjallë":["Full-bodied on the palate, with concentrated, ripe fruit, balanced by lively acidity","Al palato corposo, con frutto concentrato e maturo, bilanciato da un'acidità vivace","Am Gaumen vollmundig, mit konzentrierter, reifer Frucht, ausgeglichen durch lebendige Säure"],"Rizoto me rozmarinë dhe kaçubeta, djathë, omar, gaforre, viç i pjekur dhe sashimi":["Risotto with rosemary and chanterelles, cheese, lobster, crab, roast veal and sashimi","Risotto al rosmarino e finferli, formaggi, astice, granchio, vitello arrosto e sashimi","Risotto mit Rosmarin und Pfifferlingen, Käse, Hummer, Krabbe, Kalbsbraten und Sashimi"],"Hundë me nota të ëmbla frutash të kuqe të pjekura, qershi, kumbull dhe reçel luleshtrydhesh, me një nuancë të ëmbël pikante":["Nose with sweet notes of ripe red fruit, cherry, plum and strawberry jam, with a sweetly spicy hint","Naso con note dolci di frutti rossi maturi, ciliegia, prugna e confettura di fragole, con una sfumatura dolcemente speziata","Nase mit süßen Noten reifer roter Früchte, Kirsche, Pflaume und Erdbeerkonfitüre, mit süß-würzigem Anklang"],"E butë dhe e lëngshme në qiellzë, tanine të kapshme e të forta, e qëndrueshme":["Soft and juicy on the palate, grippy, firm tannins, persistent","Morbido e succoso al palato, tannini grippanti e decisi, persistente","Weich und saftig am Gaumen, griffige, feste Tannine, anhaltend"],"E kuqe granati e thellë dhe e errët, gati e zezë":["Deep, dark garnet red, almost black","Rosso granato profondo e scuro, quasi nero","Tiefes, dunkles Granatrot, fast schwarz"],"Hundë e hapur dhe e hollë, me nota elegante ribesi të zi dhe kokrrash shtogu, edhe trëndafila të tharë":["Open, fine nose, with elegant notes of blackcurrant and elderberries, also dried roses","Naso aperto e fine, con eleganti note di ribes nero e bacche di sambuco, anche rose secche","Offene, feine Nase mit eleganten Noten von schwarzer Johannisbeere und Holunderbeeren, auch getrocknete Rosen"],"Harmonike dhe me tanine të ëmbla, e endur hollë, frut i hollë me gjatësi të mirë dhe lëngshmëri të hollë":["Harmonious and with sweet tannins, finely woven, fine fruit with good length and fine juiciness","Armonico e con tannini dolci, finemente intessuto, frutto fine con buona lunghezza e fine succosità","Harmonisch und mit süßen Tanninen, fein gewoben, feine Frucht mit guter Länge und feiner Saftigkeit"],"Hundë shumë komplekse, lulore dhe minerale, me nota dardhe, erëzash dhe mjalti":["Very complex nose, floral and mineral, with notes of pear, spices and honey","Naso molto complesso, floreale e minerale, con note di pera, spezie e miele","Sehr komplexe Nase, blumig und mineralisch, mit Noten von Birne, Gewürzen und Honig"],"E freskët në qiellzë, por me një shije të këndshme me teksturë":["Fresh on the palate, but with a pleasant textured taste","Fresco al palato, ma con un piacevole gusto materico","Frisch am Gaumen, aber mit angenehm texturiertem Geschmack"],"Arneis është një shoqërues pothuajse ideal për fondue djathi":["Arneis is an almost ideal partner for cheese fondue","L'Arneis è un compagno quasi ideale per la fonduta di formaggio","Arneis ist ein nahezu idealer Begleiter zu Käsefondue"],"Rubin i shndritshëm me nota granati":["Bright ruby with garnet notes","Rubino brillante con note granate","Leuchtendes Rubin mit Granatnoten"],"Hundë joshëse me nota mjedrash të egra, manaferrash, qershish të konservuara, pak lëkurë, reçel portokalli":["Seductive nose with notes of wild raspberries, blackberries, preserved cherries, a little leather, orange marmalade","Naso seducente con note di lamponi selvatici, more, ciliegie sciroppate, un po' di cuoio, marmellata d'arancia","Verführerische Nase mit Noten von wilden Himbeeren, Brombeeren, eingemachten Kirschen, etwas Leder, Orangenmarmelade"],"Jashtëzakonisht e lëmuar në qiellzë, shumë elegante, hapet me hark të gjerë; shumë tanin me kokërr të imët në përfundim, e qëndrueshme":["Extraordinarily polished on the palate, very elegant, it opens in a wide arc; plenty of fine-grained tannin on the finish, persistent","Straordinariamente levigato al palato, molto elegante, si apre con un ampio arco; molto tannino a grana fine nel finale, persistente","Außergewöhnlich geschliffen am Gaumen, sehr elegant, öffnet sich in weitem Bogen; viel feinkörniges Tannin im Abgang, anhaltend"],"Freski dhe kripësi që vijnë nga tokat ranore (përshkrim i prodhuesit).":["Freshness and saltiness coming from the sandy soils (producer's description).","Freschezza e sapidità che derivano dai terreni sabbiosi (descrizione del produttore).","Frische und Salzigkeit aus den Sandböden (Beschreibung des Erzeugers)."],"Aperitiv, pjata të para dhe të dyta me peshk, djathëra të freskët, pica dhe fokaçe.":["Aperitif, first and second courses with fish, fresh cheeses, pizza and focaccia.","Aperitivo, primi e secondi piatti di pesce, formaggi freschi, pizza e focaccia.","Aperitif, erste und zweite Gänge mit Fisch, Frischkäse, Pizza und Focaccia."],"Verë e kuqe moderne, e paketuar dendur, me karakter të pasur kumbulle":["A modern, densely packed red wine with a rich plum character","Vino rosso moderno, compatto, dal ricco carattere di prugna","Ein moderner, dicht gepackter Rotwein mit reichem Pflaumencharakter"],"Freskia dhe aroma vijnë nga rrushi i Roero-s (minerale dhe aromatike)":["The freshness and aroma come from the Roero grapes (mineral and aromatic)","Freschezza e profumo derivano dalle uve del Roero (minerali e aromatiche)","Frische und Aroma stammen von den Roero-Trauben (mineralisch und aromatisch)"],"Me trup mesatar, e lëngshme, e freskët dhe e gjallë; theksi te ekuilibri – rrushi i Langhe-s jep thellësi dhe volum":["Medium-bodied, juicy, fresh and lively; the emphasis is on balance – the Langhe grapes give depth and volume","Di medio corpo, succoso, fresco e vivace; l'accento è sull'equilibrio – le uve delle Langhe danno profondità e volume","Mittlerer Körper, saftig, frisch und lebendig; der Schwerpunkt liegt auf der Ausgewogenheit – die Langhe-Trauben geben Tiefe und Volumen"],"Shpërthim frutash dhe lulesh: fruta të kuqe të pjekura si mjedra, ribes, manushaqe dhe trëndafil, nota hibiskusi dhe gjethesh çaji":["An explosion of fruit and flowers: ripe red fruit such as raspberry, currant, violet and rose, notes of hibiscus and tea leaves","Un'esplosione di frutta e fiori: frutti rossi maturi come lampone, ribes, viola e rosa, note di ibisco e foglie di tè","Eine Explosion von Früchten und Blumen: reife rote Früchte wie Himbeere, Johannisbeere, Veilchen und Rose, Noten von Hibiskus und Teeblättern"],"E thatë, tanine të këndshme, tapenadë ullinjsh të zinj, karamel i lehtë i djegur, jamballi":["Dry, pleasant tannins, black olive tapenade, light burnt caramel, saffron","Secco, tannini piacevoli, tapenade di olive nere, leggero caramello bruciato, zafferano","Trocken, angenehme Tannine, Tapenade von schwarzen Oliven, leichtes verbranntes Karamell, Safran"],"Tonet e pjekura dhe të ngrohta të vjeljes balancohen mirë nga shija karakteristike; flet për rërat gëlqerore nga vjen.":["The ripe, warm tones of the vintage are well balanced by the characteristic flavour; it speaks of the calcareous sands it comes from.","I toni maturi e caldi dell'annata sono ben bilanciati dal sapore caratteristico; parla delle sabbie calcaree da cui proviene.","Die reifen, warmen Töne des Jahrgangs werden gut vom charakteristischen Geschmack ausgeglichen; er erzählt von den kalkhaltigen Sanden, aus denen er stammt."],"Profil i këndshëm lulesh dhe stil tipikisht i afrueshëm; nota dredhëze, vjollce, limoni dhe erëzash.":["A pleasant floral profile and a typically approachable style; notes of strawberry, violet, lemon and spices.","Profilo floreale piacevole e stile tipicamente accessibile; note di fragola, viola, limone e spezie.","Angenehmes blumiges Profil und typisch zugänglicher Stil; Noten von Erdbeere, Veilchen, Zitrone und Gewürzen."],"Freskuese dhe njëkohësisht e butë në gojë; tanine kadifeje dhe të sakta.":["Refreshing and at the same time soft on the palate; velvety, precise tannins.","Rinfrescante e allo stesso tempo morbido in bocca; tannini vellutati e precisi.","Erfrischend und zugleich weich am Gaumen; samtige, präzise Tannine."],"Moscato Spumante me cilësi të jashtëzakonshme, për qiellzat më të kërkuara; alkool i ulët (6,5%), ëmbëlsia e mbetur vjen tërësisht nga rrushi; freskia e madhe e plotëson me një kundërpikë të përsosur":["A Moscato Spumante of extraordinary quality, for the most demanding palates; low alcohol (6.5%), the residual sweetness comes entirely from the grapes; its great freshness complements it with a perfect counterpoint","Moscato Spumante di qualità straordinaria, per i palati più esigenti; bassa gradazione (6,5%), la dolcezza residua deriva interamente dall'uva; la grande freschezza la completa con un contrappunto perfetto","Ein Moscato Spumante von außergewöhnlicher Qualität für die anspruchsvollsten Gaumen; wenig Alkohol (6,5 %), die Restsüße stammt ganz aus den Trauben; die große Frische ergänzt sie als perfekter Kontrapunkt"],"Flluska festimi par excellence; zakonisht hapet pas darkës ose me ëmbëlsira; shkon lehtë me fruta të freskëta dhe mund të krijojë kombinime befasuese me ushqime të kripura":["The celebration bubbly par excellence; usually opened after dinner or with desserts; pairs easily with fresh fruit and can create surprising matches with savoury food","La bollicina della festa per eccellenza; di solito si stappa dopo cena o con i dolci; si abbina facilmente alla frutta fresca e può creare abbinamenti sorprendenti con cibi salati","Das Festtagsprickeln schlechthin; wird meist nach dem Abendessen oder zu Desserts geöffnet; passt leicht zu frischem Obst und kann überraschende Kombinationen mit herzhaften Speisen schaffen"],"Verë natyrshëm e ëmbël, me pak alkool, e lehtë – jo verë e rëndë ëmbëlsire (përshkrimi i përgjithshëm i markës Villa M)":["A naturally sweet, low-alcohol, light wine – not a heavy dessert wine (general description of the Villa M brand)","Vino naturalmente dolce, a bassa gradazione, leggero – non un pesante vino da dessert (descrizione generale del marchio Villa M)","Ein natürlich süßer, alkoholarmer, leichter Wein – kein schwerer Dessertwein (allgemeine Beschreibung der Marke Villa M)"],"Për brunch, piknik dhe aperitiv":["For brunch, picnics and aperitifs","Per brunch, picnic e aperitivi","Für Brunch, Picknick und Aperitif"],"Verë e butë dhe kremoze, me flluska të lehta dhe shije intensive dardhe, pjeshke dhe mandarine":["A soft, creamy wine with light bubbles and intense flavours of pear, peach and mandarin","Vino morbido e cremoso, con bollicine leggere e intensi sapori di pera, pesca e mandarino","Ein weicher, cremiger Wein mit leichten Bläschen und intensivem Geschmack von Birne, Pfirsich und Mandarine"],"Në hundë dalin nota të freskëta frutash të kuqe pylli, të ndjekura nga nuanca delikate lulore dhe nota mjalti akacieje":["On the nose fresh notes of red wild berries emerge, followed by delicate floral hints and notes of acacia honey","Al naso emergono fresche note di frutti rossi di bosco, seguite da delicate sfumature floreali e note di miele d'acacia","In der Nase zeigen sich frische Noten roter Waldbeeren, gefolgt von zarten Blütenanklängen und Noten von Akazienhonig"],"Ëmbëlsia e butë ngrihet nga një freski e ndritshme; verë e gjallë dhe aromatike":["The gentle sweetness is lifted by a bright freshness; a lively, aromatic wine","La dolcezza delicata è sollevata da una freschezza brillante; vino vivace e aromatico","Die sanfte Süße wird von leuchtender Frische gehoben; ein lebendiger, aromatischer Wein"],"Verë e ndritshme, me shumë luleshtrydhe, nota lulore dhe petale trëndafili":["A bright wine, with lots of strawberry, floral notes and rose petals","Vino brillante, con molta fragola, note floreali e petali di rosa","Ein leuchtender Wein mit viel Erdbeere, Blütennoten und Rosenblättern"],"E artë me reflekse të forta qelibari":["Golden with strong amber reflections","Dorato con intensi riflessi ambrati","Golden mit kräftigen bernsteinfarbenen Reflexen"],"Intensive dhe e qëndrueshme, me nuanca bajameje, lajthie dhe kakaoje":["Intense and persistent, with hints of almond, hazelnut and cocoa","Intenso e persistente, con sfumature di mandorla, nocciola e cacao","Intensiv und anhaltend, mit Anklängen von Mandel, Haselnuss und Kakao"],"E ngrohtë dhe kadifeje, me horizonte ndjesish të ëmbla":["Warm and velvety, with horizons of sweet sensations","Caldo e vellutato, con orizzonti di sensazioni dolci","Warm und samtig, mit Horizonten süßer Eindrücke"],"Shkon në mënyrë të përsosur me biskota, pasticeri të thatë dhe torta; prodhuesi rekomandon veçanërisht cantuccini me bajame të zhytur në verë":["Goes perfectly with biscuits, dry pastries and cakes; the producer especially recommends almond cantuccini dipped in the wine","Si abbina perfettamente a biscotti, pasticceria secca e torte; il produttore consiglia in particolare i cantuccini alle mandorle intinti nel vino","Passt perfekt zu Keksen, trockenem Gebäck und Kuchen; der Erzeuger empfiehlt besonders Mandel-Cantuccini, in den Wein getunkt"],"Rubin-vjollcë i pasur":["Rich ruby-violet","Rubino-violaceo ricco","Reiches Rubinviolett"],"Hundë kompakte me tym dhe lajthi të pjekura, pak karamel":["Compact nose with smoke and roasted hazelnuts, a little caramel","Naso compatto con fumo e nocciole tostate, un po' di caramello","Kompakte Nase mit Rauch und gerösteten Haselnüssen, etwas Karamell"],"Shumë kompakte në qiellzë, shumë fruta, tanin i kapshëm me bërthamë të ëmbël, luan gjatë":["Very compact on the palate, lots of fruit, grippy tannin with a sweet core, it plays long","Molto compatto al palato, molto frutto, tannino grippante con un cuore dolce, gioca a lungo","Sehr kompakt am Gaumen, viel Frucht, griffiges Tannin mit süßem Kern, spielt lange"],"E bardhë e ndritshme me reflekse të arta":["Bright white with golden reflections","Bianco brillante con riflessi dorati","Leuchtendes Weiß mit goldenen Reflexen"],"Agrumet e freskëta hapin buqetën, të ndjekura nga nota të lëngshme mollësh të pjekura dhe pjeshkësh të pjekura në diell":["Fresh citrus opens the bouquet, followed by juicy notes of ripe apples and sun-ripened peaches","Agrumi freschi aprono il bouquet, seguiti da note succose di mele mature e pesche maturate al sole","Frische Zitrusfrüchte eröffnen das Bouquet, gefolgt von saftigen Noten reifer Äpfel und sonnengereifter Pfirsiche"],"Ëmbëlsi e theksuar që plotëson në mënyrë të përsosur aromën frutore; me shkumë të imët dhe harmonike":["Marked sweetness that perfectly complements the fruity aroma; with fine, harmonious mousse","Dolcezza marcata che completa perfettamente il profumo fruttato; con spuma fine e armoniosa","Ausgeprägte Süße, die das fruchtige Aroma perfekt ergänzt; mit feinem, harmonischem Schaum"],"Ëmbëlsira me fruta (p.sh. panna cotta me agrume), djathëra të butë si burrata ose mocarela e re, sallata frutash, peshk i lehtë, antipasta":["Fruit desserts (e.g. panna cotta with citrus), soft cheeses such as burrata or young mozzarella, fruit salads, light fish, starters","Dolci alla frutta (es. panna cotta agli agrumi), formaggi morbidi come burrata o mozzarella giovane, macedonie, pesce leggero, antipasti","Obstdesserts (z. B. Panna cotta mit Zitrus), Weichkäse wie Burrata oder junger Mozzarella, Obstsalate, leichter Fisch, Vorspeisen"],"E kuqe rubin intensive me nota të purpurta":["Intense ruby red with purple notes","Rosso rubino intenso con note porpora","Intensives Rubinrot mit purpurnen Noten"],"Hapet me nota balsamike elegante e të rafinuara, vazhdon me nota të vogla frutash pylli; në fund erëza të buta orientale si xhenxhefil dhe kanellë":["It opens with elegant, refined balsamic notes, continues with notes of small wild berries; at the end soft oriental spices such as ginger and cinnamon","Si apre con eleganti e raffinate note balsamiche, prosegue con note di piccoli frutti di bosco; nel finale morbide spezie orientali come zenzero e cannella","Öffnet sich mit eleganten, feinen balsamischen Noten, setzt sich mit Noten kleiner Waldbeeren fort; am Ende sanfte orientalische Gewürze wie Ingwer und Zimt"],"Eleganca e taninave i jep një shije të pasur, me plotësi të këndshme në gojë":["The elegance of the tannins gives it a rich taste, with a pleasant fullness on the palate","L'eleganza dei tannini gli conferisce un gusto ricco, con una piacevole pienezza in bocca","Die Eleganz der Tannine verleiht ihm einen reichen Geschmack mit angenehmer Fülle am Gaumen"],"E verdhë kashte e ndritshme dhe e shndritshme, me nuanca të lehta jeshile":["Bright, shining straw yellow, with light green hues","Giallo paglierino luminoso e brillante, con leggere sfumature verdi","Leuchtendes, glänzendes Strohgelb mit leichten grünen Nuancen"],"Hundë aromatike dhe shumë e saktë, me pjeshkë të bardhë, kajsi, pak grejpfrut dhe bajame në sfond":["Aromatic and very precise nose, with white peach, apricot, a little grapefruit and almond in the background","Naso aromatico e molto preciso, con pesca bianca, albicocca, un po' di pompelmo e mandorla sullo sfondo","Aromatische und sehr präzise Nase mit weißem Pfirsich, Aprikose, etwas Grapefruit und Mandel im Hintergrund"],"E lëngshme dhe e balancuar në qiellzë, shumë koherente, e hollë në përfundim, me teksturë frutash të ëmbla; zgjat shumë":["Juicy and balanced on the palate, very consistent, fine on the finish, with a sweet-fruit texture; very long","Succoso ed equilibrato al palato, molto coerente, fine nel finale, con una trama di frutto dolce; molto lungo","Saftig und ausgewogen am Gaumen, sehr stimmig, fein im Abgang, mit süßer Fruchttextur; sehr lang"],"E verdhë kashte, e ndritshme":["Straw yellow, bright","Giallo paglierino, luminoso","Strohgelb, leuchtend"],"Kompleksitet dhe bukuri me aroma eleganca e sofistikimi të rrallë; mbizotërojnë aroma ekzotike frutash të pjekura, gjalpë i shkrirë, vanilje, pastiçeri":["Complexity and beauty with aromas of rare elegance and sophistication; exotic aromas of ripe fruit, melted butter, vanilla and pastry dominate","Complessità e bellezza con profumi di rara eleganza e raffinatezza; dominano profumi esotici di frutta matura, burro fuso, vaniglia, pasticceria","Komplexität und Schönheit mit Aromen seltener Eleganz und Raffinesse; exotische Aromen reifer Früchte, geschmolzene Butter, Vanille und Gebäck dominieren"],"Në qiellzë mban të gjitha premtimet e hundës dhe i pasuron me shije të buta dhe nuanca të freskëta, aromatike e të qëndrueshme":["On the palate it keeps all the promises of the nose and enriches them with soft flavours and fresh, aromatic and persistent hints","Al palato mantiene tutte le promesse del naso e le arricchisce con sapori morbidi e sfumature fresche, aromatiche e persistenti","Am Gaumen hält er alle Versprechen der Nase und bereichert sie mit weichen Aromen und frischen, aromatischen, anhaltenden Nuancen"],"E verdhë e shndritshme":["Bright yellow","Giallo brillante","Leuchtendes Gelb"],"Aromë frutore dardhe Williams me nuanca lulesh të bardha":["Fruity aroma of Williams pear with hints of white flowers","Profumo fruttato di pera Williams con sfumature di fiori bianchi","Fruchtiger Duft von Williamsbirne mit Anklängen weißer Blüten"],"Shumë minerale, e shoqëruar nga një frutshmëri e freskët dhe elegancë delikate":["Very mineral, accompanied by fresh fruitiness and delicate elegance","Molto minerale, accompagnato da una fresca fruttuosità e da una delicata eleganza","Sehr mineralisch, begleitet von frischer Fruchtigkeit und zarter Eleganz"],"Perfekte si aperitiv freskues ose me sallata të lehta vere; edhe me antipasta delikate, pjata me perime të gatuara shpejt dhe fruta deti":["Perfect as a refreshing aperitif or with light summer salads; also with delicate starters, quickly cooked vegetable dishes and seafood","Perfetto come aperitivo rinfrescante o con insalate estive leggere; anche con antipasti delicati, piatti di verdure a cottura rapida e frutti di mare","Perfekt als erfrischender Aperitif oder zu leichten Sommersalaten; auch zu zarten Vorspeisen, kurz gegarten Gemüsegerichten und Meeresfrüchten"],"Profum frutor-aromatik pjeshke të pjekur, mango dhe qumështi kokosi":["Fruity-aromatic perfume of ripe peach, mango and coconut milk","Profumo fruttato-aromatico di pesca matura, mango e latte di cocco","Fruchtig-aromatischer Duft von reifem Pfirsich, Mango und Kokosmilch"],"Ndjesi e plotë në gojë me shumë fruta të pjekura, e lëngshme në përfundim":["Full mouthfeel with lots of ripe fruit, juicy on the finish","Sensazione piena in bocca con molta frutta matura, succoso nel finale","Volles Mundgefühl mit viel reifer Frucht, saftig im Abgang"],"Si aperitiv, me antipasta të lehta, sallata vere, pjata me asparagus, peshk në skarë dhe djathëra të butë e të freskët":["As an aperitif, with light starters, summer salads, asparagus dishes, grilled fish and soft, fresh cheeses","Come aperitivo, con antipasti leggeri, insalate estive, piatti di asparagi, pesce alla griglia e formaggi morbidi e freschi","Als Aperitif, zu leichten Vorspeisen, Sommersalaten, Spargelgerichten, gegrilltem Fisch und weichen Frischkäsen"],"E kuqe e errët, e thellë":["Dark, deep red","Rosso scuro, profondo","Dunkles, tiefes Rot"],"Aroma frutash të pjekura kumbulle dhe manaferre, të shoqëruara nga nota çokollate dhe kafeje":["Aromas of ripe plum and blackberry fruit, accompanied by notes of chocolate and coffee","Profumi di frutta matura di prugna e mora, accompagnati da note di cioccolato e caffè","Aromen reifer Pflaumen- und Brombeerfrucht, begleitet von Schokoladen- und Kaffeenoten"],"Qiellzë voluminoze dhe e fuqishme, me tanine të buta e të ekuilibruara dhe përfundim të qëndrueshëm":["Voluminous and powerful palate, with soft, balanced tannins and a persistent finish","Palato voluminoso e potente, con tannini morbidi ed equilibrati e finale persistente","Voluminöser, kraftvoller Gaumen mit weichen, ausgewogenen Tanninen und anhaltendem Abgang"],"Gjah, mish i errët dhe djathë i fortë":["Game, dark meat and strong cheese","Selvaggina, carni scure e formaggi forti","Wild, dunkles Fleisch und kräftiger Käse"],"E kuqe rubin intensive me reflekse purpuri":["Intense ruby red with purple reflections","Rosso rubino intenso con riflessi porpora","Intensives Rubinrot mit purpurnen Reflexen"],"Profum frutor në hundë, me nuanca frutash të vogla të kuqe dhe çokollate të zezë":["Fruity perfume on the nose, with hints of small red fruits and dark chocolate","Profumo fruttato al naso, con sfumature di piccoli frutti rossi e cioccolato fondente","Fruchtiger Duft in der Nase mit Anklängen kleiner roter Früchte und dunkler Schokolade"],"E përqendruar dhe bujare në qiellzë, me tanine të buta dhe përfundim të gjatë":["Concentrated and generous on the palate, with soft tannins and a long finish","Concentrato e generoso al palato, con tannini morbidi e finale lungo","Konzentriert und großzügig am Gaumen, mit weichen Tanninen und langem Abgang"],"Pjata me gjah, mish i pjekur, mish i errët dhe djathëra me brumë të fortë":["Game dishes, roast meat, dark meat and hard cheeses","Piatti di selvaggina, carni arrosto, carni scure e formaggi a pasta dura","Wildgerichte, Braten, dunkles Fleisch und Hartkäse"],"Hundë e freskët e dominuar nga frutat, me nota mollësh Golden Delicious, dardhash dhe ftoi":["Fresh nose dominated by fruit, with notes of Golden Delicious apples, pears and quince","Naso fresco dominato dalla frutta, con note di mele Golden Delicious, pere e mela cotogna","Frische, fruchtdominierte Nase mit Noten von Golden-Delicious-Äpfeln, Birnen und Quitte"],"E lëngshme, me aciditet të këndshëm dhe aroma shporte frutash në përfundim":["Juicy, with pleasant acidity and aromas of a fruit basket on the finish","Succoso, con acidità piacevole e profumi di cesto di frutta nel finale","Saftig, mit angenehmer Säure und Aromen eines Obstkorbs im Abgang"],"Antipasta të lehta ose pjata me peshk; e shkëlqyer edhe si aperitiv":["Light starters or fish dishes; excellent also as an aperitif","Antipasti leggeri o piatti di pesce; ottimo anche come aperitivo","Leichte Vorspeisen oder Fischgerichte; auch ausgezeichnet als Aperitif"],"E verdhë kashte e lehtë":["Light straw yellow","Giallo paglierino chiaro","Helles Strohgelb"],"Freski e gjallë shtogu dhe kulumbrie, me nuanca frutash ekzotike":["Lively freshness of elderflower and greengage, with hints of exotic fruit","Freschezza vivace di sambuco e susina verde, con sfumature di frutta esotica","Lebendige Frische von Holunder und Reneklode, mit Anklängen exotischer Früchte"],"E qartë dhe e lëngshme me fruta, e ndjekur nga freski minerale; lë një ndjesi të qëndrueshme që të kujton një pemishte":["Clear and juicy with fruit, followed by mineral freshness; it leaves a persistent sensation reminiscent of an orchard","Netto e succoso di frutto, seguito da una freschezza minerale; lascia una sensazione persistente che ricorda un frutteto","Klar und saftig mit Frucht, gefolgt von mineralischer Frische; hinterlässt einen anhaltenden Eindruck, der an einen Obstgarten erinnert"],"Asparagus, perime në skarë, peshk dhe djathë dhie; verë e shkëlqyer aperitivi":["Asparagus, grilled vegetables, fish and goat cheese; an excellent aperitif wine","Asparagi, verdure alla griglia, pesce e formaggio di capra; ottimo vino da aperitivo","Spargel, gegrilltes Gemüse, Fisch und Ziegenkäse; ein ausgezeichneter Aperitifwein"],"E verdhë e artë e ndritshme me nuanca të gjelbra.":["Bright golden yellow with green hues.","Giallo dorato brillante con sfumature verdi.","Leuchtendes Goldgelb mit grünen Nuancen."],"Buqetë shumëplanëshe me nota frutash krokante dhe nuanca barishtesh: mollë e verdhë e freskët, pjepër, kamomil i tharë dhe nota të holla grafiti.":["A multi-layered bouquet with notes of crisp fruit and herbal hints: fresh yellow apple, melon, dried chamomile and fine notes of graphite.","Bouquet stratificato con note di frutta croccante e sfumature erbacee: mela gialla fresca, melone, camomilla secca e fini note di grafite.","Vielschichtiges Bouquet mit Noten knackiger Früchte und krautigen Anklängen: frischer gelber Apfel, Melone, getrocknete Kamille und feine Graphitnoten."],"Harmonike, me përfundim me kripësi, teksturë kremoze dhe aciditet krokant; përfundim i fuqishëm dhe elegant.":["Harmonious, with a savoury finish, creamy texture and crisp acidity; a powerful, elegant finish.","Armonico, con finale sapido, consistenza cremosa e acidità croccante; finale potente ed elegante.","Harmonisch, mit salzigem Abgang, cremiger Textur und knackiger Säure; kraftvoller, eleganter Abgang."],"Supë peshku e shijshme, rizoto me barishte, peshk i skuqur dhe shpendë në skarë.":["Tasty fish soup, herb risotto, fried fish and grilled poultry.","Zuppa di pesce saporita, risotto alle erbe, pesce fritto e pollame alla griglia.","Würzige Fischsuppe, Kräuterrisotto, frittierter Fisch und gegrilltes Geflügel."],"Rubin me pak vjollcë":["Ruby with a little violet","Rubino con un po' di violaceo","Rubin mit etwas Violett"],"Në hundë aroma tymi, edhe tone mishi dhe druri, pak frut":["On the nose aromas of smoke, also meaty and woody tones, a little fruit","Al naso profumi di fumo, anche toni di carne e legno, poco frutto","In der Nase Rauchnoten, auch fleischige und holzige Töne, wenig Frucht"],"E dendur në gojë me shumë tension, por në vazhdim duket më pak harmonike; në përfundim nota kafeje, pas ajrosjes vetëm kakao":["Dense on the palate with plenty of tension, but further on it seems less harmonious; coffee notes on the finish, after aeration only cocoa","Denso in bocca con molta tensione, ma in seguito appare meno armonico; note di caffè nel finale, dopo l'ossigenazione solo cacao","Dicht am Gaumen mit viel Spannung, wirkt im weiteren Verlauf aber weniger harmonisch; Kaffeenoten im Abgang, nach dem Belüften nur Kakao"],"Rubin i ndritshëm dhe intensiv me buzë të lehtë granate":["Bright, intense ruby with a light garnet rim","Rubino brillante e intenso con unghia leggermente granata","Leuchtendes, intensives Rubin mit leicht granatfarbenem Rand"],"Shumë intensive dhe tërheqëse, me qershi të errëta e të pjekura, pak manaferra dhe kumbull, në sfond pak jamballi":["Very intense and attractive, with dark, ripe cherries, a few blackberries and plum, a little saffron in the background","Molto intenso e attraente, con ciliegie scure e mature, un po' di more e prugna, un po' di zafferano sullo sfondo","Sehr intensiv und ansprechend, mit dunklen, reifen Kirschen, etwas Brombeere und Pflaume, im Hintergrund etwas Safran"],"Kadifeje dhe elastike në sulm dhe në vazhdim, shumë frut qershie të pjekur dhe tanin i mëndafshtë me kokërr të imët, hark i gjerë; në fund aciditet i gjallë dhe vezullues":["Velvety and elastic on the attack and through the mid-palate, lots of ripe cherry fruit and silky, fine-grained tannin, a wide arc; at the end lively, sparkling acidity","Vellutato ed elastico all'attacco e nello sviluppo, molto frutto di ciliegia matura e tannino setoso a grana fine, ampio arco; nel finale acidità vivace e frizzante","Samtig und elastisch im Antrunk und im Verlauf, viel reife Kirschfrucht und seidiges, feinkörniges Tannin, weiter Bogen; am Ende lebendige, prickelnde Säure"],"Rubin intensiv dhe i ndritshëm":["Intense, bright ruby","Rubino intenso e brillante","Intensives, leuchtendes Rubin"],"Hundë kompakte dhe e dendur, me nota të plota kumbulle të pjekur, pak jamballi":["Compact, dense nose, with full notes of ripe plum, a little saffron","Naso compatto e fitto, con note piene di prugna matura, un po' di zafferano","Kompakte, dichte Nase mit vollen Noten reifer Pflaume, etwas Safran"],"E fortë dhe me lëndë në qiellzë, shpaloset me tanin të kapshëm, nota theksueshëm erëzore, lojë e bukur në përfundim":["Firm and substantial on the palate, it unfolds with grippy tannin, markedly spicy notes, a lovely play on the finish","Deciso e materico al palato, si distende con tannino grippante, note spiccatamente speziate, bel gioco nel finale","Fest und substanzreich am Gaumen, entfaltet sich mit griffigem Tannin, ausgeprägt würzigen Noten, schönes Spiel im Abgang"],"Rubin intensiv, gati i padepërtueshëm":["Intense ruby, almost impenetrable","Rubino intenso, quasi impenetrabile","Intensives Rubin, fast undurchdringlich"],"Hunda është e pasur me fruta (manaferra, qershi); lisi i fuçive të vogla shton kompleksitet dhe intensitet":["The nose is rich in fruit (blackberries, cherries); the oak of the small barrels adds complexity and intensity","Il naso è ricco di frutta (more, ciliegie); il rovere delle piccole botti aggiunge complessità e intensità","Die Nase ist reich an Frucht (Brombeeren, Kirschen); die Eiche der kleinen Fässer bringt Komplexität und Intensität"],"Komponenti taninik shumë i ëmbël e bën verën shumë të pijshme":["The very sweet tannic component makes the wine very drinkable","La componente tannica molto dolce rende il vino molto bevibile","Die sehr süße Tanninkomponente macht den Wein sehr trinkig"],"E kuqe intensive me reflekse granati":["Intense red with garnet reflections","Rosso intenso con riflessi granati","Intensives Rot mit granatroten Reflexen"],"Nota reçeli kokrrash, theksime erëzash, vaniljeje, raven dhe nuanca të thekura":["Notes of berry jam, accents of spice, vanilla, rhubarb and toasty hints","Note di confettura di bacche, accenti di spezie, vaniglia, rabarbaro e sfumature tostate","Noten von Beerenkonfitüre, Akzente von Gewürzen, Vanille, Rhabarber und Röstaromen"],"Intensive, e strukturuar, elegante dhe e qëndrueshme, me tanine të mëndafshta dhe të integruara mirë":["Intense, structured, elegant and persistent, with silky, well-integrated tannins","Intenso, strutturato, elegante e persistente, con tannini setosi e ben integrati","Intensiv, strukturiert, elegant und anhaltend, mit seidigen, gut eingebundenen Tanninen"],"Makarona bolognese, mish i pjekur dhe në skarë, gjellë me mish të kuq, gjah, djathëra të stazhionuar":["Pasta Bolognese, roast and grilled meat, red-meat stews, game, aged cheeses","Pasta alla bolognese, carni arrosto e alla griglia, stufati di carne rossa, selvaggina, formaggi stagionati","Pasta Bolognese, Braten und Gegrilltes, Ragouts mit rotem Fleisch, Wild, gereifte Käse"],"E verdhë kashte e çelët":["Light straw yellow","Giallo paglierino chiaro","Helles Strohgelb"],"E hollë, këndshëm e freskët; nota bajameje dhe barishtesh mesdhetare":["Fine, pleasantly fresh; notes of almond and Mediterranean herbs","Fine, piacevolmente fresco; note di mandorla ed erbe mediterranee","Fein, angenehm frisch; Noten von Mandel und mediterranen Kräutern"],"Delikate, e thatë, e formuar mirë, e pasur me trup, e qëndrueshme; nota pjeshke, mango, molle jeshile, agrumesh dhe dardhe":["Delicate, dry, well shaped, full-bodied, persistent; notes of peach, mango, green apple, citrus and pear","Delicato, secco, ben fatto, di corpo, persistente; note di pesca, mango, mela verde, agrumi e pera","Zart, trocken, gut geformt, körperreich, anhaltend; Noten von Pfirsich, Mango, grünem Apfel, Zitrus und Birne"],"Veçanërisht e përshtatshme për gjithë vaktin: aperitivë, pjata me perime, djathëra të lehtë":["Particularly suitable for the whole meal: aperitifs, vegetable dishes, light cheeses","Particolarmente adatto a tutto il pasto: aperitivi, piatti di verdure, formaggi leggeri","Besonders geeignet für das ganze Menü: Aperitifs, Gemüsegerichte, leichte Käse"],"E verdhë kashte e zbehtë me nuanca të gjelbra":["Pale straw yellow with green hues","Giallo paglierino tenue con sfumature verdi","Blasses Strohgelb mit grünen Nuancen"],"Tipike, këndshëm e freskët, elegante":["Typical, pleasantly fresh, elegant","Tipico, piacevolmente fresco, elegante","Typisch, angenehm frisch, elegant"],"Delikate, e thatë, me një damar të athët që të kujton bajamet":["Delicate, dry, with a tart vein reminiscent of almonds","Delicato, secco, con una vena acidula che ricorda le mandorle","Zart, trocken, mit einer säuerlichen Ader, die an Mandeln erinnert"],"Më e mira me antipasta, peshk dhe fruta deti; e shkëlqyer me pasta me salca të lehta perimesh (pesto) ose peshku (pasta me vongole); shkon elegante me mish të bardhë dhe tarta perimesh; ideale me kuzhinën aziatike dhe si aperitiv":["Best with starters, fish and seafood; excellent with pasta with light vegetable sauces (pesto) or fish sauces (pasta with clams); pairs elegantly with white meat and vegetable tarts; ideal with Asian cuisine and as an aperitif","Ottimo con antipasti, pesce e frutti di mare; eccellente con pasta con sughi leggeri di verdure (pesto) o di pesce (pasta alle vongole); si abbina con eleganza a carni bianche e torte di verdure; ideale con la cucina asiatica e come aperitivo","Am besten zu Vorspeisen, Fisch und Meeresfrüchten; ausgezeichnet zu Pasta mit leichten Gemüsesaucen (Pesto) oder Fischsaucen (Pasta mit Venusmuscheln); passt elegant zu hellem Fleisch und Gemüsetartes; ideal zur asiatischen Küche und als Aperitif"],"E verdhë kashte e zbehtë, me nuanca delikate të gjelbra":["Pale straw yellow, with delicate green hues","Giallo paglierino tenue, con delicate sfumature verdi","Blasses Strohgelb mit zarten grünen Nuancen"],"Intensive, e gjatë, e vazhdueshme, e qëndrueshme; nga frutore në lulore sipas fazës së zhvillimit":["Intense, long, continuous, persistent; from fruity to floral depending on the stage of development","Intenso, lungo, continuo, persistente; da fruttato a floreale secondo la fase di evoluzione","Intensiv, lang, beständig, anhaltend; je nach Entwicklungsphase von fruchtig bis blumig"],"E gjerë, e kripur, me nuanca stralli; bajame dhe arrë në përfundim, me nota agrumesh (portokall, limë)":["Broad, savoury, with flinty hints; almond and walnut on the finish, with citrus notes (orange, lime)","Ampio, sapido, con sfumature di pietra focaia; mandorla e noce nel finale, con note agrumate (arancia, lime)","Weit, salzig, mit Feuersteinanklängen; Mandel und Walnuss im Abgang, mit Zitrusnoten (Orange, Limette)"],"E shkëlqyer si aperitiv ose për gjithë vaktin; shkon mirë me mish të bardhë, shpendë fisnikë dhe mish të pjekur të lehtë; ideale me kuzhinën italiane dhe ndërkombëtare":["Excellent as an aperitif or for the whole meal; goes well with white meat, noble fowl and light roast meat; ideal with Italian and international cuisine","Ottimo come aperitivo o per tutto il pasto; si abbina bene a carni bianche, pollame nobile e arrosti leggeri; ideale con la cucina italiana e internazionale","Ausgezeichnet als Aperitif oder zum ganzen Menü; passt gut zu hellem Fleisch, edlem Geflügel und leichten Braten; ideal zur italienischen und internationalen Küche"],"Kashte e lehtë intensive me nuanca delikate të gjelbra.":["Intense light straw with delicate green hues.","Paglierino chiaro intenso con delicate sfumature verdi.","Intensives helles Stroh mit zarten grünen Nuancen."],"Intensive, e gjatë, e vazhdueshme dhe e qëndrueshme, me aroma që kalojnë nga frutore në lulore sipas fazës së evolucionit.":["Intense, long, continuous and persistent, with aromas passing from fruity to floral according to the stage of evolution.","Intenso, lungo, continuo e persistente, con profumi che passano dal fruttato al floreale secondo la fase di evoluzione.","Intensiv, lang, beständig und anhaltend, mit Aromen, die je nach Entwicklungsphase von fruchtig zu blumig übergehen."],"Shumë tipike për Gavi; me notë guri stralli, me arrë dhe bajame të thekur në përfundim.":["Very typical of Gavi; with a flinty note, with walnut and toasted almond on the finish.","Molto tipico del Gavi; con nota di pietra focaia, con noce e mandorla tostata nel finale.","Sehr typisch für Gavi; mit Feuersteinnote, mit Walnuss und gerösteter Mandel im Abgang."],"Shkëlqyeshëm gjatë gjithë vaktit, pas vaktit dhe edhe si verë \"meditimi\".":["Excellent throughout the meal, after the meal and even as a 'meditation' wine.","Ottimo durante tutto il pasto, dopo il pasto e anche come vino 'da meditazione'.","Ausgezeichnet zum ganzen Menü, nach dem Essen und auch als 'Meditationswein'."],"E kuqe vjollcë":["Violet red","Rosso violaceo","Violettrot"],"Aroma boronicash të pjekura, trëndafili të egër dhe nektarine":["Aromas of ripe blueberries, wild rose and nectarine","Profumi di mirtilli maturi, rosa canina e pesca noce","Aromen reifer Heidelbeeren, Wildrose und Nektarine"],"Në shije e freskët dhe e strukturuar, me nota intensive frutash të vogla të kuqe dhe reçeli vishnjeje":["Fresh and structured on the palate, with intense notes of small red fruits and sour-cherry jam","Al gusto fresco e strutturato, con intense note di piccoli frutti rossi e confettura di amarene","Am Gaumen frisch und strukturiert, mit intensiven Noten kleiner roter Früchte und Sauerkirschkonfitüre"],"Reçel boronice, trëndafil dhe piper i bardhë":["Blueberry jam, rose and white pepper","Confettura di mirtilli, rosa e pepe bianco","Heidelbeerkonfitüre, Rose und weißer Pfeffer"],"E freskët dhe elegante, me nota delikate lulore dhe erëzore; tanine kadifeje por të theksuara; përfundim i saktë dhe i qëndrueshëm":["Fresh and elegant, with delicate floral and spicy notes; velvety but marked tannins; a precise, persistent finish","Fresco ed elegante, con delicate note floreali e speziate; tannini vellutati ma marcati; finale preciso e persistente","Frisch und elegant, mit zarten blumigen und würzigen Noten; samtige, aber ausgeprägte Tannine; präziser, anhaltender Abgang"],"Buqetë frutash, lulesh dhe erëzash":["Bouquet of fruit, flowers and spices","Bouquet di frutta, fiori e spezie","Bouquet aus Früchten, Blumen und Gewürzen"],"Ekuilibri midis taninëve dhe aciditetit e bën shoqërues perfekt për ushqimin":["The balance between tannins and acidity makes it a perfect partner for food","L'equilibrio tra tannini e acidità lo rende un compagno perfetto a tavola","Das Gleichgewicht zwischen Tanninen und Säure macht ihn zum perfekten Speisenbegleiter"],"Bollëk notash lulore dhe balsamike":["An abundance of floral and balsamic notes","Abbondanza di note floreali e balsamiche","Fülle an blumigen und balsamischen Noten"],"E mëndafshtë, elegante, bindëse; aciditet i butë dhe teksturë taninike e papritur":["Silky, elegant, convincing; soft acidity and an unexpected tannic texture","Setoso, elegante, convincente; acidità morbida e una trama tannica inaspettata","Seidig, elegant, überzeugend; weiche Säure und unerwartete Tannintextur"],"E kuqe rubin intensive, e gjallë, e ndritshme":["Intense, lively, bright ruby red","Rosso rubino intenso, vivace, brillante","Intensives, lebendiges, leuchtendes Rubinrot"],"Gama aromatike shkon nga frutat me kokërr të kuqe si vishnja, mana dhe ribesi i zi, me notë barishtore karakteristike të varietetit":["The aromatic range goes from red-berried fruit such as sour cherry, mulberry and blackcurrant, with the herbaceous note characteristic of the variety","La gamma aromatica va dai frutti a bacca rossa come amarena, mora di gelso e ribes nero, con la nota erbacea caratteristica del vitigno","Das Aromenspektrum reicht von roten Beerenfrüchten wie Sauerkirsche, Maulbeere und schwarzer Johannisbeere, mit der für die Rebsorte charakteristischen krautigen Note"],"Në qiellzë e rëndësishme, me personalitet të madh dhe trup të mirë, e gjerë dhe e këndshme, e gjatë në përfundim":["Important on the palate, with great personality and good body, broad and pleasant, long on the finish","Importante al palato, di grande personalità e buon corpo, ampio e piacevole, lungo nel finale","Gewichtig am Gaumen, mit großer Persönlichkeit und gutem Körper, weit und angenehm, lang im Abgang"],"Mish i kuq, gjah dhe djathëra të vjetëruar mirë":["Red meat, game and well-aged cheeses","Carni rosse, selvaggina e formaggi ben stagionati","Rotes Fleisch, Wild und gut gereifte Käse"],"E kuqe rubin intensive me reflekse vjollcë":["Intense ruby red with violet reflections","Rosso rubino intenso con riflessi violacei","Intensives Rubinrot mit violetten Reflexen"],"Frutore dhe lehtësisht erëzore, me nota frutash të freskëta të pyllit dhe kumbulle, të mbështjella nga ndjesi delikate piperi të zi":["Fruity and lightly spicy, with notes of fresh wild berries and plum, wrapped in delicate sensations of black pepper","Fruttato e leggermente speziato, con note di frutti di bosco freschi e prugna, avvolte da delicate sensazioni di pepe nero","Fruchtig und leicht würzig, mit Noten frischer Waldbeeren und Pflaume, umhüllt von zarten Eindrücken von schwarzem Pfeffer"],"E butë dhe elegante në qiellzë, me strukturë të shkëlqyer dhe freski të vrullshme; verë kënaqësie të menjëhershme":["Soft and elegant on the palate, with excellent structure and vibrant freshness; a wine of immediate pleasure","Morbido ed elegante al palato, con ottima struttura e freschezza vibrante; vino di piacere immediato","Weich und elegant am Gaumen, mit ausgezeichneter Struktur und lebhafter Frische; ein Wein für unmittelbaren Genuss"],"Mish i pjekur, kërci, tagliata dhe brinjë qengji; edhe mish i ftohtë; shkëlqyer me djathëra të vjetëruar mirë":["Roast meat, shank, tagliata and lamb chops; also cold cuts; excellent with well-aged cheeses","Carni arrosto, stinco, tagliata e costolette d'agnello; anche salumi; ottimo con formaggi ben stagionati","Braten, Haxe, Tagliata und Lammkoteletts; auch Aufschnitt; ausgezeichnet zu gut gereiften Käsen"],"E verdhë kashte intensive, më e ngarkuar me plakjen":["Intense straw yellow, deeper with ageing","Giallo paglierino intenso, più carico con l'invecchiamento","Intensives Strohgelb, mit der Reife kräftiger"],"Aromë e freskët dhe frutore që të kujton fruta të vogla tropikale të pjekura, ananas dhe lule të bardha":["Fresh, fruity aroma recalling small ripe tropical fruits, pineapple and white flowers","Profumo fresco e fruttato che ricorda piccoli frutti tropicali maturi, ananas e fiori bianchi","Frischer, fruchtiger Duft, der an kleine reife tropische Früchte, Ananas und weiße Blüten erinnert"],"Fisnike dhe elegante, me trup të hollë, e gjallë falë freskisë së mirë":["Noble and elegant, with a slender body, lively thanks to good freshness","Nobile ed elegante, di corpo snello, vivace grazie a una buona freschezza","Edel und elegant, mit schlankem Körper, lebendig dank guter Frische"],"Shkëlqyer si aperitiv ose me antipasta të lehta, pasta të thata dhe në lëng, pjata me vezë dhe peshk":["Excellent as an aperitif or with light starters, pasta and soups, egg and fish dishes","Ottimo come aperitivo o con antipasti leggeri, pasta asciutta e in brodo, piatti a base di uova e pesce","Ausgezeichnet als Aperitif oder zu leichten Vorspeisen, Pasta und Suppen, Ei- und Fischgerichten"],"E verdhë kashte e ndritshme, me reflekse elegante të gjelbra":["Bright straw yellow, with elegant green reflections","Giallo paglierino brillante, con eleganti riflessi verdi","Leuchtendes Strohgelb mit eleganten grünen Reflexen"],"Hollësisht harmonik, lulor dhe frutor, me nota bajameje të hidhur, dardhe, lulesh fushe dhe akacie":["Finely harmonious, floral and fruity, with notes of bitter almond, pear, wild flowers and acacia","Finemente armonico, floreale e fruttato, con note di mandorla amara, pera, fiori di campo e acacia","Fein harmonisch, blumig und fruchtig, mit Noten von Bittermandel, Birne, Wiesenblumen und Akazie"],"E butë dhe kadifeje, mesatarisht acide, e thatë dhe e strukturuar mirë; përfundim tepër i qëndrueshëm me notën tipike të bajames së hidhur":["Soft and velvety, medium acidity, dry and well structured; an extremely persistent finish with the typical note of bitter almond","Morbido e vellutato, di media acidità, secco e ben strutturato; finale estremamente persistente con la tipica nota di mandorla amara","Weich und samtig, mittlere Säure, trocken und gut strukturiert; äußerst anhaltender Abgang mit der typischen Bittermandelnote"],"Antipasta të lehta, mish i tharë, lëngje mishi, pasta, peshk dhe mish i bardhë; shkëlqyer me proshutë San Daniele":["Light starters, cured meats, meat broths, pasta, fish and white meat; excellent with San Daniele ham","Antipasti leggeri, salumi, brodi di carne, pasta, pesce e carni bianche; ottimo con prosciutto di San Daniele","Leichte Vorspeisen, Wurstwaren, Fleischbrühen, Pasta, Fisch und helles Fleisch; ausgezeichnet zu San-Daniele-Schinken"],"E kuqe rubin intensive dhe e gjallë, e kuqe granatë kur plaket":["Intense, lively ruby red, garnet red with age","Rosso rubino intenso e vivace, rosso granato con l'invecchiamento","Intensives, lebendiges Rubinrot, mit dem Alter Granatrot"],"Aromë karakteristike, e ëmbël dhe e butë, me nota reçeli kumbulle, duhani, sanë dhe kafeje":["Characteristic aroma, sweet and soft, with notes of plum jam, tobacco, hay and coffee","Profumo caratteristico, dolce e morbido, con note di confettura di prugne, tabacco, fieno e caffè","Charakteristischer Duft, süß und weich, mit Noten von Pflaumenkonfitüre, Tabak, Heu und Kaffee"],"E thatë dhe e butë, e kripur, harmonike, me shije frutore manaferrash dhe kumbullash":["Dry and soft, savoury, harmonious, with fruity flavours of blackberries and plums","Secco e morbido, sapido, armonico, con sapori fruttati di more e prugne","Trocken und weich, salzig, harmonisch, mit fruchtigem Geschmack von Brombeeren und Pflaumen"],"Mish i kuq në skarë, mish i zier, gjellë me shpendë dhe lepur, mish i pjekur dhe djathëra gjysmë të stazhionuar":["Grilled red meat, boiled meat, poultry and rabbit stews, roast meat and semi-aged cheeses","Carni rosse alla griglia, bolliti, umidi di pollame e coniglio, arrosti e formaggi semistagionati","Gegrilltes rotes Fleisch, gekochtes Fleisch, Geflügel- und Kaninchenragouts, Braten und halbgereifte Käse"],"Frutore dhe aromatike; të kujton koren e bukës së ngrohtë, aromën intensive të luleve të akacies dhe fruta tropikale të pjekura":["Fruity and aromatic; it recalls warm bread crust, the intense scent of acacia flowers and ripe tropical fruit","Fruttato e aromatico; ricorda la crosta di pane caldo, l'intenso profumo dei fiori d'acacia e frutta tropicale matura","Fruchtig und aromatisch; erinnert an warme Brotkruste, den intensiven Duft von Akazienblüten und reife tropische Früchte"],"Elegante, me trup, mesatarisht e athët, me nota delikate majaje":["Elegant, with body, medium tartness, with delicate yeasty notes","Elegante, di corpo, mediamente acidulo, con delicate note di lievito","Elegant, mit Körper, mittlere Säure, mit zarten Hefenoten"],"Antipasta, proshuta, peshk dhe mish i bardhë; shkëlqyer si aperitiv":["Starters, ham, fish and white meat; excellent as an aperitif","Antipasti, prosciutti, pesce e carni bianche; ottimo come aperitivo","Vorspeisen, Schinken, Fisch und helles Fleisch; ausgezeichnet als Aperitif"],"Aromë e theksuar, karakteristike, delikate, ku dallohen mjedra dhe frutat e pyllit":["Marked, characteristic, delicate aroma, in which raspberry and wild berries stand out","Profumo marcato, caratteristico, delicato, in cui spiccano lampone e frutti di bosco","Ausgeprägter, charakteristischer, zarter Duft, in dem Himbeere und Waldbeeren hervortreten"],"Shije e thatë, lehtësisht aromatike, e këndshme, me një notë të hollë të hidhur, kadifeje":["Dry, lightly aromatic, pleasant taste, with a fine bitter note, velvety","Gusto secco, leggermente aromatico, piacevole, con una fine nota amarognola, vellutato","Trockener, leicht aromatischer, angenehmer Geschmack, mit feiner Bitternote, samtig"],"Mish i bardhë dhe shpendë në përgjithësi, peshq të yndyrshëm (ngjalë) edhe me salcë":["White meat and poultry in general, fatty fish (eel) also in sauce","Carni bianche e pollame in genere, pesci grassi (anguilla) anche in salsa","Helles Fleisch und Geflügel allgemein, fette Fische (Aal) auch in Sauce"],"E kuqe rubin intensive me reflekse vjollcë; merr nuanca granate me plakjen":["Intense ruby red with violet reflections; it takes on garnet hues with age","Rosso rubino intenso con riflessi violacei; con l'invecchiamento assume sfumature granate","Intensives Rubinrot mit violetten Reflexen; nimmt mit dem Alter granatrote Nuancen an"],"Aromë qartësisht vinoze, e gjerë, e pasur dhe intensive, me nota frutore dhe erëzore: nënpyll, manaferra e egër, mjedër, kakao, duhan":["Clearly vinous aroma, broad, rich and intense, with fruity and spicy notes: undergrowth, wild blackberry, raspberry, cocoa, tobacco","Profumo nettamente vinoso, ampio, ricco e intenso, con note fruttate e speziate: sottobosco, mora selvatica, lampone, cacao, tabacco","Deutlich weiniger Duft, weit, reich und intensiv, mit fruchtigen und würzigen Noten: Waldboden, wilde Brombeere, Himbeere, Kakao, Tabak"],"Shije e thatë, e plotë, me strukturë të theksuar dhe pas-shije lehtësisht të hidhur; nuancë e hollë dhe delikate vaniljeje":["Dry, full taste, with marked structure and a lightly bitter aftertaste; a fine, delicate hint of vanilla","Gusto secco, pieno, di struttura marcata e retrogusto leggermente amarognolo; fine e delicata sfumatura di vaniglia","Trockener, voller Geschmack mit ausgeprägter Struktur und leicht bitterem Nachgeschmack; feiner, zarter Vanilleanklang"],"Mish i yndyrshëm, shpendë, gjellë të ziera; përjashtohet gjahu me salcë pikante":["Fatty meat, poultry, boiled dishes; game in spicy sauce excluded","Carni grasse, pollame, bolliti; esclusa la selvaggina in salsa piccante","Fettes Fleisch, Geflügel, Gekochtes; ausgenommen Wild in scharfer Sauce"],"Elegante dhe intensive, lulore dhe frutore, aromatike, me klas e vazhdimësi; nota akacie, kumbulle, pjeshke të verdhë dhe molle Renetë":["Elegant and intense, floral and fruity, aromatic, with class and continuity; notes of acacia, plum, yellow peach and Reinette apple","Elegante e intenso, floreale e fruttato, aromatico, con classe e continuità; note di acacia, prugna, pesca gialla e mela renetta","Elegant und intensiv, blumig und fruchtig, aromatisch, mit Klasse und Beständigkeit; Noten von Akazie, Pflaume, gelbem Pfirsich und Renettenapfel"],"Në qiellzë intensive dhe e plotë, me trup të shkathët; e thatë dhe e kripur, me përfundim aromatik lehtësisht të qëndrueshëm":["Intense and full on the palate, with a nimble body; dry and savoury, with a lightly persistent aromatic finish","Al palato intenso e pieno, di corpo agile; secco e sapido, con finale aromatico leggermente persistente","Am Gaumen intensiv und voll, mit agilem Körper; trocken und salzig, mit leicht anhaltendem aromatischem Abgang"],"Antipasta të ftohta me salca ëmbël-thartë, perime, peshq delikatë dhe peshk i skuqur, supa (sidomos krem perimesh)":["Cold starters with sweet-and-sour sauces, vegetables, delicate fish and fried fish, soups (especially vegetable creams)","Antipasti freddi con salse agrodolci, verdure, pesci delicati e fritture di pesce, zuppe (soprattutto vellutate di verdure)","Kalte Vorspeisen mit süßsauren Saucen, Gemüse, zarte Fische und frittierter Fisch, Suppen (besonders Gemüsecremes)"],"E verdhë kashte e gjallë dhe e ndritshme, me reflekse të dukshme të gjelbra":["Lively, bright straw yellow, with visible green reflections","Giallo paglierino vivace e brillante, con evidenti riflessi verdi","Lebhaftes, leuchtendes Strohgelb mit deutlichen grünen Reflexen"],"Intensive dhe e qëndrueshme, tipike e varietetit: sherebelë dhe gjethe domateje, të përziera me nota më frutore e delikate pjepri dhe speci të verdhë":["Intense and persistent, typical of the variety: sage and tomato leaf, mixed with fruitier, delicate notes of melon and yellow pepper","Intenso e persistente, tipico del vitigno: salvia e foglia di pomodoro, unite a note più fruttate e delicate di melone e peperone giallo","Intensiv und anhaltend, typisch für die Rebsorte: Salbei und Tomatenblatt, gemischt mit fruchtigeren, zarten Noten von Melone und gelber Paprika"],"Shije e freskët dhe e thatë, në ekuilibër të përsosur; intensive dhe mbështjellëse, mbyllet me qëndrueshmëri të gjatë aromatike":["Fresh, dry taste, in perfect balance; intense and enveloping, it closes with long aromatic persistence","Gusto fresco e secco, in perfetto equilibrio; intenso e avvolgente, chiude con lunga persistenza aromatica","Frischer, trockener Geschmack in perfektem Gleichgewicht; intensiv und umhüllend, schließt mit langer aromatischer Länge"],"Verë aperitivi dhe antipastash; shkon mirë me karavidhe, omar, scampi, salmon dhe peshq deti; edhe me kremra, supa, rizoto dhe pjata me barishte aromatike":["An aperitif and starter wine; goes well with crayfish, lobster, scampi, salmon and sea fish; also with creams, soups, risottos and dishes with aromatic herbs","Vino da aperitivo e da antipasti; si abbina bene a gamberi di fiume, astice, scampi, salmone e pesci di mare; anche con vellutate, zuppe, risotti e piatti alle erbe aromatiche","Ein Aperitif- und Vorspeisenwein; passt gut zu Flusskrebsen, Hummer, Scampi, Lachs und Meeresfischen; auch zu Cremesuppen, Suppen, Risotti und Gerichten mit Kräutern"],"Aromë e rafinuar dhe elegante pastiçerie të vogël, vaniljeje dhe lulesh akacie":["Refined, elegant aroma of petits fours, vanilla and acacia flowers","Profumo raffinato ed elegante di piccola pasticceria, vaniglia e fiori d'acacia","Feiner, eleganter Duft von Feingebäck, Vanille und Akazienblüten"],"Në qiellzë hyn delikate dhe e plotë, por njëkohësisht e shkathët dhe e kripur":["It enters the palate delicate and full, yet at the same time nimble and savoury","Entra in bocca delicato e pieno, ma allo stesso tempo agile e sapido","Er kommt zart und voll an den Gaumen, zugleich aber agil und salzig"],"Verë e shkëlqyer për gjithë vaktin: si aperitiv ose me pjata të para me kërpudha ose peshk; edhe me molusqe, krustace dhe peshk në furrë":["An excellent wine for the whole meal: as an aperitif or with first courses with mushrooms or fish; also with molluscs, shellfish and baked fish","Vino eccellente per tutto il pasto: come aperitivo o con primi piatti ai funghi o di pesce; anche con molluschi, crostacei e pesce al forno","Ein ausgezeichneter Wein für das ganze Menü: als Aperitif oder zu ersten Gängen mit Pilzen oder Fisch; auch zu Weichtieren, Krustentieren und Fisch aus dem Ofen"],"E verdhë kashte intensive me reflekse ari-jeshile":["Intense straw yellow with gold-green reflections","Giallo paglierino intenso con riflessi verde-oro","Intensives Strohgelb mit goldgrünen Reflexen"],"Një re e butë dhe e dendur aromash: ananas, fruti i pasionit, lule fushe dhe nuanca të holla agrumesh të thurura me finesë të madhe":["A soft, dense cloud of aromas: pineapple, passion fruit, wild flowers and fine hints of citrus woven with great finesse","Una nuvola morbida e fitta di profumi: ananas, frutto della passione, fiori di campo e fini sfumature di agrumi intrecciate con grande finezza","Eine weiche, dichte Wolke von Aromen: Ananas, Passionsfrucht, Wiesenblumen und feine Zitrusanklänge, mit großer Finesse verwoben"],"Freski e shijshme që mban ekuilibrin me trupin e butë, edhe falë një theksi elegant mineral":["A tasty freshness that keeps balance with the soft body, also thanks to an elegant mineral accent","Una freschezza golosa che si equilibra con il corpo morbido, anche grazie a un elegante accento minerale","Eine köstliche Frische, die mit dem weichen Körper im Gleichgewicht steht, auch dank eines eleganten mineralischen Akzents"],"Antipasta me peshk dhe perime, supa, kremra dhe velute, pjata me peshk me salcë dhe të skuqura":["Fish and vegetable starters, soups, creams and veloutés, fish dishes with sauce and fried","Antipasti di pesce e verdure, zuppe, creme e vellutate, piatti di pesce in salsa e fritti","Fisch- und Gemüsevorspeisen, Suppen, Cremes und Veloutés, Fischgerichte mit Sauce und frittiert"],"E kuqe granati e shndritshme":["Bright garnet red","Rosso granato brillante","Leuchtendes Granatrot"],"Hundë çuditërisht e freskët dhe me shumë shtresa, me nota specash (paprika) dhe urthi, edhe pak qepë turshi":["Surprisingly fresh, multi-layered nose, with notes of peppers (paprika) and nettle, also a little pickled onion","Naso sorprendentemente fresco e stratificato, con note di peperoni (paprika) e ortica, anche un po' di cipolla sottaceto","Überraschend frische, vielschichtige Nase mit Noten von Paprika und Brennnessel, auch etwas eingelegte Zwiebel"],"E pjekur në qiellzë, por ende mirë e pranishme, me boronica të kuqe (cranberry) dhe piper":["Mature on the palate, but still well present, with cranberries and pepper","Evoluto al palato, ma ancora ben presente, con mirtilli rossi (cranberry) e pepe","Gereift am Gaumen, aber noch gut präsent, mit Cranberrys und Pfeffer"],"E verdhë e lehtë me reflekse të zbehta të gjelbra":["Light yellow with pale green reflections","Giallo chiaro con tenui riflessi verdi","Hellgelb mit blassgrünen Reflexen"],"Delikate, pranverore, me nota intensive të gjelbra":["Delicate, springlike, with intense green notes","Delicato, primaverile, con intense note verdi","Zart, frühlingshaft, mit intensiven grünen Noten"],"E freskët, frutore":["Fresh, fruity","Fresco, fruttato","Frisch, fruchtig"],"Antipasta, pjata me peshk, mish i bardhë":["Starters, fish dishes, white meat","Antipasti, piatti di pesce, carni bianche","Vorspeisen, Fischgerichte, helles Fleisch"],"Intensive, me shkurre të papjekura":["Intense, with unripe shrubs","Intenso, con arbusti acerbi","Intensiv, mit unreifem Strauchwerk"],"Shije e thatë, elegante, mesatarisht kadifeje, me aromë të lehtë manaferrash dhe qershish":["Dry, elegant taste, medium velvety, with a light aroma of blackberries and cherries","Gusto secco, elegante, mediamente vellutato, con un leggero profumo di more e ciliegie","Trockener, eleganter Geschmack, mittel samtig, mit leichtem Duft von Brombeeren und Kirschen"],"Pjata të para, mish i kuq, djathëra; e shkëlqyer për gjithë vaktin":["First courses, red meat, cheeses; excellent for the whole meal","Primi piatti, carni rosse, formaggi; ottimo per tutto il pasto","Erste Gänge, rotes Fleisch, Käse; ausgezeichnet zum ganzen Menü"],"E verdhë kashte 'hënore', perlazh shumë i imët, i qëndrueshëm dhe i vazhdueshëm":["'Lunar' straw yellow, very fine, persistent and continuous perlage","Giallo paglierino 'lunare', perlage finissimo, persistente e continuo","'Mondfarbenes' Strohgelb, sehr feine, anhaltende und beständige Perlage"],"Buqetë e përsosur me aroma elegante e të freskëta majaje, që ndërthur një damar frutor me tone vaniljeje dhe buke brioche":["A perfect bouquet with elegant, fresh yeasty aromas, weaving a fruity vein with tones of vanilla and brioche","Bouquet perfetto con eleganti e freschi profumi di lievito, che intreccia una vena fruttata con toni di vaniglia e pan brioche","Ein perfektes Bouquet mit eleganten, frischen Hefearomen, das eine fruchtige Ader mit Tönen von Vanille und Brioche verwebt"],"Shkumëzim përkëdhelës, damar i bukur acid që mbështet një frutshmëri intensive dhe të butë, me nota tropikale frutash ekzotike të pjekura":["Caressing effervescence, a lovely acidic vein supporting intense, soft fruitiness, with tropical notes of ripe exotic fruit","Effervescenza carezzevole, bella vena acida che sostiene una fruttuosità intensa e morbida, con note tropicali di frutta esotica matura","Schmeichelndes Moussieren, eine schöne Säureader, die eine intensive, weiche Fruchtigkeit trägt, mit tropischen Noten reifer exotischer Früchte"],"Perfekte si aperitiv dhe me pjata me peshk dhe fruta deti, rizoto dhe ëmbëlsira të thata":["Perfect as an aperitif and with fish and seafood dishes, risottos and dry pastries","Perfetto come aperitivo e con piatti di pesce e frutti di mare, risotti e pasticceria secca","Perfekt als Aperitif und zu Fisch- und Meeresfrüchtegerichten, Risotti und trockenem Gebäck"],"E verdhë kashte me reflekse të arta dhe perlazh shumë të imët":["Straw yellow with golden reflections and very fine perlage","Giallo paglierino con riflessi dorati e perlage finissimo","Strohgelb mit goldenen Reflexen und sehr feiner Perlage"],"Nota aromatike buke të pjekur në skarë, majaje dhe mineralesh":["Aromatic notes of grilled bread, yeast and minerals","Note aromatiche di pane grigliato, lievito e minerali","Aromatische Noten von gegrilltem Brot, Hefe und Mineralien"],"E fortë dhe e strukturuar mirë, e kripur dhe e thellë; shuhet butë në nuanca të thekura dhe minerale":["Firm and well structured, savoury and deep; it fades softly into toasty and mineral hints","Deciso e ben strutturato, sapido e profondo; sfuma morbidamente in sentori tostati e minerali","Fest und gut strukturiert, salzig und tief; klingt sanft in Röst- und Mineralnoten aus"],"E gjithanshme: me pjata të para, sallame, peshk ose pulë; edhe me pulë Guinea, viç, lepur dhe djathëra të butë":["Versatile: with first courses, cured meats, fish or chicken; also with guinea fowl, veal, rabbit and soft cheeses","Versatile: con primi piatti, salumi, pesce o pollo; anche con faraona, vitello, coniglio e formaggi morbidi","Vielseitig: zu ersten Gängen, Wurstwaren, Fisch oder Huhn; auch zu Perlhuhn, Kalb, Kaninchen und Weichkäse"],"E verdhë kashte e thellë me reflekse të ndritshme të arta":["Deep straw yellow with bright golden reflections","Giallo paglierino carico con brillanti riflessi dorati","Tiefes Strohgelb mit leuchtend goldenen Reflexen"],"Në gojë harmonike, e freskët dhe e strukturuar mirë, me përfundim që kalon nga mjalti te tonet balsamike dhe të thekura":["Harmonious on the palate, fresh and well structured, with a finish moving from honey to balsamic and toasty tones","In bocca armonico, fresco e ben strutturato, con un finale che passa dal miele a toni balsamici e tostati","Am Gaumen harmonisch, frisch und gut strukturiert, mit einem Abgang, der von Honig zu balsamischen und gerösteten Tönen übergeht"],"Perfekte si aperitiv, me antipasta me peshk dhe perime, fruta deti me guaskë":["Perfect as an aperitif, with fish and vegetable starters, shellfish","Perfetto come aperitivo, con antipasti di pesce e verdure, molluschi","Perfekt als Aperitif, zu Fisch- und Gemüsevorspeisen, Schalentieren"],"Rozë pastel":["Pastel pink","Rosa pastello","Pastellrosa"],"E hollë, e butë, frutore dhe me notë majaje":["Fine, soft, fruity and with a yeasty note","Fine, morbido, fruttato e con nota di lievito","Fein, weich, fruchtig und mit Hefenote"],"Shije e kripur, e freskët, e hollë dhe harmonike, me karakter të dukshëm":["Savoury, fresh, fine and harmonious taste, with noticeable character","Gusto sapido, fresco, fine e armonico, di evidente carattere","Salziger, frischer, feiner und harmonischer Geschmack, mit deutlichem Charakter"],"E shkëlqyer si aperitiv; me sallame dhe djathëra me stazhionim mesatar, pjata të para me shije dhe pjata të dyta me peshk; perfekte me ëmbëlsira me fruta":["Excellent as an aperitif; with cured meats and medium-aged cheeses, flavourful first courses and fish main courses; perfect with fruit desserts","Ottimo come aperitivo; con salumi e formaggi di media stagionatura, primi piatti saporiti e secondi di pesce; perfetto con dolci alla frutta","Ausgezeichnet als Aperitif; zu Wurstwaren und mittelalten Käsen, würzigen ersten Gängen und Fischhauptgerichten; perfekt zu Obstdesserts"],"E verdhë kashte e artë e ndritshme, perlazh shumë i imët dhe i qëndrueshëm":["Bright golden straw yellow, very fine and persistent perlage","Giallo paglierino dorato brillante, perlage finissimo e persistente","Leuchtendes goldenes Strohgelb, sehr feine und anhaltende Perlage"],"Nota frutash të pjekura dhe lulesh të bardha, pastaj barishte aromatike dhe në fund minerale":["Notes of ripe fruit and white flowers, then aromatic herbs and finally minerals","Note di frutta matura e fiori bianchi, poi erbe aromatiche e infine minerali","Noten reifer Früchte und weißer Blüten, dann Kräuter und zuletzt Mineralien"],"E freskët dhe me tul, e butë; mbyllet e qëndrueshme me tone delikate lajthie dhe vaniljeje":["Fresh and fleshy, soft; it closes persistently with delicate tones of hazelnut and vanilla","Fresco e polposo, morbido; chiude persistente con delicati toni di nocciola e vaniglia","Frisch und fleischig, weich; schließt anhaltend mit zarten Tönen von Haselnuss und Vanille"],"Aperitiv i mrekullueshëm; me karpaçio mishi ose peshku, salmon të tymosur, sallata me fruta deti dhe perime; i këndshëm edhe me ëmbëlsira të thata":["A wonderful aperitif; with meat or fish carpaccio, smoked salmon, seafood and vegetable salads; pleasant also with dry pastries","Aperitivo meraviglioso; con carpaccio di carne o pesce, salmone affumicato, insalate di mare e di verdure; piacevole anche con pasticceria secca","Ein wunderbarer Aperitif; zu Fleisch- oder Fischcarpaccio, Räucherlachs, Meeresfrüchte- und Gemüsesalaten; angenehm auch zu trockenem Gebäck"],"E kuqe e thellë":["Deep red","Rosso profondo","Tiefes Rot"],"Frutore, me nuanca mjalti dhe karameli, aromë unike dhe intensive; të kujton frutat e thara, duhanin dhe erëzat":["Fruity, with hints of honey and caramel, a unique and intense aroma; it recalls dried fruit, tobacco and spices","Fruttato, con sfumature di miele e caramello, profumo unico e intenso; ricorda la frutta secca, il tabacco e le spezie","Fruchtig, mit Anklängen von Honig und Karamell, ein einzigartiger, intensiver Duft; erinnert an Trockenfrüchte, Tabak und Gewürze"],"Shije me intensitet të madh, me nota të qarta frutash të thara; e thatë por shumë e butë, me trup të plotë":["Taste of great intensity, with clear notes of dried fruit; dry but very soft, full-bodied","Gusto di grande intensità, con nette note di frutta secca; secco ma molto morbido, di corpo pieno","Geschmack von großer Intensität, mit klaren Noten von Trockenfrüchten; trocken, aber sehr weich, vollmundig"],"Verë e përsosur për gjah, brasato ose pjata tradicionale me mish":["A perfect wine for game, brasato or traditional meat dishes","Vino perfetto per selvaggina, brasato o piatti tradizionali di carne","Ein perfekter Wein zu Wild, Brasato oder traditionellen Fleischgerichten"],"Nga e verdhë kashte te e artë, deri në qelibar intensiv":["From straw yellow to golden, up to intense amber","Dal giallo paglierino al dorato, fino all'ambra intenso","Von Strohgelb über Gold bis zu intensivem Bernstein"],"Eterike, intensive, karakteristike":["Ethereal, intense, characteristic","Etereo, intenso, caratteristico","Ätherisch, intensiv, charakteristisch"],"Nga e thatë deri në të ëmbël (amabile), harmonike, kadifeje
